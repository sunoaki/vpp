              candidate = os.environ["CANDIDATE_SHA"]
              workflow_sha = os.environ["WORKFLOW_SHA"]
              manifest = {"workflow_sha": workflow_sha, "workflow_blob": blob(workflow_sha, WORKFLOW),
                          "source": {"path": SOURCE, "candidate_blob": blob(candidate, SOURCE)},
                          "work_deadline": os.environ["DTLS_WORK_DEADLINE"],
                          "candidate_sha": candidate, "candidate_tree": git("rev-parse", f"{candidate}^{{tree}}"),
                          "frozen_sha": os.environ["FROZEN_SHA"], "variant": os.environ["CONTROL_VARIANT"],
                          "tests": {p: blob(candidate, p) for p in TESTS},
                          "tools_sha256": {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                                           for p in sorted(Path(os.environ["CONTROL_DIR"]).glob("*.py"))},
                          "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
