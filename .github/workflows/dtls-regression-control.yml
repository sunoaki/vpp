# SPDX-License-Identifier: Apache-2.0
name: Temporary DTLS cleanup controls

on:
  push:
    branches: [feat/dtls-runtime-controls-ff49-october19]

permissions:
  contents: read

concurrency:
  group: dtls-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dtls:
    name: DTLS / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, restored]
    container:
      image: debian:trixie
      options: >-
        --shm-size=2g
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --security-opt=apparmor=unconfined
        --device-cgroup-rule="c 10:200 rwm"
        --device-cgroup-rule="c 10:238 rwm"
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE_SHA: b4c80425f766147c1e6412b013cbcd3892e53741
      FROZEN_SHA: 630f876bc326eee05c23d517600b72e8d6a6ec83
      WORKFLOW_SHA: ${{ github.sha }}
      CONTROL_VARIANT: ${{ matrix.variant }}
      CLANG_FORMAT_VER: "19"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install base tools
        timeout-minutes: 4
        run: |
          set -euo pipefail
          printf 'CONTROL_DIR=%s/dtls-tools\nEVIDENCE_DIR=%s/dtls-evidence\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dtls-tools" "$RUNNER_TEMP/dtls-evidence"
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update -qq
          apt-get install -y -qq sudo make git bash iproute2 python3

      - name: Check out immutable workflow
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prepare external observer and control tools
        run: |
          set -euo pipefail
          cp .github/workflows/dtls-regression-control.yml "$EVIDENCE_DIR/workflow.yml"
          cat > "$CONTROL_DIR/sitecustomize.py" <<'PY'
          import json
          import os
          import sys
          import threading
          import traceback
          import unittest
          from pathlib import Path

          destination = os.environ.get("DTLS_EVENTS")
          if destination:
              state = threading.local()
              provider = os.environ["DTLS_PROVIDER"]

              def emit(record):
                  record["pid"] = os.getpid()
                  data = (json.dumps(record, sort_keys=True) + "\n").encode()
                  if len(data) > 256 * 1024:
                      raise RuntimeError("DTLS observer record exceeds 256 KiB")
                  fd = os.open(destination, os.O_APPEND | os.O_CREAT | os.O_WRONLY, 0o600)
                  try:
                      if os.fstat(fd).st_size + len(data) > 4 * 1024 * 1024:
                          raise RuntimeError("DTLS observer exceeds 4 MiB")
                      if os.write(fd, data) != len(data):
                          raise RuntimeError("Incomplete DTLS observer write")
                  finally:
                      os.close(fd)

              def wrap(name):
                  original = getattr(unittest.TestResult, name)

                  def observed(self, test, *args):
                      if name == "startTest":
                          state.test = test.id()
                      record = {"kind": name, "test": test.id()}
                      if name == "startTest":
                          record["workers"] = test.get_vpp_worker_count()
                      if name in ("addFailure", "addError"):
                          record["exception"] = args[0][0].__name__
                          record["traceback"] = "".join(traceback.format_exception(*args[0]))
                      if name == "addSkip":
                          record["reason"] = str(args[0])
                      emit(record)
                      result = original(self, test, *args)
                      if name == "stopTest":
                          state.test = None
                      return result

                  setattr(unittest.TestResult, name, observed)

              for method in ("startTest", "stopTest", "addSuccess", "addFailure", "addError",
                             "addSkip", "addExpectedFailure", "addUnexpectedSuccess", "addSubTest"):
                  wrap(method)

              def profile(frame, event, response):
                  if (event == "return" and frame.f_code.co_filename == provider
                          and frame.f_code.co_name == "cli_return_response"
                          and frame.f_locals.get("cli", "").strip() == "test session dtls-cleanup"):
                      emit({"kind": "cli", "test": getattr(state, "test", None),
                            "retval": getattr(response, "retval", None),
                            "reply": getattr(response, "reply", None)})

              if sys.getprofile() is not None:
                  raise RuntimeError("DTLS observer requires an unused profile hook")
              sys.setprofile(profile)
              emit({"kind": "loaded"})
          PY
          cat > "$CONTROL_DIR/control.py" <<'PY'
          import ctypes
          import hashlib
          import json
          import os
          import re
          import selectors
          import signal
          import stat
          import subprocess
          import sys
          import time
          import traceback
          from pathlib import Path

          SOURCE = "src/vnet/tls/tls.c"
          TESTS = ["src/plugins/tlsopenssl/tls_openssl.c", "src/plugins/unittest/session_test.c",
                   "test/asf/test_tls.py", "test/vpp_papi_provider.py", "test/asf/asfframework.py",
                   "test/Makefile", "test/requirements.txt", "test/requirements-3.txt"]
          WORKFLOW = ".github/workflows/dtls-regression-control.yml"
          WITNESS = ("DTLS immediate failure retained hostname/async ownership "
                     "(named 1, async 0, iteration 0)")
          BEFORE = (b"  cargs->sep_ext.transport_flags = TRANSPORT_CFG_F_CONNECTED;\n"
                    b"  if ((rv = vnet_connect (cargs)))\n    {\n"
                    b"      tls_ctx_free (ctx);\n      return rv;\n    }")
          AFTER = BEFORE.replace(b"tls_ctx_free (ctx)", b"tls_ctx_half_open_free (ctx_handle)")

          def require(condition, message):
              if not condition:
                  raise AssertionError(message)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def blob(ref, path):
              return git("rev-parse", f"{ref}:{path}")

          def restored(data):
              require(data.count(BEFORE) == 1, "Restoration anchor is missing or ambiguous")
              return data.replace(BEFORE, AFTER, 1)

          def validate(variant, cls, workers, rc, console, logs, stderr, events):
              identity = f"test_tls.{cls}.test_dtls_cleanup"
              loaded = [e["pid"] for e in events if e["kind"] == "loaded"]
              records = [e for e in events if e["kind"] != "loaded"]
              require(loaded and len(set(loaded)) == len(loaded), "Missing/duplicate observer load")
              require(all(e["pid"] in loaded and e["test"] == identity for e in records),
                      "Unexpected test or missing observer load")
              expected = ["startTest", "cli", "addSuccess" if variant == "fixed" else "addFailure",
                          "stopTest"]
              require([e["kind"] for e in records] == expected,
                      f"Unexpected observer lifecycle: {[e['kind'] for e in records]}")
              require(len({e["pid"] for e in records}) == 1, "Lifecycle spans different processes")
              require(records[0]["workers"] == workers, "Wrong actual worker configuration")
              callbacks = re.findall(r"--- (add\w+)\(\) (\w+)\.(\w+)\(", logs)
              require(callbacks == [(expected[2], cls, "test_dtls_cleanup")],
                      f"Wrong framework callbacks: {callbacks}")
              console = re.sub(r"\x1b\[[0-9;]*m", "", console)
              require(len(re.findall(r"(?m)^Ran 1 tests? in [0-9.]+s\s*$", console)) == 1,
                      "Missing normal single-test completion")
              channels = "\n".join((console, logs, stderr))
              require(not re.search(r"SIGSEGV|segmentation fault|Core was generated|"
                                    r"timed out|TimeoutError|VppTransportSocketIOError|"
                                    r"Vpp\s+dead\b|VPP.*(?:died|crashed)|"
                                    r"(?m:^)(?:ERROR|SKIP):|OK \(skipped=", channels, re.I),
                      "Crash, caught transport failure, timeout, setup error, or skipped test")
              reply = records[1]["reply"]
              require(isinstance(reply, str), "Missing real CLI reply")
              success = f"DTLS cleanup: 4 modes passed on thread {workers}"
              if variant == "fixed":
                  require(rc == 0 and records[1]["retval"] == 0, "Fixed run or CLI failed")
                  require(re.search(r"(?m)^OK\s*$", console), "Missing successful unittest summary")
                  require(reply.count(success) == 1 and "SUCCESS" in reply,
                          "Missing four-mode/thread success in actual CLI reply")
                  require(not re.search(r"FAIL:\d+:|DTLS .*retained|Session unit test failed", reply + stderr),
                          "Fixed run contains a C failure")
              else:
                  require(rc == 2, f"Expected ordinary make failure rc=2, got {rc}")
                  require(records[1]["retval"] == -1, "Wrong actual CLI failure status")
                  require(re.search(r"(?m)^FAILED \(failures=1\)\s*$", console),
                          "Missing assertion-only unittest completion")
                  failure = records[2]
                  require(failure["exception"] == "AssertionError", "Non-assertion failure")
                  trace = failure["traceback"]
                  require("self.assertEqual(response.retval, 0, response.reply)" in trace
                          and "AssertionError: -1 != 0 :" in trace and WITNESS in trace,
                          "Wrong ordinary assertion location or message")
                  require(reply.count(WITNESS) == 1 and "Session unit test failed" in reply,
                          "Missing exact retained-hostname CLI witness")
                  require("Session unit test failed" in trace, "Missing CLI failure in actual assertion")
                  require(not re.search(r"SIGSEGV|segmentation fault|Core was generated|"
                                        r"AddressSanitizer|runtime error:|assertion.*fails", stderr, re.I),
                          "Raw VPP stderr contains a crash or C assertion")
                  require("DTLS cleanup: 4 modes passed" not in reply,
                          "Restored cleanup unexpectedly reported success")
                  require(not re.search(r"DTLS (?:expected immediate route failure|immediate failure retained "
                                        r"connection state|failures grew heap|migration)", reply),
                          "Unrelated DTLS failure")

          def collect(destination):
              destination.mkdir(parents=True, exist_ok=True)
              report = ["24 MiB total, 2 MiB/file, 200 files; text tails; no symlinks or cores."]
              candidates = []
              for root in [*sorted(Path("/tmp").glob("vpp-unittest-*")), Path("build-root/test-logs")]:
                  if root.is_symlink() or not root.is_dir():
                      continue
                  for directory, subdirs, names in os.walk(root, followlinks=False):
                      subdirs[:] = sorted(n for n in subdirs if not (Path(directory) / n).is_symlink())
                      for name in sorted(names):
                          path = Path(directory) / name
                          if path.suffix not in (".txt", ".log", ".pcap", ".pcapng"):
                              continue
                          if stat.S_ISREG(path.lstat().st_mode):
                              priority = 0 if name in ("log.txt", "vpp_stderr.txt") else 1
                              candidates.append((path.suffix in (".pcap", ".pcapng"), priority, path))
              remaining, count = 24 * 1024 * 1024, 0
              for binary, _, path in sorted(candidates):
                  if count == 200:
                      report.append("Stopped at 200 files")
                      break
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(fd, "rb") as reader:
                      info = os.fstat(reader.fileno())
                      if not stat.S_ISREG(info.st_mode):
                          continue
                      size = info.st_size
                      length = min(size, 2 * 1024 * 1024)
                      if length > remaining or binary and size > length:
                          if len(report) < 1000:
                              report.append(f"SKIP {str(path)[:500]!r}: {size}")
                          continue
                      reader.seek(size - length)
                      data = reader.read(length)
                      target = destination / f"{count:04d}{path.suffix}"
                      target.write_bytes(data)
                  report.append(f"{str(path)[:500]!r} -> {target.name}: {len(data)}/{size}")
                  remaining -= len(data)
                  count += 1
              (destination / "collection.txt").write_text("\n".join(report) + "\n")

          def process_table():
              table = {}
              for path in Path("/proc").glob("[0-9]*/stat"):
                  try:
                      fields = path.read_text().rsplit(")", 1)[1].split()
                      table[int(path.parent.name)] = (int(fields[1]), int(fields[19]))
                  except (OSError, ValueError, IndexError):
                      continue
              return table

          def descendants(tracked, baseline):
              table = process_table()
              changed = True
              while changed:
                  changed = False
                  for pid, (parent, birth) in table.items():
                      if tracked.get(pid) == birth or baseline.get(pid) == birth:
                          continue
                      valid_parent = (parent in tracked and parent in table
                                      and table[parent][1] == tracked[parent])
                      if parent == os.getpid() or valid_parent:
                          tracked[pid] = birth
                          changed = True
              return {pid for pid, birth in tracked.items()
                      if pid in table and table[pid][1] == birth}

          def signal_process(pid, birth, sig, reap):
              try:
                  handle = os.pidfd_open(pid, 0)
              except ProcessLookupError:
                  return False, None
              try:
                  current = process_table().get(pid)
                  if current is None or current[1] != birth:
                      return False, None
                  try:
                      signal.pidfd_send_signal(handle, sig, None, 0)
                  except ProcessLookupError:
                      return False, None
                  reaped = None
                  if reap:
                      try:
                          reaped = os.waitid(os.P_PIDFD, handle, os.WEXITED | os.WNOHANG)
                      except ChildProcessError:
                          pass
                  return True, reaped
              finally:
                  os.close(handle)

          def cleanup(process, tracked, baseline):
              result = {"signals": [], "reaped": [], "survivors": []}
              deadline = time.monotonic() + 5
              for sig, budget in ((signal.SIGTERM, 1), (signal.SIGKILL, 3)):
                  stage_end = min(deadline, time.monotonic() + budget)
                  while True:
                      live = descendants(tracked, baseline)
                      identities = [(pid, tracked[pid]) for pid in sorted(live)]
                      if process is not None:
                          process.poll()
                      for pid, birth in identities:
                          reap = process is None or pid != process.pid or process.returncode is not None
                          sent, reaped = signal_process(pid, birth, sig, reap)
                          if sent:
                              result["signals"].append([pid, int(sig)])
                          if reaped:
                              result["reaped"].append([reaped.si_pid, reaped.si_status])
                      if not descendants(tracked, baseline) or time.monotonic() >= stage_end:
                          break
                      time.sleep(0.02)
              if process is not None:
                  try:
                      process.wait(timeout=max(0.01, deadline - time.monotonic()))
                  except subprocess.TimeoutExpired:
                      result["survivors"].append(process.pid)
              result["survivors"] = sorted(set(result["survivors"]) | descendants(tracked, baseline))
              return result

          def publish_json(path, record, exclusive=False):
              temporary = path.with_name(f".{path.name}.{os.urandom(16).hex()}.tmp")
              try:
                  temporary.write_text(json.dumps(record, indent=2) + "\n")
                  if exclusive:
                      os.link(temporary, path)
                  else:
                      os.replace(temporary, path)
              finally:
                  temporary.unlink(missing_ok=True)

          def command_identity(record):
              return (isinstance(record, dict) and isinstance(record.get("command_id"), str)
                      and bool(record["command_id"]) and isinstance(record.get("ancestors"), list)
                      and all(isinstance(item, dict) and isinstance(item.get("result"), str)
                              and isinstance(item.get("command_id"), str)
                              for item in record["ancestors"]))

          def record_interruptions(parent_status, parent_result):
              if parent_result["cleanup"].get("exception") or parent_result["cleanup"]["survivors"]:
                  return
              output = Path(os.environ["EVIDENCE_DIR"])
              reference = {"result": str(parent_status.relative_to(output)),
                           "command_id": parent_result["command_id"]}
              paths = sorted(output.glob("*/result.json"))
              require(len(paths) <= 1000, "Too many command records for interruption attribution")
              errors = []
              for path in paths:
                  if path.is_symlink() or path.parent.is_symlink():
                      continue
                  require(path.stat().st_size <= 1024 * 1024, "Command record exceeds attribution limit")
                  raw = path.read_bytes()
                  malformed = None
                  ownership = None
                  try:
                      child = json.loads(raw)
                      if not command_identity(child):
                          raise ValueError("Invalid command identity")
                  except (ValueError, UnicodeError) as error:
                      malformed = {"result": str(path.relative_to(output)),
                                   "raw_sha256": hashlib.sha256(raw).hexdigest(),
                                   "error": str(error), "ownership_recovered": False}
                      errors.append(malformed)
                      owner_path = path.parent / "ownership.json"
                      try:
                          require(not owner_path.is_symlink() and owner_path.stat().st_size <= 1024 * 1024,
                                  "Invalid ownership record")
                          owner_raw = owner_path.read_bytes()
                          child = json.loads(owner_raw)
                          require(command_identity(child)
                                  and child.get("result") == str(path.relative_to(output)),
                                  "Ownership record does not identify this result")
                      except (OSError, ValueError, UnicodeError, AssertionError) as owner_error:
                          malformed["ownership_error"] = str(owner_error)
                          continue
                      ownership = {"path": str(owner_path.relative_to(output)),
                                   "sha256": hashlib.sha256(owner_raw).hexdigest()}
                      malformed["ownership_recovered"] = True
                  if (reference not in child["ancestors"]
                          or (malformed is None and (child.get("outcome") != "running" or "end" in child))
                          or (path.parent / "interruption.json").exists()):
                      continue
                  interruption = {"outcome": "interrupted-by-parent", "observed_at": time.time(),
                                  "parent": reference, "parent_outcome": parent_result["outcome"],
                                  "raw_result": str(path.relative_to(output)),
                                  "raw_result_sha256": hashlib.sha256(raw).hexdigest(),
                                  "raw_result_state": "malformed" if malformed else "running",
                                  "ownership": ownership,
                                  "command_id": child["command_id"], "rc": None, "cleanup": None,
                                  "unknowns": "Child exit status and child supervisor cleanup are unknown; "
                                              "parent cleanup is recorded only in the referenced parent result."}
                  try:
                      publish_json(path.parent / "interruption.json", interruption, exclusive=True)
                  except FileExistsError:
                      pass
              if errors:
                  publish_json(parent_status.parent / "attribution-errors.json", errors)

          def command(label, args, env=None, seconds=300):
              directory = Path(os.environ["EVIDENCE_DIR"]) / label
              directory.mkdir()
              now = time.time()
              limit = min(now + seconds, float(os.environ.get("DTLS_WORK_DEADLINE", now + seconds)),
                          float(os.environ.get("DTLS_PHASE_DEADLINE", now + seconds)))
              deadline = time.monotonic() + max(0, limit - now)
              inherited = os.environ if env is None else env
              ancestors = json.loads(inherited.get("DTLS_COMMAND_ANCESTORS", "[]"))
              command_id = os.urandom(16).hex()
              result = {"command": args, "start": now, "deadline": limit, "rc": None,
                        "outcome": "running", "exception": None, "cleanup": None,
                        "command_id": command_id, "ancestors": ancestors}
              status = directory / "result.json"
              publish_json(directory / "ownership.json",
                           {"result": str(status.relative_to(Path(os.environ["EVIDENCE_DIR"]))),
                            "command_id": command_id, "ancestors": ancestors}, exclusive=True)
              publish_json(status, result)
              tail, process, tracked = bytearray(), None, {}
              diagnostic_window = b""
              caught_transport = False
              baseline = {pid: birth for pid, (_, birth) in process_table().items()}
              poller = selectors.DefaultSelector()
              try:
                  require(ctypes.CDLL(None, use_errno=True).prctl(36, 1, 0, 0, 0) == 0,
                          "Cannot become child subreaper")
                  if time.monotonic() >= deadline:
                      raise TimeoutError("Command budget exhausted before spawn")
                  reference = {"result": str(status.relative_to(Path(os.environ["EVIDENCE_DIR"]))),
                               "command_id": command_id}
                  environment = dict(inherited, DTLS_PHASE_DEADLINE=str(limit),
                                     DTLS_COMMAND_ANCESTORS=json.dumps(ancestors + [reference]))
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                             env=environment, start_new_session=True)
                  tracked[process.pid] = process_table().get(process.pid, (0, -1))[1]
                  os.set_blocking(process.stdout.fileno(), False)
                  poller.register(process.stdout, selectors.EVENT_READ)
                  with (directory / "console.log").open("w+b") as stream:
                      while poller.get_map() or process.poll() is None:
                          descendants(tracked, baseline)
                          remaining = deadline - time.monotonic()
                          if remaining <= 0:
                              raise TimeoutError("Absolute command deadline exceeded")
                          for key, _ in poller.select(min(0.1, remaining)):
                              chunk = os.read(key.fd, 65536)
                              if not chunk:
                                  poller.unregister(key.fileobj)
                                  continue
                              diagnostic_window = (diagnostic_window + chunk)[-131072:]
                              caught_transport |= bool(re.search(
                                  rb"VppTransportSocketIOError|Vpp\s+dead\b", diagnostic_window, re.I))
                              tail.extend(chunk)
                              del tail[:-8 * 1024 * 1024]
                              stream.seek(0)
                              stream.write(tail)
                              stream.truncate()
                              stream.flush()
                  result["rc"] = process.wait(timeout=max(0.01, deadline - time.monotonic()))
                  require(not (descendants(tracked, baseline) - {process.pid}),
                          "Command left descendant processes after completion")
                  result["outcome"] = "success" if result["rc"] == 0 else "nonzero"
              except BaseException as error:
                  result["outcome"] = "timeout" if isinstance(error, (TimeoutError, subprocess.TimeoutExpired)) else "exception"
                  result["exception"] = {"type": type(error).__name__, "message": str(error),
                                         "traceback": traceback.format_exc()}
              finally:
                  try:
                      result["cleanup"] = cleanup(process, tracked, baseline)
                  except BaseException as error:
                      result["cleanup"] = {"survivors": sorted(descendants(tracked, baseline)),
                                           "exception": {"type": type(error).__name__, "message": str(error)}}
                      result["outcome"] = "cleanup-failed"
                  finally:
                      if process is not None:
                          result["rc"] = process.returncode
                          process.stdout.close()
                      poller.close()
                      if result["cleanup"]["survivors"]:
                          result["outcome"] = "cleanup-failed"
                      result["caught_transport"] = caught_transport
                      if caught_transport:
                          result["outcome"] = "transport-failure"
                      result["end"] = time.time()
                      publish_json(status, result)
              record_interruptions(status, result)
              if result["outcome"] not in ("success", "nonzero"):
                  raise RuntimeError(f"{label}: {result['outcome']}; see {status}")
              return directory, result["rc"], tail.decode(errors="replace")

          def verify(variant):
              candidate = os.environ["CANDIDATE_SHA"]
              require(git("rev-parse", "HEAD") == candidate, "Candidate HEAD changed")
              original = subprocess.check_output(["git", "show", f"{candidate}:{SOURCE}"])
              expected = restored(original) if variant == "restored" else original
              require(Path(SOURCE).read_bytes() == expected, "Unexpected TLS source bytes")
              require(git("diff", "--name-only").splitlines() == ([SOURCE] if variant == "restored" else []),
                      "Unexpected tracked tree changes")
              require(not git("diff", "--cached", "--name-only"), "Unexpected staged changes")
              for path in TESTS:
                  require(git("hash-object", path) == blob(candidate, path), f"Changed test/tool: {path}")

          def initialize():
              output = Path(os.environ["EVIDENCE_DIR"])
              phases = {name: {"outcome": "skipped", "reason": "not reached"} for name in
                        ("fixtures", "prepare", "dependencies", "checks", "python", "select",
                         "version", "build", "tests", "collect")}
              (output / "phases.json").write_text(json.dumps(phases, indent=2))
              candidate = os.environ["CANDIDATE_SHA"]
              workflow_sha = os.environ["WORKFLOW_SHA"]
              manifest = {"workflow_sha": workflow_sha, "workflow_blob": blob(workflow_sha, WORKFLOW),
                          "source": {"path": SOURCE, "candidate_blob": blob(candidate, SOURCE)},
                          "work_deadline": os.environ["DTLS_WORK_DEADLINE"],
                          "candidate_sha": candidate, "candidate_tree": git("rev-parse", f"{candidate}^{{tree}}"),
                          "frozen_sha": os.environ["FROZEN_SHA"], "variant": os.environ["CONTROL_VARIANT"],
                          "tests": {p: blob(candidate, p) for p in TESTS},
                          "tools_sha256": {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                                           for p in sorted(Path(os.environ["CONTROL_DIR"]).glob("*.py"))},
                          "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                          "job": os.environ["GITHUB_JOB"],
                          "artifact_name": f"dtls-{os.environ['CONTROL_VARIANT']}-"
