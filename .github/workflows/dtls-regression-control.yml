                  require(not (directory / "result.json").exists()
                          and interrupted["raw_result_state"] == "missing" and interrupted["raw_result_sha256"] is None
                          and interrupted["ownership"]["sha256"] == hashlib.sha256(owner_raw).hexdigest()
                          and any(item.get("sha256") == hashlib.sha256(b"{").hexdigest()
