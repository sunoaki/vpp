          def phase(name, seconds, args):
              path = Path(os.environ["EVIDENCE_DIR"]) / "phases.json"
              phases = json.loads(path.read_text())
              phases[name] = {"outcome": "running", "start": time.time(), "command": args}
              path.write_text(json.dumps(phases, indent=2))
              try:
                  directory, rc, _ = command("phase-" + name, args, seconds=seconds)
                  result = json.loads((directory / "result.json").read_text())
                  phases[name].update(result)
                  require(rc == 0, f"Phase {name} failed: {rc}")
              except BaseException as error:
                  phases[name].update(outcome="failed", exception={"type": type(error).__name__,
                                                               "message": str(error)})
                  raise
              finally:
                  phases[name]["end"] = time.time()
                  path.write_text(json.dumps(phases, indent=2))

