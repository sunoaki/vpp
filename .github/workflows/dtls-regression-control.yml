              require(result["outcome"] == "exception" and result["rc"] is not None
                      and not result["cleanup"]["survivors"], "Read exception leaked child")
              phase_path = Path(os.environ["EVIDENCE_DIR"]) / "phases.json"
              saved = phase_path.read_bytes()
              try:
                  try:
                      phase("fixture-failure", 2, [sys.executable, "-c", "raise ValueError('fixture failure')"])
                  except AssertionError:
                      pass
                  phases = json.loads(phase_path.read_text())
                  require(phases["fixture-failure"]["exception"] and phases["prepare"]["outcome"] == "skipped",
                          "Missing exception or skipped preparation status")
                  require((phase_path.parent / "initial-manifest.json").is_file(), "Manifest missing before fixtures")
              finally:
                  phase_path.write_bytes(saved)
              print("Runner deadlines, setsid descendant cleanup/reaping, spawn/read exceptions, phase evidence passed")

          if __name__ == "__main__":
              action = sys.argv[1]
              if action == "initialize":
                  initialize()
              elif action == "phase":
                  phase(sys.argv[2], int(sys.argv[3]), sys.argv[4:])
              elif action == "prepare":
                  prepare()
              elif action == "select":
                  select_variant()
              elif action == "verify":
                  verify(os.environ["CONTROL_VARIANT"])
              elif action == "tests":
                  tests()
              elif action == "collect":
                  collect(Path(os.environ["EVIDENCE_DIR"]) / "final-diagnostics")
              elif action == "fixtures":
                  fixtures()
                  observer_fixtures()
                  runner_fixtures()
                  nested_deadline_fixtures()
                  publication_fixtures()
              else:
                  _, rc, _ = command(action, sys.argv[2:])
                  raise SystemExit(rc)
          PY
          export DTLS_WORK_DEADLINE=$(( $(date +%s) + 4200 ))
          printf 'DTLS_WORK_DEADLINE=%s\n' "$DTLS_WORK_DEADLINE" >> "$GITHUB_ENV"
          timeout --kill-after=5s 30s python3 "$CONTROL_DIR/control.py" initialize
          python3 "$CONTROL_DIR/control.py" phase fixtures 90 python3 "$CONTROL_DIR/control.py" fixtures
          python3 "$CONTROL_DIR/control.py" phase prepare 60 python3 "$CONTROL_DIR/control.py" prepare

      - name: Install build and checkstyle dependencies on clean candidate
        run: python3 "$CONTROL_DIR/control.py" phase dependencies 900 make UNATTENDED=yes install-dep

      - name: Run source-clean C style and API checks
        run: |
          python3 "$CONTROL_DIR/control.py" phase checks 600 bash -s <<'SH'
          set -euo pipefail
          trap 'git checkout --quiet --detach "$CANDIDATE_SHA"' EXIT
          for commit in $(git rev-list --reverse --no-merges "$FROZEN_SHA..$CANDIDATE_SHA"); do
            git checkout --quiet --detach "$commit"
            python3 "$CONTROL_DIR/control.py" "style-$commit" make checkstyle
            python3 "$CONTROL_DIR/control.py" "api-$commit" make checkstyle-api
            python3 "$CONTROL_DIR/control.py" "message-$commit" extras/scripts/check_commit_msg.sh
            test -z "$(git status --porcelain --untracked-files=all)"
          done
          git checkout --quiet --detach "$CANDIDATE_SHA"
          trap - EXIT
          SH

      - name: Run pinned Python checks before any source restoration
        run: |
          python3 "$CONTROL_DIR/control.py" phase python 600 bash -s <<'SH'
          set -euo pipefail
          touch test/requirements-3.txt
          python3 "$CONTROL_DIR/control.py" python-style make UV= checkstyle-python
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 "$CONTROL_DIR/control.py" python-tools \
            build-root/test/venv/bin/python -m pip freeze --all
          SH

      - name: Select only the immediate error cleanup variant
        run: python3 "$CONTROL_DIR/control.py" phase select 60 python3 "$CONTROL_DIR/control.py" select

      - name: Supply and record build version
        run: |
          python3 "$CONTROL_DIR/control.py" phase version 60 bash -s <<'SH'
          set -euo pipefail
          if ! git describe --long --match 'v[0-9]*' 2>/dev/null; then
            printf '0.0.0-release+%s.%s-g%s\n' "$(git log -1 --format=%ct)" \
              "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)" > src/scripts/.version
          fi
          if [ -f src/scripts/.version ]; then
            cp src/scripts/.version "$EVIDENCE_DIR/version.txt"
          fi
          python3 "$CONTROL_DIR/control.py" toolchain bash -c \
            'uname -a; python3 --version; make --version; clang --version; git --version; dpkg-query -W'
          SH

      - name: Build debug variant independently
        run: |
          python3 "$CONTROL_DIR/control.py" phase build 2400 bash -s <<'SH'
          set -euo pipefail
          python3 "$CONTROL_DIR/control.py" verify
          make UNATTENDED=yes build
          python3 "$CONTROL_DIR/control.py" verify
          SH

      - name: Prepare test runtime
        timeout-minutes: 2
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ runner.temp }}/dtls-evidence/runtime

      - name: Run unchanged main and worker regression methods
        run: |
          python3 "$CONTROL_DIR/control.py" phase tests 600 bash -s <<'SH'
          set -euo pipefail
          mountpoint /dev/shm
          test "$(df -B1 --output=size /dev/shm | tail -n 1)" -ge 2147483648
          python3 "$CONTROL_DIR/control.py" tests
          SH

      - name: Retain bounded diagnostics and tools on every outcome
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if [ -d "$CONTROL_DIR" ]; then
            for tool in "$CONTROL_DIR/"*.py; do
              [ ! -f "$tool" ] || cp "$tool" "$EVIDENCE_DIR/"
            done
          fi
          if [ -f "$CONTROL_DIR/control.py" ] && [ -f "$EVIDENCE_DIR/phases.json" ]; then
            DTLS_WORK_DEADLINE=$(( $(date +%s) + 60 )) \
              python3 "$CONTROL_DIR/control.py" phase collect 45 python3 "$CONTROL_DIR/control.py" collect || true
          fi
          timeout --kill-after=2s 5s git status --short > "$EVIDENCE_DIR/final-git-status.txt" || true
          timeout --kill-after=2s 5s git diff -- src/vnet/tls/tls.c > "$EVIDENCE_DIR/final-restoration.diff" || true

      - name: Upload immutable run evidence
        id: evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: dtls-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dtls-evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Record artifact identity and pending coverage
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf 'Artifact ID: %s\nArtifact URL: %s\n' "$ARTIFACT_ID" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Successful handshake, cross-worker migration, and isolated restored unnamed async1 pointer witness remain unproven.' >> "$GITHUB_STEP_SUMMARY"
