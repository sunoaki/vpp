name: Verify

# yamllint disable-line rule:truthy
on:
  # This tree is the production branch, not a fork awaiting upstream review, so
  # a push to master verifies itself the same way a pull request does. Feature
  # branches are verified through their pull request, which keeps a push and
  # the pull request that carries the same commits from building twice.
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  # A push or a manual run has no pull request, so the steps that read the
  # pull_request context fall back to comparing the branch tip with its parent,
  # and the suites input replaces the filter derived from the changed paths.
  workflow_dispatch:
    inputs:
      suites:
        description: >-
          TEST suites that replace the derived filter, for example
          "neighbor ip_mcast linux_cp". The token "all" expands to every
          test/test_*.py and test/asf/test_*.py module of the checked-out
          tree. Leave empty to derive them.
        required: false
        default: ""
        type: string

# One run per ref: a new push to the same branch cancels the previous run.
concurrency:
  # A pull request and a dispatch run share their head branch, so the
  # dispatch is a group of its own: it drives the build and the twelve test
  # shards, and is not cancelled by, nor cancels, the run a push to the same
  # branch starts.
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: style
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    # A job that runs in a container gets `sh` for `run:` unless it says
    # otherwise, and debian:trixie's /bin/sh is dash, which rejects the
    # parameter expansions this repository's scripts use.
    defaults:
      run:
        shell: bash
    env:
      # extras/scripts/checkstyle.sh picks clang-format-${CLANG_FORMAT_VER};
      # the Makefile sets 19 for Debian 13, and the same value has to reach the
      # script when it is invoked directly.
      CLANG_FORMAT_VER: "19"
    steps:
      - name: Disable APT cache cleanup
        run: rm -f /etc/apt/apt.conf.d/docker-clean

      - name: Install base tools
        run: |
          apt-get update -qq
          # curl and ca-certificates are for extras/scripts/ci-lint-workflows.sh,
          # which fetches the pinned actionlint release over TLS.
          apt-get install -y -qq sudo make git bash ca-certificates curl

      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          # The coding style and API checks diff against a parent commit, and
          # src/scripts/version reads the v* tags, so the whole history and
          # tags are needed.
          fetch-depth: 0
          fetch-tags: true

      - name: Check the workflow files with actionlint
        # A YAML parser accepts ${{ runner.temp }} in a job-level env, and
        # GitHub then rejects the whole file with HTTP 422, so only actionlint's
        # context check catches it. The script pins its own actionlint version
        # and checksums and needs nothing installed beyond curl.
        run: extras/scripts/ci-lint-workflows.sh

      - name: Install VPP checkstyle dependencies
        run: |
          git config --global --add safe.directory "$PWD"
          # crcchecker.py refuses to run when a tracked file is modified, so
          # this step must not rewrite the Makefile.
          make UNATTENDED=yes install-dep

      - name: Check the feature list
        run: make checkfeaturelist

      - name: Check the C coding style
        # A pull_request checkout is the merge commit, whose first parent is
        # the base branch tip, so HEAD~1..HEAD is the whole pull request.
        run: make checkstyle

      - name: Check the API for incompatible changes
        # crcchecker.py compares HEAD~1..HEAD as well, and refuses to run when
        # the working tree is dirty, so this runs before the Python check
        # builds anything.
        run: make checkstyle-api

      - name: Check the Python coding style
        run: make checkstyle-python

      - name: Check the commit messages of the run
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          checked_out=$(git rev-parse HEAD)
          trap 'git checkout --quiet "${checked_out}"' EXIT
          # A merge commit has no feature id in its subject, and
          # check_commit_msg.sh rejects a subject without one, so only the
          # commits the run's author wrote are checked.
          if [ -n "${base}" ] && [ -n "${head}" ]; then
            echo "Pull request base ${base}, head ${head}"
            commits=$(git rev-list --reverse --no-merges "${base}..${head}")
          else
            # A push or a manual run has no pull request context, and its tip is
            # usually a merge commit, which check_commit_msg.sh rejects. The
            # commits such a tip carries are the range between its first parent
            # and itself, and the merge commits inside that range are skipped
            # for the same reason. A tip with one parent, or a root commit,
            # carries itself.
            head=$(git rev-parse HEAD)
            first_parent=$(git rev-parse --verify --quiet "${head}^1" || true)
            if [ -n "${first_parent}" ]; then
              echo "No pull request context; first parent of ${head} is ${first_parent}"
              commits=$(git rev-list --reverse --no-merges "${first_parent}..${head}")
            else
              echo "No pull request context and ${head} has no parent"
              commits=""
            fi
            if [ -z "${commits}" ]; then
              # An empty set would check nothing and pass, so the newest
              # non-merge commit reachable from the tip is checked instead.
              commits=$(git rev-list --no-merges --max-count=1 "${head}")
              if [ -z "${commits}" ]; then
                echo "::error::No commit message to check from ${head}"
                exit 1
              fi
              echo "No non-merge commit derives from ${head}; checking only ${commits}"
            fi
          fi
          checked=0
          for commit in ${commits}; do
            echo "Checking commit message of ${commit}"
            git checkout --quiet "${commit}"
            extras/scripts/check_commit_msg.sh
            checked=$((checked + 1))
          done

      # The rules that map a changed path to a test module are written once,
      # into a file the plan job downloads, so the plan job and the self-check
      # below run that one file instead of restating the rules.
      - name: Write the test-suite derivation helper
        id: helper
        run: |
          cat > "${RUNNER_TEMP}/derive-suites.sh" <<'HELPER'
          # One push runs at most SUITE_CAP test suites. The suites that do not
          # fit are named in the log instead of being dropped without a word, so
          # the selection and the drop report both read this one value.
          SUITE_CAP=3

          # A bare suite name resolves to test/test_<name>.py or
          # test/asf/test_<name>.py. A rule that resolves to no module selects
          # no test at all, so it reports itself instead of returning nothing.
          suite_module_exists() {
            [ -f "test/test_$1.py" ] || [ -f "test/asf/test_$1.py" ]
          }

          # src/vnet/<dir> directories whose test module is named differently
          # from the directory. Every other directory keeps its own name.
          suite_module_alias() {
            case "$1" in
              ip-neighbor) printf '%s\n' neighbor ;;
              mfib) printf '%s\n' ip_mcast ;;
            esac
          }

          report_uncovered() {
            local path="$1" candidate looked=""
            shift
            for candidate in "$@"; do
              looked="${looked}${looked:+, }test/test_${candidate}.py or test/asf/test_${candidate}.py"
            done
            printf 'UNCOVERED %s: looked for %s\n' "${path}" "${looked}" >&2
          }

          # Print the module that covers one changed path and return success, or
          # print an UNCOVERED report on stderr and return failure.
          derive_suite_for_path() {
            local path="$1" rest dir sub name
            local -a candidates=()
            case "${path}" in
              src/plugins/*/*)
                rest=${path#src/plugins/}
                dir=${rest%%/*}
                sub=${rest#*/}
                sub=${sub%%/*}
                # The subdirectory is tried first, so
                # src/plugins/nat/nat64/nat64_db.c selects nat64 rather than the
                # package name nat, which has no module of its own. Only a
                # directory is a candidate: in src/plugins/gre/gre.c the second
                # path component is the file that changed.
                if [ -d "src/plugins/${dir}/${sub}" ]; then
                  candidates+=("${sub//-/_}")
                fi
                candidates+=("${dir//-/_}")
                for name in "${candidates[@]}"; do
                  if suite_module_exists "${name}"; then
                    printf '%s\n' "${name}"
                    return 0
                  fi
                done
                report_uncovered "${path}" "${candidates[@]}"
                return 1
                ;;
              src/vnet/*/*)
                rest=${path#src/vnet/}
                dir=${rest%%/*}
                name=$(suite_module_alias "${dir}")
                if [ -z "${name}" ]; then
                  name=${dir//-/_}
                fi
                if suite_module_exists "${name}"; then
                  printf '%s\n' "${name}"
                  return 0
                fi
                report_uncovered "${path}" "${name}"
                return 1
                ;;
            esac
            return 1
          }

          # Read the changed paths from stdin and print the TEST filter: a suite
          # whose own test module also changed goes first, alphabetical order
          # within each group, at most SUITE_CAP suites, ip4 when nothing
          # derives. A suite the cap drops is named on stderr rather than
          # vanishing.
          derive_test_suites() {
            local changed path name suite suites prioritized remaining selected dropped
            local -a paths=()
            changed=$(cat)
            mapfile -t paths <<< "${changed}"
            suites=""
            for path in "${paths[@]}"; do
              [ -n "${path}" ] || continue
              if name=$(derive_suite_for_path "${path}"); then
                suites="${suites} ${name}"
              fi
            done
            suites=$(printf '%s\n' "${suites}" | tr ' ' '\n' | sed '/^$/d' | sort -u)
            prioritized=""
            remaining=""
            for suite in ${suites}; do
              case $'\n'"${changed}"$'\n' in
                *$'\n'"test/test_${suite}.py"$'\n'*|*$'\n'"test/asf/test_${suite}.py"$'\n'*)
                  prioritized="${prioritized} ${suite}"
                  ;;
                *) remaining="${remaining} ${suite}" ;;
              esac
            done
            suites=$(printf '%s %s\n' "${prioritized}" "${remaining}" |
                     tr ' ' '\n' | sed '/^$/d')
            selected=$(printf '%s\n' "${suites}" | head -n "${SUITE_CAP}" | tr '\n' ' ')
            selected=${selected% }
            dropped=$(printf '%s\n' "${suites}" | sed "1,${SUITE_CAP}d" | tr '\n' ' ')
            if [ -n "${dropped% }" ]; then
              printf 'Not selected: the suite cap of %s drops %s\n' \
                "${SUITE_CAP}" "${dropped% }" >&2
            fi
            if [ -z "${selected}" ]; then
              printf 'No test derives from the changed paths; using the ip4 smoke suite\n' >&2
              selected="ip4"
            fi
            printf '%s\n' "${selected}"
          }

          # Every suite of the checked-out tree: the module names of
          # test/test_*.py and test/asf/test_*.py, without the test_ prefix and
          # the .py suffix, sorted and deduplicated, one name per line. It is
          # read from the tree so the list cannot fall behind a new test module.
          all_test_suites() {
            local paths
            paths=$(ls test/test_*.py test/asf/test_*.py 2>/dev/null || true)
            if [ -n "${paths}" ]; then
              printf '%s\n' "${paths}"
            fi | sed 's#.*/test_##; s#\.py$##' | sort -u
          }

          # Print the number of suites all_test_suites lists. The names go
          # through a file so the count is words of a file, never file
          # arguments to wc, and the count is printed as a bare integer.
          all_test_suites_count() {
            local listing="$1/listing.txt"
            all_test_suites > "${listing}"
            grep -c '[^[:space:]]' "${listing}"
          }

          # Expand a workflow_dispatch suites input: the token "all" becomes
          # every suite of the tree, and any other name is kept as given. The
          # result is the sorted union of both, so an explicit name lands in
          # its place even when it sits next to "all". An input without "all"
          # is returned unchanged, so an explicit list behaves as before.
          expand_manual_suites() {
            local input="$1" token expanded="" others=""
            for token in ${input}; do
              if [ "${token}" = all ]; then
                expanded="${expanded} $(all_test_suites | tr '\n' ' ')"
              else
                others="${others} ${token}"
              fi
            done
            if [ -z "${expanded}" ]; then
              printf '%s\n' "${others# }"
              return 0
            fi
            printf '%s\n' ${expanded} ${others} | sed '/^$/d' | sort -u |
              tr '\n' ' ' | sed 's/ *$//'
            printf '\n'
          }
          HELPER
          # The file is handed to another job as an artifact, so its length
          # goes into the job output for the log to name.
          echo "hash=$(sha256sum "${RUNNER_TEMP}/derive-suites.sh" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # The plan job downloads this file; no other job writes it.
      - name: Upload the suite derivation helper
        uses: actions/upload-artifact@v4
        with:
          name: derive-suites-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/derive-suites.sh
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      # The derivation decides which suites the pull request runs, and a rule
      # that resolves to no module selects nothing instead of failing, so its
      # output is asserted on fixed paths before the build starts.
      - name: Self-check the test-suite derivation
        run: |
          set -eu
          . "${RUNNER_TEMP}/derive-suites.sh"
          failures=0
          expect_suite() {
            local path="$1" expected="$2" actual
            actual=$(derive_suite_for_path "${path}" 2>/dev/null || true)
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::${path}: expected suite '${expected}', derived '${actual}'"
              failures=$((failures + 1))
            fi
          }
          expect_uncovered() {
            local path="$1" looked="$2" module line
            module=$(derive_suite_for_path "${path}" 2>/dev/null || true)
            line=$(derive_suite_for_path "${path}" 2>&1 >/dev/null || true)
            if [ -n "${module}" ]; then
              echo "::error::${path}: expected no suite, derived '${module}'"
              failures=$((failures + 1))
            elif [ "${line}" != "UNCOVERED ${path}: looked for ${looked}" ]; then
              echo "::error::${path}: expected 'UNCOVERED ${path}: looked for ${looked}', got '${line}'"
              failures=$((failures + 1))
            fi
          }
          expect_suites() {
            local expected="$1" actual
            shift
            actual=$(printf '%s\n' "$@" | derive_test_suites 2>/dev/null)
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::derived suites '${actual}', expected '${expected}' from: $*"
              failures=$((failures + 1))
            fi
          }
          # One fixture per rule: the src/vnet alias table, the plain directory
          # rule, the plugin subdirectory candidate, the plugin package-name
          # fallback, and directories that have no module of their own.
          expect_suite src/vnet/ip-neighbor/ip6_neighbor.c neighbor
          expect_suite src/vnet/mfib/mfib_table.c ip_mcast
          expect_suite src/vnet/fib/fib_table.c fib
          expect_suite src/plugins/nat/nat64/nat64_db.c nat64
          # linux-cp has no test_lcp_node module, so this path can only resolve
          # through the package name.
          expect_suite src/plugins/linux-cp/lcp_node.c linux_cp
          expect_uncovered src/vnet/l2/l2_input.c "test/test_l2.py or test/asf/test_l2.py"
          expect_uncovered src/plugins/xdp/xdp_input.c "test/test_xdp.py or test/asf/test_xdp.py"
          # No package in this repository has both test_<pkg>.py and
          # test_<sub>.py, so the subdirectory-first order is unobservable in
          # the real tree. Assert it in a tree that has both.
          order_tree="${RUNNER_TEMP}/plugin-order"
          mkdir -p "${order_tree}/src/plugins/alpha/beta" "${order_tree}/test"
          : > "${order_tree}/test/test_alpha.py"
          : > "${order_tree}/test/test_beta.py"
          ordered=$(cd "${order_tree}" && derive_suite_for_path src/plugins/alpha/beta/x.c || true)
          if [ "${ordered}" != "beta" ]; then
            echo "::error::src/plugins/alpha/beta/x.c: expected the subdirectory suite 'beta', derived '${ordered}'"
            failures=$((failures + 1))
          fi
          # The aggregate filter: order, SUITE_CAP, the priority of a suite whose
          # own module changed, and the fallback.
          expect_suites "fib ip_mcast linux_cp" \
            src/vnet/fib/fib_table.c src/vnet/mfib/mfib_table.c \
            src/plugins/linux-cp/lcp_node.c
          expect_suites "neighbor fib ip_mcast" test/test_neighbor.py \
            src/vnet/ip-neighbor/ip6_neighbor.c src/vnet/fib/fib_table.c \
            src/vnet/mfib/mfib_table.c src/plugins/linux-cp/lcp_node.c
          expect_suites "ip4" src/vnet/l2/l2_input.c
          # SUITE_CAP is three, but a suite it leaves out is named instead of
          # vanishing: this is the changed set of pull request 48, where the
          # ip-neighbor suite does not fit in the cap.
          capped=$(printf '%s\n' src/vnet/fib/fib_table.c \
                   src/vnet/ip-neighbor/ip6_neighbor.c src/vnet/mfib/mfib_table.c \
                   src/plugins/linux-cp/lcp_node.c | derive_test_suites 2>&1 >/dev/null)
          if [ "${capped}" != "Not selected: the suite cap of 3 drops neighbor" ]; then
            echo "::error::the suite left out by the cap was not reported, got '${capped}'"
            failures=$((failures + 1))
          fi
          # The suites input keeps an explicit list as it is and expands "all"
          # to every module of the tree. The fixture tree pins the enumeration
          # order and the module-name stripping without depending on this tree's
          # current test count.
          mkdir -p "${order_tree}/test/asf"
          : > "${order_tree}/test/test_alpha.py"
          : > "${order_tree}/test/test_beta.py"
          : > "${order_tree}/test/asf/test_gamma.py"
          explicit=$(cd "${order_tree}" && \
            expand_manual_suites "neighbor ip_mcast linux_cp")
          if [ "${explicit}" != "neighbor ip_mcast linux_cp" ]; then
            echo "::error::an explicit suites input changed, got '${explicit}'"
            failures=$((failures + 1))
          fi
          every=$(cd "${order_tree}" && expand_manual_suites all)
          if [ "${every}" != "alpha beta gamma" ]; then
            echo "::error::'all' did not expand to every module, got '${every}'"
            failures=$((failures + 1))
          fi
          # "all" next to explicit names is the sorted union of both: a name
          # that sorts before every enumerated module and one that sorts after
          # them both land in their sorted place.
          union=$(cd "${order_tree}" && expand_manual_suites "all aardvark zeta")
          if [ "${union}" != "aardvark alpha beta gamma zeta" ]; then
            echo "::error::'all aardvark zeta' did not expand to the sorted union, got '${union}'"
            failures=$((failures + 1))
          fi
          # word_count prints a bare non-negative integer; anything else is a
          # self-check failure rather than a comparison that cannot fail.
          word_count() {
            local count
            count=$(all_test_suites_count "${RUNNER_TEMP}")
            case "${count}" in
              ''|*[!0-9]*)
                # The complaint goes to stderr, so the only text this function
                # writes to stdout is the count the caller compares.
                >&2 echo "::error::the suite enumeration counted '${count}', not a number"
                failures=$((failures + 1))
                count=0
                ;;
            esac
            printf '%s\n' "${count}"
          }
          enumerated=$(word_count)
          if [ "${enumerated}" -lt 200 ]; then
            echo "::error::'all' enumerated ${enumerated} suites, expected at least 200"
            failures=$((failures + 1))
          fi
          if [ "${failures}" -ne 0 ]; then
            echo "::error::${failures} derivation self-check assertion(s) failed"
            exit 1
          fi
          echo "The derivation self-check passed; the tree holds ${enumerated} suites"

      # make install-dep installs $(DEB_DEPENDS), which is defined in the
      # Makefile, so key the apt archive cache on that file: the key moves when
      # the package list moves, and the run that first needs a new package is
      # the run that stores it. The install step rewrites the Makefile
      # afterwards, so the hash is taken into an output before that and both
      # cache steps read the same value.
      - name: Hash the dependency list
        id: deps
        run: |
          git config --global --add safe.directory "$PWD"
          echo "hash=$(git hash-object Makefile)" >> "$GITHUB_OUTPUT"

      - name: Restore apt archive cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debian13-${{ runner.arch }}-${{ github.job }}-${{ steps.deps.outputs.hash }}
          restore-keys: |
            apt-debian13-${{ runner.arch }}-${{ github.job }}-

      - name: Install VPP build dependencies
        run: |
          sed -i '/^\s*git config commit\.template/s/^\(\s*\)/\1-/' Makefile
          make UNATTENDED=yes install-dep

      # Saving is skipped when the exact key was restored: that entry already
      # holds what this run would store, and asking to save a key that exists
      # fails the step with "Unable to reserve cache".
      - name: Save apt archive cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debian13-${{ runner.arch }}-${{ github.job }}-${{ steps.deps.outputs.hash }}

      # Keyed by commit rather than by ref alone: a fixed key lets only the

  test-plan:
    # The style job writes and uploads the derivation helper this job reads,
    # so needs: style orders the upload before the download.
    needs: style
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
      # The build job is a matrix, and a matrix job cannot carry outputs to a
      # later job. The suite filter is derived here once; the build job reads
      # the tunnel flag for its ESP control, and the test job reads the same
      # flag for its ESP check and the shards for its matrix, so every job acts
      # on one derivation.
      tunnel_regression: ${{ steps.tests.outputs.tunnel_regression }}
      # The suites this run selected, for the test job's namespace check.
      suites: ${{ steps.tests.outputs.suites }}
      # The test job's matrix: one entry per shard, each an object pairing the
      # shard's number with the suites it runs, so the matrix has one dimension
      # and cannot expand into a cross product.
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The derivation rules are written by the style job; this job reads the
      # same file instead of restating them.
      - name: Download the suite derivation helper
        uses: actions/download-artifact@v4
        with:
          name: derive-suites-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/derive

      - name: Plan isolated ESP builds from the committed candidate
        id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # The same suites input the build job's derive step reads.
          MANUAL_SUITES: ${{ inputs.suites }}
        run: |
          set -eu
          . "${RUNNER_TEMP}/derive/derive-suites.sh"
          python3 - <<'PY'
          import ast
          import json
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args])

          base = os.environ["PR_BASE"]
          head = os.environ["PR_HEAD"]
          if not base or not head:
              # A workflow_dispatch run has no pull request context; compare the
              # branch tip with its parent instead.
              base = subprocess.run(["git", "rev-parse", "HEAD^"], capture_output=True,
                                    text=True).stdout.strip()
              head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True,
                                    text=True).stdout.strip()
          changed = (git("diff", "--name-only", base + "..." + head).decode().splitlines()
                     if base and head else [])
          enabled = False
          if "src/vnet/tunnel/tunnel_dp.h" in changed:
              path = "test/test_ipsec_esp.py"
              exists = subprocess.run(["git", "cat-file", "-e",
                                       head + ":" + path]).returncode == 0
              if exists:
                  tree = ast.parse(git("show", head + ":" + path))
                  enabled = any(isinstance(node, ast.ClassDef) and node.name == "TestIpsecEspTun"
                                and any(isinstance(method, ast.FunctionDef) and
                                        method.name == "test_tun_df44" for method in node.body)
                                for node in tree.body)
          variants = ["fixed", "original-df"] if enabled else ["fixed"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("variants=" + json.dumps(variants) + "\n")
          PY

      - name: Derive a test filter from the changed paths
        id: tests
        env:
          # A workflow_dispatch run may name the suites itself; a push run
          # leaves the input empty and derives the suites from its paths.
          MANUAL_SUITES: ${{ inputs.suites }}
        run: |
          set -eu
          . "${RUNNER_TEMP}/derive/derive-suites.sh"
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # A push or a workflow_dispatch run has no pull request context;
          # compare the branch tip with its parent instead.
          if [ -z "${base}" ] || [ -z "${head}" ]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || echo "")
            head=$(git rev-parse HEAD)
          fi
          changed=$(git diff --name-only "${base}...${head}" 2>/dev/null ||
                    git diff --name-only "${base}..${head}" 2>/dev/null || true)
          if [ -n "${MANUAL_SUITES}" ]; then
            suites=$(printf '%s' "${MANUAL_SUITES}" | tr -s '[:space:]' ' ' |
                     sed 's/^ *//; s/ *$//')
            suites=$(expand_manual_suites "${suites}")
            echo "Using the suites input of this workflow_dispatch run: ${suites}"
          else
            suites=$(printf '%s\n' "${changed}" | derive_test_suites)
          fi
          tunnel_regression=false
          case $'\n'"${changed}"$'\n' in
            *$'\n'src/vnet/tunnel/tunnel_dp.h$'\n'*)
              if [ -f test/test_ipsec_esp.py ]; then
                tunnel_regression=true
              fi
              ;;
          esac
          # The derivation reports src/vnet/tunnel/tunnel_dp.h as UNCOVERED, so
          # on its own the change falls back to ip4 and the negative control
          # would run while the positive never did. The suite is appended here,
          # before the split, so it lands in a shard.
          if [ "${tunnel_regression}" = true ]; then
            case " ${suites} " in
              *' ipsec_esp '*) ;;
              *) suites="${suites} ipsec_esp" ;;
            esac
          fi
          echo "Running TEST suites: ${suites}"
          echo "suites=${suites}" >> "$GITHUB_OUTPUT"
          echo "tunnel_regression=${tunnel_regression}" >> "$GITHUB_OUTPUT"

      # The split reads the filter the derive step published, so the tunnel
      # suite the derive step appends is in one of the shards.
      - name: Split the selected suites into test shards
        id: shards
        env:
          SUITES: ${{ steps.tests.outputs.suites }}
        run: |
          set -eu
          # One entry per shard, each an object pairing the shard's number with
          # the suites it runs. The pairing is in the data, because the matrix
          # expands independent dimensions as a cross product and has no way to
          # zip two lists. `variant` pairs with this list through `include:`
          # below, so the rendered job count is the number of entries here.
          #
          # Every selected suite is handed to exactly one shard. The count is
          # fixed at twelve and the split follows the list order, so the shards
          # of two runs hold the same suites in the same order. A hash over the
          # names would scramble that order for no benefit, because the suites
          # differ widely in duration and no assignment by name balances them.
          # A dispatch that selects all 201 suites puts 201 // 12 = 16 in each
          # shard and gives one more, 17, to the leading 201 % 12 = 9 shards.
          # Fewer suites shrink the shard count instead of leaving empty
          # shards that would start a runner to run nothing.
          shard_count=12
          total=0
          for suite in ${SUITES}; do
            total=$((total + 1))
          done
          # An empty matrix is a workflow error, so a filter that selects
          # nothing stops the run here with the reason instead.
          if [ "${total}" -eq 0 ]; then
            echo "::error::The suite filter selected no suite; the test matrix would be empty"
            exit 1
          fi
          # The split reads one suite per line, so the filter becomes a list
          # before the arithmetic turns it into shard sizes.
          suites=$(printf '%s\n' "${SUITES}" | tr ' ' '\n' | sed '/^$/d')
          per_shard=$((total / shard_count))
          remainder=$((total % shard_count))
          shards="${shard_count}"
          if [ "${total}" -lt "${shard_count}" ]; then
            shards="${total}"
          fi
          # A shard's suites are written as one space-separated string, not as
          # an array: the matrix entry is interpolated into the step that runs
          # the suites, and an array interpolated there arrives as one token
          # holding the JSON text, which no `TEST=` accepts. The string goes
          # through a JSON encoder rather than through sed, so a name with a
          # quote in it cannot break the object, and the size of a shard is
          # decided by the shard's own index, not by how many suites are already
          # placed: the leading `remainder` shards take one more.
          entries=""
          offset=0
          shard=0
          while [ "${shard}" -lt "${shards}" ]; do
            size="${per_shard}"
            if [ "${shard}" -lt "${remainder}" ]; then
              size=$((size + 1))
            fi
            names=$(printf '%s\n' "${suites}" |
                      sed -n "$((offset + 1)),$((offset + size))p" |
                      python3 -c 'import json,sys; print(json.dumps(" ".join(sys.stdin.read().split())))')
            # The first entry starts the list; every later entry is preceded by
            # one comma, so no trailing comma is left behind.
            if [ "${shard}" -ne 0 ]; then
              entries="${entries},"
            fi
            entries="${entries}{\"batch\":$((shard + 1)),\"suites\":${names}}"
            offset=$((offset + size))
            shard=$((shard + 1))
          done
          shards_json="[${entries}]"
          echo "Split ${total} suite(s) into ${shards} shard(s); sizes:"
          printf '%s\n' "${shards_json}" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print([len(s["suites"].split()) for s in d])'
          echo "shards=${shards_json}" >> "$GITHUB_OUTPUT"

  build-test:
    # It builds the tree and, on a tunnel regression, runs the ESP negative
    # control. It runs no suite: the shards of the test job do that.
    name: build (${{ matrix.variant }})
    needs: test-plan
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.test-plan.outputs.variants) }}
    runs-on: ubuntu-24.04
    # GitHub caps a GitHub-hosted job at 360 minutes. This job builds VPP
    # debug and, when the tunnel regression applies, runs the ESP negative
    # control against the unpatched tree; the ipsec_esp suite itself runs in
    # the test job's shards. A run that reaches the ceiling is truncated by the
    # platform.
    timeout-minutes: 360
    container:
      image: debian:trixie
      # The test framework reserves SHM_PER_PROCESS per worker on top of a
      # 1 GiB minimum; the 64 MiB container default is far too small.
      # ip netns needs mount/unshare/setns; link setup needs NET_ADMIN.
      # Docker's default seccomp permits these calls with SYS_ADMIN, but its
      # AppArmor profile denies mount. Allow only the TAP/vhost misc devices;
      # this job creates neither node, the suites that open them run in the
      # test job.
      options: >-
        --shm-size=2g
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --security-opt=apparmor=unconfined
        --device-cgroup-rule="c 10:200 rwm"
        --device-cgroup-rule="c 10:238 rwm"
    defaults:
      run:
        shell: bash
    env:
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Disable APT cache cleanup
        run: rm -f /etc/apt/apt.conf.d/docker-clean

      - name: Install base tools
        run: |
          apt-get update -qq
          apt-get install -y -qq sudo make git bash iproute2

      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # make install-dep installs $(DEB_DEPENDS), which is defined in the
      # Makefile, so key the apt archive cache on that file: the key moves when
      # the package list moves, and the run that first needs a new package is
      # the run that stores it. The install step rewrites the Makefile
      # afterwards, so the hash is taken into an output before that and both
      # cache steps read the same value.
      - name: Hash the dependency list
        id: deps
        run: |
          git config --global --add safe.directory "$PWD"
          echo "hash=$(git hash-object Makefile)" >> "$GITHUB_OUTPUT"

      - name: Restore apt archive cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debian13-${{ runner.arch }}-${{ github.job }}-${{ steps.deps.outputs.hash }}
          restore-keys: |
            apt-debian13-${{ runner.arch }}-${{ github.job }}-

      - name: Install VPP build dependencies
        run: |
          sed -i '/^\s*git config commit\.template/s/^\(\s*\)/\1-/' Makefile
          make UNATTENDED=yes install-dep

      # Saving is skipped when the exact key was restored: that entry already
      # holds what this run would store, and asking to save a key that exists
      # fails the step with "Unable to reserve cache".
      - name: Save apt archive cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debian13-${{ runner.arch }}-${{ github.job }}-${{ steps.deps.outputs.hash }}

      # Keyed by commit rather than by ref alone: a fixed key lets only the
      # first build of a ref store it, and every later build is asked to save a
      # key that already exists. A commit key gives each build its own entry,
      # and the prefix in restore-keys still lends a run the newest entry of
      # another commit on the same ref.
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: build-root/.ccache
          key: ccache-debug-debian13-${{ runner.arch }}-${{ matrix.variant }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-debug-debian13-${{ runner.arch }}-${{ matrix.variant }}-${{ github.ref_name }}-
            ccache-debug-debian13-${{ runner.arch }}-${{ matrix.variant }}-

      # src/scripts/version calls git describe without --tags, and origin
      # (sunoaki/vpp) has no v* tags, so the version is empty and the CMake
      # configure aborts with "string sub-command REPLACE requires at least
      # four arguments". Synthesise a version in the same format the DEB
      # workflow uses, whose ordering is already thought through, whenever no
      # tag is reachable.
      - name: Provide a version when origin has no tag
        run: |
          if ! git describe --tags --long --match 'v[0-9]*' 2>/dev/null; then
            echo "0.0.0-release+$(git log -1 --format=%ct).$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)" \
              > src/scripts/.version
          fi

      - name: Prepare exact ESP source variant and provenance
        if: needs.test-plan.outputs.tunnel_regression == 'true'
        env:
          ESP_VARIANT: ${{ matrix.variant }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # A push or a workflow_dispatch run has no pull request context;
          # report the branch tip and its parent instead of empty base and head
          # values.
          if [ -z "${PR_BASE}" ] || [ -z "${PR_HEAD}" ]; then
            PR_BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "")
            PR_HEAD=$(git rev-parse HEAD)
            export PR_BASE PR_HEAD
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args]).decode().strip()

          def blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          # Two jobs write ESP evidence: this one produces the source
          # provenance under control/, and the ipsec_esp shard writes what it
          # ran under suite/. Neither can remove the other's files.
          output = Path(os.environ["RUNNER_TEMP"]) / "esp-evidence" / "control"
          output.mkdir(parents=True, exist_ok=True)
          production = Path("src/vnet/tunnel/tunnel_dp.h")
          test = Path("test/test_ipsec_esp.py")
          before = production.read_bytes()
          test_before = test.read_bytes()
          expected_fixed = "468c628236393f184ab64736441fe1b7bbd40e36"
          expected_negative = "fd0d60c0a1a3021b22dad1d52fc3e54049bade46"
          expected_test = "093794c2074bbdf66f9350308439e833a03dccc6"
          report = {
              "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "variant": os.environ["ESP_VARIANT"], "base": os.environ["PR_BASE"],
              "head": os.environ["PR_HEAD"], "checkout": git("rev-parse", "HEAD"),
              "candidate_tree": git("rev-parse", "HEAD^{tree}"),
              "reviewed_product": "815eaa339772c4c715ac0890fe2c2b136f694fe9",
              "expected_fixed": expected_fixed, "expected_negative": expected_negative,
              "expected_test": expected_test, "before_header": blob(before),
              "before_test": blob(test_before), "replacement_count": 0,
          }
          (output / "provenance.json").write_text(json.dumps(report, indent=2) + "\n")
          assert blob(before) == expected_fixed, "candidate header differs from reviewed M40"
          assert blob(test_before) == expected_test, "candidate test differs from reviewed M40"
          assert git("diff", "--name-only", "HEAD", "--", str(production), str(test)) == ""
          old = (b'      u16 old_flags = outer->flags_and_fragment_offset;\n'
                 b'\n'
                 b'      ip4_header_set_df (outer);\n'
                 b'\n'
                 b'      sum = ip_csum_update (outer->checksum, old_flags, outer->flags_and_fragment_offset,\n'
                 b'\t\t\t    ip4_header_t, flags_and_fragment_offset);\n')
          new = (b'      u16 tos = outer->flags_and_fragment_offset;\n'
                 b'\n'
                 b'      ip4_header_set_df (outer);\n'
                 b'\n'
                 b'      sum =\n'
                 b'\tip_csum_update (outer->checksum, tos, outer->tos, ip4_header_t,\n'
                 b'\t\t\tflags_and_fragment_offset);\n')
          if os.environ["ESP_VARIANT"] == "original-df":
              assert before.count(old) == 1 and before.count(new) == 0
              negative = before.replace(old, new, 1)
              assert blob(negative) == expected_negative
              assert negative.replace(new, old, 1) == before
              production.write_bytes(negative)
              report["replacement_count"] = 1
          assert test.read_bytes() == test_before
          report["built_header"] = blob(production.read_bytes())
          report["built_test"] = blob(test.read_bytes())
          index = output / "source.index"
          env = dict(os.environ, GIT_INDEX_FILE=str(index))
          subprocess.run(["git", "read-tree", "HEAD"], env=env, check=True)
          for path in git("diff", "--name-only", "HEAD").splitlines():
              subprocess.run(["git", "add", "--", path], env=env, check=True)
          version = Path("src/scripts/.version")
          assert not version.is_symlink(), "unsafe build version input"
          if version.exists():
              assert version.is_file() and 0 < version.stat().st_size <= 4096, "invalid build version input"
              version_bytes = version.read_bytes()
              (output / "build-version.raw").write_bytes(version_bytes)
              report["build_version"] = {"source": str(version), "blob": blob(version_bytes),
                                         "sha256": hashlib.sha256(version_bytes).hexdigest()}
              subprocess.run(["git", "add", "-f", "--", str(version)], env=env, check=True)
          else:
              version_bytes = subprocess.check_output(["git", "describe", "--long", "--match", "v*"])
              assert version_bytes.strip(), "missing tag-derived build version"
              (output / "build-version.raw").write_bytes(version_bytes)
              report["build_version"] = {"source": "git describe --long --match v*",
                                         "blob": blob(version_bytes),
                                         "sha256": hashlib.sha256(version_bytes).hexdigest()}
          report["built_source_tree"] = subprocess.check_output(["git", "write-tree"], env=env).decode().strip()
          index.unlink()
          manifest = subprocess.check_output(["git", "ls-tree", "-r", "-z", report["built_source_tree"]])
          (output / "built-source-manifest.txt").write_bytes(manifest)
          report["built_manifest_sha256"] = hashlib.sha256(manifest).hexdigest()
          (output / "provenance.json").write_text(json.dumps(report, indent=2) + "\n")
          subprocess.run(["git", "diff", "--check"], check=True)
          PY

      - name: Build VPP debug
        id: build
        run: |
          git config --global --add safe.directory "$PWD"
          export VPP_EXTRA_CMAKE_ARGS="\
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          ccache -z
          make UNATTENDED=yes build
          ccache -s

      - name: Save ccache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-root/.ccache
          key: ccache-debug-debian13-${{ runner.arch }}-${{ matrix.variant }}-${{ github.ref_name }}-${{ github.sha }}

      # make test-debug consumes the installed tree and the build tree, so both
      # travel to the test job as one archive. It is written as soon as the
      # build succeeds, before any test runs, so the test job does not depend
      # on the build job's own tests passing.
      # The whole of build-root travels, not only the vpp trees: the install
      # timestamps, the external dependency build and install trees, and the
      # harness's copy of the tree all sit beside them, and `make test-debug`
      # on a shard reads the timestamps and the external trees to decide that
      # it has nothing to build.
      - name: Archive the built image for the test job
        id: image
        if: steps.build.outcome == 'success'
        env:
          # One literal name, read by both the archive step and the upload
          # step, so the name the test job downloads is visible in the file.
          IMAGE: vpp-debug-image-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu
          name="${IMAGE}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -ld build-root/build-vpp_debug-native/vpp/.mu_build_install_timestamp \
            build-root/install-vpp_debug-native/external/lib/pkgconfig/libdpdk.pc
          # build-root as a whole is 1.8 GiB here, and two of its trees are
          # never read by a shard: .ccache is only used by this build job's own
          # ccache steps, and build-vpp-native is the release tree. Leaving them
          # out keeps the payload near 1.2 GiB per shard instead of 1.8 GiB,
          # and the shard's Extract step asserts that every tree it does need
          # arrived.
          #
          # tar writes a plain archive and the upload step compresses it. GNU
          # tar does not link libzstd: `--zstd` execs a separate `zstd` program,
          # which the trixie image does not carry (it has libzstd1 only), so
          # compressing here would fail before the upload.
          tar --exclude='build-root/.ccache' \
            --exclude='build-root/build-vpp-native' \
            --exclude='build-root/install-vpp-native' \
            -cf "${RUNNER_TEMP}/${name}.tar" build-root
          ls -l "${RUNNER_TEMP}/${name}.tar"

      - name: Upload the built image
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          # Named from the same variant the archive file is named from: a
          # tunnel regression runs two matrix legs, and upload-artifact v4
          # refuses a second upload under an existing name.
          name: vpp-debug-image-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.image.outputs.name }}.tar
          retention-days: 3
          if-no-files-found: error
          # The archive leaves the archive step uncompressed, so this level is
          # what decides the download size.
          compression-level: 6

      - name: Remount /dev/shm for the test harness
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ github.workspace }}/build-root/test-logs

      - name: Run the original DF checksum control
        id: negative
        if: matrix.variant == 'original-df'
        run: |
          set -eu
          evidence="${RUNNER_TEMP}/esp-evidence/control"
          mkdir -p "${evidence}" "${RUNNER_TEMP}/esp-observer"
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = '''import json
          import os
          import traceback
          import unittest

          original = unittest.TestResult.addSubTest
          def record(self, test, subtest, error):
              if test.id() == "test_ipsec_esp.TestIpsecEspTun.test_tun_df44":
                  event = {"test": test.id(), "params": dict(subtest.params),
                           "error": None if error is None else error[0].__name__,
                           "trace": "" if error is None else "".join(traceback.format_exception(*error))}
                  path = os.path.join(os.environ["ESP_EVIDENCE"], "subtests-" + str(os.getpid()) + ".jsonl")
                  data = (json.dumps(event) + "\\n").encode()
                  if os.path.exists(path) and os.path.getsize(path) + len(data) > 1048576:
                      raise RuntimeError("ESP subtest evidence exceeds 1 MiB")
                  with open(path, "ab") as output:
                      output.write(data)
              return original(self, test, subtest, error)
          unittest.TestResult.addSubTest = record
          '''
          (Path(os.environ["RUNNER_TEMP"]) / "esp-observer/sitecustomize.py").write_text(source)
          PY
          export ESP_EVIDENCE="${evidence}"
          export PYTHONPATH="${RUNNER_TEMP}/esp-observer${PYTHONPATH:+:${PYTHONPATH}}"
          rm -f /tmp/vpp-unittest-TestIpsecEspTun/log.txt
          set +e
          make UNATTENDED=yes TEST_JOBS=auto RETRIES=0 \
            TEST=ipsec_esp.TestIpsecEspTun.test_tun_df44 test-debug 2>&1 |
            (ulimit -f 32768; tee "${evidence}/command.log")
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "${evidence}/raw-returncode.txt"
          printf '%s\n' "${statuses[1]}" > "${evidence}/capture-returncode.txt"
          printf '%s\n' 'make UNATTENDED=yes TEST_JOBS=auto RETRIES=0 TEST=ipsec_esp.TestIpsecEspTun.test_tun_df44 test-debug' > "${evidence}/command.txt"
          test "${statuses[1]}" = 0

      # This job produces the negative control only: the ipsec_esp positive
      # runs in the test job's shards, which assert its evidence themselves.
      # Both parts read the same control directory, so the provenance of the
      # built tree is checked once, here, before any suite runs against it.
      - name: Verify complete ESP evidence
        if: always() && needs.test-plan.outputs.tunnel_regression == 'true'
        env:
          ESP_VARIANT: ${{ matrix.variant }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"]) / "esp-evidence"
          control = root / "control"
          control.mkdir(parents=True, exist_ok=True)
          result = {"accepted": False, "build": os.environ["BUILD_OUTCOME"]}
          try:
              provenance = json.loads((control / "provenance.json").read_text())
              manifest = (control / "built-source-manifest.txt").read_bytes()
              assert hashlib.sha256(manifest).hexdigest() == provenance["built_manifest_sha256"]
              assert manifest == subprocess.check_output(["git", "ls-tree", "-r", "-z", provenance["built_source_tree"]])
              assert subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() == provenance["checkout"]
              version_bytes = (control / "build-version.raw").read_bytes()
              version_info = provenance["build_version"]
              assert 0 < len(version_bytes) <= 4096, "missing or oversized build version evidence"
              version_blob = hashlib.sha1(b"blob " + str(len(version_bytes)).encode() + b"\0" + version_bytes).hexdigest()
              assert version_blob == version_info["blob"]
              assert hashlib.sha256(version_bytes).hexdigest() == version_info["sha256"]
              version = Path("src/scripts/.version")
              assert not version.is_symlink(), "unsafe post-build version input"
              if version_info["source"] == str(version):
                  assert version.is_file() and version.read_bytes() == version_bytes, "build version drift"
                  assert subprocess.check_output(["git", "show", provenance["built_source_tree"] + ":" + str(version)]) == version_bytes
              else:
                  assert version_info["source"] == "git describe --long --match v*" and not version.exists()
                  assert subprocess.check_output(["git", "describe", "--long", "--match", "v*"]) == version_bytes
              for key, path in (("built_header", "src/vnet/tunnel/tunnel_dp.h"),
                                ("built_test", "test/test_ipsec_esp.py")):
                  data = Path(path).read_bytes()
                  actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
                  assert actual == provenance[key], "post-build source drift: " + path
              if os.environ["ESP_VARIANT"] == "fixed":
                  # The fixed source is what the shards run, so this job only
                  # asserts that the tree carries the fixed header.
                  assert provenance["built_header"] == provenance["expected_fixed"]
              else:
                  assert os.environ["BUILD_OUTCOME"] == "success", "build did not succeed"
                  raw = (control / "command.log").read_text()
                  rc = int((control / "raw-returncode.txt").read_text())
                  result["raw_returncode"] = rc
                  assert int((control / "capture-returncode.txt").read_text()) == 0
                  # The control's own record of what it ran, asserted here and
                  # not merely on size, and this branch is the original-df
                  # variant only, so no other variant writes this file.
                  command = (control / "command.txt").read_text().strip()
                  assert command == ("make UNATTENDED=yes TEST_JOBS=auto RETRIES=0 "
                                     "TEST=ipsec_esp.TestIpsecEspTun.test_tun_df44 test-debug"), command
                  assert os.environ["ESP_VARIANT"] == "original-df"
                  assert (control / "command.log").stat().st_size <= 32 * 1024 * 1024
                  assert 0 < rc < 128, "unexpected return code"
                  assert provenance["replacement_count"] == 1
                  assert provenance["built_header"] == provenance["expected_negative"]
                  events = []
                  for path in sorted(control.glob("subtests-*.jsonl")):
                      assert path.stat().st_size <= 1024 * 1024
                      events.extend(json.loads(line) for line in path.read_text().splitlines())
                  expected = {(flag, tos, df, size) for flag, tos in ((1, 0), (1, 171), (13, 171), (0, 171))
                              for df in (0, 1) for size in (0, 1, 54, 511)}
                  actual = [(e["params"]["tun_flags"], e["params"]["inner_tos"],
                             e["params"]["inner_df"], e["params"]["payload_size"]) for e in events]
                  assert len(events) == 32 and set(actual) == expected, "incomplete subtest matrix"
                  failures = [event for event in events if event["error"] is not None]
                  assert failures and actual[:4] == [(1, 0, 0, size) for size in (0, 1, 54, 511)]
                  assert all(event["error"] is None for event in events[:4]), "DF0 controls failed"
                  first = failures[0]
                  assert first["params"] == {"tun_flags": 1, "inner_tos": 0, "inner_df": 1, "payload_size": 0}
                  for event in events:
                      assert event["test"] == "test_ipsec_esp.TestIpsecEspTun.test_tun_df44"
                  for event in failures:
                      trace = event["trace"]
                      assert event["error"] == "AssertionError"
                      assert 'test_ipsec_esp.py", line 604, in test_tun_df44' in trace
                      assert 'test_ipsec_esp.py", line 565, in verify_encrypted' in trace
                      assert "self.assertEqual(checksum(header[:header_len]), 0)" in trace
                      assert re.search(r"AssertionError: [1-9][0-9]* != 0", trace)
                  assert "AssertionError: 49151 != 0" in first["trace"]
                  assert "FAIL:" in raw and "AssertionError: 49151 != 0" in raw
                  assert not re.search(r"^ERROR:|CoreDump|TimeoutExpired", raw, re.MULTILINE)
                  (control / "checksum-witness.txt").write_text(first["trace"])
                  result["subtests"] = len(events)
                  result["checksum_failures"] = len(failures)
              result["accepted"] = True
          except Exception as error:
              result["error"] = str(error)
              raise
          finally:
              (control / "result.json").write_text(json.dumps(result, indent=2) + "\n")
          PY

      - name: Upload ESP evidence
        if: always() && needs.test-plan.outputs.tunnel_regression == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esp-evidence-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/esp-evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

  test:
    name: test (shard ${{ matrix.entry.batch }})
    needs: [test-plan, build-test]
    # A skipped build has no image, so these runners would only fail on the
    # download; everything else is left to the shard's own steps.
    if: always() && needs.build-test.result != 'skipped' && needs.build-test.result != 'cancelled'
    strategy:
      # A failing suite does not stop the other shards, and a shard that was
      # cancelled does not stop the dispatch from reaching the rest.
      fail-fast: false
      # Twelve runners take the shards; the others wait in the queue instead of
      # all of them installing packages and building the test environment at
      # once.
      max-parallel: 12
      # One dimension, holding one object per shard. The shard's number and its
      # suites come out of the same object, so they cannot be paired wrongly:
      # independent matrix dimensions would expand as a cross product, which
      # would run every shard list twelve times.
      #
      # `include` adds the variant to each of those objects rather than making
      # a dimension of it. The variant is `fixed` because these jobs run the
      # suites against the built tree, and only that variant is built to pass
      # them: `original-df` carries the deliberately broken header the negative
      # control in the build job is designed to reject, so it gets no shard.
      matrix:
        entry: ${{ fromJSON(needs.test-plan.outputs.shards) }}
        include:
          - variant: fixed
    runs-on: ubuntu-24.04
    # A shard that hangs is cut off here rather than holding a runner until the
    # platform ceiling, and its summary is the last artifact it uploaded.
    timeout-minutes: 180
    container:
      image: debian:trixie
      # Copied from the build job: the framework and the namespace, TAP and
      # vhost tests need the same shared memory, capabilities and devices.
      options: >-
        --shm-size=2g
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --security-opt=apparmor=unconfined
        --device-cgroup-rule="c 10:200 rwm"
        --device-cgroup-rule="c 10:238 rwm"
    defaults:
      run:
        shell: bash
    # A job-level env cannot reference the runner context, so the shard's own
    # directory is declared in each step that reads it. The remaining names are
    # read by more than one step and reference nothing but the needs outputs.
    env:
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
      # The ESP evidence check and the suite loop both read this flag.
      TUNNEL_REGRESSION: ${{ needs.test-plan.outputs.tunnel_regression }}
    steps:

      - name: Disable APT cache cleanup
        run: rm -f /etc/apt/apt.conf.d/docker-clean

      - name: Install base tools
        run: |
          apt-get update -qq
          apt-get install -y -qq sudo make git bash iproute2

      # strace is installed for the suite monitor the loop starts, but its
      # attach is denied in this container (see record-suite.py), so the
      # records do not carry a trace today. The install stays because the
      # monitor's availability is what the record reports on.
      - name: Install the suite monitor
        run: |
          apt-get update -qq
          apt-get install -y -qq strace

      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # `make test-debug` installs $(DEB_DEPENDS) and builds the test virtual
      # environment itself; the image carries neither. This job therefore
      # runs the same two steps the build job runs, with the same apt archive
      # cache, so the packages come from the cache the build job filled. The
      # cache key is deliberately the same one: pressing the Makefile this
      # way keeps it byte-identical to the build job's.
      - name: Hash the dependency list
        id: deps
        run: |
          git config --global --add safe.directory "$PWD"
          echo "hash=$(git hash-object Makefile)" >> "$GITHUB_OUTPUT"

      - name: Restore apt archive cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debian13-${{ runner.arch }}-test-fixed-${{ steps.deps.outputs.hash }}
          restore-keys: |
            apt-debian13-${{ runner.arch }}-test-fixed-
            apt-debian13-${{ runner.arch }}-build-test-

      - name: Install VPP build and test dependencies
        run: |
          sed -i '/^\s*git config commit\.template/s/^\(\s*\)/\1-/' Makefile
          make UNATTENDED=yes install-dep

      - name: Download the built image
        uses: actions/download-artifact@v4
        with:
          # The shard runs the `fixed` leg (matrix include), so this reads the
          # artifact that leg uploaded.
          name: vpp-debug-image-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image

      # The archive carries the build and install trees, the external
      # dependency trees, and every .mu_build_* timestamp beside them.
      # `make test-debug` runs `vpp-install`, which is `%-install: %-build`
      # plus install_check_timestamp (build-root/Makefile:724-736), so three
      # checks decide whether the shard rebuilds:
      #
      #   configure_check_timestamp  reads $(PACKAGE_SOURCE), the platform
      #                              file and every CMakeLists.txt under it
      #   build_check_timestamp      reads $(PACKAGE_SOURCE) and the installed
      #                              package dependencies
      #   install_check_timestamp    reads $(PACKAGE_BUILD_DIR) only
      #
      # $(PACKAGE_SOURCE) is not always src/: build-data/packages/external.mk
      # sets external_source = build, and vpp_configure_depend += external-install
      # makes vpp-install enter external-install first. The source set is
      # therefore read out of the package files rather than hard-coded, so a
      # directory a package points at is in the guard below even when it is not
      # src/. `build/` was the case that exposed this.
      #
      # The checkout writes those directories after the build job finished, so
      # their mtimes are later than every archived timestamp and the shard would
      # rebuild. Each timestamp is therefore given the mtime of the newest file
      # this runner already has, copied to the nanosecond: a later checkout is
      # still later than the stamps, and the guard keeps holding. Truncating to
      # whole seconds is not enough, because a source file written in the same
      # second would count as newer.
      - name: Extract the built image
        run: |
          set -eu
          image="${RUNNER_TEMP}/image/vpp-debug-image-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}.tar"
          tar -xf "${image}"
          test -f build-root/build-vpp_debug-native/vpp/.mu_build_install_timestamp
          test -f build-root/build-vpp_debug-native/external/.mu_build_install_timestamp
          test -f build-root/install-vpp_debug-native/external/lib/pkgconfig/libdpdk.pc
          # Every directory a package names as its source, plus the make inputs.
          sources=$(sed -n 's/^[a-z][a-z0-9_-]*_source[[:space:]]*=[[:space:]]*//p' \
                      build-data/packages/*.mk | sort -u | tr '\n' ' ')
          echo "Source directories read by the make checks: ${sources}"
          find_set="${sources} build-data build-root/Makefile"
          newest=$(find ${find_set} -type f -printf '%T@ %p\n' 2>/dev/null |
                     sort -n | tail -1)
          newest=${newest#* }
          for stamp in build-root/build-vpp_debug-native/*/.mu_build_*_timestamp; do
            touch -r "${newest}" "${stamp}"
          done
          # The reset must have removed every rebuild trigger. The comparisons
          # build-root/Makefile:635-650, 683-696 and 724-736 make are repeated
          # here on the trees they read, so a shard that would still rebuild
          # stops before it runs a suite.
          for stamp in build-root/build-vpp_debug-native/*/.mu_build_*_timestamp; do
            stale=$(find ${find_set} -newer "${stamp}" -type f 2>/dev/null || true)
            if [ -n "${stale}" ]; then
              echo "::error::${stale%%$'\n'*} is newer than ${stamp}; this shard would rebuild"
              printf '%s\n' "${stale}" | head -20
              exit 1
            fi
          done
          echo "No file the make checks read is newer than the archive's timestamps"

      # The archive holds all of build-root: the build and install trees, the
      # external dependency trees, and every .mu_build_* timestamp beside them.
      # `make test-debug` runs `vpp-install`, and build-root/Makefile:724-736
      # compares .mu_build_install_timestamp against vpp's build directory and
      # its install dependencies, so those timestamps decide whether the shard
      # installs anything. They travel with the archive.
      #
      - name: Remount /dev/shm for the test harness
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ github.workspace }}/build-root/test-logs

      # The cgroup rules above let this container open the two misc devices,
      # but they do not create them and a plain container has neither. VPP's
      # TAP backend opens /dev/net/tun when it creates an LCP pair
      # (src/plugins/tap/tap.c:529, src/vnet/unix/tuntap.c:510), and its vhost
      # backend opens /dev/vhost-net (src/plugins/tap/tap.c:667); the suites
      # run in this job, so the nodes are made here.
      - name: Create the TAP and vhost device nodes
        run: |
          set -eu
          # VPP's TAP backend opens both devices when it creates an LCP pair.
          mkdir -p /dev/net
          if [ ! -e /dev/net/tun ]; then
            mknod /dev/net/tun c 10 200
          fi
          if [ ! -e /dev/vhost-net ]; then
            mknod /dev/vhost-net c 10 238
          fi
          for device in /dev/net/tun /dev/vhost-net; do
            test -c "${device}"
            (: <> "${device}")
          done

      - name: Check namespace support for linux_cp
        if: contains(format(' {0} ', needs.test-plan.outputs.suites), ' linux_cp ')
        run: |
          set -Eeuo pipefail
          namespace="vpp-ci-netns-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            result=$?
            trap - EXIT
            if [ -e "/run/netns/${namespace}" ]; then
              ip netns del "${namespace}" || result=1
            fi
            exit "${result}"
          }
          trap cleanup EXIT
          trap 'echo "::error::Namespace preflight: ${BASH_COMMAND}" >&2' ERR
          command -v ip
          id
          # Report the effective capabilities and active security filters.
          sed -n '/^Cap/p; /^NoNewPrivs:/p; /^Seccomp/p' /proc/self/status
          if [ -r /proc/self/attr/current ]; then
            cat /proc/self/attr/current || true
          fi
          set -x
          ip netns add "${namespace}"
          ip netns exec "${namespace}" ip link set lo up
          ip netns exec "${namespace}" ip link show lo
          ip netns exec "${namespace}" ip tuntap add dev vpp-ci-tap mode tap
          ip netns exec "${namespace}" ip link del vpp-ci-tap

      # Every suite of this shard is run by a recorder step and a fixer step,
      # and the checks that read a suite's own evidence are helper scripts, so
      # the suite loop stays shell and each check is a program with arguments.
      # A suite runs as a background child so a monitor can watch it; that
      # monitor's attach is refused in this container, which the record states
      # rather than hides. The recorder writes each suite's record as that
      # suite ends; the fixer runs afterwards for a record the recorder never
      # wrote, for example because the runner stopped the step first.
      - name: Write the shard's helper programs
        run: |
          set -eu
          cat > "${RUNNER_TEMP}/record-suite.py" <<'RECORDER'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          # argv: step output file, record file, trace file, suite name, exit
          # status. The record states that the suite finished, so a fixer that
          # reads it never has to infer the end from the step.
          output_path, record_path = Path(sys.argv[1]), Path(sys.argv[2])
          trace_path = Path(sys.argv[3])
          suite, status = sys.argv[4], int(sys.argv[5])
          # The harness writes the failed test methods to one comma-separated
          # line under the directory test/Makefile:17 names. It rewrites that
          # file only on the last retry attempt, and leaves it alone when the
          # last attempt has no failures, so a file from an earlier suite would
          # be attributed to a later passing one. It is therefore read only for
          # a suite that failed here.
          failed_dir = Path(os.environ.get("FAILED_DIR", "/tmp/vpp-failed-unittests"))
          failed = failed_dir / "failed_tests.txt"
          names = []
          if status != 0 and failed.is_file() and not failed.is_symlink():
              names = [name.strip() for line in failed.read_text().splitlines()
                       for name in line.split(",") if name.strip()]
          # strace creates the output file before it attaches, so an empty file
          # means the attach was refused, not that anything was traced, and
          # only a non-empty one counts as recorded.
          #
          # The attach is refused on the runner: the container holds no
          # CAP_SYS_PTRACE and the target is a sibling of strace rather than its
          # descendant, so yama's ptrace_scope denies it. Adding that capability
          # to both container option lists would make the attach succeed, and is
          # not done: it widens what any process in the container may inspect,
          # for a field nothing reads. The record keeps saying "unavailable",
          # which is true.
          recorded = trace_path.is_file() and trace_path.stat().st_size > 0
          record = {
              "test": suite,
              "lifecycle": "finished",
              "finished": True,
              "outcome": "pass" if status == 0 else "fail",
              "exit_status": status,
              "monitor": "recorded" if recorded else "unavailable",
              "failed_tests": names[-50:],
              "observed_at_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          record_path.write_text(json.dumps(record) + "\n")
          with output_path.open("a") as output:
              output.write(f"status={status}\n")
          print(json.dumps(record))
          RECORDER
          cat > "${RUNNER_TEMP}/fix-suite.py" <<'FIXER'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          # argv: record file, step output file, suite name. A recorder line of
          # `status=` is the only evidence of how the suite ended. An absent
          # line leaves the outcome unknown: it is not a cancellation, because
          # a cancelled runner usually runs no step at all.
          record_path, output_path = Path(sys.argv[1]), Path(sys.argv[2])
          suite = sys.argv[3]
          status = None
          if output_path.is_file():
              for line in output_path.read_text().splitlines():
                  if line.startswith("status="):
                      status = line.partition("=")[2].strip()
          record = {}
          if record_path.is_file():
              try:
                  record = json.loads(record_path.read_text())
              except json.JSONDecodeError:
                  record = {}
          if not record.get("finished"):
              record.update({
                  "test": suite,
                  "lifecycle": "finished",
                  "finished": True,
                  "outcome": ("pass" if status == "0" else
                              "fail" if status else "unknown"),
                  "exit_status": int(status) if status else None,
                  "monitor": "unavailable",
                  "failed_tests": record.get("failed_tests", []),
                  "observed_at_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              })
              record_path.write_text(json.dumps(record) + "\n")
          print(json.dumps(record))
          FIXER
          cat > "${RUNNER_TEMP}/capture-esp-suite.py" <<'ESP'
          import json
          import re
          import shutil
          import sys
          from pathlib import Path

          # argv: suite exit status, evidence directory, named log, named test
          # and method. The named log is the harness log of the test class, and
          # the result lines in it name the callback and the exact method.
          status, evidence = int(sys.argv[1]), Path(sys.argv[2])
          source, named_test, method = Path(sys.argv[3]), sys.argv[4], sys.argv[5]
          if not source.is_file() or source.is_symlink() \
                  or source.stat().st_size > 8 * 1024 * 1024:
              sys.exit("::error::Missing, unsafe or oversized ESP named log")
          evidence.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, evidence / "named-test.log")
          (evidence / "raw-returncode.txt").write_text(f"{status}\n")
          log = source.read_text(errors="replace")
          pattern = rf" --- (add\w+)\(\) {re.escape(named_test)}\.{re.escape(method)}\("
          events = {}
          for callback in re.findall(pattern, log):
              events.setdefault(method, []).append(callback)
          (evidence / "subtests.json").write_text(json.dumps(events, sort_keys=True) + "\n")
          print(f"{named_test}.{method}: {events.get(method)}")
          if events.get(method) != ["addSuccess"]:
              sys.exit(f"::error::{named_test}.{method} recorded {events.get(method)}")
          ESP
          cat > "${RUNNER_TEMP}/check-linux-cp.py" <<'LINUXCP'
          import re
          import sys
          from pathlib import Path

          # argv: recovery results log, then the test methods that must have
          # succeeded. VppTestResult.log_result records the callback and the
          # exact test name, so the log is the evidence, not the exit status.
          path = Path(sys.argv[1])
          if not path.is_file():
              sys.exit(f"::error::Missing recovery test results: {path}")
          results = {}
          pattern = r" --- (add\w+)\(\) TestLinuxCPNetlinkRecovery\.(\w+)\("
          for callback, method in re.findall(pattern, path.read_text()):
              results.setdefault(method, []).append(callback)
          for method in sys.argv[2:]:
              callbacks = results.get(method, [])
              if callbacks != ["addSuccess"]:
                  sys.exit(f"::error::{method}: expected addSuccess, "
                           f"got {callbacks}; see {path}")
              print(f"Verified {method}: addSuccess")
          LINUXCP
          cat > "${RUNNER_TEMP}/collect-suite-evidence.py" <<'COLLECT'
          import os
          import re
          import shutil
          import stat
          from pathlib import Path

          # Reads SUITE and OUTPUT. The next make test-debug runs the
          # framework's reset, which removes the harness trees, so this copy
          # runs right after the suite. The copy is per suite because two
          # suites can share a test-class directory name.
          suite, output = os.environ["SUITE"], Path(os.environ["OUTPUT"])
          limit = 32 * 1024 * 1024
          reserved = {"log.txt", "vpp_stdout.txt", "vpp_stderr.txt", "failed_tests.txt"}
          output.mkdir(parents=True, exist_ok=True)
          originals = [Path("/tmp/vpp-failed-unittests")] + sorted(Path("/tmp").glob("vpp-unittest-*"))
          copied = []
          copied_count = 0
          for original in originals:
              if original.is_symlink() or not original.is_dir():
                  copied.append(f"MISSING OR UNSAFE directory: {original}")
                  continue
              for directory, subdirs, names in os.walk(original, followlinks=False):
                  subdirs[:] = sorted(name for name in subdirs
                                      if not (Path(directory) / name).is_symlink())
                  for name in sorted(names):
                      source = Path(directory) / name
                      keep = (name in reserved or name.startswith("vpp_api_trace")
                              or re.fullmatch(r"api_post_mortem\.[0-9]+", name) is not None
                              or name.endswith(".log"))
                      if not keep:
                          continue
                      # A file can vanish between the walk and the copy, so the
                      # size check and the copy share one try: a file that
                      # disappears is recorded, not raised.
                      try:
                          if not stat.S_ISREG(source.lstat().st_mode):
                              continue
                          if source.stat().st_size > limit:
                              copied.append(f"SKIPPED (over 32 MiB): {source}")
                              continue
                          target = output / f"{copied_count:04d}{source.suffix}"
                          shutil.copyfile(source, target)
                      except OSError as error:
                          copied.append(f"SKIPPED ({error}): {source}")
                          continue
                      copied.append(f"COPIED: {source} -> {target.name}")
                      copied_count += 1
                      if copied_count >= 2000:
                          break
                  if copied_count >= 2000:
                      break
          (output / "collection-report.txt").write_text("\n".join(copied) + "\n")
          print(f"Copied {copied_count} file(s) of suite {suite}")
          COLLECT

      - name: Run the shard's suites
        env:
          SUITES: ${{ matrix.entry.suites }}
          SHARD_DIAGNOSTICS: ${{ runner.temp }}/shard-diagnostics
        run: |
          git config --global --add safe.directory "$PWD"
          set -eu
          read -ra suites <<< "${SUITES}"
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::The shard matrix entry names no suite"
            exit 1
          fi
          summary_file="${SHARD_DIAGNOSTICS}/suite-summary.txt"
          records="${SHARD_DIAGNOSTICS}/records"
          mkdir -p "${SHARD_DIAGNOSTICS}" "${records}"
          : > "${summary_file}"
          results=()
          failed=()
          # errexit would end the step at the first failing suite, so it is off
          # for the suite bodies and every command records its own status.
          for suite in "${suites[@]}"; do
            echo "Running TEST=${suite}"
            suite_status=0
            touch "${records}/${suite}.status"
            trace="${RUNNER_TEMP}/suite-exec-${suite}.trace"
            rm -f "${trace}"
            # The harness wipes these itself, but only from `reset`, which
            # `$(FAILED_DIR): reset` reaches inside the suite's own make after
            # vpp-install has run (test/Makefile:358, root Makefile:573). When
            # that install fails the wipe never happens and the previous
            # suite's failed_tests.txt would be read as this suite's. The wipe
            # therefore happens here, before the suite starts, so it can
            # neither inherit a file nor destroy this suite's own.
            rm -rf "${FAILED_DIR:-/tmp/vpp-failed-unittests}"
            if [ "${suite}" = linux_cp ]; then
              recovery_log=/tmp/vpp-unittest-TestLinuxCPNetlinkRecovery/log.txt
              rm -f "${recovery_log}"
            fi
            set +e
            make UNATTENDED=yes TEST_JOBS=auto RETRIES=2 TEST="${suite}" test-debug &
            suite_pid=$!
            monitor_pid=""
            if command -v strace >/dev/null 2>&1; then
              strace -f -qq -e trace=execve -o "${trace}" -p "${suite_pid}" \
                >/dev/null 2>&1 &
              monitor_pid=$!
            fi
            set -e
            wait "${suite_pid}" || suite_status=$?
            # The monitor is a child of this shell, so stopping it here keeps it
            # from outliving the suite it watches.
            if [ -n "${monitor_pid}" ]; then
              kill "${monitor_pid}" 2>/dev/null || true
              wait "${monitor_pid}" 2>/dev/null || true
            fi
            set +e
            if [ "${suite}" = ipsec_esp ] && [ "${TUNNEL_REGRESSION}" = true ]; then
              # The fixed tree is what this suite ran against, so its own
              # callback line is the assertion for the ESP change.
              python3 "${RUNNER_TEMP}/capture-esp-suite.py" "${suite_status}" \
                "${RUNNER_TEMP}/esp-evidence/suite" \
                /tmp/vpp-unittest-TestIpsecEspTun/log.txt \
                TestIpsecEspTun test_tun_df44 || suite_status=1
            fi
            if [ "${suite}" = linux_cp ]; then
              python3 "${RUNNER_TEMP}/check-linux-cp.py" "${recovery_log}" \
                test_netlink_poll_error_recovery \
                test_netlink_poll_error_invalid_fd || suite_status=1
            fi
            # A suite that passed its make but failed one of the checks above is
            # recorded as a failure, because those checks are part of its
            # evidence.
            python3 "${RUNNER_TEMP}/record-suite.py" \
              "${records}/${suite}.status" "${records}/${suite}.json" \
              "${trace}" "${suite}" "${suite_status}"
            if [ "${suite_status}" = 0 ]; then
              results+=("${suite}: pass")
              echo "${suite}: pass" >> "${summary_file}"
              echo "Suite result: ${suite}: pass"
            else
              results+=("${suite}: fail")
              failed+=("${suite}")
              echo "${suite}: fail" >> "${summary_file}"
              echo "Suite result: ${suite}: fail"
            fi
            SUITE="${suite}" OUTPUT="${SHARD_DIAGNOSTICS}/${suite}" \
              python3 "${RUNNER_TEMP}/collect-suite-evidence.py" || true
            if [ "${suite_status}" -ne 0 ]; then
              echo "::error::TEST=${suite} failed; its evidence is in ${SHARD_DIAGNOSTICS}/${suite}"
            fi
          done
          set -e
          echo "Shard summary (${#results[@]} suite(s)):"
          printf '  %s\n' "${results[@]}"
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::${#failed[@]} of ${#results[@]} suite(s) failed in this shard: ${failed[*]}"
            exit 1
          fi
          echo "All ${#results[@]} suite(s) of this shard passed"

      # The run step can be stopped before its last suite ends, and a runner
      # can stop the step before its recorder reached that suite. This step
      # writes a record for every suite the shard did not record, with the
      # outcome left unknown when no exit status was captured.
      - name: Finish the suite records
        if: always()
        env:
          SUITES: ${{ matrix.entry.suites }}
          SHARD_DIAGNOSTICS: ${{ runner.temp }}/shard-diagnostics
        run: |
          set -eu
          read -ra suites <<< "${SUITES}"
          records="${SHARD_DIAGNOSTICS}/records"
          mkdir -p "${records}"
          for suite in "${suites[@]}"; do
            touch "${records}/${suite}.status"
            python3 "${RUNNER_TEMP}/fix-suite.py" "${records}/${suite}.json" \
              "${records}/${suite}.status" "${suite}"
          done

      # The fixed tree is the one the suites ran against, so their own results
      # are the assertion: every DF=1 case of the ESP test passed, and the
      # build job's control found them failing on the unpatched tree.
      - name: Verify the ESP positive against the fixed build
        if: always()
        env:
          BUILD_OUTCOME: ${{ needs.build-test.result }}
          SHARD_SUITES: ${{ matrix.entry.suites }}
        run: |
          if [ "${TUNNEL_REGRESSION}" != true ]; then
            echo "No tunnel regression in this change; nothing to assert for the ESP test"
            exit 0
          fi
          case " ${SHARD_SUITES} " in
            *' ipsec_esp '*) ;;
            *) echo "This shard does not run ipsec_esp"; exit 0 ;;
          esac
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          suite = Path(os.environ["RUNNER_TEMP"]) / "esp-evidence/suite"
          events = json.loads((suite / "subtests.json").read_text())
          assert events.get("test_tun_df44") == ["addSuccess"], events
          assert int((suite / "raw-returncode.txt").read_text()) == 0
          assert (suite / "named-test.log").stat().st_size > 0
          assert os.environ["BUILD_OUTCOME"] == "success"
          print("ipsec_esp.TestIpsecEspTun.test_tun_df44 passed against the fixed tree")
          PY

      # The evidence above is written on this shard's runner, and the ESP
      # upload in the build job reads a different runner's temp directory, so
      # without this step the shard's own log and subtests would survive
      # nowhere. Only the shard that ran ipsec_esp has the tree; the others
      # upload nothing and say so.
      - name: Upload the ESP suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp-suite-evidence-batch${{ matrix.entry.batch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/esp-evidence/suite/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      # The shard prints its table after its last suite, so a shard that
      # reaches the job's time limit loses the table but not the per-suite
      # result lines, which the loop appends as each suite ends. This step
      # reads the same directory the loop writes.
      - name: Report the shard summary so far
        if: always()
        env:
          SHARD_DIAGNOSTICS: ${{ runner.temp }}/shard-diagnostics
        run: |
          summary="${SHARD_DIAGNOSTICS}/suite-summary.txt"
          mkdir -p "${SHARD_DIAGNOSTICS}"
          if [ ! -s "${summary}" ]; then
            echo "No suite of this shard finished before this step ran" > "${summary}"
          fi
          echo "Per-suite results recorded by this shard so far:"
          cat "${summary}"

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vpp-test-diagnostics-batch${{ matrix.entry.batch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-diagnostics/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      # Every shard uploads its own table: a cancelled run stops the shards, and
      # this artifact is what survives that.
      - name: Upload the suite summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpp-suite-summary-batch${{ matrix.entry.batch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-diagnostics/suite-summary.txt
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

  # This job needs the test job, so it starts after the last shard has
  # stopped, and it runs under `always()` so it also starts when a shard
  # failed. It downloads every shard's own summary artifact and prints the
  # union table in the job summary and in one log, instead of a reader opening
  # twelve jobs.
  #
  # When the whole run is cancelled this job never starts, because nothing
  # starts after a cancel. The table then lives in the per-shard artifact
  # vpp-suite-summary-batch<N>-<run_id>-<run_attempt>, which each
  # shard uploads under `always()`, and each shard's own log shows how far that
  # shard reached.
  aggregate:
    name: report the run
    needs: [test-plan, build-test, test]
    if: always() && needs.test.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # A run whose shards all failed before uploading has nothing to fetch,
      # and the absence of a summary is itself the report, so the download is
      # allowed to find nothing.
      - name: Download the shard summaries
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: vpp-suite-summary-*
          path: ${{ runner.temp }}/shard-summaries
          merge-multiple: false

      - name: Print the union table
        run: |
          set -eu
          output="${RUNNER_TEMP}/run-summary.txt"
          : > "${output}"
          # One suite-bearing matrix, and the shard number in each name is
          # unique, so every suite occurs in one family only.
          top=0
          shopt -s nullglob
          for family in "${RUNNER_TEMP}"/shard-summaries/*; do
            [ -d "${family}" ] || continue
            file="${family}/suite-summary.txt"
            if [ ! -s "${file}" ]; then
              echo "No summary from $(basename "${family}")" >> "${output}"
              continue
            fi
            while IFS= read -r line; do
              [ -n "${line}" ] || continue
              echo "$(basename "${family}"): ${line}" >> "${output}"
            done < "${file}"
            top=$((top + 1))
          done
          if [ "${top}" -eq 0 ]; then
            echo "No shard reported a summary" >> "${output}"
          fi
          {
            echo "## Test results of this run"
            echo
            echo '```'
            sort "${output}"
            echo '```'
          } > "${RUNNER_TEMP}/step-summary.txt"
          cat "${RUNNER_TEMP}/step-summary.txt" >> "$GITHUB_STEP_SUMMARY"
          cat "${output}"

      - name: Upload the run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpp-run-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/run-summary.txt
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6
