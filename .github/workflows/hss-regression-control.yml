          text = (Path(os.environ["EVIDENCE"]) / "fixtures/console.log").read_text()
          assert "Ran 24 tests in " in text and "\nOK\n" in text, text
          tree = ast.parse((Path(os.environ["TOOLS"]) / "control.py").read_text())
          functions = [node for node in tree.body if isinstance(node, ast.FunctionDef) and
                       node.name in ("require", "infrastructure_text")]
          namespace = {"re": re}
          exec(compile(ast.Module(body=functions, type_ignores=[]), "counter-fixtures", "exec"), namespace)
          normalize = namespace["infrastructure_text"]
          header = "   Count                  Node                              Reason               Severity \n"
          for variant in ("fixed", "cache-limit", "api-protocol", "original-endpoint", "read-error-unlock", "http-name"):
              for count in (1, 2, 3, 17):
                  counter = f"         {count}          af-packet-input                    timed out block             error  \n"
                  other = "         1           ethernet-input                        no error                error  \n"
                  reply = header + counter + other
                  rendered = "12:34:56,789 show error\n" + reply + "\n"
                  events = [dict(kind="cli_reply", command="show error", pid=1, seq=1, retval=0, reply=reply),
                            dict(kind="cli", command="show error", pid=1, seq=2, reply=reply)]
                  expected = rendered.replace(counter, "\n")
                  assert normalize(rendered, events, variant) == expected
                  assert normalize(counter, events, variant) == counter
                  assert normalize(rendered, events[1:], variant) == rendered
                  for key, value in (("retval", -1), ("pid", 2), ("seq", 0), ("reply", "different")):
                      changed = copy.deepcopy(events)
                      changed[0][key] = value
                      assert normalize(rendered, changed, variant) == rendered
                  for before, after in (("af-packet-input", "other-input"), ("timed out block", "timed out operation"),
                                        ("error  \n", "warning  \n"), ("Severity \n", "Severity broken\n")):
                      changed = copy.deepcopy(events)
                      for event in changed:
                          event["reply"] = event["reply"].replace(before, after)
                      altered = rendered.replace(before, after)
                      assert normalize(altered, changed, variant) == altered
                  for marker in ("SIGSEGV", "Aborted", "Bus error", "core was generated", "operation timed out",
                                 "TimeoutError", "VppTransportSocketIOError", "VPP is dead", "not enough cpus",
                                 "Skipping tests due to setup failure"):
                      assert normalize(rendered + marker, events, variant) == expected + marker
                  for marker in ("ERROR: AddressSanitizer: bad", "AddressSanitizer:DEADLYSIGNAL",
                                 "Assertion `pointer` failed"):
                      try:
                          normalize(rendered + marker, events, variant)
                      except AssertionError:
                          pass
                      else:
                          raise AssertionError("Fatal diagnostic was masked: " + marker)
          print("Counter fixtures passed: 24 variant/count combinations with provenance and fatal checks")
          import runpy
          import sys
          sys.path.insert(0, os.environ["TOOLS"])
          control = runpy.run_path(str(Path(os.environ["TOOLS"]) / "control.py"))
          method = "test_http_static_cache_read_error"
          expected = [f"test_http_static.{cls}.{method}" for cls in control["CLASSES"]]
          events = [dict(kind="loaded", pid=1, seq=1)]
          frame = ('  File "/fixture/test/asf/test_http_static.py", line 500, '
                   'in test_http_static_cache_read_error\n'
                   '    self.assertEqual(reply.retval, 0, reply.reply)\n')
          traceback = ("Traceback (most recent call last):\n" + frame +
                       "    ~~~~~~~~~~~~~~~~^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n"
                       "AssertionError: -1 != 0 : test http static cache read-error: cache read error retained lock\n")
          for index, test in enumerate(expected):
              events.append(dict(kind="startTest", pid=1, seq=len(events) + 1, test=test, workers=index,
                                 netns_disabled=False, excluded=[], vpp_cmdline=["vpp"]))
              valid = f"/fixture/{index}/valid.txt"
              for invalid in (f"/fixture/{index}/missing.txt", valid + "/child"):
                  events.append(dict(kind="cli_reply", pid=1, seq=len(events) + 1,
                                     command=f"test http static cache read-error {invalid} {valid}", retval=-1,
                                     reply="cache read error retained lock"))
                  events.append(dict(kind="addSubTest", pid=1, seq=len(events) + 1, test=test,
                                     params={"invalid": invalid}, error="AssertionError", traceback=traceback))
              events.append(dict(kind="stopTest", pid=1, seq=len(events) + 1, test=test))
          events.append(dict(kind="completed", pid=1, seq=len(events) + 1, tests=2, failures=4,
                             errors=0, skips=0, expected=0, unexpected=0))
          console = traceback * 4
          validate = control["validate"]
          validate(events, console, 2, expected, "read-error-unlock", "")
          rejected = 0
          def rejects(changed, raw=console, logs=""):
              global rejected
              try:
                  validate(changed, raw, 2, expected, "read-error-unlock", logs)
              except AssertionError:
                  rejected += 1
              else:
                  raise AssertionError("Invalid read-error evidence was accepted")
          rejects(events, traceback * 3)
          rejects(events, traceback * 5)
          for before, after in (("line 500", "line 501"), ("/fixture/", "/foreign/"),
                                (method, "test_other"), ("reply.retval, 0", "reply.retval, 1"),
                                ("AssertionError: -1", "ValueError: -1"),
                                ("retained lock", "missing diagnostic")):
              rejects(events, console.replace(before, after, 1))
          for kind, key, value in (("addSubTest", "test", "wrong.class.method"),
                                   ("addSubTest", "params", {"invalid": "/wrong"}),
                                   ("addSubTest", "error", "ValueError"),
                                   ("cli_reply", "retval", 0), ("cli_reply", "pid", 2),
                                   ("cli_reply", "seq", 0), ("cli_reply", "reply", "missing diagnostic"),
                                   ("stopTest", "pid", 2), ("completed", "failures", 3)):
              changed = copy.deepcopy(events)
              next(event for event in changed if event["kind"] == kind)[key] = value
              rejects(changed)
          for before, after in (("line 500", "line 501"), ("/fixture/", "/foreign/"),
                                (frame, frame * 2)):
              changed = copy.deepcopy(events)
              event = next(event for event in changed if event["kind"] == "addSubTest")
              event["traceback"] = event["traceback"].replace(before, after)
              rejects(changed)
          for kind in ("stopTest", "completed", "cli_reply", "addSubTest"):
              rejects([event for event in events if event["kind"] != kind])
          for marker in ("SIGSEGV", "TimeoutError", "operation timed out", "VPP is dead"):
              rejects(events, console + marker)
              rejects(events, logs=marker)
          print(f"Raw read-error fixtures passed: exact four correlated frames; {rejected} invalid inputs rejected")
          test = "test_http.TestHttpNameOwnership.test_app_name_ownership"
          messages = ("accepted connections own separate names", "listener changes do not alter accepted names",
                      "closing one connection retains its sibling and listener", "accepted name survives listener disposal",
                      "QUIC streams own names and keep borrowed host pointers",
                      "stream rollback disposal retains the connection name",
                      "replacement stream name survives old stream and connection disposal",
                      "empty names can be copied and disposed")
          reply = "".join(f"PASS:{index + 1}: {message}\n" for index, message in enumerate(messages)) + "SUCCESS\n"
          command = "test http app-name-ownership"
          events = [dict(kind="loaded", pid=1, seq=1),
                    dict(kind="startTest", pid=1, seq=2, test=test, workers=0, netns_disabled=False,
                         excluded=[], vpp_cmdline=["vpp", "http_unittest_plugin.so { enable }"]),
                    dict(kind="cli_reply", pid=1, seq=3, command=command, retval=0, reply=reply),
                    dict(kind="cli", pid=1, seq=4, command=command, reply=reply),
                    dict(kind="addSuccess", pid=1, seq=5, test=test),
                    dict(kind="stopTest", pid=1, seq=6, test=test),
                    dict(kind="completed", pid=1, seq=7, tests=1, failures=0, errors=0,
                         skips=0, expected=0, unexpected=0)]
          logs = "--- addSuccess() TestHttpNameOwnership.test_app_name_ownership(ownership)"
          validate_http = control["validate_http_name"]
          validate_http(events, "", 0, logs)
          rejected = 0
          def rejects_http(changed, console="", raw_logs=logs, rc=0):
              global rejected
              try:
                  validate_http(changed, console, rc, raw_logs)
              except AssertionError:
                  rejected += 1
              else:
                  raise AssertionError("Invalid HTTP name evidence was accepted")
          for kind in ("cli_reply", "cli", "startTest", "stopTest", "addSuccess", "completed", "loaded"):
              rejects_http([event for event in events if event["kind"] != kind])
          for kind in ("cli_reply", "cli", "addSuccess", "completed"):
              rejects_http(events + [copy.deepcopy(next(event for event in events if event["kind"] == kind))])
          for kind, key, value in (("cli_reply", "command", "test http other"), ("cli", "command", "test http other"),
                                   ("cli_reply", "retval", -1), ("cli_reply", "pid", 2), ("cli", "pid", 2),
                                   ("cli_reply", "seq", 1), ("cli", "seq", 5), ("cli", "reply", "different"),
                                   ("addSuccess", "seq", 3), ("addSuccess", "test", "wrong.class.method"),
                                   ("stopTest", "pid", 2), ("completed", "tests", 2),
                                   ("startTest", "excluded", ["http_unittest"])):
              changed = copy.deepcopy(events)
              next(event for event in changed if event["kind"] == kind)[key] = value
              rejects_http(changed)
          for kind in ("addFailure", "addError", "addSkip", "addSubTest", "addExpectedFailure", "addUnexpectedSuccess"):
              changed = copy.deepcopy(events)
              next(event for event in changed if event["kind"] == "addSuccess")["kind"] = kind
              rejects_http(changed)
          for key in ("failures", "errors", "skips", "expected", "unexpected"):
              changed = copy.deepcopy(events)
              changed[-1][key] = 1
              rejects_http(changed)
          lines = reply.splitlines(keepends=True)
          for index in range(len(lines)):
              for altered in ("".join(lines[:index] + lines[index + 1:]),
                              reply.replace(lines[index], lines[index] * 2, 1),
                              reply.replace(lines[index], "FAIL\n", 1)):
                  changed = copy.deepcopy(events)
                  changed[2]["reply"] = changed[3]["reply"] = altered
                  rejects_http(changed)
          for altered in (reply.replace("PASS:1:", "PASS:0:"), reply + "extra\n",
                          "".join([lines[1], lines[0]] + lines[2:])):
              changed = copy.deepcopy(events)
              changed[2]["reply"] = changed[3]["reply"] = altered
              rejects_http(changed)
          rejects_http(events, rc=1)
          rejects_http(events, raw_logs="")
          rejects_http(events, raw_logs=logs.replace("addSuccess", "addFailure"))
          for marker in ("SIGSEGV", "Aborted", "Bus error", "core was generated", "TimeoutError",
                         "operation timed out", "VppTransportSocketIOError", "VPP is dead", "not enough cpus",
                         "Skipping tests due to setup failure", "ERROR: AddressSanitizer: bad", "Assertion `pointer` failed"):
              rejects_http(events, console=marker)
              rejects_http(events, raw_logs=logs + marker)
          print(f"HTTP name fixtures passed: exact paired eight PASS replies; {rejected} invalid inputs rejected")
          events = []
          listing = "show session listeners quic verbose 2"
          add = "http static listener add uri quic://10.10.1.2:8087 url-handlers http3"
          delete = "http static listener del uri quic://10.10.1.2:8087 http3"
          for worker, cls in enumerate(control["CLASSES"]):
              test = f"test_http_static.{cls}.test_http_static_listener_http3_identity"
              pid = worker + 1
              events.append(dict(kind="startTest", pid=pid, seq=len(events) + 1, test=test))
              def query(command, reply):
                  events.append(dict(kind="cli_reply", pid=pid, seq=len(events) + 1,
                                     command=command, reply=reply, retval=0))
                  events.append(dict(kind="cli", pid=pid, seq=len(events) + 1, command=command, reply=reply))
              query(listing, "[0:2][Q] baseline\n")
              for repeat in range(2):
                  query(add, "")
                  query(listing, "[0:2][Q] baseline\n[1:5][Q] http\n")
                  query("show session thread 1 index 5", "QUIC listener ALPN: h3\n")
                  events.append(dict(kind="cli_reply", pid=pid, seq=len(events) + 1,
                                     command=delete, reply="", retval=0))
                  query(listing, "[0:2][Q] baseline\n")
              events.append(dict(kind="addSuccess", pid=pid, seq=len(events) + 1, test=test))
              events.append(dict(kind="stopTest", pid=pid, seq=len(events) + 1, test=test))
          quic = control["quic_evidence"]
          quic(events)
          rejected = 0
          def rejects_quic(changed):
              global rejected
              try:
                  quic(changed)
              except AssertionError:
                  rejected += 1
              else:
                  raise AssertionError("Invalid QUIC identity evidence was accepted")
          for position, event in enumerate(events):
              if event["kind"] not in ("cli", "cli_reply"):
                  continue
              rejects_quic(events[:position] + events[position + 1:])
              rejects_quic(events[:position] + [copy.deepcopy(event)] + events[position:])
          for command, key, value in (("show session thread 1 index 5", "command", "show session thread 2 index 5"),
                                      ("show session thread 1 index 5", "command", "show session thread 1 index 6"),
                                      ("show session thread 1 index 5", "reply", "unrelated http/1.1"),
                                      (listing, "retval", -1), (delete, "retval", -1),
                                      (add, "pid", 9), (add, "seq", 0)):
              changed = copy.deepcopy(events)
              next(event for event in changed if event["kind"] == "cli_reply" and
                   event["command"] == command)[key] = value
              rejects_quic(changed)
          for replacement in ("[0:2][Q] baseline\n[1:6][Q] http\n", "[1:5][Q] http\n",
                              "[0:2][Q] baseline\n[1:5][Q] http\n[1:5][Q] duplicate\n"):
              changed = copy.deepcopy(events)
              for event in changed:
                  if event.get("command") == listing and "[1:5]" in event["reply"]:
                      event["reply"] = replacement
              rejects_quic(changed)
          changed = copy.deepcopy(events)
          for event in changed:
              if event.get("command") == "show session thread 1 index 5":
                  event["reply"] = "http/1.1"
          changed.append(dict(kind="cli", pid=99, seq=999, command="unrelated", reply="h3"))
          rejects_quic(changed)
          changed = copy.deepcopy(events)
          changed[-3]["seq"] = changed[-2]["seq"] + 1
          rejects_quic(changed)
          changed = copy.deepcopy(events)
          changed[-4]["reply"] = changed[-3]["reply"] = "[0:2][Q] baseline\n[1:5][Q] retained\n"
          rejects_quic(changed)
          print(f"QUIC fixtures passed: both worker classes and two exact listener iterations; {rejected} invalid inputs rejected")
          PY

      - name: Restore narrow source field and identify build tree
        timeout-minutes: 5
        run: python3 "$TOOLS/control.py" mutate

      - name: Supply reproducible fallback version
        id: version
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! git describe --long --match 'v[0-9]*' 2>/dev/null; then
            echo "0.0.0-release+$(git log -1 --format=%ct).$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)" > src/scripts/.version
          fi
          if [ -f src/scripts/.version ]; then cp src/scripts/.version "$EVIDENCE/version.txt"; fi

      - name: Build independent debug variant with TLS and QUIC
        timeout-minutes: 42
        run: |
          set -euo pipefail
          python3 "$TOOLS/control.py" build make UNATTENDED=yes VPP_EXCLUDED_PLUGINS= build

      - name: Record exact binaries and build configuration
        timeout-minutes: 5
        run: python3 "$TOOLS/control.py" binaries

      - name: Prepare namespace runtime
        id: namespace
        timeout-minutes: 3
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ runner.temp }}/hss-evidence/runtime-setup

      - name: Record and require CPU namespace and OpenSSL environment
        id: environment
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 "$TOOLS/control.py" environment bash -euo pipefail -c '
            uname -a
            cat /etc/os-release
            openssl version -a
            python3 -c "import os,resource; limits=resource.getrlimit(resource.RLIMIT_MEMLOCK); print(dict(pid=os.getpid(),memlock_bytes=limits),flush=True); print(open(\"/proc/self/limits\").read(4096),flush=True); print([line for line in open(\"/proc/self/status\").read(8192).splitlines() if line.startswith((\"VmLck:\",\"CapEff:\"))],flush=True); assert limits == (268435456,268435456), limits"
            python3 -c "import os; print(sorted(os.sched_getaffinity(0))); assert len(os.sched_getaffinity(0)) >= 2"
            mountpoint /dev/shm
            test "$(df -B1 --output=size /dev/shm | tail -n 1)" -ge 2147483648
            namespace="hss-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap '\''ip netns del "$namespace"'\'' EXIT
            ip netns add "$namespace"
            ip netns exec "$namespace" ip link set lo up
            ip netns exec "$namespace" ip link show lo
            dpkg-query -W libssl-dev clang-format-19 python3
          '

      - name: Run full fixed suite or exact restored assertions
        timeout-minutes: 17
        run: python3 "$TOOLS/control.py" tests

      - name: Run exact HTTP name ownership regression
        if: ${{ !cancelled() && matrix.variant == 'fixed' && steps.environment.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 "$TOOLS/control.py" http-name

      - name: Always retain tools diagnostics and provenance
        if: always()
        timeout-minutes: 5
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          NAMESPACE_OUTCOME: ${{ steps.namespace.outcome }}
        run: |
          set -uo pipefail
          EVIDENCE="${EVIDENCE:-$RUNNER_TEMP/hss-evidence}"
          TOOLS="${TOOLS:-$RUNNER_TEMP/hss-tools}"
          export EVIDENCE TOOLS
          mkdir -p "$EVIDENCE"
          for path in "$TOOLS/"*.py; do
            if [ -f "$path" ]; then cp "$path" "$EVIDENCE/"; fi
          done
          collection_status=1
          if [ -f "$TOOLS/control.py" ]; then
            timeout --signal=TERM --kill-after=5s 90s python3 "$TOOLS/control.py" collect \
              > "$EVIDENCE/collection-console.log" 2>&1
            collection_status=$?
            printf 'rc=%s\n' "$collection_status" > "$EVIDENCE/collection-status.txt"
          fi
          timeout 15s git status --short > "$EVIDENCE/final-status.txt" 2>&1
          timeout 15s git diff --binary > "$EVIDENCE/final.diff" 2>&1
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, os.environ["TOOLS"])
          import evidence_schema
          root = Path(os.environ["EVIDENCE"])
          phases = {}
          names = (root / "planned-phases.txt").read_text().splitlines()
          outcomes = {"bootstrap": "BOOTSTRAP_OUTCOME", "checkout": "CHECKOUT_OUTCOME",
                      "fallback-version": "VERSION_OUTCOME", "namespace": "NAMESPACE_OUTCOME"}
          for name in names:
              paths = (root / name / "result.json", root / f"{name}-result.json")
              found = next((path for path in paths if path.is_file()), None)
              if found:
                  raw, failed_path = b"", found
                  try:
                      raw = found.read_bytes()
                      child_raw = raw
                      child = evidence_schema.record(raw, command=found.name == "result.json")
                      phases[name] = child
                      interruption = root / name / "interruption.json"
                      if interruption.is_file():
                          failed_path = interruption
                          raw = interruption.read_bytes()
                          checked = evidence_schema.interruption(raw, child, child_raw)
                          phases[name] = dict(raw_result=str(found.relative_to(root)), **checked)
                  except (ValueError, UnicodeDecodeError, OSError) as error:
                      phases[name] = evidence_schema.invalid(failed_path.relative_to(root), raw, error)
              elif (root / name / "interruption.json").is_file():
                  sidecar = root / name / "interruption.json"
                  raw, failed_path = b"", sidecar
                  try:
                      raw = sidecar.read_bytes()
                      owner_path = sidecar.with_name("ownership.json")
                      owner_raw = owner_path.read_bytes()
                      phases[name] = evidence_schema.initial_interruption(raw, owner_raw, f"{name}/result.json")
                  except (ValueError, UnicodeDecodeError, OSError) as error:
                      phases[name] = evidence_schema.invalid(failed_path.relative_to(root), raw, error)
              elif (root / name / "invalid-ownership.json").is_file():
                  diagnostic = root / name / "invalid-ownership.json"
                  raw = b""
                  try:
                      raw = diagnostic.read_bytes()
                      owner_path = diagnostic.with_name("ownership.json")
                      owner_raw = owner_path.read_bytes()
                      phases[name] = evidence_schema.invalid_ownership(
                          raw, str(owner_path.relative_to(root)), owner_raw)
                  except (ValueError, UnicodeDecodeError, OSError) as error:
                      phases[name] = dict(evidence_schema.invalid(diagnostic.relative_to(root), raw, error), spawn=None)
              elif name in outcomes:
                  outcome = os.environ.get(outcomes[name], "skipped")
                  phases[name] = dict(status="not_run" if outcome == "skipped" else outcome,
                                      rc=0 if outcome == "success" else None, action_outcome=outcome)
              else:
                  phases[name] = dict(status="not_run", rc=None, reason="No phase result; inspect earlier failure")
          (root / "phase-status.json").write_text(json.dumps(phases, indent=2) + "\n")
          files = {str(path.relative_to(root)): {"bytes": path.stat().st_size,
                   "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                   for path in sorted(root.rglob("*")) if path.is_file() and not path.is_symlink()}
          (root / "evidence-index.json").write_text(json.dumps(files, indent=2) + "\n")
          PY
          index_status=$?
          test "$index_status" -eq 0 && test "$collection_status" -eq 0

      - name: Upload bounded HSS evidence on every outcome
        timeout-minutes: 8
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hss-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hss-evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Report artifact identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        timeout-minutes: 5
        run: |
          printf 'Artifact ID: %s\nArtifact URL: %s\nArtifact digest: %s\n' \
            "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
