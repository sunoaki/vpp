                      finally:
                          slot.lock.release()
                      try:
                          reply = str(value.reply)
                          reply_hash, size = hashlib.sha256(), 0
                          for offset in range(0, len(reply), 65536):
                              chunk = reply[offset:offset + 65536].encode("utf-8", errors="backslashreplace")
