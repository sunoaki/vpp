                  process = spawn(args, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL, close_fds=True)
                  result["pid"] = process.pid
                  control.publish(directory / "result.json", result)
                  while process.poll() is None and time.monotonic() < deadline:
                      time.sleep(min(.02, max(0, deadline - time.monotonic())))
                  result["status"] = "completed" if process.poll() is not None else "collector_timeout"
                  result["cleanup_complete"] = control.cleanup(process, 2)
                  result["rc"] = process.returncode
                  if not result["cleanup_complete"]:
                      result["status"] = "collector_cleanup_incomplete"
                  worker = bounded_json(directory / "worker.json")
                  result["complete"] = receipt_complete(request, worker, process.pid,
                      result["status"], result["rc"], result["cleanup_complete"])
                  result["worker"] = worker
                  if result["complete"]:
                      result.update(entries=worker["entries"], bytes=worker["bytes"], index=worker["index"])
              except (OSError, ValueError, KeyError, TypeError, TimeoutError) as error:
                  if result["status"] == "running" or result["status"] == "completed":
