                      stream.write("HSS_UPLOAD_READY=true\n")
              except (OSError, ValueError, KeyError, TypeError, IndexError, AttributeError) as error:
                  control.publish(healthy / "upload-publication-error.json", dict(complete=False, error=str(error)[:512]))
                  print(f"Upload publication failed: {type(error).__name__}: {str(error)[:512]}", file=sys.stderr, flush=True)
                  return 1
              if not summary["complete"]:
                  print("Terminal remains incomplete: " + str(summary["errors"][-8:])[:4096], file=sys.stderr, flush=True)
              return 0 if summary["complete"] and result["complete"] else 1

          if __name__ == "__main__":
              raise SystemExit(finalize(int(sys.argv[1])))
