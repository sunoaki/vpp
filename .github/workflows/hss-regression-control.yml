                          slot.record.update(query_status="unavailable")
                      finally:
                          slot.query_active = False
                          slot.finish()
                  except Exception:
                      pass

              def query(self, slot, cls, started):
                  process = None
                  execution = started + 1.5
                  deadline = started + 2
                  result = slot.record
                  try:
                      if float(os.environ["WORK_DEADLINE"]) - time.time() < 2 or time.monotonic() >= execution:
                          result["query_status"] = "work_budget_unavailable"
                          return
                      if slot.process.poll() is not None or getattr(cls, "vpp", None) is not slot.process:
                          result["query_status"] = "not_live"
                          return
                      slot.process_metadata(min(execution, time.monotonic() + .05))
                      socket = cls.get_cli_sock_path()
                      if cls.tempdir != slot.tempdir or socket != os.path.join(slot.tempdir, "cli.sock") or not os.path.isabs(socket):
                          raise ValueError("Foreign CLI socket")
                      socket_parent = directory(cls.tempdir)
                      try:
                          info = os.stat("cli.sock", dir_fd=socket_parent, follow_symlinks=False)
                          if not stat.S_ISSOCK(info.st_mode):
                              raise ValueError("Invalid CLI socket")
                      finally:
                          os.close(socket_parent)
                      source_check = directory(self.source_path)
                      try:
                          if stamp(source_check) != self.source_inode:
                              raise ValueError("Diagnostic source root replaced")
                      finally:
                          os.close(source_check)
                      relative = "build-root/install-vpp_debug-native/vpp/bin/vppctl"
                      executable = source_file(self.source_fd, relative)
                      try:
                          if descriptor_hash(executable) != self.config["vppctl_sha256"]:
                              raise ValueError("Diagnostic executable mismatch")
                          source_check = directory(self.source_path)
                          try:
                              if stamp(source_check) != self.source_inode:
                                  raise ValueError("Diagnostic source root replaced")
                              checked = source_file(source_check, relative)
                              try:
                                  if stamp(checked) != stamp(executable):
                                      raise ValueError("Diagnostic executable replaced")
                              finally:
                                  os.close(checked)
                          finally:
                              os.close(source_check)
                          if time.monotonic() >= execution:
                              raise TimeoutError("Diagnostic preparation budget")
                          args = [self.tool, "-s", socket, "show", "logging"]
                          process = subprocess.Popen(args, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                              stderr=subprocess.PIPE, shell=False, executable=f"/proc/self/fd/{executable}",
                              cwd=f"/proc/self/fd/{self.source_fd}", pass_fds=(executable, self.source_fd))
                      finally:
                          os.close(executable)
                      result.update(query_pid=process.pid, query_status="completed")
                      with selectors.DefaultSelector() as selector:
                          for index, pipe in ((2, process.stdout), (3, process.stderr)):
                              os.set_blocking(pipe.fileno(), False)
                              selector.register(pipe, selectors.EVENT_READ, index)
                          while selector.get_map() or process.poll() is None:
                              if time.monotonic() >= execution:
