              if os.environ.get("GITHUB_JOB") == "diagnostic":
                  expected = diagnostic_requirements(load)
                  required.update(expected)
                  receipts = {row["path"]: {key: row[key] for key in ("bytes", "sha256")}
                      for row in manifest["entries"] if row["included"]}
                  if any(receipts.get(name) != receipt for name, receipt in expected.items()):
                      raise ValueError("Diagnostic upload evidence changed")
              if not required <= included or copied != manifest["bytes"] or manifest["actual_read_bytes"] < copied:
                  raise ValueError("Upload inventory required entries or byte totals disagree")

          def finalize(collection_rc):
              import control
              healthy = Path(os.environ["HSS_CONTROL"])
              def load(name, cap):
                  return collection.read_regular(healthy / relative(name), cap, time.monotonic() + 5)
              summary = terminal(load, os.environ["WORKFLOW_SHA"], collection_rc,
                  diagnostic=os.environ.get("GITHUB_JOB") == "diagnostic")
              summary.update(candidate=control.CANDIDATE, control=control.CONTROL,
                  candidate_tree=os.environ["CANDIDATE_TREE"], control_tree=os.environ["CONTROL_TREE"],
                  variant=control.VARIANT)
              control.publish(healthy / "phase-status.json", summary)
              result = collection.supervise(control, dict(mode="upload", root=os.environ["EVIDENCE"],
                  destination=str(Path(os.environ["RUNNER_TEMP"]) / "hss-upload")))
              control.publish(healthy / "upload-collection.json", result)
              try:
                  upload_complete(load, result, healthy, Path(os.environ["RUNNER_TEMP"]) / "hss-upload")
