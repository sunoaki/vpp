              finally:
                  if process is not None and result["cleanup_complete"] is not True:
                      try:
                          result["safety_cleanup"] = control.cleanup(process, 2)
                          result["rc"] = process.returncode
                      except OSError as error:
                          result.update(safety_cleanup=False, cleanup_error=type(error).__name__)
                      result["complete"] = False
