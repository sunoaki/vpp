              return snapshot, payloads

          def supervise(control, request, seconds=45, adapter=None):
              healthy = Path(os.path.abspath(os.environ["HSS_CONTROL"]))
              request = dict(request)
              for key in ("root", "destination"):
                  path = Path(os.path.abspath(request[key]))
                  if path == healthy or healthy in path.parents or path in healthy.parents:
                      raise ValueError("Collector and control roots overlap")
