              for index in (2, 3):
                  descriptor = os.open(directory / f"stream{index}", os.O_CREAT | os.O_RDWR, 0o600)
                  streams[index] = diagnostics.Stream(descriptor, 1024)
              process = None
              real_spawn = subprocess.Popen
              timing = {}
              class Process:
                  def __init__(self, child):
                      self.child = child
                  def __getattr__(self, name):
                      return getattr(self.child, name)
                  def terminate(self):
                      timing["term"] = time.monotonic()
                      if denied == "terminate":
                          raise PermissionError(errno.EPERM, "injected owned helper TERM")
                      if not omit_cleanup:
                          self.child.terminate()
                  def kill(self):
                      timing["kill"] = time.monotonic()
                      if denied == "kill":
                          raise PermissionError(errno.EPERM, "injected owned helper KILL")
                      if not omit_cleanup:
                          self.child.kill()
                  def wait(self, timeout=None):
                      if denied == "wait":
                          raise PermissionError(errno.EPERM, "injected owned helper wait")
                      if omit_cleanup:
                          raise subprocess.TimeoutExpired("negative cleanup adapter", timeout)
                      answer = self.child.wait(timeout=timeout)
                      timing["reap"] = time.monotonic()
                      return answer
              def spawn(args, **kwargs):
                  nonlocal process
                  require(args[-2:] == ["show", "logging"], "Query command changed")
                  timing["spawn"] = time.monotonic()
                  process = real_spawn([sys.executable, __file__, "helper", mode],
                      stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  return Process(process)
              slot = types.SimpleNamespace(record={}, process=types.SimpleNamespace(poll=lambda: None),
                  tempdir=str(directory), process_metadata=lambda deadline: None,
                  write=lambda index, raw: streams[index].write(raw))
              cls = types.SimpleNamespace(vpp=slot.process, tempdir=str(directory),
                                          get_cli_sock_path=lambda: str(socket))
              source = diagnostics.directory(str(control.ROOT))
              owner = types.SimpleNamespace(source_path=str(control.ROOT), source_inode=diagnostics.stamp(source),
                  source_fd=source, tool=str(control.ROOT / "build-root/install-vpp_debug-native/vpp/bin/vppctl"),
                  config={"vppctl_sha256": control.digest("build-root/install-vpp_debug-native/vpp/bin/vppctl")})
              start = time.monotonic()
              safety = None
              try:
                  with patch.object(diagnostics.subprocess, "Popen", spawn):
                      diagnostics.Diagnostics.query(owner, slot, cls, start)
                  require(process is not None, "Actual query did not reach helper spawn")
                  timing["finish"] = time.monotonic()
                  observed = dict(slot.record, query_direct_cleanup=slot.record.get("cleanup_complete"),
                      direct_reaped=direct_reaped(process), alive_before_safety=process.poll() is None,
                      owned_children_before_safety=control.children(),
                      timing={key: value - start for key, value in timing.items()},
                      streams={str(index): stream.freeze() for index, stream in streams.items()},
                      helper=dict(mode=mode, argv=[sys.executable, __file__, "helper", mode],
                                  sha256=control.digest(__file__)), actual_vppctl=False)
                  return observed
              finally:
                  if process is not None:
                      safety = control.cleanup(process, 2)
                  OBSERVATIONS.setdefault("outer_cleanup", []).append(dict(mode=mode, safety_cleanup=safety,
                      children_after=control.children(), separate_from_query=True))
                  for stream in streams.values():
                      if stream.descriptor is not None:
                          stream.freeze()
                  os.close(source)
                  server.close()

          def setup_probe(mode):
              import threading
              sys.argv = [__file__, "--vpp-ws-dir", str(control.ROOT), "--vpp-tag", "vpp_debug",
                          "--vpp-worker-count", "0", "--rnd-seed", "48", "--coredump-size", "0"]
              sys.path[:0] = [str(control.ROOT / "test"), str(control.ROOT / "test/asf")]
              module = importlib.import_module("test_http_static")
              config = importlib.import_module("config")
              case = module.TestHttpStaticCli
              case.assign_cores(config.physical_cores[:case.get_cores_required()])
              original = module.create_host_interface
              name = "hsdiag_missing"
              require(not Path("/sys/class/net", name).exists(), "Fault device is present")
              require(not config.config.skip_netns_tests, "Namespaces unavailable")
              record = dict(mode=mode, error=None, calls=[], teardown_called=False, resource_cleanup=False,
                            addSuccess=0, callbacks=[])
              def absent(*args, **kwargs):
                  host, device = original(*args, **kwargs)
                  record["calls"].append(dict(host=host, actual_device=device, returned_device=name))
                  return host, name
              observer = sys.modules.get("sitecustomize") if mode == "observed" else None
              active = getattr(observer, "diagnostics", None)
              require(mode == "baseline" or active is not None, "Live source observer unavailable")
              provider = importlib.import_module("vpp_papi_provider").VppPapiProvider
              def profile(frame, event, value):
                  if observer is not None:
                      observer.profile(frame, event, value)
                  if event != "return" or frame.f_code is not provider.cli_return_response.__code__ or value is None:
                      return
                  command = frame.f_locals.get("cli", "").strip()
                  if command == f"create host-interface name {name}":
                      record.update(retval=value.retval, reply=str(value.reply),
                                    provider_pid=os.getpid(), original_command=command)
                      if active is not None:
                          active.failure(frame, value, observer.sequence)
              class Result(unittest.TestResult):
                  def addError(self, test, error):
                      record["callbacks"].append(dict(kind="addError", test=test.id()))
                      record["error"] = dict(type=error[0].__name__, message=str(error[1]),
                          traceback="".join(traceback.format_exception(*error)),
                          frames=[dict(file=frame.filename, name=frame.name, line=frame.lineno)
                                  for frame in traceback.extract_tb(error[2])])
                      super().addError(test, error)
                  def addSuccess(self, test):
                      record["addSuccess"] += 1
                      super().addSuccess(test)
              result = Result()
              process = None
              real_spawn = subprocess.Popen
              record["logging_queries"] = []
              def spawn(args, **kwargs):
                  child = real_spawn(args, **kwargs)
                  if isinstance(args, list) and args[-2:] == ["show", "logging"]:
                      record["logging_queries"].append(dict(pid=child.pid, argv=args,
                          executable=kwargs.get("executable"), socket=case.get_cli_sock_path()))
                  return child
              try:
                  sys.setprofile(profile)
                  threading.setprofile(profile)
                  with patch.object(module, "create_host_interface", absent), patch.object(subprocess, "Popen", spawn):
                      method = unittest.defaultTestLoader.getTestCaseNames(case)[0]
                      unittest.TestSuite([case(method)]).run(result)
                  record.update(methods=result.testsRun, setup_errors=len(result.errors),
                                skips=len(result.skipped), failures=len(result.failures))
                  require(record.get("retval", 0) != 0 and len(record["calls"]) == 1 and
                          len(result.errors) == 1 and result.testsRun == 0 and not result.skipped,
                          "Missing actual unittest absent-device setup failure")
                  require(any(frame["name"] == "setUpClass" and frame["line"] == 199
                              for frame in record["error"]["frames"]), "Original setup frame absent")
              finally:
                  sys.setprofile(None)
                  threading.setprofile(None)
                  process = getattr(case, "vpp", None)
                  try:
                      case.tearDownClass()
                      record["teardown_called"] = True
                      record["resource_cleanup"] = (process is not None and process.poll() is not None and
                          all(not Path("/sys/class/net", call["actual_device"]).exists()
                              for call in record["calls"]))
                  finally:
                      if active is not None:
                          active.finish()
              if active is not None:
                  record["slots"] = [hss_collection.bounded_json(Path(active.config["directory"]) / name / "record.json")
                                     for name in active.slots]
              os.chdir(control.ROOT)
              control.publish(ROOT / f"setup-{mode}.json", record)
              return 0

          class Contract(unittest.TestCase):
              def test_live_setup_failure_query_once(self):
                  config = json.loads((control.OUT / "manifest.json").read_text())
                  directory = ROOT / "live"
                  directory.mkdir()
                  live = dict(directory=str(directory), root=str(control.ROOT),
                      vppctl=str(control.ROOT / "build-root/install-vpp_debug-native/vpp/bin/vppctl"),
                      vppctl_sha256=control.digest("build-root/install-vpp_debug-native/vpp/bin/vppctl"),
                      sources=config["diagnostic_sources"], workflow=config["workflow_sha"],
                      candidate=control.CANDIDATE, variant="fixed", runtime="diagnostic-contract")
                  results = []
                  for mode in ("baseline", "observed"):
                      env = dict(os.environ,
                          HSS_EVENTS=str(ROOT / "events") if mode == "observed" else "",
                          HSS_DIAGNOSTIC_CONFIG=json.dumps(live) if mode == "observed" else "",
                          PYTHONPATH=str(control.TOOLS) + os.pathsep + os.environ.get("PYTHONPATH", ""))
                      process = subprocess.Popen([str(control.ROOT / "build-root/test/venv/bin/python"),
                          __file__, "setup", mode], env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                      with (ROOT / f"setup-{mode}.log").open("w+b") as stream:
                          _, timeout = control.capture(process, time.monotonic() + 90, stream)
                      cleanup = control.cleanup(process, 2)
                      self.assertFalse(timeout)
                      self.assertTrue(cleanup)
                      self.assertEqual(process.returncode, 0)
                      results.append(hss_collection.bounded_json(ROOT / f"setup-{mode}.json"))
                  before, after = results
                  self.assertEqual((before["retval"], before["reply"], before["error"]),
                                   (after["retval"], after["reply"], after["error"]))
                  self.assertTrue(all(result["resource_cleanup"] and result["methods"] == 0 and
                                      result["addSuccess"] == 0 for result in results))
                  self.assertEqual(before["logging_queries"], [])
                  self.assertEqual(len(after["logging_queries"]), 1)
                  self.assertEqual(len(after["slots"]), 1)
                  slot = after["slots"][0]
                  self.assertEqual(slot["observer_pid"], after["provider_pid"])
                  self.assertEqual(slot["query_pid"], after["logging_queries"][0]["pid"])
                  event_path = ROOT / f"events.{after['provider_pid']}.jsonl"
                  raw_events = hss_collection.read_regular(event_path, 4 * 1024 * 1024 + 65536,
                                                           time.monotonic() + 5)
                  events = [json.loads(line) for line in raw_events.splitlines() if line]
                  replies = [event for event in events if event["kind"] == "cli_reply" and
                             event["command"] == after["original_command"]]
                  self.assertEqual(len(replies), 1)
                  event = replies[0]
                  self.assertEqual(event["pid"], slot["observer_pid"])
                  self.assertEqual(event["seq"], slot["event_seq"])
                  self.assertEqual(event["retval"], after["retval"])
                  self.assertEqual(event["reply"], after["reply"])
                  self.assertEqual(slot["event_file"], event_path.name)
                  self.assertEqual(slot["reply_sha256"], hashlib.sha256(event["reply"].encode()).hexdigest())
                  self.assertEqual(slot["reply_bytes"], len(event["reply"].encode()))
                  self.assertTrue(any(item["kind"] == "loaded" and item["pid"] == event["pid"]
                                      for item in events))
                  self.assertEqual(sum(item["kind"] == "addError" for item in events), 1)
                  self.assertFalse(any(item["kind"] in ("startTest", "addSuccess") for item in events))
                  verified = {}
                  self.assertEqual(set(slot["files"]), set(diagnostics.FILES))
                  for name in diagnostics.FILES:
                      artifact = hss_collection.read_regular(directory / slot["slot"] / name,
                          2 * 1024 * 1024, time.monotonic() + 5)
                      receipt = slot["files"][name]
                      self.assertEqual(len(artifact), receipt["bytes"])
                      self.assertEqual(hashlib.sha256(artifact).hexdigest(), receipt["sha256"])
                      self.assertIsNone(receipt["error"])
                      verified[name] = dict(bytes=len(artifact), sha256=receipt["sha256"])
                  after["verified_streams"] = verified
                  after["event_witness"] = dict(path=str(event_path), bytes=len(raw_events),
                      sha256=hashlib.sha256(raw_events).hexdigest(), event=event)
                  self.assertEqual(slot["query_status"], "completed")
                  self.assertTrue(slot["cleanup_complete"])
                  self.assertIsNotNone(slot.get("query_pid"))
                  self.assertIn(slot.get("process_metadata", {}).get("status"), ("captured", "unavailable"))
                  OBSERVATIONS[self._testMethodName] = dict(baseline=before, observed=after,
                      actual_vppctl=True, original_setup_failure_preserved=True)

              def test_query_term_kill_reap(self):
                  records = {}
                  for mode in ("exit", "silent", "output", "ignore", "descendant"):
                      result = query_case(mode)
                      self.assertTrue(result["query_direct_cleanup"])
                      self.assertTrue(result["direct_reaped"])
                      self.assertFalse(result["alive_before_safety"])
                      expected = ("completed" if mode == "exit" else
                                  "output_limit_or_write_error" if mode == "output" else "timeout")
                      self.assertEqual(result["query_status"], expected)
                      if mode in ("ignore", "descendant"):
                          self.assertIn("kill", result["timing"])
                      if mode == "descendant":
                          self.assertTrue(result["owned_children_before_safety"], "No adopted descendant witness")
                      if mode == "output":
                          self.assertTrue(all(stream["bytes"] == 1024
                                              for stream in result["streams"].values()))
                          self.assertTrue(any(stream["observed_bytes"] > 1024
                                              for stream in result["streams"].values()))
                      self.assertIn("reap", result["timing"])
                      self.assertLess(result["query_elapsed"], 4, "Real deadline plus scheduling allowance")
                      records[mode] = result
                  negative = query_case("ignore", omit_cleanup=True)
                  with self.assertRaises(AssertionError):
                      self.assertTrue(negative["query_direct_cleanup"] and negative["direct_reaped"])
                  self.assertTrue(negative["alive_before_safety"])
                  self.assertTrue(all(record["safety_cleanup"] and not record["children_after"]
                                      for record in OBSERVATIONS["outer_cleanup"]))
                  OBSERVATIONS[self._testMethodName] = dict(cases=records, negative=negative)

