                      except (ValueError, UnicodeDecodeError, OSError) as error:
                          phases[name] = evidence_schema.invalid(sidecar.relative_to(root), raw, error)
                  elif (root / name / "invalid-ownership.json").is_file():
                      path = root / name / "invalid-ownership.json"
                      raw = path.read_bytes()
                      try:
                          phases[name] = evidence_schema.invalid_ownership(raw, f"{name}/ownership.json",
                              path.with_name("ownership.json").read_bytes())
                      except (ValueError, UnicodeDecodeError, OSError) as error:
                          phases[name] = dict(evidence_schema.invalid(path.relative_to(root), raw, error), spawn=None)
                  elif name in outcomes:
                      outcome = os.environ.get(outcomes[name], "skipped")
                      phases[name] = dict(status="not_run" if outcome == "skipped" else outcome,
                                          rc=0 if outcome == "success" else None, action_outcome=outcome)
                  else:
                      phases[name] = dict(status="not_run", rc=None, reason="No phase result; inspect earlier failure")
              return phases

