# SPDX-License-Identifier: Apache-2.0
name: Temporary HSS runtime controls

on:
  push:
    branches: [feat/hss-runtime-validation-ff48-october19]

permissions:
  contents: read

concurrency:
  group: hss-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control:
    name: HSS / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, cache-limit, api-protocol, original-endpoint, read-error-unlock]
    # Independent Debian 13 builds, OpenSSL TLS/QUIC, two CPUs and namespace access.
    # IPv6 and HTTP/3 checks establish control-plane identity only.
    # These narrow API negatives do not cover lifecycle/reset/cleanup/ack mutations.
    # Default AF_PACKET V3 RX 10 MiB + TX 66 MiB; 256 MiB bounds each process with headroom.
    container:
      image: debian:trixie
      options: >-
        --shm-size=2g
        --ulimit memlock=268435456:268435456
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --security-opt=apparmor=unconfined
        --device-cgroup-rule="c 10:200 rwm"
        --device-cgroup-rule="c 10:238 rwm"
    defaults:
      run:
        shell: bash
    env:
      VARIANT_NAME: ${{ matrix.variant }}
      WORKFLOW_SHA: ${{ github.sha }}
      CANDIDATE_SHA: 2ff4cf5eb2a84522213e1182ff1b3934153645d7
      CHECK_BASE_SHA: d71243491366c793325a970433498ea412eba530
      CANDIDATE_TREE: 665b7c899566aac80f64af3a9b23f75cb3d26be4
      FROZEN_SHA: 630f876bc326eee05c23d517600b72e8d6a6ec83
      CLANG_FORMAT_VER: "19"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install base tools
        id: bootstrap
        timeout-minutes: 6
        run: |
          set -euo pipefail
          export TOOLS="$RUNNER_TEMP/hss-tools" EVIDENCE="$RUNNER_TEMP/hss-evidence"
          export WORK_DEADLINE="$(( $(date +%s) + 4800 ))"
          mkdir -p "$TOOLS" "$EVIDENCE"
          printf 'TOOLS=%s\nEVIDENCE=%s\nWORK_DEADLINE=%s\n' \
            "$TOOLS" "$EVIDENCE" "$WORK_DEADLINE" >> "$GITHUB_ENV"
          cat > "$EVIDENCE/manifest.json" <<JSON
          {"workflow_sha":"$WORKFLOW_SHA","candidate_sha":"$CANDIDATE_SHA","check_base_sha":"$CHECK_BASE_SHA","frozen_sha":"$FROZEN_SHA",
           "variant":"$VARIANT_NAME","run_id":"$GITHUB_RUN_ID","attempt":"$GITHUB_RUN_ATTEMPT",
           "work_deadline":$WORK_DEADLINE,"status":"before_bootstrap",
           "workflow_blob":null,"candidate_tree":null,"tools":null,
           "unavailable_reason":"Bootstrap/checkout has not completed; hashes unavailable",
           "source":{"path":"src/plugins/http_static/$(if [ "$VARIANT_NAME" = original-endpoint ]; then printf static_server.c; elif [ "$VARIANT_NAME" = read-error-unlock ]; then printf http_cache.c; else printf http_static.c; fi)","candidate_blob":null,"frozen_blob":null},
           "tests":{"test/asf/test_http_static.py":{"blob":null,"sha256":null},"src/plugins/http_static/test_lifetime_fixtures.py":{"blob":null,"sha256":null},"test/asf/test_http.py":{"blob":null,"sha256":null}}}
          JSON
          printf '%s\n' bootstrap checkout prepare dependencies feature-list pinned-python black-version \
            fixture-python-style fixtures mutate fallback-version build binaries namespace environment runtime tests http-name http-name-runtime collect \
            > "$EVIDENCE/planned-phases.txt"
          for commit in b332ab4cd6fb4a26d15685b9da0f9250f83d2c3c 40b52275db082d350158684cdb117e9f43450418 2ff4cf5eb2a84522213e1182ff1b3934153645d7; do
            printf 'style-%s\napi-%s\nmessage-%s\n' "$commit" "$commit" "$commit" >> "$EVIDENCE/planned-phases.txt"
          done
          {
            printf '{\n'
            separator=''
            while IFS= read -r phase; do
              printf '%s"%s":{"status":"not_run","rc":null}' "$separator" "$phase"
              separator=','
            done < "$EVIDENCE/planned-phases.txt"
            printf '\n}\n'
          } > "$EVIDENCE/phase-status.json"
          cat > "$TOOLS/evidence_schema.py" <<'PY'
          import hashlib
          import json
          import re
          from pathlib import PurePosixPath

          FATAL = re.compile(r"\bSIG(?:SEGV|ABRT|BUS|ILL|FPE)\b|segmentation fault|"
                             r"\bAborted\b|\bBus error\b|core was generated", re.I)

          def result_path(value):
              return (identity(value) and not PurePosixPath(value).is_absolute() and
                      ".." not in PurePosixPath(value).parts and value.endswith("/result.json"))

          def ownership(raw):
              value = json.loads(raw)
              check(isinstance(value, dict), "Ownership must be an object")
              check(set(value) == {"identity", "result", "ancestors", "parents"}, "Invalid ownership fields")
              check(isinstance(value["identity"], str) and
                    re.fullmatch(r"[0-9a-f]{32}", value["identity"]) is not None, "Invalid random identity")
              check(result_path(value["result"]), "Invalid owned result path")
              check(isinstance(value["ancestors"], list) and all(identity(item) for item in value["ancestors"]),
                    "Invalid ownership ancestors")
              check(isinstance(value["parents"], list) and len(value["parents"]) == len(value["ancestors"]),
                    "Invalid ownership parents")
              for item, ancestor in zip(value["parents"], value["ancestors"]):
                  check(isinstance(item, dict) and set(item) == {"identity", "result"} and
                        item["identity"] == ancestor and result_path(item["result"]), "Invalid parent ownership")
              return value

          def initial_interruption(raw, owner_raw, expected_result):
              owner = ownership(owner_raw)
              value = json.loads(raw)
              check(isinstance(value, dict) and set(value) == {"status", "rc", "cleanup_complete", "spawn",
                    "observed_at", "parent", "parent_identity", "ownership", "ownership_sha256",
                    "raw_result", "raw_sha256", "temporary", "reason"}, "Invalid initial interruption fields")
              check(value["status"] == "interrupted_before_result" and owner["result"] == expected_result,
                    "Initial interruption result mismatch")
              check(all(value[key] is None for key in ("rc", "cleanup_complete", "spawn", "raw_result", "raw_sha256")),
                    "Initial command unknowns must remain null")
              check({"result": value["parent"], "identity": value["parent_identity"]} in owner["parents"],
                    "Initial interruption is not attributable")
              check(value["ownership"] == str(PurePosixPath(expected_result).with_name("ownership.json")) and
                    value["ownership_sha256"] == hashlib.sha256(owner_raw).hexdigest(), "Ownership hash/path mismatch")
              check(type(value["observed_at"]) in (int, float) and 0 <= value["observed_at"] <= 1e20 and
                    identity(value["reason"]), "Invalid initial interruption metadata")
              check(isinstance(value["temporary"], list), "Invalid temporary evidence")
              for item in value["temporary"]:
                  check(isinstance(item, dict) and set(item) == {"path", "sha256"} and identity(item["path"]) and
                        PurePosixPath(item["path"]).parent == PurePosixPath(expected_result).parent and
                        PurePosixPath(item["path"]).name.startswith(".result.json.") and
                        isinstance(item["sha256"], str) and re.fullmatch(r"[0-9a-f]{64}", item["sha256"]) is not None,
                        "Invalid temporary path/hash")
              return value

          COMMAND_STATUSES = {"running", "completed", "work_budget_exhausted", "work_budget_timeout",
                              "command_timeout", "cleanup_timeout", "execution_error", "cleanup_error"}
          PHASE_STATUSES = COMMAND_STATUSES | {"failed", "not_run", "success", "failure", "cancelled"}

          def check(condition, message):
              if not condition:
                  raise ValueError(message)

          def identity(value):
              return isinstance(value, str) and bool(value.strip())

          def record(raw, command=False):
              value = json.loads(raw)
              check(isinstance(value, dict), "Record must be an object")
              status = value.get("status")
              check(isinstance(status, str) and status in (COMMAND_STATUSES if command else PHASE_STATUSES),
                    "Unrecognized record status")
              check("rc" in value and (value["rc"] is None or type(value["rc"]) is int), "Invalid return code")
              if command or "ancestors" in value or "identity" in value:
                  check(identity(value.get("identity")), "Missing command identity")
                  check(isinstance(value.get("ancestors"), list) and
                        all(identity(item) for item in value["ancestors"]), "Invalid ancestor identities")
              check(status != "running" or value["rc"] is None, "Running command has an exit status")
              check(status != "completed" or type(value["rc"]) is int, "Completed record lacks an exit status")
              if "cleanup_complete" in value:
                  check(value["cleanup_complete"] is None or type(value["cleanup_complete"]) is bool,
                        "Invalid cleanup result")
              return value

          def interruption(raw, child, child_raw):
              child = record(child_raw, command=True)
              value = json.loads(raw)
              check(isinstance(value, dict), "Interruption must be an object")
              check(set(value) == {"status", "rc", "cleanup_complete", "observed_at", "parent",
                                   "parent_identity", "raw_sha256", "reason"}, "Invalid interruption fields")
              check(value.get("status") == "interrupted_by_parent", "Invalid interruption status")
              check("rc" in value and value["rc"] is None and "cleanup_complete" in value and
                    value["cleanup_complete"] is None, "Interruption unknowns must remain null")
              observed = value.get("observed_at")
              check(type(observed) in (int, float) and 0 <= observed <= 1e20,
                    "Invalid interruption timestamp")
              parent = value.get("parent")
              check(identity(parent) and not PurePosixPath(parent).is_absolute() and
                    ".." not in PurePosixPath(parent).parts and parent.endswith("/result.json"),
                    "Invalid parent result path")
              check(identity(value.get("parent_identity")) and child["status"] == "running" and
                    value["parent_identity"] in child["ancestors"], "Interruption is not attributable")
              check(value.get("raw_sha256") == hashlib.sha256(child_raw).hexdigest(), "Raw result hash mismatch")
              check(identity(value.get("reason")), "Missing interruption reason")
              return value

          def invalid(path, raw, error):
              return dict(status="invalid_record", rc=None, cleanup_complete=None,
                          raw_result=str(path), raw_sha256=hashlib.sha256(raw).hexdigest(), error=str(error))

          def invalid_ownership(raw, expected_owner, owner_raw):
              value = json.loads(raw)
              check(isinstance(value, dict) and set(value) ==
                    {"status", "rc", "cleanup_complete", "raw_result", "raw_sha256", "error"},
                    "Invalid ownership diagnostic fields")
              check(value["status"] == "invalid_record" and value["rc"] is None and
                    value["cleanup_complete"] is None, "Invalid ownership diagnostic outcome")
              check(value["raw_result"] == expected_owner and
                    value["raw_sha256"] == hashlib.sha256(owner_raw).hexdigest(),
                    "Ownership diagnostic path/hash mismatch")
              check(identity(value["error"]), "Missing ownership diagnostic error")
              return dict(value, spawn=None)
          PY
          rm -f /etc/apt/apt.conf.d/docker-clean
          rc=0
          timeout --signal=TERM --kill-after=5s 300s bash -euo pipefail -c \
            'apt-get update -qq; apt-get install -y -qq sudo make git bash iproute2 python3 libssl-dev curl' \
            > "$RUNNER_TEMP/hss-evidence/bootstrap.log" 2>&1 || rc=$?
          printf 'command=apt-get update/install\nlimit_seconds=300\nrc=%s\n' "$rc" \
            > "$RUNNER_TEMP/hss-evidence/bootstrap-status.txt"
          printf '{"status":"completed","rc":%s,"limit_seconds":300}\n' "$rc" \
            > "$EVIDENCE/bootstrap-result.json"
          tail -c 8388608 "$RUNNER_TEMP/hss-evidence/bootstrap.log" > "$RUNNER_TEMP/hss-evidence/bootstrap-tail.log"
          mv "$RUNNER_TEMP/hss-evidence/bootstrap-tail.log" "$RUNNER_TEMP/hss-evidence/bootstrap.log"
          exit "$rc"

      - name: Check out exact workflow
        id: checkout
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prepare external evidence tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cp .github/workflows/hss-regression-control.yml "$EVIDENCE/workflow.yml"
          cat > "$TOOLS/hss_diagnostics.py" <<'PY'
          import atexit
          import fcntl
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import stat
          import subprocess
          import sys
          import threading
          import time

          CLASSES = ("TestHttpStaticVapi", "TestHttpStaticCli", "TestHttpStaticCliWorker")
          FILES = ("stdout.bin", "stderr.bin", "show-logging.stdout.bin", "show-logging.stderr.bin")
          SOURCES = {"asfframework": "test/asf/asfframework.py",
                     "vpp_papi_provider": "test/vpp_papi_provider.py",
                     "test_http_static": "test/asf/test_http_static.py"}

          def directory(path):
              if not os.path.isabs(path) or ".." in Path(path).parts:
                  raise ValueError("Noncanonical diagnostic directory")
              descriptor = os.open("/", os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC)
              try:
                  for part in Path(path).parts[1:]:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC,
                                      dir_fd=descriptor)
                      os.close(descriptor)
                      descriptor = child
                  return descriptor
              except BaseException:
                  os.close(descriptor)
                  raise

          def stamp(descriptor):
              info = os.fstat(descriptor)
              return info.st_dev, info.st_ino

          def regular(parent, name, flags):
              descriptor = os.open(name, flags | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600, dir_fd=parent)
              try:
                  info = os.fstat(descriptor)
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                      raise ValueError("Nonregular diagnostic file")
                  return descriptor
              except BaseException:
                  os.close(descriptor)
                  raise

          def source_file(root, relative):
              parts = Path(relative).parts
              if not parts or any(part in ("..", "/") for part in parts):
                  raise ValueError("Invalid source path")
              parent = os.dup(root)
              try:
                  for part in parts[:-1]:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC,
                                      dir_fd=parent)
                      os.close(parent)
                      parent = child
                  return regular(parent, parts[-1], os.O_RDONLY)
              finally:
                  os.close(parent)

          def descriptor_hash(descriptor):
              value = hashlib.sha256()
              while True:
                  chunk = os.read(descriptor, 65536)
                  if not chunk:
                      return value.hexdigest()
                  value.update(chunk)

          def file_hash(root, relative):
              descriptor = source_file(root, relative)
              try:
                  return descriptor_hash(descriptor)
              finally:
                  os.close(descriptor)

          def unavailable(stage, error):
              raw = ("HSS diagnostic unavailable: " + stage + ": " + type(error).__name__ +
                     ": " + str(error)[:128]).encode("utf-8", errors="backslashreplace")[:512] + b"\n"
              try:
                  os.write(2, raw)
              except OSError:
                  pass

          def encoded_record(value):
              def encode(item):
                  return (json.dumps(item, sort_keys=True, ensure_ascii=True) + "\n").encode("utf-8")
              raw = encode(value)
              if len(raw) <= 16384:
                  return raw
              value = dict(value)
              for key in ("summary", "error", "argv"):
                  value.pop(key, None)
              raw = encode(value)
              if len(raw) <= 16384:
                  return raw
              return encode(dict(status="diagnostic-contract-error", slot=value.get("slot"),
                                 observer_pid=value.get("observer_pid"), event_seq=value.get("event_seq")))

          class Stream:
              def __init__(self, descriptor, limit):
                  self.descriptor, self.limit = descriptor, limit
                  self.count, self.observed, self.truncated = 0, 0, False
                  self.error = None
                  self.hash = hashlib.sha256()

              def write(self, raw):
                  if self.error is not None:
                      return False
                  self.observed += len(raw)
                  chunk = raw[:max(0, self.limit - self.count)]
                  self.truncated |= len(chunk) != len(raw)
                  try:
                      written = os.write(self.descriptor, chunk) if chunk else 0
                      self.hash.update(chunk[:written])
                      self.count += written
                      if written != len(chunk):
                          self.error = "short_write"
                  except OSError:
                      self.error = "write_error"
                  return self.error is None and not self.truncated

              def freeze(self):
                  if self.descriptor is not None:
                      os.close(self.descriptor)
                      self.descriptor = None
                  return dict(bytes=self.count, observed_bytes=self.observed, sha256=self.hash.hexdigest(),
                              truncated=self.truncated, error=self.error)

          class Slot:
              def __init__(self, owner, name, process, descriptor, pending):
                  self.owner, self.name, self.process = owner, name, process
                  self.descriptor, self.pending = descriptor, pending
                  self.inode = stamp(descriptor)
                  self.pid, self.observer_pid = process.pid, os.getpid()
                  self.tempdir = None
                  self.lock = threading.Lock()
                  self.streams, self.once, self.frozen, self.query_active = {}, False, False, False
                  self.capture_stopped, self.incomplete, self.allocated = False, False, False
                  self.record = dict(slot=name, observer_pid=self.observer_pid, vpp_pid=self.pid,
                                     status="pending", query_status="not_triggered", rc=None,
                                     cleanup_complete=None, event_seq=None, identity=owner.identity,
                                     source=owner.provenance, coverage="frozen_prefix_through_snapshot")
                  self.proc_fd, self.birth = None, None
                  try:
                      if process.poll() is not None:
                          raise ProcessLookupError("Original process exited")
                      self.proc_fd = directory(f"/proc/{self.pid}")
                      self.birth = self.proc_read("stat", 4096, time.monotonic() + .05).rsplit(b") ", 1)[1].split()[19].decode("ascii")
                      if process.poll() is not None:
                          raise ProcessLookupError("Original process exited")
                  except (OSError, ValueError, IndexError, UnicodeError, TimeoutError):
                      self.close_proc()
                      self.birth = None

              def close_proc(self):
                  if self.proc_fd is not None:
                      os.close(self.proc_fd)
                      self.proc_fd = None

              def proc_read(self, name, limit, deadline):
                  if time.monotonic() >= deadline:
                      raise TimeoutError("Process metadata budget")
                  descriptor = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC,
                                       dir_fd=self.proc_fd)
                  try:
                      if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                          raise ValueError("Nonregular process metadata")
                      raw = bytearray()
                      while True:
                          if time.monotonic() >= deadline:
                              raise TimeoutError("Process metadata budget")
                          chunk = os.read(descriptor, limit + 1 - len(raw))
                          if time.monotonic() >= deadline:
                              raise TimeoutError("Process metadata budget")
                          if not chunk:
                              return bytes(raw)
                          raw.extend(chunk)
                          if len(raw) > limit:
                              raise ValueError("Process metadata exceeds cap")
                  finally:
                      os.close(descriptor)

              def process_metadata(self, deadline):
                  result = dict(status="unavailable", pid=self.pid, starttime_ticks=self.birth,
                                limits=None, status_fields=None, raw=None)
                  self.record["process_metadata"] = result
                  try:
                      if self.proc_fd is None or self.birth is None or self.process.poll() is not None:
                          raise ProcessLookupError("Original process unavailable")
                      before = self.proc_read("stat", 4096, deadline).rsplit(b") ", 1)[1].split()[19].decode("ascii")
                      if before != self.birth:
                          raise ProcessLookupError("Original process identity changed")
                      limits = self.proc_read("limits", 4096, deadline)
                      status = self.proc_read("status", 8192, deadline)
                      after = self.proc_read("stat", 4096, deadline).rsplit(b") ", 1)[1].split()[19].decode("ascii")
                      if after != self.birth or self.process.poll() is not None:
                          raise ProcessLookupError("Original process exited or changed")
                      fields = {}
                      for line in status.decode("ascii").splitlines():
                          key, separator, value = line.partition(":")
                          if separator and key in ("VmLck", "CapInh", "CapPrm", "CapEff", "CapBnd", "CapAmb"):
                              fields[key] = value.strip()
                      if "VmLck" not in fields or "CapEff" not in fields:
                          raise ValueError("Required process status absent")
                      result.update(status="captured", limits=limits.decode("ascii"), status_fields=fields,
                                    raw={name: dict(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest())
                                         for name, raw in (("limits", limits), ("status", status))})
                  except (OSError, ValueError, IndexError, UnicodeError, TimeoutError) as error:
                      result["error"] = type(error).__name__[:64]

              def write(self, index, raw):
                  if not self.lock.acquire(blocking=False):
                      return False
                  try:
                      if self.capture_stopped or self.frozen or self.observer_pid != os.getpid():
                          return False
                      return self.streams[index].write(raw)
                  finally:
                      self.lock.release()

              def finish(self):
                  if self.observer_pid != os.getpid() or self.query_active or self.record["query_status"] == "running":
                      return
                  self.capture_stopped = True
                  if not self.lock.acquire(blocking=False):
                      self.incomplete = True
                      return
                  try:
                      if self.query_active:
                          return
                      self.close_proc()
                      if self.frozen or self.incomplete or not self.allocated:
                          return
                      self.frozen = True
                      self.record.update(snapshot_at=time.time(), observed_until=time.time(), status="frozen",
                                         files={FILES[index]: stream.freeze() for index, stream in self.streams.items()})
                      if stamp(self.descriptor) != self.inode:
                          return
                      raw = encoded_record(self.record)
                      os.ftruncate(self.pending, 0)
                      os.lseek(self.pending, 0, os.SEEK_SET)
                      if os.write(self.pending, raw) != len(raw):
                          return
                      os.close(self.pending)
                      self.pending = None
                      try:
                          os.stat("record.json", dir_fd=self.descriptor, follow_symlinks=False)
                      except FileNotFoundError:
                          os.rename("record.pending", "record.json", src_dir_fd=self.descriptor,
                                    dst_dir_fd=self.descriptor)
                  except (OSError, ValueError, TypeError):
                      pass
                  finally:
                      self.lock.release()

              def close(self):
                  self.close_proc()
                  for stream in self.streams.values():
                      if stream.descriptor is not None:
                          os.close(stream.descriptor)
                          stream.descriptor = None
                  if self.pending is not None:
                      os.close(self.pending)
                      self.pending = None
                  if self.descriptor is not None:
                      os.close(self.descriptor)
                      self.descriptor = None

          class Diagnostics:
              def __init__(self, config):
                  self.config = config
                  self.startup = os.getcwd()
                  self.pid = os.getpid()
                  self.root_path = config["directory"]
                  self.source_path = config["root"]
                  self.source_fd, self.root_fd = None, None
                  try:
                      self.source_fd = directory(self.source_path)
                      self.root_fd = directory(self.root_path)
                      self.source_inode = stamp(self.source_fd)
                      self.root_inode = stamp(self.root_fd)
                      self.slots, self.frames = {}, {}
                      self.guard = threading.Lock()
                      self.identity = {key: config[key] for key in ("workflow", "candidate", "variant", "runtime")}
                      parents = json.loads(os.environ.get("HSS_COMMAND_PARENTS", "[]"))
                      runtime = next((item for item in reversed(parents) if item.get("result") == "runtime/result.json"), None)
                      self.identity["command"] = runtime
                      self.provenance = config["sources"]
                      for path, value in self.provenance.items():
                          if file_hash(self.source_fd, path) != value["sha256"]:
                              raise ValueError("Diagnostic source mismatch: " + path)
                      alias_parent = directory(os.path.join(self.source_path, "test"))
                      try:
                          if os.readlink("asfframework.py", dir_fd=alias_parent) != "asf/asfframework.py":
                              raise ValueError("Unknown framework alias")
                      finally:
                          os.close(alias_parent)
                      self.tool = config["vppctl"]
                      if self.tool != os.path.join(self.source_path, "build-root/install-vpp_debug-native/vpp/bin/vppctl"):
                          raise ValueError("Unexpected diagnostic executable")
                      atexit.register(self.finish)
                  except BaseException:
                      for descriptor in (self.root_fd, self.source_fd):
                          if descriptor is not None:
                              os.close(descriptor)
                      raise

              def after_fork(self):
                  if self.pid == os.getpid():
                      return
                  for slot in self.slots.values():
                      slot.close()
                  self.slots, self.frames = {}, {}
                  os.close(self.root_fd)
                  self.root_fd = None
                  self.pid = os.getpid()
                  self.guard = threading.Lock()
                  reopened = directory(self.root_path)
                  if stamp(reopened) != self.root_inode:
                      os.close(reopened)
                      raise ValueError("Diagnostic root replaced after fork")
                  self.root_fd = reopened

              def code(self, module_name, function, code):
                  module = sys.modules.get(module_name)
                  if module is None:
                      return False
                  expected = os.path.join(self.source_path, SOURCES[module_name])
                  aliases = {expected}
                  if module_name == "asfframework":
                      aliases.add(os.path.join(self.source_path, "test/asfframework.py"))
                  def origin(value):
                      if not isinstance(value, str):
                          return None
                      return os.path.normpath(value if os.path.isabs(value) else os.path.join(self.startup, value))
                  if origin(getattr(module, "__file__", None)) not in aliases:
                      return False
                  if origin(getattr(getattr(module, "__spec__", None), "origin", None)) not in aliases:
                      return False
                  if origin(code.co_filename) not in aliases:
                      return False
                  return getattr(function, "__code__", None) is code

              def claim(self, cls, process):
                  name = cls.__name__
                  if name not in CLASSES or cls.__module__ != "test_http_static":
                      return None
                  module = sys.modules.get("test_http_static")
                  if module is None or getattr(module, name, None) is not cls or self.root_fd is None:
                      return None
                  if not self.guard.acquire(blocking=False):
                      return None
                  try:
                      if name in self.slots:
                          slot = self.slots[name]
                          return slot if slot.process is process else None
                      check = directory(self.root_path)
                      try:
                          if stamp(check) != self.root_inode:
                              return None
                      finally:
                          os.close(check)
                      try:
                          fcntl.flock(self.root_fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                      except OSError:
                          return None
                      try:
                          try:
                              os.mkdir(name, 0o700, dir_fd=self.root_fd)
                          except FileExistsError:
                              return None
                          descriptor = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC,
                                               dir_fd=self.root_fd)
                          pending = None
                          slot = None
                          try:
                              pending = regular(descriptor, "record.pending", os.O_WRONLY | os.O_CREAT | os.O_EXCL)
                              slot = Slot(self, name, process, descriptor, pending)
                              slot.tempdir = getattr(cls, "tempdir", None)
                              self.slots[name] = slot
                              for index, filename in enumerate(FILES):
                                  fd = regular(descriptor, filename, os.O_WRONLY | os.O_CREAT | os.O_EXCL)
                                  slot.streams[index] = Stream(fd, (2 if index < 2 else 1) * 1024 * 1024)
                              slot.allocated = True
                              return slot
                          except BaseException as error:
                              if slot is None:
                                  if pending is not None:
                                      os.close(pending)
                                  os.close(descriptor)
                              else:
                                  slot.capture_stopped, slot.incomplete = True, True
                                  slot.record.update(query_status="unavailable", error=type(error).__name__[:64])
                                  slot.close()
                              unavailable("stream allocation", error)
                              raise
                      finally:
                          fcntl.flock(self.root_fd, fcntl.LOCK_UN)
