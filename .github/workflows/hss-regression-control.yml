                  require(runtime["status"] == "completed", "Runtime command timed out or exceeded work budget")
                  require(not (OUT / "runtime/fatal-diagnostic.json").exists(), "Fatal diagnostic found before log tail")
                  validate(events, console, rc, expected, VARIANT, logs)
              except Exception as error:
                  save("acceptance.json", dict(status="FAIL", error=str(error), expected=expected))
                  raise
              save("acceptance.json", dict(status="PASS", expected=expected,
                                           claims="full27 fixed successes:14 original regressions,2 main-queue synthetic,8 cache,3 existing" if VARIANT == "fixed" else
                                           "narrow restored field/unlock only; lifecycle negative gaps remain"))

          def validate_http_name(events, console, rc, logs):
              test = "test_http.TestHttpNameOwnership.test_app_name_ownership"
              _, _, complete, _ = execution_evidence(events, console, [test], "http-name", logs)
              outcomes = [event for event in events if event["kind"] in ("addSuccess", "addFailure", "addSubTest")]
              require(rc == 0 and len(outcomes) == 1 and outcomes[0]["kind"] == "addSuccess" and
                      outcomes[0]["test"] == test and all(event["failures"] == 0 for event in complete),
                      "Missing normal HTTP name ownership success")
              active = test_interval(events, test)
              require(outcomes[0] in active, "HTTP name success outside owned test lifecycle")
              start = next(event for event in events if event["kind"] == "startTest")
              require(not set(start["excluded"]) & {"http", "http_unittest"} and
                      "http_unittest_plugin.so { enable }" in " ".join(start["vpp_cmdline"]) and
                      not re.search(r"(?:http|http_unittest)_plugin.so\s*\{\s*disable", " ".join(start["vpp_cmdline"])),
                      "HTTP name test plugin excluded or disabled")
              replies = [event for event in active if event["kind"] == "cli_reply" and
                         event["command"] == "test http app-name-ownership"]
              rendered = [event for event in active if event["kind"] == "cli" and
                          event["command"] == "test http app-name-ownership"]
              require(len(replies) == len(rendered) == 1 and replies[0]["retval"] == 0 and
                      replies[0]["pid"] == rendered[0]["pid"] == start["pid"] and
                      replies[0]["seq"] + 1 == rendered[0]["seq"] < outcomes[0]["seq"] and
                      replies[0]["reply"] == rendered[0]["reply"],
                      "Missing actual HTTP name command reply")
              markers = ("accepted connections own separate names", "listener changes do not alter accepted names",
                         "closing one connection retains its sibling and listener", "accepted name survives listener disposal",
                         "QUIC streams own names and keep borrowed host pointers",
                         "stream rollback disposal retains the connection name",
                         "replacement stream name survives old stream and connection disposal",
                         "empty names can be copied and disposed")
              witness = "".join(r"PASS:[1-9][0-9]*: " + re.escape(marker) + r"\n" for marker in markers) + r"SUCCESS\n"
              require(re.fullmatch(witness, replies[0]["reply"]) is not None,
                      "Missing HTTP name ownership success witnesses")
              require(re.findall(r"--- (add\w+)\(\) (\w+)\.(\w+)\(", logs) ==
                      [("addSuccess", "TestHttpNameOwnership", "test_app_name_ownership")],
                      "HTTP name framework callback mismatch")

          def http_name():
