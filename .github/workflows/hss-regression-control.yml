              def observe(self, frame, event, value):
                  try:
                      self.after_fork()
                      module = sys.modules.get("asfframework")
                      pump = getattr(module, "pump_output", None)
                      if not self.code("asfframework", pump, frame.f_code):
                          return
                      if event == "call":
                          cls = frame.f_locals.get("testclass")
                          process = getattr(cls, "vpp", None)
                          if process is None:
                              return
                          slot = self.claim(cls, process)
                          if slot is not None:
                              self.frames[frame] = (slot, process.stdout.fileno(), process.stderr.fileno())
                      elif event == "return":
                          self.frames.pop(frame, None)
                      elif event == "c_call" and frame in self.frames:
                          raw = frame.f_locals.get("read")
                          if not isinstance(raw, bytes) or getattr(value, "__name__", None) != "decode" or getattr(value, "__self__", None) is not raw:
                              return
                          slot, stdout, stderr = self.frames[frame]
                          if frame.f_locals.get("stdout_fd") != stdout or frame.f_locals.get("stderr_fd") != stderr:
                              return
                          index = {123: 0, 140: 1}.get(frame.f_lineno)
                          if index is not None:
                              slot.write(index, raw)
                  except Exception:
                      pass

              def failure(self, frame, value, sequence):
                  started = time.monotonic()
                  try:
                      self.after_fork()
                      module = sys.modules.get("vpp_papi_provider")
                      provider_type = getattr(module, "VppPapiProvider", None)
                      if not self.code("vpp_papi_provider", getattr(provider_type, "cli_return_response", None), frame.f_code):
                          return
                      caller = frame.f_back
                      setup = caller.f_back if caller else None
                      if caller is None or setup is None or not self.code("vpp_papi_provider", getattr(provider_type, "cli", None), caller.f_code) or caller.f_lineno != 480:
                          return
                      provider = frame.f_locals.get("self")
                      cls = getattr(provider, "test_class", None)
                      name = getattr(cls, "__name__", None)
                      cases = sys.modules.get("test_http_static")
                      declared = getattr(cases, "TestHttpStaticVapi" if name == CLASSES[0] else "TestHttpStaticCli", None)
                      function = getattr(getattr(declared, "setUpClass", None), "__func__", None)
                      if name not in CLASSES or not self.code("test_http_static", function, setup.f_code):
                          return
                      if setup.f_lineno != (58 if name == CLASSES[0] else 199) or setup.f_locals.get("cls") is not cls:
                          return
                      if caller.f_locals.get("self") is not provider or getattr(cls, "vapi", None) is not provider:
                          return
