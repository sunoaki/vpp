              request.update(schema=SCHEMA, identity=identity, deadline=deadline, control=str(directory),
                             module_sha256=hashlib.sha256(Path(__file__).read_bytes()).hexdigest())
              args = [sys.executable, __file__, "worker", str(directory / "request.json")]
              owner = dict(identity=identity, parent=os.getpid(), command=args,
                  ancestors=json.loads(os.environ.get("HSS_COMMAND_ANCESTORS", "[]")),
                  parents=json.loads(os.environ.get("HSS_COMMAND_PARENTS", "[]")),
                  module_sha256=request["module_sha256"], absolute_deadline=deadline)
              control.publish(directory / "request.json", request)
              control.publish(directory / "ownership.json", owner)
              result = dict(schema=SCHEMA, identity=identity, control=str(directory), status="running",
                            complete=False, rc=None, cleanup_complete=None, safety_cleanup=None,
                            entries=None, bytes=None, index=None, worker=None, elapsed=None)
              control.publish(directory / "result.json", result)
              if request["mode"] == "final":
                  control.publish(healthy / "final-collection.json", result)
              process = None
              try:
                  if deadline <= time.monotonic():
                      raise TimeoutError("Collector budget unavailable")
                  libc = control.ctypes.CDLL(None, use_errno=True)
                  if libc.prctl(36, 1, 0, 0, 0) != 0:
                      raise OSError(control.ctypes.get_errno(), "Collector subreaper")
