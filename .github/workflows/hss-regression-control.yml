          def error_tail_text(raw):
              text = raw[-16384:].decode("utf-8", errors="replace")
              return "\n".join("| " + "".join(char for char in line if char == "\t" or char.isprintable())
                  for line in text.splitlines())

          def error_tail(path):
              descriptor = None
              try:
                  descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_size <= 8 * 1024 * 1024 + 512,
                      "Failure console is nonregular or exceeds cap")
                  os.lseek(descriptor, max(0, before.st_size - 16384), os.SEEK_SET)
                  raw = os.read(descriptor, 16384)
                  after = os.fstat(descriptor)
                  require((after.st_size, after.st_mtime_ns) == (before.st_size, before.st_mtime_ns),
                      "Failure console changed")
                  print(f"Failure console tail: {path}\n{error_tail_text(raw)}", flush=True)
              except (OSError, AssertionError) as error:
                  print(f"Failure console tail unavailable: {type(error).__name__}: {error}", file=sys.stderr, flush=True)
              finally:
