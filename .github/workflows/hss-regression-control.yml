# SPDX-License-Identifier: Apache-2.0
name: Temporary HSS runtime controls

on:
  push:
    branches: [feat/hss-runtime-validation-ff48-october19]

permissions:
  contents: read

concurrency:
  group: hss-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control:
    name: HSS / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, cache-limit, api-protocol, original-endpoint]
    # Independent Debian 13 builds, OpenSSL TLS/QUIC, two CPUs and namespace access.
    # IPv6 and HTTP/3 checks establish control-plane identity only.
    # These narrow API negatives do not cover lifecycle/reset/cleanup/ack mutations.
    container:
      image: debian:trixie
      options: >-
        --shm-size=2g
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --security-opt=apparmor=unconfined
        --device-cgroup-rule="c 10:200 rwm"
        --device-cgroup-rule="c 10:238 rwm"
    defaults:
      run:
        shell: bash
    env:
      VARIANT_NAME: ${{ matrix.variant }}
      WORKFLOW_SHA: ${{ github.sha }}
      CANDIDATE_SHA: aac52ac812709644cb539295b33c76cdef1f75e3
      FROZEN_SHA: 630f876bc326eee05c23d517600b72e8d6a6ec83
      CLANG_FORMAT_VER: "19"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install base tools
        id: bootstrap
        timeout-minutes: 6
        run: |
          set -euo pipefail
          export TOOLS="$RUNNER_TEMP/hss-tools" EVIDENCE="$RUNNER_TEMP/hss-evidence"
          export WORK_DEADLINE="$(( $(date +%s) + 4800 ))"
          mkdir -p "$TOOLS" "$EVIDENCE"
          printf 'TOOLS=%s\nEVIDENCE=%s\nWORK_DEADLINE=%s\n' \
            "$TOOLS" "$EVIDENCE" "$WORK_DEADLINE" >> "$GITHUB_ENV"
          cat > "$EVIDENCE/manifest.json" <<JSON
          {"workflow_sha":"$WORKFLOW_SHA","candidate_sha":"$CANDIDATE_SHA","frozen_sha":"$FROZEN_SHA",
           "variant":"$VARIANT_NAME","run_id":"$GITHUB_RUN_ID","attempt":"$GITHUB_RUN_ATTEMPT",
           "work_deadline":$WORK_DEADLINE,"status":"before_bootstrap",
           "workflow_blob":null,"candidate_tree":null,"tools":null,
           "unavailable_reason":"Bootstrap/checkout has not completed; hashes unavailable",
           "source":{"path":"src/plugins/http_static/$(if [ "$VARIANT_NAME" = original-endpoint ]; then printf static_server.c; else printf http_static.c; fi)","candidate_blob":null,"frozen_blob":null},
           "tests":{"test/asf/test_http_static.py":{"blob":null,"sha256":null},"src/plugins/http_static/test_lifetime_fixtures.py":{"blob":null,"sha256":null}}}
          JSON
          printf '%s\n' bootstrap checkout prepare dependencies feature-list pinned-python black-version \
            fixture-python-style fixtures mutate fallback-version build binaries namespace environment runtime tests collect \
            > "$EVIDENCE/planned-phases.txt"
          for commit in 616ce15c0097bd129046531c0cfd21388613b265 27610f085ae248b73ce4d3a8d0a1c50f037ecea4 \
            7238418f29a30398522a3f980094a5a8aa35ba49 bec8c9a5beefb18c1ffced34f68dc04eb5cd7138 \
            aac52ac812709644cb539295b33c76cdef1f75e3; do
            printf 'style-%s\napi-%s\nmessage-%s\n' "$commit" "$commit" "$commit" >> "$EVIDENCE/planned-phases.txt"
          done
          {
            printf '{\n'
            separator=''
            while IFS= read -r phase; do
              printf '%s"%s":{"status":"not_run","rc":null}' "$separator" "$phase"
              separator=','
            done < "$EVIDENCE/planned-phases.txt"
            printf '\n}\n'
          } > "$EVIDENCE/phase-status.json"
          cat > "$TOOLS/evidence_schema.py" <<'PY'
          import hashlib
          import json
          import re
          from pathlib import PurePosixPath

          FATAL = re.compile(r"\bSIG(?:SEGV|ABRT|BUS|ILL|FPE)\b|segmentation fault|"
                             r"\bAborted\b|\bBus error\b|core was generated", re.I)

          def result_path(value):
              return (identity(value) and not PurePosixPath(value).is_absolute() and
                      ".." not in PurePosixPath(value).parts and value.endswith("/result.json"))

          def ownership(raw):
              value = json.loads(raw)
              check(isinstance(value, dict), "Ownership must be an object")
              check(set(value) == {"identity", "result", "ancestors", "parents"}, "Invalid ownership fields")
              check(isinstance(value["identity"], str) and
                    re.fullmatch(r"[0-9a-f]{32}", value["identity"]) is not None, "Invalid random identity")
              check(result_path(value["result"]), "Invalid owned result path")
              check(isinstance(value["ancestors"], list) and all(identity(item) for item in value["ancestors"]),
                    "Invalid ownership ancestors")
              check(isinstance(value["parents"], list) and len(value["parents"]) == len(value["ancestors"]),
                    "Invalid ownership parents")
              for item, ancestor in zip(value["parents"], value["ancestors"]):
                  check(isinstance(item, dict) and set(item) == {"identity", "result"} and
                        item["identity"] == ancestor and result_path(item["result"]), "Invalid parent ownership")
              return value

          def initial_interruption(raw, owner_raw, expected_result):
              owner = ownership(owner_raw)
              value = json.loads(raw)
              check(isinstance(value, dict) and set(value) == {"status", "rc", "cleanup_complete", "spawn",
                    "observed_at", "parent", "parent_identity", "ownership", "ownership_sha256",
                    "raw_result", "raw_sha256", "temporary", "reason"}, "Invalid initial interruption fields")
              check(value["status"] == "interrupted_before_result" and owner["result"] == expected_result,
                    "Initial interruption result mismatch")
              check(all(value[key] is None for key in ("rc", "cleanup_complete", "spawn", "raw_result", "raw_sha256")),
                    "Initial command unknowns must remain null")
              check({"result": value["parent"], "identity": value["parent_identity"]} in owner["parents"],
                    "Initial interruption is not attributable")
              check(value["ownership"] == str(PurePosixPath(expected_result).with_name("ownership.json")) and
                    value["ownership_sha256"] == hashlib.sha256(owner_raw).hexdigest(), "Ownership hash/path mismatch")
              check(type(value["observed_at"]) in (int, float) and 0 <= value["observed_at"] <= 1e20 and
                    identity(value["reason"]), "Invalid initial interruption metadata")
              check(isinstance(value["temporary"], list), "Invalid temporary evidence")
              for item in value["temporary"]:
                  check(isinstance(item, dict) and set(item) == {"path", "sha256"} and identity(item["path"]) and
                        PurePosixPath(item["path"]).parent == PurePosixPath(expected_result).parent and
                        PurePosixPath(item["path"]).name.startswith(".result.json.") and
                        isinstance(item["sha256"], str) and re.fullmatch(r"[0-9a-f]{64}", item["sha256"]) is not None,
                        "Invalid temporary path/hash")
              return value

          COMMAND_STATUSES = {"running", "completed", "work_budget_exhausted", "work_budget_timeout",
                              "command_timeout", "cleanup_timeout", "execution_error", "cleanup_error"}
          PHASE_STATUSES = COMMAND_STATUSES | {"failed", "not_run", "success", "failure", "cancelled"}

          def check(condition, message):
              if not condition:
                  raise ValueError(message)

          def identity(value):
              return isinstance(value, str) and bool(value.strip())

          def record(raw, command=False):
              value = json.loads(raw)
              check(isinstance(value, dict), "Record must be an object")
              status = value.get("status")
              check(isinstance(status, str) and status in (COMMAND_STATUSES if command else PHASE_STATUSES),
                    "Unrecognized record status")
              check("rc" in value and (value["rc"] is None or type(value["rc"]) is int), "Invalid return code")
              if command or "ancestors" in value or "identity" in value:
                  check(identity(value.get("identity")), "Missing command identity")
                  check(isinstance(value.get("ancestors"), list) and
                        all(identity(item) for item in value["ancestors"]), "Invalid ancestor identities")
              check(status != "running" or value["rc"] is None, "Running command has an exit status")
              check(status != "completed" or type(value["rc"]) is int, "Completed record lacks an exit status")
              if "cleanup_complete" in value:
                  check(value["cleanup_complete"] is None or type(value["cleanup_complete"]) is bool,
                        "Invalid cleanup result")
              return value

          def interruption(raw, child, child_raw):
              child = record(child_raw, command=True)
              value = json.loads(raw)
              check(isinstance(value, dict), "Interruption must be an object")
              check(set(value) == {"status", "rc", "cleanup_complete", "observed_at", "parent",
                                   "parent_identity", "raw_sha256", "reason"}, "Invalid interruption fields")
              check(value.get("status") == "interrupted_by_parent", "Invalid interruption status")
              check("rc" in value and value["rc"] is None and "cleanup_complete" in value and
                    value["cleanup_complete"] is None, "Interruption unknowns must remain null")
              observed = value.get("observed_at")
              check(type(observed) in (int, float) and 0 <= observed <= 1e20,
                    "Invalid interruption timestamp")
              parent = value.get("parent")
              check(identity(parent) and not PurePosixPath(parent).is_absolute() and
                    ".." not in PurePosixPath(parent).parts and parent.endswith("/result.json"),
                    "Invalid parent result path")
              check(identity(value.get("parent_identity")) and child["status"] == "running" and
                    value["parent_identity"] in child["ancestors"], "Interruption is not attributable")
              check(value.get("raw_sha256") == hashlib.sha256(child_raw).hexdigest(), "Raw result hash mismatch")
              check(identity(value.get("reason")), "Missing interruption reason")
              return value

          def invalid(path, raw, error):
              return dict(status="invalid_record", rc=None, cleanup_complete=None,
                          raw_result=str(path), raw_sha256=hashlib.sha256(raw).hexdigest(), error=str(error))
          PY
          rm -f /etc/apt/apt.conf.d/docker-clean
          rc=0
          timeout --signal=TERM --kill-after=5s 300s bash -euo pipefail -c \
            'apt-get update -qq; apt-get install -y -qq sudo make git bash iproute2 python3 libssl-dev curl' \
            > "$RUNNER_TEMP/hss-evidence/bootstrap.log" 2>&1 || rc=$?
          printf 'command=apt-get update/install\nlimit_seconds=300\nrc=%s\n' "$rc" \
            > "$RUNNER_TEMP/hss-evidence/bootstrap-status.txt"
          printf '{"status":"completed","rc":%s,"limit_seconds":300}\n' "$rc" \
            > "$EVIDENCE/bootstrap-result.json"
          tail -c 8388608 "$RUNNER_TEMP/hss-evidence/bootstrap.log" > "$RUNNER_TEMP/hss-evidence/bootstrap-tail.log"
          mv "$RUNNER_TEMP/hss-evidence/bootstrap-tail.log" "$RUNNER_TEMP/hss-evidence/bootstrap.log"
          exit "$rc"

      - name: Check out exact workflow
        id: checkout
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prepare external evidence tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cp .github/workflows/hss-regression-control.yml "$EVIDENCE/workflow.yml"
          cat > "$TOOLS/sitecustomize.py" <<'PY'
          import json
          import os
          import sys
          import threading
          import traceback
          import unittest
          from pathlib import Path

          target = os.environ.get("HSS_EVENTS")
          if target:
              sequence = 0
              def emit(kind, **values):
                  global sequence
                  sequence += 1
                  record = dict(kind=kind, pid=os.getpid(), seq=sequence, **values)
                  path = Path(target + f".{os.getpid()}.jsonl")
                  if path.exists() and path.stat().st_size > 4 * 1024 * 1024:
                      raise RuntimeError("HSS observer exceeds 4 MiB/process")
                  with path.open("a") as stream:
                      stream.write(json.dumps(record, sort_keys=True) + "\n")

              def identity(test):
                  return test.id()

              def wrap(name):
                  original = getattr(unittest.TestResult, name)
                  def observe(self, test, *args):
                      error = args[-1] if name in ("addFailure", "addError", "addSubTest",
                                                   "addExpectedFailure") else None
                      record = {"test": identity(test)}
                      if name == "startTest":
                          module = sys.modules.get("config")
                          config = getattr(module, "config", None)
                          record.update(excluded=list(getattr(config, "excluded_plugins", [])),
                                        netns_disabled=getattr(config, "skip_netns_tests", None),
                                        vpp_cmdline=list(getattr(test.__class__, "vpp_cmdline", [])))
                      if error:
                          record.update(error=error[0].__name__,
                                        traceback="".join(traceback.format_exception(*error)))
                      if name == "addSubTest":
                          record["params"] = dict(args[0].params)
                      if name == "addSkip":
                          record["reason"] = str(args[0])
                      if name == "startTest":
                          record["workers"] = getattr(test.__class__, "vpp_worker_count", 0)
                      emit(name, **record)
                      return original(self, test, *args)
                  setattr(unittest.TestResult, name, observe)

              for callback in ("startTest", "stopTest", "addSuccess", "addFailure", "addError",
                               "addSkip", "addExpectedFailure", "addUnexpectedSuccess", "addSubTest"):
                  wrap(callback)
              original_run = unittest.TextTestRunner.run
              def run(self, test):
                  result = original_run(self, test)
                  emit("completed", tests=result.testsRun, failures=len(result.failures),
                       errors=len(result.errors), skips=len(result.skipped),
                       expected=len(result.expectedFailures), unexpected=len(result.unexpectedSuccesses))
                  return result
              unittest.TextTestRunner.run = run

              # Observe returns from unchanged real helpers; never replace their results.
              def profile(frame, event, value):
                  if event != "return":
                      return
                  filename, name = frame.f_code.co_filename, frame.f_code.co_name
                  if filename.endswith("/test_http_static.py"):
                      case = frame.f_locals.get("self")
                      if not isinstance(case, unittest.TestCase):
                          return
                      record = {"test": case.id(), "helper": name}
                      if name == "_client" and value is not None:
                          record.update(port=frame.f_locals["port"], secure=frame.f_locals["secure"],
                                        client=value.pid)
                      elif name == "_response" and isinstance(value, dict):
                          record.update(response=value, client=frame.f_locals["client"].pid)
                      elif name == "_refused":
                          process = frame.f_locals.get("process")
                          if process is None:
                              return
                          record.update(port=frame.f_locals["port"], rc=process.returncode,
                                        stdout=process.stdout.decode(errors="replace"),
                                        stderr=process.stderr.decode(errors="replace"))
                      else:
                          return
                      emit("helper", **record)
                  elif filename.endswith("/vpp_papi_provider.py"):
                      if name == "cli" and isinstance(value, str):
                          emit("cli", command=frame.f_locals["cli"], reply=value[:65536])
                      elif name == "cli_return_response" and value is not None:
                          emit("cli_reply", command=frame.f_locals["cli"].strip(),
                               retval=value.retval, reply=str(value.reply)[:65536])
              sys.setprofile(profile)
              threading.setprofile(profile)
              emit("loaded")
          PY
          cat > "$TOOLS/control.py" <<'PY'
          import ast
          import collections
          import ctypes
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import signal
          import stat
          import subprocess
          import sys
          import time
          import evidence_schema

          ROOT = Path.cwd()
          OUT = Path(os.environ["EVIDENCE"])
          TOOLS = Path(os.environ["TOOLS"])
          CANDIDATE = os.environ["CANDIDATE_SHA"]
          FROZEN = os.environ["FROZEN_SHA"]
          VARIANT = os.environ["VARIANT_NAME"]
          SOURCE = "src/plugins/http_static/" + (
              "static_server.c" if VARIANT == "original-endpoint" else "http_static.c")
          TEST = "test/asf/test_http_static.py"
          FIXTURE = "src/plugins/http_static/test_lifetime_fixtures.py"
          CLASSES = ("TestHttpStaticCli", "TestHttpStaticCliWorker")
          RECIPES = {
              "cache-limit": ("rmp->cache_size_limit = htonl (l->cache.cache_limit);",
                              "rmp->cache_size_limit = htonl (hsm->default_listener.cache.cache_limit);"),
              "original-endpoint": (
                  "  clib_memcpy (&a->sep_ext, &l->sep, sizeof (l->sep));\n"
                  "  a->sep_ext.transport_proto = TRANSPORT_PROTO_HTTP;",
                  "  l->sep.transport_proto = TRANSPORT_PROTO_HTTP;\n"
                  "  clib_memcpy (&a->sep_ext, &l->sep, sizeof (l->sep));")}

          def require(condition, message):
              if not condition:
                  raise AssertionError(message)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True, timeout=60).strip()

          def content(ref, path):
              return subprocess.check_output(["git", "show", f"{ref}:{path}"], timeout=60)

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def publish(path, value):
              temporary = path.with_name(f".{path.name}.{os.getpid()}.tmp")
              temporary.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n")
              os.replace(temporary, path)

          def save(name, value):
              publish(OUT / name, value)

          def capture(process, deadline, stream):
              tail = bytearray()
              timed_out = False
              previous, fatal = "", None
              os.set_blocking(process.stdout.fileno(), False)
              with selectors.DefaultSelector() as selector:
                  selector.register(process.stdout, selectors.EVENT_READ)
                  while selector.get_map() or process.poll() is None:
                      if time.monotonic() >= deadline:
                          timed_out = True
                          break
                      for key, _ in selector.select(min(0.2, max(0, deadline - time.monotonic()))):
                          try:
                              chunk = os.read(key.fd, 65536)
                          except BlockingIOError:
                              continue
                          if not chunk:
                              selector.unregister(key.fd)
                              continue
                          text = previous + chunk.decode(errors="replace")
                          match = evidence_schema.FATAL.search(text)
                          if match and fatal is None:
                              fatal = text[max(0, match.start() - 80):match.end() + 80]
                          previous = text[-256:]
                          tail.extend(chunk)
                          del tail[:-8 * 1024 * 1024]
                          stream.seek(0)
                          stream.write(tail)
                          stream.truncate()
                          stream.flush()
              if fatal is not None:
                  publish(Path(stream.name).with_name("fatal-diagnostic.json"), dict(witness=fatal))
              return tail, timed_out

          def children():
              path = Path(f"/proc/self/task/{os.getpid()}/children")
              return [int(pid) for pid in path.read_text().split()]

          def owned_child(pid):
              descriptor = os.pidfd_open(pid)
              try:
                  fields = Path(f"/proc/{pid}/stat").read_text().rsplit(") ", 1)[1].split()
                  require(int(fields[1]) == os.getpid(), "Child ownership changed")
                  os.waitid(os.P_PIDFD, descriptor, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                  return descriptor
              except BaseException:
                  os.close(descriptor)
                  raise

          def cleanup(process, grace):
              for sig in (signal.SIGTERM, signal.SIGKILL):
                  stop = time.monotonic() + grace
                  while time.monotonic() < stop:
                      process.poll()
                      for pid in children():
                          descriptor = None
                          try:
                              descriptor = owned_child(pid)
                              exited = os.waitid(os.P_PIDFD, descriptor,
                                                 os.WEXITED | os.WNOHANG | os.WNOWAIT)
                              if exited is None:
                                  signal.pidfd_send_signal(descriptor, sig)
                              elif pid == process.pid and process.returncode is None:
                                  process.poll()
                              else:
                                  os.waitid(os.P_PIDFD, descriptor, os.WEXITED | os.WNOHANG)
                          except (ProcessLookupError, FileNotFoundError, ChildProcessError, AssertionError):
                              pass
                          finally:
                              if descriptor is not None:
                                  os.close(descriptor)
                      if not children():
                          return True
                      time.sleep(min(0.05, max(0, stop - time.monotonic())))
              return False

          def command(label, args, env=None):
              directory = OUT / label
              directory.mkdir(exist_ok=True)
              started = time.time()
              work_deadline = float(os.environ["WORK_DEADLINE"])
              phase_seconds = 1500 if label == "dependencies" else 2400 if label == "build" else (
                  960 if label == "tests" else 900 if label == "runtime" else
                  120 if label in ("environment", "fixtures") else 600)
              seconds = min(phase_seconds, max(0, work_deadline - started))
              identity = os.urandom(16).hex()
              ancestors = json.loads(os.environ.get("HSS_COMMAND_ANCESTORS", "[]"))
              parents = json.loads(os.environ.get("HSS_COMMAND_PARENTS", "[]"))
              result_path = directory / "result.json"
              owner = dict(identity=identity, result=str(result_path.relative_to(OUT)), ancestors=ancestors, parents=parents)
              evidence_schema.ownership(json.dumps(owner))
              with (directory / "ownership.json").open("x") as stream:
                  stream.write(json.dumps(owner, sort_keys=True) + "\n")
              result = dict(command=args, cwd=str(ROOT), start=started, rc=None, status="running",
                            command_limit_seconds=phase_seconds, work_deadline=work_deadline,
                            allowed_seconds=seconds, identity=identity, ancestors=ancestors)
              child_env = dict(os.environ if env is None else env,
                               HSS_COMMAND_ANCESTORS=json.dumps(ancestors + [identity]),
                               HSS_COMMAND_PARENTS=json.dumps(parents + [dict(identity=identity, result=owner["result"])]))
              publish(result_path, result)
              tail = bytearray()
              process = None
              try:
                  with (directory / "console.log").open("w+b") as stream:
                      if seconds <= 0:
                          result.update(rc=124, status="work_budget_exhausted")
                      else:
                          libc = ctypes.CDLL(None, use_errno=True)
                          if libc.prctl(36, 1, 0, 0, 0) != 0:
                              raise OSError(ctypes.get_errno(), "PR_SET_CHILD_SUBREAPER failed")
                          deadline = time.monotonic() + seconds
                          process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                                     env=child_env, start_new_session=True)
                          result["pid"] = process.pid
                          publish(result_path, result)
                          tail, timed_out = capture(process, deadline, stream)
                          result["cleanup_complete"] = cleanup(process, 2)
                          result.update(child_rc=process.returncode,
                                        rc=124 if timed_out else process.returncode,
                                        status=("work_budget_timeout" if seconds < phase_seconds else "command_timeout")
                                        if timed_out else "completed")
                          if not result["cleanup_complete"]:
                              result.update(rc=124, status="cleanup_timeout")
                      if result["rc"] == 124 and result["status"] != "completed":
                          message = f"\nHSS CONTROL TIMEOUT: {result['status']}\n".encode()
                          tail.extend(message)
                          del tail[:-8 * 1024 * 1024]
                          stream.seek(0)
                          stream.write(tail)
                          stream.truncate()
              except (OSError, subprocess.SubprocessError) as error:
                  result.update(rc=125, status="execution_error", error=str(error))
                  raise
              finally:
                  try:
                      if process is not None:
                          if not result.get("cleanup_complete"):
                              result["cleanup_complete"] = cleanup(process, 2)
                          process.stdout.close()
                  except OSError as error:
                      result.update(rc=125, status="cleanup_error", error=str(error))
                  finally:
                      result.update(end=time.time(), retained_bytes=len(tail))
                      publish(result_path, result)
              if result.get("cleanup_complete") and result["status"] != "completed":
                  record_interruptions(result, result_path)
              print(f"{label}: {result['status']}, rc={result['rc']}; raw log: {directory / 'console.log'}", flush=True)
              return result["rc"], tail.decode(errors="replace")

          def record_interruptions(parent, parent_path):
              count = 0
              for owner_path in OUT.glob("*/ownership.json"):
                  path = owner_path.with_name("result.json")
                  sidecar = owner_path.with_name("interruption.json")
                  if sidecar.exists() or path.exists():
                      continue
                  count += 1
                  require(count <= 1000, "Too many ownership records")
                  owner_raw = b""
                  try:
                      require(not owner_path.is_symlink() and owner_path.stat().st_size <= 1024 * 1024,
                              "Invalid ownership file")
                      owner_raw = owner_path.read_bytes()
                      owner = evidence_schema.ownership(owner_raw)
                      require(owner["result"] == str(path.relative_to(OUT)), "Ownership result path mismatch")
                  except (ValueError, UnicodeDecodeError, OSError, AssertionError) as error:
                      save(str(owner_path.parent.relative_to(OUT) / "invalid-ownership.json"),
                           evidence_schema.invalid(owner_path.relative_to(OUT), owner_raw, error))
                      continue
                  reference = dict(identity=parent["identity"], result=str(parent_path.relative_to(OUT)))
                  if reference not in owner["parents"]:
                      continue
                  try:
                      temporary = []
                      for item in owner_path.parent.glob(".result.json.*.tmp"):
                          require(len(temporary) < 10 and not item.is_symlink() and item.stat().st_size <= 1024 * 1024,
                                  f"Invalid temporary result evidence: {item.relative_to(OUT)}")
                          temporary.append(dict(path=str(item.relative_to(OUT)), sha256=digest(item)))
                      save(str(sidecar.relative_to(OUT)), dict(status="interrupted_before_result", rc=None,
                           cleanup_complete=None, spawn=None, observed_at=time.time(), parent=reference["result"],
                           parent_identity=reference["identity"], ownership=str(owner_path.relative_to(OUT)),
                           ownership_sha256=hashlib.sha256(owner_raw).hexdigest(), raw_result=None, raw_sha256=None,
                           temporary=temporary, reason="No published result; child spawn, exit and local cleanup unknown"))
                  except (ValueError, UnicodeDecodeError, OSError, AssertionError) as error:
                      save(str(owner_path.parent.relative_to(OUT) / "invalid-ownership.json"),
                           evidence_schema.invalid(owner_path.relative_to(OUT), owner_raw, error))
              for path in OUT.glob("*/result.json"):
                  if path.with_name("interruption.json").exists():
                      continue
                  count += 1
                  require(count <= 1000, "Too many command records")
                  require(not path.is_symlink() and path.stat().st_size <= 1024 * 1024,
                          "Invalid command record")
                  raw = path.read_bytes()
                  try:
                      child = evidence_schema.record(raw, command=True)
                  except (ValueError, UnicodeDecodeError) as error:
                      save(str(path.parent.relative_to(OUT) / "invalid-result.json"),
                           evidence_schema.invalid(path.relative_to(OUT), raw, error))
                      continue
                  if parent["identity"] not in child["ancestors"] or child["status"] != "running":
                      continue
                  save(str(path.parent.relative_to(OUT) / "interruption.json"), dict(
                      status="interrupted_by_parent", rc=None, cleanup_complete=None,
                      observed_at=time.time(), parent=str(parent_path.relative_to(OUT)),
                      parent_identity=parent["identity"], raw_sha256=hashlib.sha256(raw).hexdigest(),
                      reason="Child exit status and local cleanup unknown; see parent cleanup result"))

          def prepare():
              workflow = os.environ["WORKFLOW_SHA"]
              initial = json.loads((OUT / "manifest.json").read_text())
              initial["status"] = "preparing"
              save("manifest.json", initial)
              planned = (OUT / "planned-phases.txt").read_text().splitlines()
              commits = git("rev-list", "--reverse", "--no-merges", f"{FROZEN}..{CANDIDATE}").splitlines()
              require([name for name in planned if name.startswith(("style-", "api-", "message-"))] ==
                      [f"{kind}-{commit}" for commit in commits for kind in ("style", "api", "message")],
                      "Planned commit checks differ from immutable history")
              manifest = dict(workflow_sha=workflow, candidate_sha=CANDIDATE, frozen_sha=FROZEN,
                              workflow_blob=git("rev-parse", f"{workflow}:.github/workflows/hss-regression-control.yml"),
                              candidate_tree=git("rev-parse", f"{CANDIDATE}^{{tree}}"), variant=VARIANT,
                              run_id=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                              artifact=f"hss-{VARIANT}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
                              run_url=f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                              limits="8 MiB console/command; 4 MiB observer/process; diagnostics 32 MiB/300 files",
                              uncovered_negative_controls=["premature listener/cache release/reuse", "omitted cleanup/ack",
                                                           "deferred-only reset before pointer free", "ctx/cert heap release"],
                              ipv6_http3_scope="control-plane identity and QUIC listener/ALPN; no IPv6 request or HTTP3 transfer")
              manifest["tests"] = {path: dict(blob=git("rev-parse", f"{CANDIDATE}:{path}"),
                                             sha256=hashlib.sha256(content(CANDIDATE, path)).hexdigest())
                                   for path in (TEST, FIXTURE)}
              manifest["source"] = dict(path=SOURCE, candidate_blob=git("rev-parse", f"{CANDIDATE}:{SOURCE}"),
                                        frozen_blob=git("rev-parse", f"{FROZEN}:{SOURCE}"))
              manifest["tools"] = {path.name: digest(path) for path in TOOLS.glob("*.py")}
              manifest["work_deadline"] = float(os.environ["WORK_DEADLINE"])
              manifest["upload_limit"] = "External runner termination can prevent upload; own work stops before reserved collection/upload budget."
              save("manifest.json", manifest)
              require(git("rev-parse", "HEAD") == workflow, "Workflow SHA mismatch")
              subprocess.run(["git", "checkout", "--detach", CANDIDATE], check=True, timeout=60)
              require(not git("status", "--porcelain"), "Candidate tree is dirty")
              for path in ("build-root/build-vpp_debug-native", "build-root/install-vpp_debug-native", "build-root/test/venv"):
                  require(not Path(path).exists(), f"Not an independent clean build: {path}")
              manifest["tests"] = {path: dict(blob=git("rev-parse", f"{CANDIDATE}:{path}"), sha256=digest(path))
                                   for path in (TEST, FIXTURE)}
              save("manifest.json", manifest)

          def mutate():
              require(git("rev-parse", "HEAD") == CANDIDATE, "Candidate HEAD moved")
              require(not git("diff", "--name-only"), "Tracked source changed before mutation")
              original = Path(SOURCE).read_bytes()
              if VARIANT != "fixed":
                  old, new = RECIPES.get(VARIANT, (None, None))
                  # Whitespace comes from immutable source; preserve surrounding bytes exactly.
                  if VARIANT == "api-protocol":
                      expression = re.compile(rb'snprintf \(\(char \*\) rmp->uri, sizeof \(rmp->uri\), "http%s://%s:%d",\n[ \t]+l->flags & HSS_LISTENER_F_NEED_CRYPTO \? "s" : "", addr,')
                      matches = list(expression.finditer(original))
                      require(len(matches) == 1, "Ambiguous URI restoration hunk")
                      old = matches[0].group().decode()
                      indent = old.split("\n")[1].split("l->flags")[0]
                      new = ('snprintf ((char *) rmp->uri, sizeof (rmp->uri), "%s://%s:%d",\n' +
                             indent + 'tp_vfts[l->sep.transport_proto].transport_options.name, addr,')
                  frozen = content(FROZEN, SOURCE).decode()
                  witness = ("tp_vfts[hsm->default_listener.sep.transport_proto].transport_options.name"
                             if VARIANT == "api-protocol" else new)
                  require(witness in frozen, "Restoration has no frozen-source provenance")
                  require(original.count(old.encode()) == 1, "Ambiguous restoration hunk")
                  Path(SOURCE).write_bytes(original.replace(old.encode(), new.encode(), 1))
              require(git("diff", "--name-only").splitlines() == ([] if VARIANT == "fixed" else [SOURCE]),
                      "Unexpected source mutation")
              manifest = json.loads((OUT / "manifest.json").read_text())
              for path, provenance in manifest["tests"].items():
                  require(digest(path) == provenance["sha256"], f"Candidate test changed: {path}")
              manifest["source"] = dict(path=SOURCE, candidate_blob=git("rev-parse", f"{CANDIDATE}:{SOURCE}"),
                                        frozen_blob=git("rev-parse", f"{FROZEN}:{SOURCE}"), built_blob=git("hash-object", SOURCE))
              index_env = dict(os.environ, GIT_INDEX_FILE=str(TOOLS / "build-index"))
              subprocess.run(["git", "read-tree", CANDIDATE], env=index_env, check=True, timeout=60)
              subprocess.run(["git", "add", SOURCE], env=index_env, check=True, timeout=60)
              manifest["built_tree"] = subprocess.check_output(["git", "write-tree"], env=index_env, text=True, timeout=60).strip()
              manifest["tools"] = {path.name: digest(path) for path in TOOLS.glob("*.py")}
              save("manifest.json", manifest)
              (OUT / "restoration.diff").write_text(git("diff", "--", SOURCE) + "\n")

          def work_remaining():
              seconds = float(os.environ["WORK_DEADLINE"]) - time.time()
              if seconds <= 0:
                  raise TimeoutError("Absolute work deadline exceeded")
              return seconds

          def bounded_paths(root, recursive=True, limit=4000):
              pending, visited = [Path(root)], 0
              while pending:
                  work_remaining()
                  with os.scandir(pending.pop()) as entries:
                      for entry in entries:
                          work_remaining()
                          visited += 1
                          require(visited <= limit, "Evidence traversal limit exceeded")
                          if entry.is_symlink():
                              continue
                          if recursive and entry.is_dir(follow_symlinks=False):
                              pending.append(Path(entry.path))
                          elif entry.is_file(follow_symlinks=False):
                              yield Path(entry.path)
                          elif not recursive and entry.is_dir(follow_symlinks=False):
                              yield Path(entry.path)

          def runtime_roots():
              return [path for path in bounded_paths("/tmp", recursive=False)
                      if path.name.startswith("vpp-unittest-") and path.is_dir()]

          def read_evidence(paths, limit=32 * 1024 * 1024):
              data, remaining = [], limit
              for path in paths:
                  work_remaining()
                  require(not path.is_symlink(), "Symlink evidence rejected")
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(fd, "rb") as stream:
                      require(stat.S_ISREG(os.fstat(stream.fileno()).st_mode), "Nonregular evidence")
                      raw = stream.read(remaining + 1)
                  require(len(raw) <= remaining, "Evidence input limit exceeded; refusing partial validation")
                  remaining -= len(raw)
                  data.append(raw.decode(errors="replace"))
              work_remaining()
              return "\n".join(data)

          def collect(destination):
              destination.mkdir(parents=True, exist_ok=True)
              report, remaining, count, complete = [], 32 * 1024 * 1024, 0, False
              try:
                  roots = runtime_roots() + [Path("build-root/test-logs")]
                  for root in roots:
                      if root.is_symlink() or not root.is_dir():
                          continue
                      for source in bounded_paths(root):
                          work_remaining()
                          require(count < 300 and remaining > 0, "Diagnostic file/byte cap reached")
                          if source.suffix not in (".txt", ".log", ".pcap", ".pcapng"):
                              continue
                          fd = os.open(source, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                          with os.fdopen(fd, "rb") as reader:
                              info = os.fstat(reader.fileno())
                              if not stat.S_ISREG(info.st_mode):
                                  continue
                              length = min(info.st_size, 2 * 1024 * 1024)
                              require(length <= remaining, "Diagnostic byte cap reached")
                              require(source.suffix not in (".pcap", ".pcapng") or length == info.st_size,
                                      "Packet capture exceeds whole-file limit")
                              reader.seek(info.st_size - length)
                              raw = reader.read(length)
                              require(len(raw) == length, "Diagnostic file changed while reading")
                              (destination / f"{count:04d}{source.suffix}").write_bytes(raw)
                          report.append(f"{source}: {length}/{info.st_size}")
                          remaining -= length
                          count += 1
                  complete = True
              finally:
                  (destination / "collection.json").write_text(json.dumps(dict(
                      complete=complete, files=count, bytes=32 * 1024 * 1024 - remaining,
                      limits="4000 entries/root; 300 files; 32 MiB; 2 MiB/file; text tails",
                      report=report), indent=2) + "\n")

          def expected_ids():
              tree = ast.parse(Path(TEST).read_text())
              methods = {cls.name: [node.name for node in cls.body if isinstance(node, ast.FunctionDef)
                                    and node.name.startswith("test_")]
                         for cls in tree.body if isinstance(cls, ast.ClassDef)}
              return [f"test_http_static.{cls}.{method}" for cls in (*CLASSES, "TestHttpStaticVapi")
                      for method in methods["TestHttpStaticCli" if cls in CLASSES else cls]]

          def validate(events, console, rc, expected, variant, logs):
              require(evidence_schema.FATAL.search("\n".join((console, logs, json.dumps(events)))) is None,
                      "Fatal process diagnostic evidence")
              forbidden = ("addError", "addSkip", "addExpectedFailure", "addUnexpectedSuccess")
              require(not any(event["kind"] in forbidden for event in events), "Error/skip/expected failure callback")
              require(not re.search(r"SIGSEGV|segmentation fault|core was generated|timed out|TimeoutError|"
                                    r"VppTransportSocketIOError|VPP(?:\s+is)?\s+dead|"
                                    r"not enough cpus|Skipping tests due to setup failure", console + logs, re.I),
                      "Infrastructure/crash/timeout evidence")
              starts = [event for event in events if event["kind"] == "startTest"]
              stops = [event for event in events if event["kind"] == "stopTest"]
              wanted = collections.Counter(expected)
              require(collections.Counter(event["test"] for event in starts) == wanted, "Wrong/missing/duplicate test starts")
              require(collections.Counter(event["test"] for event in stops) == wanted, "Missing normal stopTest")
              complete = [event for event in events if event["kind"] == "completed" and event["tests"]]
              require(sum(event["tests"] for event in complete) == len(expected), "Missing normal runner completion")
              require(all(not any(event[key] for key in ("errors", "skips", "expected", "unexpected")) for event in complete),
                      "Invalid runner summary")
              loaded = {event["pid"] for event in events if event["kind"] == "loaded"}
              require(loaded and all(event["pid"] in loaded for event in starts + stops + complete),
                      "Missing observer load provenance")
              for event in starts:
                  require(event["workers"] == (1 if ".TestHttpStaticCliWorker." in event["test"] else 0),
                          "Wrong worker configuration")
                  require(event.get("netns_disabled") is False and
                          not set(event.get("excluded", [])) & {"http_static", "tlsopenssl", "quic"},
                          "Namespace or required plugin excluded")
                  cmdline = " ".join(event.get("vpp_cmdline", []))
                  require(cmdline and not re.search(r"(?:tlsopenssl|quic|http_static)_plugin.so\s*\{\s*disable", cmdline),
                          "Missing startup command or required plugin disabled")
              subs = [event for event in events if event["kind"] == "addSubTest"]
              outcomes = [event for event in events if event["kind"] in ("addSuccess", "addFailure")]
              callbacks = re.findall(r"--- (add\w+)\(\) (\w+)\.(\w+)\(", logs)
              if variant == "fixed":
                  require(rc == 0, f"Fixed test command failed: {rc}")
                  require(collections.Counter(event["test"] for event in outcomes if event["kind"] == "addSuccess") == wanted,
                          "Missing actual successes")
                  require(all(event["kind"] == "addSuccess" for event in outcomes), "Fixed assertion failure")
                  require(not any(event.get("error") for event in subs), "Fixed subtest failure")
                  require(collections.Counter(f"test_http_static.{cls}.{method}" for kind, cls, method in callbacks
                                              if kind == "addSuccess") == wanted and
                          all(kind == "addSuccess" for kind, _, _ in callbacks), "Framework callbacks mismatch")
                  for cls in CLASSES:
                      identity = f"test_http_static.{cls}.test_http_static_listener_uri_identity"
                      require(collections.Counter(event["params"].get("protocol") for event in subs if event["test"] == identity) ==
                              collections.Counter(("tcp", "http", "tls", "https")), "Incomplete secure subtests")
                      helpers = [event for event in events if event["kind"] == "helper" and event["test"] == identity]
                      clients = [event for event in helpers if event["helper"] == "_client"]
                      responses = [event for event in helpers if event["helper"] == "_response"]
                      refusals = [event for event in helpers if event["helper"] == "_refused"]
                      require([event["secure"] for event in clients] == [False] * 4 + [True] * 4,
                              "Missing real TLS/HTTPS requests")
                      require(len(responses) == 8 and all(event["response"].get("status") == 200 for event in responses),
                              "Missing actual HTTP200 responses")
                      require(len(refusals) == 8 and all(event["rc"] == 0 and event["stdout"].strip() == "ECONNREFUSED"
                                                       for event in refusals), "Missing real TCP refusals")
                      sequence = [event["helper"] for event in helpers]
                      require(sequence == ["_client", "_response", "_refused"] * 8,
                              "HTTP200/delete/refusal sequence differs")
                  require(any(event["kind"] == "cli" and event["command"] == "show session listeners quic verbose 2"
                              and "[Q]" in event["reply"] and "h3" in event["reply"] for event in events),
                          "No real QUIC listener and ALPN evidence")
              else:
                  require(rc > 0 and rc != 124, "Restored command unexpectedly passed or timed out")
                  require(collections.Counter(event["test"] for event in outcomes) == wanted and
                          all(event["kind"] == "addFailure" for event in outcomes),
                          "Restored outcomes are not assertion failures")
                  require(not any(event.get("error") for event in subs), "Unexpected negative subtest failure")
                  require(sum(event["failures"] for event in complete) == len(expected), "Wrong assertion summary")
                  require(collections.Counter(f"test_http_static.{cls}.{method}" for kind, cls, method in callbacks
                                              if kind == "addFailure") == wanted and
                          all(kind == "addFailure" for kind, _, _ in callbacks), "Negative framework callbacks mismatch")
                  expressions = {
                      "cache-limit": ('self.assertEqual(reply.cache_size_limit, 2 << 20)',
                                      "AssertionError: 0 != 2097152"),
                      "api-protocol": ('self.assertEqual(reply.uri, "http://10.10.1.2:8083")',
                                       "AssertionError: 'tcp://10.10.1.2:8083' != 'http://10.10.1.2:8083'"),
                      "original-endpoint": ('self.assertEqual(reply.retval, 0, reply.reply)',
                                            "AssertionError: -1 != 0")}
                  expression, witness = expressions[variant]
                  for event in outcomes:
                      require(event.get("error") == "AssertionError" and expression in event.get("traceback", "") and
                              witness in event["traceback"], "Wrong restored assertion witness")
                  require(expression in logs and witness in logs, "Missing raw assertion witness")
                  if variant == "original-endpoint":
                      message = "Listener with given endpoint not found"
                      require(all(message in event["traceback"] for event in outcomes) and
                              message in console and witness in console, "Missing raw endpoint traceback")
                      replies = [event for event in events if event["kind"] == "cli_reply" and event["retval"] != 0]
                      require(len(replies) == len(expected) and all(
                          event["command"] == "http static listener del uri tcp://[::]:8086" and
                          event["retval"] == -1 and message in event["reply"]
                          for event in replies), "Missing exact failed raw API replies")

          def tests():
              manifest = json.loads((OUT / "manifest.json").read_text())
              require(git("hash-object", SOURCE) == manifest["source"]["built_blob"], "Built source moved")
              for path, provenance in manifest["tests"].items():
                  require(digest(path) == provenance["sha256"], "Candidate tests changed")
              method = ("test_http_static_listener_ipv6_identity" if VARIANT == "original-endpoint" else
                        "test_http_static_default_get_states")
              selector = "http_static" if VARIANT == "fixed" else ",".join(
                  f"http_static.{cls}.{method}" for cls in CLASSES)
              expected = expected_ids() if VARIANT == "fixed" else [
                  f"test_http_static.{cls}.{method}" for cls in CLASSES]
              event_base = OUT / "events"
              env = dict(os.environ, HSS_EVENTS=str(event_base),
                         PYTHONPATH=str(TOOLS) + os.pathsep + os.environ.get("PYTHONPATH", ""))
              args = ["make", "UNATTENDED=yes", "TEST_JOBS=1", "FORCE_FOREGROUND=1", "VPP_WORKER_COUNT=0",
                      "RETRIES=0", "FAILFAST=0", "SKIP_TESTS=", "VPP_EXCLUDED_PLUGINS=", "V=2",
                      "COREDUMP_SIZE=0", "DECODE_PCAPS=none", "RND_SEED=48", f"TEST={selector}", "test-debug"]
              rc, console = command("runtime", args, env)
              collect(OUT / "runtime" / "diagnostics")
              event_paths = [path for path in bounded_paths(OUT, recursive=False)
                             if path.name.startswith("events.") and path.suffix == ".jsonl"]
              events = [json.loads(line) for line in read_evidence(event_paths).splitlines() if line]
              paths = [root / name for root in runtime_roots() for name in ("log.txt", "vpp_stderr.txt")
                       if (root / name).is_file()]
              logs = read_evidence(paths)
              work_remaining()
              try:
                  runtime = json.loads((OUT / "runtime/result.json").read_text())
                  require(runtime["status"] == "completed", "Runtime command timed out or exceeded work budget")
                  require(not (OUT / "runtime/fatal-diagnostic.json").exists(), "Fatal diagnostic found before log tail")
                  validate(events, console, rc, expected, VARIANT, logs)
              except Exception as error:
                  save("acceptance.json", dict(status="FAIL", error=str(error), expected=expected))
                  raise
              save("acceptance.json", dict(status="PASS", expected=expected,
                                           claims="full fixed suite and14 new successes" if VARIANT == "fixed" else
                                           "narrow restored API field only; lifecycle negative gaps remain"))

          def binaries():
              paths = [*Path("build-root/install-vpp_debug-native").rglob("vpp"),
                       *Path("build-root/install-vpp_debug-native").rglob("http_static_plugin.so"),
                       *Path("build-root/install-vpp_debug-native").rglob("tlsopenssl_plugin.so"),
                       *Path("build-root/install-vpp_debug-native").rglob("quic_plugin.so")]
              files = {str(path): digest(path) for path in paths if path.is_file()}
              for name in ("vpp", "http_static_plugin.so", "tlsopenssl_plugin.so", "quic_plugin.so"):
                  require(any(Path(path).name == name for path in files), f"Required binary/plugin missing: {name}")
              save("binaries.json", files)
              caches = list(Path("build-root/build-vpp_debug-native").rglob("CMakeCache.txt"))
              require(caches, "Missing build cache")
              (OUT / "CMakeCache.txt").write_text("\n".join(path.read_text() for path in caches))

          def action_result(action, operation):
              result = dict(action=action, start=time.time(), status="running", rc=None)
              save(f"{action}-result.json", result)
              try:
                  operation()
              except Exception as error:
                  result.update(status="failed", rc=1, error=f"{type(error).__name__}: {error}")
                  raise
              else:
                  result.update(status="completed", rc=0)
              finally:
                  result["end"] = time.time()
                  save(f"{action}-result.json", result)

          if __name__ == "__main__":
              action = sys.argv[1]
              operations = {"prepare": prepare, "mutate": mutate, "tests": tests,
                            "binaries": binaries, "collect": lambda: collect(OUT / "final-diagnostics")}
              if action.startswith("operation-"):
                  name = action.removeprefix("operation-")
                  action_result(name, operations[name])
              elif action in operations:
                  status, _ = command(action, [sys.executable, __file__, f"operation-{action}"])
                  if action == "tests" and status != 0:
                      save("acceptance.json", dict(status="FAIL", error=f"Whole runtime action failed: {status}"))
                  raise SystemExit(status)
              else:
                  status, _ = command(action, sys.argv[2:])
                  raise SystemExit(status)
          PY
          python3 "$TOOLS/control.py" prepare

      - name: Install exact candidate dependencies
        timeout-minutes: 27
        run: python3 "$TOOLS/control.py" dependencies make UNATTENDED=yes install-dep

      - name: Check exact candidate style API and pinned Python
        timeout-minutes: 82
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -uno)"
          python3 "$TOOLS/control.py" feature-list make checkfeaturelist
          for commit in $(git rev-list --reverse --no-merges "$FROZEN_SHA..$CANDIDATE_SHA"); do
            git checkout --detach "$commit"
            test -z "$(git status --porcelain -uno)"
            CHECKSTYLE_COMMIT="$commit" python3 "$TOOLS/control.py" "style-$commit" make checkstyle
            python3 "$TOOLS/control.py" "api-$commit" make checkstyle-api
            python3 "$TOOLS/control.py" "message-$commit" extras/scripts/check_commit_msg.sh
          done
          git checkout --detach "$CANDIDATE_SHA"
          python3 "$TOOLS/control.py" pinned-python make checkstyle-python
          python3 "$TOOLS/control.py" black-version build-root/test/venv/bin/python -c \
            'import black; assert black.__version__ == "26.5.1", black.__version__; print(black.__version__)'
          python3 "$TOOLS/control.py" fixture-python-style build-root/test/venv/bin/black --check -t py39 \
            src/plugins/http_static/test_lifetime_fixtures.py test/asf/test_http_static.py

      - name: Execute exactly fourteen standalone fixtures
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 "$TOOLS/control.py" fixtures python3 src/plugins/http_static/test_lifetime_fixtures.py -v
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ["EVIDENCE"]) / "fixtures/console.log").read_text()
          assert "Ran 14 tests in " in text and "\nOK\n" in text, text
          PY

      - name: Restore narrow source field and identify build tree
        timeout-minutes: 5
        run: python3 "$TOOLS/control.py" mutate

      - name: Supply reproducible fallback version
        id: version
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! git describe --long --match 'v[0-9]*' 2>/dev/null; then
            echo "0.0.0-release+$(git log -1 --format=%ct).$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)" > src/scripts/.version
          fi
          if [ -f src/scripts/.version ]; then cp src/scripts/.version "$EVIDENCE/version.txt"; fi

      - name: Build independent debug variant with TLS and QUIC
        timeout-minutes: 42
        run: |
          set -euo pipefail
          python3 "$TOOLS/control.py" build make UNATTENDED=yes VPP_EXCLUDED_PLUGINS= build
          python3 "$TOOLS/control.py" binaries

      - name: Prepare namespace runtime
        id: namespace
        timeout-minutes: 3
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ runner.temp }}/hss-evidence/runtime-setup

      - name: Record and require CPU namespace and OpenSSL environment
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 "$TOOLS/control.py" environment bash -euo pipefail -c '
            uname -a
            cat /etc/os-release
            openssl version -a
            python3 -c "import os; print(sorted(os.sched_getaffinity(0))); assert len(os.sched_getaffinity(0)) >= 2"
            mountpoint /dev/shm
            test "$(df -B1 --output=size /dev/shm | tail -n 1)" -ge 2147483648
            namespace="hss-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap '\''ip netns del "$namespace"'\'' EXIT
            ip netns add "$namespace"
            ip netns exec "$namespace" ip link set lo up
            ip netns exec "$namespace" ip link show lo
            dpkg-query -W libssl-dev clang-format-19 python3
          '

      - name: Run full fixed suite or exact restored assertions
        timeout-minutes: 17
        run: python3 "$TOOLS/control.py" tests

      - name: Always retain tools diagnostics and provenance
        if: always()
        timeout-minutes: 5
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          NAMESPACE_OUTCOME: ${{ steps.namespace.outcome }}
        run: |
          set -uo pipefail
          EVIDENCE="${EVIDENCE:-$RUNNER_TEMP/hss-evidence}"
          TOOLS="${TOOLS:-$RUNNER_TEMP/hss-tools}"
          export EVIDENCE TOOLS
          mkdir -p "$EVIDENCE"
          for path in "$TOOLS/"*.py; do
            if [ -f "$path" ]; then cp "$path" "$EVIDENCE/"; fi
          done
          if [ -f "$TOOLS/control.py" ]; then
            timeout --signal=TERM --kill-after=5s 90s python3 "$TOOLS/control.py" collect \
              > "$EVIDENCE/collection-console.log" 2>&1
            printf 'rc=%s\n' "$?" > "$EVIDENCE/collection-status.txt"
          fi
          timeout 15s git status --short > "$EVIDENCE/final-status.txt" 2>&1
          timeout 15s git diff --binary > "$EVIDENCE/final.diff" 2>&1
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, os.environ["TOOLS"])
          import evidence_schema
          root = Path(os.environ["EVIDENCE"])
          phases = {}
          names = (root / "planned-phases.txt").read_text().splitlines()
          outcomes = {"bootstrap": "BOOTSTRAP_OUTCOME", "checkout": "CHECKOUT_OUTCOME",
                      "fallback-version": "VERSION_OUTCOME", "namespace": "NAMESPACE_OUTCOME"}
          for name in names:
              paths = (root / name / "result.json", root / f"{name}-result.json")
              found = next((path for path in paths if path.is_file()), None)
              if found:
                  raw, failed_path = b"", found
                  try:
                      raw = found.read_bytes()
                      child_raw = raw
                      child = evidence_schema.record(raw, command=found.name == "result.json")
                      phases[name] = child
                      interruption = root / name / "interruption.json"
                      if interruption.is_file():
                          failed_path = interruption
                          raw = interruption.read_bytes()
                          checked = evidence_schema.interruption(raw, child, child_raw)
                          phases[name] = dict(raw_result=str(found.relative_to(root)), **checked)
                  except (ValueError, UnicodeDecodeError, OSError) as error:
                      phases[name] = evidence_schema.invalid(failed_path.relative_to(root), raw, error)
              elif (root / name / "interruption.json").is_file():
                  sidecar = root / name / "interruption.json"
                  raw, failed_path = b"", sidecar
                  try:
                      raw = sidecar.read_bytes()
                      owner_path = sidecar.with_name("ownership.json")
                      owner_raw = owner_path.read_bytes()
                      phases[name] = evidence_schema.initial_interruption(raw, owner_raw, f"{name}/result.json")
                  except (ValueError, UnicodeDecodeError, OSError) as error:
                      phases[name] = evidence_schema.invalid(failed_path.relative_to(root), raw, error)
              elif name in outcomes:
                  outcome = os.environ.get(outcomes[name], "skipped")
                  phases[name] = dict(status="not_run" if outcome == "skipped" else outcome,
                                      rc=0 if outcome == "success" else None, action_outcome=outcome)
              else:
                  phases[name] = dict(status="not_run", rc=None, reason="No phase result; inspect earlier failure")
          (root / "phase-status.json").write_text(json.dumps(phases, indent=2) + "\n")
          files = {str(path.relative_to(root)): {"bytes": path.stat().st_size,
                   "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                   for path in sorted(root.rglob("*")) if path.is_file() and not path.is_symlink()}
          (root / "evidence-index.json").write_text(json.dumps(files, indent=2) + "\n")
          PY

      - name: Upload bounded HSS evidence on every outcome
        timeout-minutes: 8
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hss-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hss-evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Report artifact identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        timeout-minutes: 5
        run: |
          printf 'Artifact ID: %s\nArtifact URL: %s\nArtifact digest: %s\n' \
            "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
