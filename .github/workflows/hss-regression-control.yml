                  if event.get("command") == "test http static async status":
                      event["reply"] = event["reply"].replace(before, after)
              rejects_async(changed)
          for marker in ("SIGSEGV", "TimeoutError", "operation timed out"):
              rejects_async(negative, True, raw=trace + marker)
          for before, after in (("record[\"refs\"], 0", "record[\"refs\"], 1"), ("1 != 0", "2 != 0")):
              rejects_async(negative, True, raw=trace.replace(before, after))
          for rc in (0, 1, 124, -11):
              rejects_async(negative, True, rc=rc)
          def with_trace(raw):
              changed = copy.deepcopy(negative)
              next(event for event in changed if event["kind"] == "addFailure")["traceback"] = raw
              return changed
          callback = "--- addFailure() TestHttpStaticCliWorker.test_http_static_async_release_cancel("
          fragments = ('in test_http_static_async_release_cancel\nin _async_sent_scenario\n'
                       'in _async_assert_freed\nself.assertEqual(record["refs"], 0, record)\nAssertionError: 1 != 0\n')
          invalid_traces = [fragments, trace.split("\n", 1)[1]]
          lines = trace.splitlines(keepends=True)
          for index in (1, 3, 5):
              invalid_traces.append("".join(lines[:index] + lines[index + 1:]))
          invalid_traces.append("".join([lines[0], *lines[3:5], *lines[1:3], *lines[5:]]))
          for before, after in (("test/asf/test_http_static.py", "test/asf/test_other.py"),
                                ("line 1371", "line 1372"), ("line 1297", "line 1298"), ("line 1154", "line 1155"),
                                ("in _async_sent_scenario", "in _other_scenario"),
                                ("self._async_sent_scenario(root, uri)", "self._async_sent_scenario(uri, root)"),
                                ("self._async_assert_freed(completed)", "self._async_assert_freed(other)"),
                                ('self.assertEqual(record["refs"], 0, record)', 'self.assertEqual(record["refs"], 1, record)'),
                                ("AssertionError: 1 != 0", "AssertionError: 2 != 0")):
              invalid_traces.append(trace.replace(before, after))
          invalid_traces.append(trace.replace('/fixture/test/asf/test_http_static.py',
                                              '/foreign/test/asf/test_http_static.py', 1))
          invalid_traces.append(trace.replace("    self._async_assert_freed(completed)\n",
                                              "    unrelated()\n    self._async_assert_freed(completed)\n"))
          for raw in invalid_traces:
              rejects_async(with_trace(raw), True, raw=raw, raw_logs=raw + callback)
          for raw in (trace.replace("/fixture/", "/foreign/"), trace.replace("refs retained", "different detail")):
              rejects_async(negative, True, raw=raw)
              rejects_async(negative, True, raw_logs=raw + callback)
          caret = trace
          for statement in ("self._async_sent_scenario(root, uri)", "self._async_assert_freed(completed)",
                            'self.assertEqual(record["refs"], 0, record)'):
              caret = caret.replace("    " + statement + "\n", "    " + statement + "\n    ~~~~~~~~~~  ^^^^^\n")
          unittest_trace = trace.replace("Traceback (most recent call last):\n",
              'Traceback (most recent call last):\n  File "/usr/lib/python3.13/unittest/case.py", line 58, in testPartExecutor\n'
              '    yield\n  File "/usr/lib/python3.13/unittest/case.py", line 651, in run\n    self._callTestMethod(testMethod)\n'
              '  File "/usr/lib/python3.13/unittest/case.py", line 606, in _callTestMethod\n    method()\n')
          unittest_trace = unittest_trace.replace("AssertionError: 1 != 0",
              '  File "/usr/lib/python3.13/unittest/case.py", line 899, in assertEqual\n    assertion_func(first, second, msg=msg)\n'
              '  File "/usr/lib/python3.13/unittest/case.py", line 892, in _baseAssertEqual\n    raise self.failureException(msg)\n'
              'AssertionError: 1 != 0')
          for event_trace, raw, raw_logs in ((caret, caret, caret + callback),
                                             (trace, caret, logs), (caret, trace, logs),
                                             (unittest_trace, trace, logs), (trace, unittest_trace, unittest_trace + callback)):
              control["validate"](with_trace(event_trace), raw, 2, [control["ASYNC_TEST"]],
                                  "async-omit-release", raw_logs)
          recovery_index = next(index for index, event in enumerate(negative)
                                if event.get("command") == "test http static async recover 101")
          status_index = recovery_index - 1
          def pre_recovery(reply, append=False):
              changed = copy.deepcopy(negative)
              if append:
                  changed.insert(recovery_index, dict(changed[status_index], reply=reply))
              else:
                  changed[status_index]["reply"] = reply
              for index, event in enumerate(changed, 1):
                  event["seq"] = index
              return changed
          idle = negative[status_index]["reply"]
          for before, after in (("pending 0", "pending 1"), ("owners 0", "owners 1"),
                                ("destroys 0", "destroys 1"), ("detaches 0", "detaches 1"),
                                ("omitted 1", "omitted 0"), ("refs 1", "refs 0"),
                                ("cleanups 1", "cleanups 0"), ("poolput 0", "poolput 1"),
                                ("final 0", "final 5"), ("freed 0", "freed 6"), ("recovery 0", "recovery 1")):
              for append in (False, True):
                  rejects_async(pre_recovery(idle.replace(before, after), append), True)
          nonidle = idle.replace("owners 0", "owners 1").replace("detaches 0", "detaches 1").replace("pending 0", "pending 1")
          rejects_async(pre_recovery(nonidle, True), True)
          extra_pending = idle + idle.splitlines(keepends=True)[1].replace("token 101", "token 102").replace("pending 0", "pending 1")
          rejects_async(pre_recovery(extra_pending), True)
          rejects_async(pre_recovery(idle.splitlines(keepends=True)[0]), True)
          control["validate"](pre_recovery(idle, True), trace, 2, [control["ASYNC_TEST"]], "async-omit-release", logs)
          print(f"Pure-memory ASYNC fixtures passed: fixed, ordinary omission, legal caret traces and latest idle recovery; {rejected} invalid inputs rejected")
          accepted_fields = control["ACCEPTED_FIELDS"]
          accepted_test = control["ACCEPTED_TEST"]
          events = []
          def accepted_emit(kind, **values):
              events.append(dict(kind=kind, pid=1, seq=len(events) + 1, **values))
          def accepted_cli(command, reply=""):
              accepted_emit("cli_reply", command=command, retval=0, reply=reply)
          def accepted_status(**values):
              record = dict.fromkeys(accepted_fields, 0)
              record.update(token=201, enabled=1, epoch=5, generation=6, app=7, worker=8,
                            listener=9, thread=1, handle=(1 << 32) + 10, protocol=7, builtin=1,
                            event=11, enqueued=1, head=12, current_head=12, held=1)
              record.update(values)
              accepted_cli("test http static accepted status",
                           " ".join(f"{key} {record[key]}" for key in accepted_fields))
          accepted_emit("startTest", test=accepted_test)
          accepted_cli("test http static async start")
          accepted_cli("http static listener add uri tcp://10.10.1.2:8093 www-root /old max-age 123")
          accepted_cli("test http static accepted start 201 listener 9")
          accepted_cli("test http static accepted identity listener 9", "listener 9 epoch 5 generation 6 app 7")
          accepted_emit("helper", test=accepted_test, helper="_response", client=20, response={"requested": True})
          accepted_status(queued=1)
          accepted_cli("http static listener del uri tcp://10.10.1.2:8093")
          captured = dict(captured=2, captures=1, retained=1, refs=1, retiring=1, queued=1)
          accepted_status(**captured)
          accepted_cli("http static listener add uri tcp://10.10.1.2:8093 www-root /new max-age 456")
          accepted_cli("test http static accepted identity listener 11", "listener 11 epoch 15 generation 6 app 7")
          accepted_status(**captured)
          accepted_cli("test http static accepted release")
          released = dict(captured=2, captures=1, released=3, transferred=4, callback=5, ready=6,
                          advanced=7, ack=8, callbacks=1, advances=1, rx_ready=1, transfers=1,
                          refs_before=1, refs_after=1, head_after=13, current_head=13, refs=1, retiring=1)
          accepted_status(**released)
          for client, body, cache in ((20, "old accepted config", "max-age=123"),
                                      (21, "new accepted config", "max-age=456")):
              accepted_emit("helper", test=accepted_test, helper="_response", client=client,
                            response=dict(status=200, body=body, cache=cache, server="http_static_server_6"))
          closed = dict(released, cleaned=9, freed=10, cleanups=1, poolput=1, refs=0)
          accepted_status(**closed)
          accepted_cli("http static listener del uri tcp://10.10.1.2:8093")
          accepted_cli("test http static accepted release")
          accepted_status(**closed)
          accepted_cli("http static server disable")
          accepted_cli("test http static async status",
                       "async-ledger enabled 1 overflow 0 live 0 baseline 0 destroys 0 detaches 0 owners 0\n")
          accepted_cli("test http static accepted clear")
          accepted_cli("test http static async clear")
          accepted_emit("addSuccess", test=accepted_test)
          accepted_emit("stopTest", test=accepted_test)
          control["accepted_evidence"](events)
          rejected = 0
          def rejects_accepted(changed):
              global rejected
              try:
                  control["accepted_evidence"](changed)
              except (AssertionError, ValueError, KeyError, IndexError, StopIteration):
                  rejected += 1
              else:
                  raise AssertionError("Invalid ACCEPTED evidence was accepted")
          for index, event in enumerate(events):
              if event["kind"] in ("cli_reply", "helper", "addSuccess"):
                  rejects_accepted(events[:index] + events[index + 1:])
          for before, after in (("overflow 0", "overflow 1"), ("thread 1", "thread 0"),
                                ("protocol 7", "protocol 6"), ("event 11", "event 12"),
                                ("enqueued 1", "enqueued 0"), ("captures 1", "captures 2"),
                                ("refs_before 1", "refs_before 2"), ("refs_after 1", "refs_after 0"),
                                ("callback 5", "callback 3"), ("ack 8", "ack 6"),
                                ("head_after 13", "head_after 12"), ("poolput 1", "poolput 0"),
                                ("epoch 15", "epoch 5"), ("cleaned 9", "cleaned 11")):
              changed = copy.deepcopy(events)
              for event in changed:
                  if event["kind"] == "cli_reply":
                      event["reply"] = event["reply"].replace(before, after)
              rejects_accepted(changed)
          print(f"Pure-memory ACCEPTED verifier checks passed; {rejected} invalid inputs rejected; no runtime claim")
          PY

      - &hss_mutate
        name: Restore narrow source field and identify build tree
        timeout-minutes: 5
        run: python3 "$TOOLS/control.py" mutate

      - &hss_version
        name: Supply reproducible fallback version
        id: version
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! git describe --long --match 'v[0-9]*' 2>/dev/null; then
            echo "0.0.0-release+$(git log -1 --format=%ct).$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)" > src/scripts/.version
          fi
          if [ -f src/scripts/.version ]; then cp src/scripts/.version "$EVIDENCE/version.txt"; fi

      - &hss_build
        name: Build independent debug variant with TLS and QUIC
        timeout-minutes: 42
        run: |
          set -euo pipefail
          python3 "$TOOLS/control.py" build make UNATTENDED=yes VPP_EXCLUDED_PLUGINS= build

      - &hss_binaries
        name: Record exact binaries and build configuration
        timeout-minutes: 5
        run: python3 "$TOOLS/control.py" binaries

      - &hss_namespace
        name: Prepare namespace runtime
        id: namespace
        timeout-minutes: 3
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ runner.temp }}/hss-evidence/runtime-setup

      - &hss_environment
        name: Record and require CPU namespace and OpenSSL environment
        id: environment
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 "$TOOLS/control.py" environment bash -euo pipefail -c '
            uname -a
            cat /etc/os-release
            openssl version -a
            python3 -c "import os,resource; limits=resource.getrlimit(resource.RLIMIT_MEMLOCK); print(dict(pid=os.getpid(),memlock_bytes=limits),flush=True); print(open(\"/proc/self/limits\").read(4096),flush=True); print([line for line in open(\"/proc/self/status\").read(8192).splitlines() if line.startswith((\"VmLck:\",\"CapEff:\"))],flush=True); assert limits == (268435456,268435456), limits"
            python3 -c "import os; print(sorted(os.sched_getaffinity(0))); assert len(os.sched_getaffinity(0)) >= 2"
            mountpoint /dev/shm
            test "$(df -B1 --output=size /dev/shm | tail -n 1)" -ge 2147483648
            namespace="hss-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap '\''ip netns del "$namespace"'\'' EXIT
            ip netns add "$namespace"
            ip netns exec "$namespace" ip link set lo up
            ip netns exec "$namespace" ip link show lo
            dpkg-query -W libssl-dev clang-format-19 python3
          '

      - name: Run full fixed suite or exact restored assertions
        timeout-minutes: 17
        run: python3 "$TOOLS/control.py" tests

      - name: Run exact HTTP name ownership regression
        if: ${{ !cancelled() && matrix.variant == 'fixed' && steps.environment.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 "$TOOLS/control.py" http-name

      - &hss_retain
        name: Always retain tools diagnostics and provenance
        if: always()
        timeout-minutes: 5
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          NAMESPACE_OUTCOME: ${{ steps.namespace.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic_contract.outcome }}
        run: |
          set -uo pipefail
          export EVIDENCE="${EVIDENCE:-$RUNNER_TEMP/hss-evidence}"
          export TOOLS="${TOOLS:-$RUNNER_TEMP/hss-tools}"
          export HSS_CONTROL="${HSS_CONTROL:-$RUNNER_TEMP/hss-collection-control}"
          record_status=0
          if mkdir -m 700 -p "$HSS_CONTROL"; then :; else
            record_status=$?
            printf 'Healthy control directory unavailable: rc=%s\n' "$record_status" >&2 || :
          fi
          if timeout --signal=TERM --kill-after=5s 65s python3 "$TOOLS/control.py" collect \
              > "$HSS_CONTROL/final-console.log" 2>&1; then
            collection_status=0
          else
            collection_status=$?
          fi
          if printf 'rc=%s\n' "$collection_status" > "$HSS_CONTROL/final-status.txt"; then :; else
            record_status=$?
            printf 'Cannot preserve collection rc=%s: write rc=%s\n' "$collection_status" "$record_status" >&2 || :
          fi
          if timeout --signal=TERM --kill-after=5s 65s python3 "$TOOLS/hss_delivery.py" "$collection_status" \
              > "$HSS_CONTROL/delivery-console.log" 2>&1; then
            delivery_status=0
          else
            delivery_status=$?
          fi
          if printf 'rc=%s\n' "$delivery_status" > "$HSS_CONTROL/delivery-status.txt"; then :; else
            record_status=$?
            printf 'Cannot preserve delivery rc=%s: write rc=%s\n' "$delivery_status" "$record_status" >&2 || :
          fi
          if [ ! -f "$HSS_CONTROL/phase-status.json" ]; then
            if printf '{"schema":"hss-terminal-v1","authority":"terminal","complete":false,"product_acceptance":false,"collection_rc":%s,"delivery_rc":%s,"phases":{"collect":{"status":"unknown/incomplete","complete":false}},"errors":["Terminal publisher unavailable; inspect healthy final and delivery records"]}\n' \
                "$collection_status" "$delivery_status" > "$HSS_CONTROL/phase-status.json"; then :; else
              record_status=$?
              printf 'Cannot publish fallback: collection rc=%s delivery rc=%s write rc=%s\n' \
                "$collection_status" "$delivery_status" "$record_status" >&2 || :
            fi
          fi
          if printf 'Collection rc=%s delivery rc=%s healthy-record rc=%s\n' \
              "$collection_status" "$delivery_status" "$record_status" >&2; then :; else
            console_status=$?
            if [ "$record_status" -eq 0 ]; then record_status=$console_status; fi
          fi
          if [ "$collection_status" -ne 0 ]; then
            timeout --signal=TERM --kill-after=1s 5s python3 "$TOOLS/control.py" error-tail "$HSS_CONTROL/final-console.log" || :
          fi
          if [ "$delivery_status" -ne 0 ]; then
            timeout --signal=TERM --kill-after=1s 5s python3 "$TOOLS/control.py" error-tail "$HSS_CONTROL/delivery-console.log" || :
          fi
          if [ "$collection_status" -ne 0 ]; then exit "$collection_status"; fi
          if [ "$delivery_status" -ne 0 ]; then exit "$delivery_status"; fi
          exit "$record_status"

      - &hss_upload
        name: Upload bounded HSS evidence on every outcome
        timeout-minutes: 8
        id: evidence
        if: ${{ always() && env.HSS_UPLOAD_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hss-${{ env.VARIANT_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hss-upload/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - &hss_control_upload
        name: Upload healthy collection control records
        timeout-minutes: 8
        id: healthy
        if: ${{ always() && env.HSS_UPLOAD_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hss-control-${{ env.VARIANT_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hss-upload/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - &hss_report
        name: Report artifact identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        timeout-minutes: 5
        run: |
          printf 'Artifact ID: %s\nArtifact URL: %s\nArtifact digest: %s\n' \
            "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  diagnostic:
    name: HSS / diagnostic contract
    if: ${{ github.event_name == 'push' || !inputs.product_controls }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    container: *hss_container
    defaults:
      run:
        shell: bash
    env:
      VARIANT_NAME: fixed
      WORKFLOW_SHA: ${{ github.sha }}
      CANDIDATE_SHA: f89072eefd4dae7c7392b2a828ffb297b47bd9a9
      CHECK_BASE_SHA: d71243491366c793325a970433498ea412eba530
      CANDIDATE_TREE: 7d86133605624990b0342f9074d78e1c9dd265b2
      CONTROL_SHA: 8e85e05616a1b86b9b3e95354415e28047967217
      CONTROL_TREE: 5cde6288d912293c9bac96da4fcfd126a6604b48
      FROZEN_SHA: 630f876bc326eee05c23d517600b72e8d6a6ec83
      CLANG_FORMAT_VER: "19"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      VPP_TEARDOWN_TIMEOUT: "5"
    steps:
      - *hss_bootstrap
      - *hss_checkout
      - *hss_generate
      - name: Plan independent diagnostic phases
        timeout-minutes: 1
        run: |
          set -euo pipefail
          printf '%s\n' bootstrap checkout prepare dependencies diagnostic-dependency-guard diagnostic-dependencies mutate fallback-version build binaries namespace environment diagnostic-contract collect > "$EVIDENCE/planned-phases.txt"
          printf '{"product_controls":"NOT_RUN","historical_run":"39494180264","diagnostic_acceptance":"independent","candidate":"%s","control":"%s","workflow":"%s"}\n' \
            "$CANDIDATE_SHA" "$CONTROL_SHA" "$WORKFLOW_SHA" > "$HSS_CONTROL/task-map.json"
      - *hss_dependencies
      - name: Prepare pinned diagnostic Python environment
        timeout-minutes: 15
        run: python3 "$TOOLS/control.py" diagnostic-dependencies
      - *hss_mutate
      - *hss_version
      - *hss_build
      - *hss_binaries
      - *hss_namespace
      - *hss_environment
      - name: Execute unique D1 through D5 diagnostic contract
        id: diagnostic_contract
        timeout-minutes: 7
        run: python3 "$TOOLS/control.py" diagnostic-contract
      - *hss_retain
      - *hss_upload
      - *hss_control_upload
      - *hss_report
