          import hashlib
          import json
          import os
          from pathlib import Path
          import signal
          import stat
          import subprocess
          import sys
          import time
          import evidence_schema

          LIMIT = 256 * 1024
          SCHEMA = "hss-collection-v1"

          def bounded_json(path):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                      raise ValueError("Nonregular control record")
                  raw = os.read(descriptor, LIMIT + 1)
                  if len(raw) > LIMIT:
                      raise ValueError("Control record exceeds cap")
                  return json.loads(raw)
              finally:
                  os.close(descriptor)

          def receipt_complete(request, worker, pid, status, rc, cleanup):
              if (not isinstance(worker, dict) or worker.get("schema") != SCHEMA or
                      worker.get("identity") != request["identity"] or worker.get("pid") != pid or
                      worker.get("module_sha256") != request["module_sha256"] or
                      worker.get("deadline") != request["deadline"] or type(worker.get("complete")) is not bool or
                      type(worker.get("entries")) is not int or not 0 <= worker["entries"] <= 4000 or
                      type(worker.get("bytes")) is not int or not 0 <= worker["bytes"] <= 256 * 1024 * 1024):
                  raise ValueError("Malformed, foreign or stale collector result")
              complete = (status == "completed" and type(rc) is int and rc == 0 and
                          cleanup is True and worker["complete"] and "error" not in worker)
              if complete:
                  index = worker["index"]
                  if (not isinstance(index, dict) or set(index) != {"path", "bytes", "sha256"} or
                          index["path"] != str(Path(request["destination"]) / "evidence-index.json") or
                          type(index["bytes"]) is not int or not 0 < index["bytes"] <= 2 * 1024 * 1024 or
                          not isinstance(index["sha256"], str) or len(index["sha256"]) != 64 or
                          any(char not in "0123456789abcdef" for char in index["sha256"])):
                      raise ValueError("Invalid collector index receipt")
              return complete

          def read_size(consumed):
              available = 256 * 1024 * 1024 - consumed
              if available <= 0:
                  raise ValueError("Collector actual read cap reached")
              return min(65536, available)

          def read_regular(path, limit, deadline):
              remaining(deadline)
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode) or before.st_size > limit:
                      raise ValueError("Snapshot input invalid or exceeds cap")
                  raw = bytearray()
                  while len(raw) < before.st_size:
                      remaining(deadline)
                      chunk = os.read(descriptor, min(65536, before.st_size - len(raw)))
                      if not chunk:
                          raise ValueError("Snapshot input shortened")
                      raw.extend(chunk)
                  after = os.fstat(descriptor)
                  if (after.st_size, after.st_mtime_ns) != (before.st_size, before.st_mtime_ns):
                      raise ValueError("Snapshot input changed")
                  remaining(deadline)
                  return bytes(raw)
              finally:
                  os.close(descriptor)

          def freeze_runtime(control, request, directory, validation):
              root, deadline = control.OUT, request["deadline"]
              paths = sorted(path for path in control.bounded_paths(root, recursive=False)
                             if path.name.startswith("events.") and path.suffix == ".jsonl")
              events, available = [], 32 * 1024 * 1024
              for path in paths:
                  raw = read_regular(path, min(available, 4 * 1024 * 1024 + 65536), deadline)
                  available -= len(raw)
                  events.append(raw)
              runtime = root / "runtime"
              fatal_path = runtime / "fatal-diagnostic.json"
              fatal = read_regular(fatal_path, LIMIT, deadline) if fatal_path.exists() else None
              payloads = {"validation.log": validation, "events.jsonl": b"\n".join(events),
                  "runtime.json": read_regular(runtime / "result.json", LIMIT, deadline),
                  "console.log": read_regular(runtime / "console.log", 8 * 1024 * 1024 + 512, deadline)}
              if fatal is not None:
                  payloads["fatal.json"] = fatal
              files = {}
              for name, raw in payloads.items():
                  remaining(deadline)
                  if (directory / name).write_bytes(raw) != len(raw):
                      raise OSError("Snapshot short write")
                  files[name] = dict(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest())
              snapshot = dict(schema="hss-runtime-snapshot-v1", identity=request["identity"],
                              fatal=fatal is not None, files=files)
              control.publish(directory / "snapshot.json", snapshot)
              return snapshot

          def runtime_snapshot(collection):
              directory = Path(collection["control"])
              snapshot = bounded_json(directory / "snapshot.json")
              if (snapshot.get("schema") != "hss-runtime-snapshot-v1" or
                      snapshot.get("identity") != collection["identity"] or
                      snapshot != collection["worker"]["snapshot"] or
                      type(snapshot.get("fatal")) is not bool):
                  raise ValueError("Invalid runtime snapshot identity")
              caps = {"validation.log": 96 * 1024 * 1024, "events.jsonl": 33 * 1024 * 1024,
                      "runtime.json": LIMIT, "console.log": 8 * 1024 * 1024 + 512}
              if snapshot["fatal"]:
                  caps["fatal.json"] = LIMIT
              if set(snapshot["files"]) != set(caps):
                  raise ValueError("Invalid runtime snapshot inventory")
              payloads = {}
              for name, cap in caps.items():
