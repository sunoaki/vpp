              def test_diagnostic_disk_full_is_incomplete(self):
                  records = []
                  real_write = os.write
                  for fault in ("short_write", "enospc"):
                      path = ROOT / (fault + ".bin")
                      descriptor = os.open(path, os.O_CREAT | os.O_RDWR, 0o600)
                      stream = diagnostics.Stream(descriptor, 128)
                      calls = 0
                      def write(fd, raw):
                          nonlocal calls
                          if fd != descriptor:
                              return real_write(fd, raw)
                          calls += 1
                          if calls == 1:
                              return real_write(fd, raw[:3])
                          raise OSError(errno.ENOSPC, "finite disk-full adapter")
                      with patch.object(diagnostics.os, "write", write):
                          if fault == "enospc":
                              self.assertTrue(stream.write(b"abc"))
                          self.assertFalse(stream.write(b"abcdefgh"))
                      record = stream.freeze()
                      self.assertEqual(path.read_bytes(), b"abc")
                      self.assertEqual(record["bytes"], 3)
                      self.assertEqual(record["sha256"], hashlib.sha256(b"abc").hexdigest())
                      self.assertEqual(record["error"], "short_write" if fault == "short_write" else "write_error")
                      self.assertFalse(record["truncated"])
                      records.append(record)
                  for stage in ("pending_short", "pending_enospc", "rename"):
                      result = slot_case(stage)
                      self.assertFalse(result["complete"])
                      self.assertTrue(result["pending_exists"])
                      self.assertFalse(result["record_exists"])
                      self.assertGreater(result["bytes"], 0)
                      records.append(result)
                  for stage in ("index", "copy", "collection"):
                      result = collection_case(stage)
                      self.assertFalse(result["complete"])
                      self.assertTrue(result["ready"])
                      self.assertEqual(result["rc"], 1)
                      self.assertIn("OSError", result["worker"]["error"])
                      retained = result["fault_receipt"]["retained"]
                      self.assertEqual(retained["bytes"], 7)
                      self.assertEqual(len(retained["sha256"]), 64)
                      self.assertTrue(result["outer_children_empty"])
                      records.append(result)
                  OBSERVATIONS[self._testMethodName] = records

              def test_collector_blocked_is_bounded(self):
                  records = []
                  for stage in ("scandir", "open", "read", "write", "ignore"):
                      result = collection_case(stage)
                      self.assertFalse(result["complete"])
                      self.assertTrue(result["cleanup_complete"])
                      self.assertLess(result["elapsed"], 7)
                      self.assertTrue(result["ready"])
                      self.assertEqual(result["status"], "collector_timeout")
                      self.assertEqual(result["fault_receipt"]["pid"], result["pid"])
                      self.assertTrue(result["outer_children_empty"])
                      self.assertIn(result["rc"], (-signal.SIGTERM, -signal.SIGKILL))
                      if stage == "ignore":
                          self.assertEqual(result["rc"], -signal.SIGKILL)
                      records.append(result)
                  measured = records[0]
                  request = hss_collection.bounded_json(Path(measured["control"]) / "request.json")
                  worker = dict(schema=hss_collection.SCHEMA, identity=request["identity"],
                      deadline=request["deadline"], module_sha256=request["module_sha256"],
                      pid=measured["pid"], complete=True, entries=1, bytes=16,
                      index=dict(path=str(Path(request["destination"]) / "evidence-index.json"),
                                 bytes=2, sha256=hashlib.sha256(b"{}").hexdigest()))
                  validate = hss_collection.receipt_complete
                  self.assertTrue(validate(request, worker, measured["pid"], "completed", 0, True))
                  negatives = {}
                  for field, value in (("pid", measured["pid"] + 1), ("identity", "foreign"),
                                       ("module_sha256", "foreign"), ("deadline", request["deadline"] + 1)):
                      with self.assertRaises(ValueError):
                          validate(request, dict(worker, **{field: value}), measured["pid"], "completed", 0, True)
                      negatives[field] = "rejected"
                  for name, status, rc, cleanup in (
                          ("forged_timeout", measured["status"], measured["rc"], measured["cleanup_complete"]),
                          ("nonzero_exit", "completed", 1, True),
                          ("cleanup_failed", "completed", 0, False),
                          ("cleanup_unknown", "completed", 0, None)):
                      self.assertFalse(validate(request, worker, measured["pid"], status, rc, cleanup))
                      negatives[name] = "incomplete"
                  self.assertFalse(validate(request, dict(worker, error="partial"),
                                            measured["pid"], "completed", 0, True))
                  negatives["worker_error"] = "incomplete"
                  with self.assertRaises(ValueError):
                      validate(request, dict(worker, index=dict(worker["index"], path="foreign")),
                               measured["pid"], "completed", 0, True)
                  negatives["index_path"] = "rejected"
                  OBSERVATIONS[self._testMethodName] = dict(cases=records, receipt_negatives=negatives)

          def slot_case(stage):
              directory = ROOT / stage
              directory.mkdir()
              descriptor = diagnostics.directory(str(directory))
              pending = os.open("record.pending", os.O_CREAT | os.O_RDWR, 0o600, dir_fd=descriptor)
              owner = types.SimpleNamespace(identity={}, provenance={})
              slot = diagnostics.Slot(owner, stage, types.SimpleNamespace(pid=os.getpid(), poll=lambda: None),
                                      descriptor, pending)
              slot.allocated = True
              real_write, real_rename = os.write, os.rename
              def write(fd, raw):
                  if fd != pending:
                      return real_write(fd, raw)
                  count = real_write(fd, raw[:7])
                  if stage == "pending_enospc":
                      raise OSError(errno.ENOSPC, "pending prefix written")
                  return count
              def rename(source, destination, **kwargs):
                  require(source == "record.pending" and destination == "record.json", "Wrong rename seam")
                  raise OSError(errno.ENOSPC, "pending rename denied")
              try:
                  with patch.object(os, "write", real_write if stage == "rename" else write), \
                          patch.object(os, "rename", rename if stage == "rename" else real_rename):
                      slot.finish()
              finally:
                  slot.close()
              raw = (directory / "record.pending").read_bytes()
              return dict(stage=stage, complete=False, pending_exists=(directory / "record.pending").exists(),
                  record_exists=(directory / "record.json").exists(), bytes=len(raw),
                  sha256=hashlib.sha256(raw).hexdigest(), expected_fault=stage)

          def collection_case(stage):
              directory = ROOT / ("collect-" + stage + os.urandom(4).hex())
              directory.mkdir()
              target = Path(tempfile.mkdtemp(prefix="collector-", dir=FAULTS))
              (target / "prefix.log").write_bytes(b"retained prefix\n")
              ready = directory / "ready"
              real_spawn = subprocess.Popen
              def spawn(args, **kwargs):
                  return real_spawn([sys.executable, __file__, "collector", args[-1], stage, str(ready)], **kwargs)
              mode = "runtime" if stage in ("copy", "collection") else "fixture"
              measured = hss_collection.supervise(control, dict(mode=mode, root=str(target),
                  destination=str(target)), seconds=2, adapter=spawn)
              measured["ready"] = ready.exists()
              measured["fault_receipt"] = hss_collection.bounded_json(ready) if ready.exists() else None
              measured["retained_prefix"] = dict(path=str(target / "prefix.log"), bytes=16,
                  sha256=hashlib.sha256(b"retained prefix\n").hexdigest(), verified_by="pre-fault real write")
              measured["outer_children_empty"] = not control.children()
              measured["expected_fault"] = stage
              return measured

          def collector_probe(request_path, stage, ready):
              request = hss_collection.bounded_json(request_path)
              root = Path(request["destination"])
              real_scandir, real_open, real_read, real_write = os.scandir, os.open, os.read, os.write
              real_bytes, real_text = Path.write_bytes, Path.write_text
              descriptors = set()
              if stage in ("copy", "collection"):
                  source = root / "input"
                  source.mkdir()
                  (source / "source.log").write_bytes(b"source prefix\n")
                  control.runtime_roots = lambda: [source]
              def fault(prefix=None):
                  receipt = dict(stage=stage, pid=os.getpid(), retained=None)
                  if prefix is not None:
                      raw = prefix.read_bytes()
                      receipt["retained"] = dict(path=str(prefix), bytes=len(raw),
                          sha256=hashlib.sha256(raw).hexdigest())
                  real_text(Path(ready), json.dumps(receipt))
                  if stage in ("index", "copy", "collection"):
                      raise OSError(errno.ENOSPC, "collector finite fault " + stage)
                  if stage == "ignore":
                      signal.signal(signal.SIGTERM, signal.SIG_IGN)
                  while True:
                      time.sleep(.05)
              def scandir(path):
                  if stage in ("scandir", "ignore") and Path(path) == root:
                      fault()
                  return real_scandir(path)
              def opened(path, flags, *args, **kwargs):
                  if stage == "open" and str(path).startswith(str(root)):
                      fault()
                  fd = real_open(path, flags, *args, **kwargs)
                  if str(path).startswith(str(root)):
                      descriptors.add(fd)
                  return fd
              def read(fd, length):
                  if stage == "read" and fd in descriptors:
                      fault()
                  return real_read(fd, length)
              def write(fd, raw):
                  if fd in descriptors and stage == "write":
                      fault()
                  if fd in descriptors and stage == "index":
                      real_write(fd, raw[:7])
                      fault(root / "evidence-index.pending")
                  return real_write(fd, raw)
              def write_bytes(path, raw):
                  if stage == "copy" and path.parent == root and path.name == "0000.log":
                      real_bytes(path, raw[:7])
                      fault(path)
                  return real_bytes(path, raw)
              def write_text(path, text, *args, **kwargs):
                  if stage == "collection" and path == root / "collection.json":
                      real_text(path, text[:7], *args, **kwargs)
                      fault(path)
                  return real_text(path, text, *args, **kwargs)
              with patch.object(os, "scandir", scandir), patch.object(os, "open", opened), \
                      patch.object(os, "read", read), patch.object(os, "write", write), \
                      patch.object(Path, "write_bytes", write_bytes), patch.object(Path, "write_text", write_text):
                  result = hss_collection.worker(request)
              return 0 if result["complete"] else 1

          def supervise_contract():
              ROOT.mkdir(mode=0o700, exist_ok=True)
              libc = ctypes.CDLL(None, use_errno=True)
              require(libc.prctl(36, 1, 0, 0, 0) == 0, "Diagnostic watchdog subreaper unavailable")
              start = time.monotonic()
              process = subprocess.Popen([sys.executable, __file__, "suite"], stdout=subprocess.PIPE,
                                         stderr=subprocess.STDOUT)
              with (ROOT / "suite-console.log").open("w+b") as stream:
                  _, timed_out = control.capture(process, start + 300, stream)
              cleanup = control.cleanup(process, 2)
