                  bytes=consumed, errors=errors, scope="snapshot before upload worker terminal receipt; inventory itself is the only unlisted upload file")

          def walk(roots, check, excluded):
              visited = 0
              for label, root in roots.items():
                  pending = [(root, label)]
                  while pending:
                      check()
                      directory, prefix = pending.pop()
                      info = directory.lstat()
                      if not stat.S_ISDIR(info.st_mode):
                          raise ValueError("Upload source directory replaced")
                      with os.scandir(directory) as entries:
                          for entry in entries:
                              check()
                              visited += 1
                              if visited > 4000:
                                  raise ValueError("Upload traversal entry cap")
                              name = relative(prefix + "/" + entry.name)
                              info = entry.stat(follow_symlinks=False)
                              kind = file_type(info.st_mode)
                              yield name, kind, info.st_size
                              if kind == "directory" and name not in excluded:
                                  pending.append((Path(entry.path), name))

          def upload_worker(request, directory):
              import control
              roots = {"evidence": Path(request["root"]), "control": Path(os.environ["HSS_CONTROL"])}
              destination = Path(request["destination"])
              destination.mkdir(mode=0o700)
              check = lambda: collection.remaining(request["deadline"])
              consumed = 0
              def read(path, cap):
                  nonlocal consumed
                  raw = collection.read_regular(path, min(cap, CAP - consumed), request["deadline"])
                  consumed += len(raw)
                  return raw
              expected, setup_errors = {}, []
              required = {"evidence/evidence-index.json", "control/phase-status.json", "control/final-collection.json"}
              try:
                  raw = read(roots["evidence"] / "evidence-index.json", 2 * 1024 * 1024)
                  expected["evidence/evidence-index.json"] = fingerprint(raw)
                  index = json.loads(raw)
                  for name, receipt in index.items():
                      expected["evidence/" + relative(name)] = receipt
                  summary = json.loads(read(roots["control"] / "phase-status.json", collection.LIMIT))
                  for name, receipt in summary["bindings"].items():
                      expected["control/" + relative(name)] = receipt
                  required.update(expected)
              except (OSError, ValueError, KeyError, TypeError, AttributeError) as error:
                  setup_errors.append(f"Required inventory: {type(error).__name__}: {error}"[:512])
              def copy(name, size):
                  label, suffix = name.split("/", 1)
                  raw = read(roots[label] / suffix, size)
                  if len(raw) != size:
                      raise ValueError("Upload source changed size")
                  target = destination / name
                  target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  pending = directory / "copy.pending"
                  fd = os.open(pending, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  try:
                      if os.write(fd, raw) != size:
                          raise OSError("Upload copy short write")
                  finally:
                      os.close(fd)
                  check()
                  if fingerprint(read(pending, size)) != fingerprint(raw):
                      raise ValueError("Upload copy hash mismatch")
                  if name in expected and fingerprint(raw) != expected[name]:
                      raise ValueError("Required evidence hash mismatch: " + name)
                  os.replace(pending, target)
                  return fingerprint(raw)
              if os.environ.get("GITHUB_JOB") == "diagnostic":
                  try:
                      expected.update(diagnostic_requirements(lambda name, cap: read(roots["control"] / relative(name), cap)))
                      required.update(expected)
                  except (OSError, ValueError, KeyError, TypeError, IndexError, AttributeError) as error:
                      setup_errors.append(f"Required diagnostic evidence: {type(error).__name__}: {error}"[:512])
              excluded = {"control/" + request["identity"]}
              manifest = inventory(walk(roots, check, excluded), required, copy, check)
              for row in manifest["entries"]:
                  if row["path"] in excluded:
                      row["reason"] = "excluded-inflight-upload-control-subtree"
              manifest["errors"].extend(setup_errors)
              manifest["complete"] = not manifest["errors"]
              manifest["actual_read_bytes"] = consumed
              manifest["identity"] = request["identity"]
              manifest["deadline"] = request["deadline"]
              manifest["source_roots"] = {name: str(root) for name, root in roots.items()}
              raw = encoded(manifest)
              if len(raw) > 2 * 1024 * 1024:
                  raise ValueError("Upload inventory metadata cap")
              target = destination / "evidence-index.json"
              if target.write_bytes(raw) != len(raw):
                  raise OSError("Upload inventory short write")
              if collection.read_regular(target, len(raw), request["deadline"]) != raw:
                  raise ValueError("Upload inventory publication mismatch")
              control.publish(directory / "upload-inventory.json", manifest)
              if manifest["complete"]:
                  control.publish(directory / "upload-ready.json", dict(identity=request["identity"],
                      inventory=fingerprint(raw), path=str(target)))
              return dict(complete=manifest["complete"], entries=len(manifest["entries"]), bytes=manifest["bytes"],
                  index=dict(path=str(target), **fingerprint(raw)),
                  **({"error": str(manifest["errors"])[:512]} if manifest["errors"] else {}))

          def upload_complete(load, result, healthy, destination):
              identity = result["identity"]
              if (not isinstance(identity, str) or len(identity) != 32 or
                      any(char not in "0123456789abcdef" for char in identity)):
                  raise ValueError("Invalid upload collector identity")
              request = json.loads(load(f"{identity}/request.json", collection.LIMIT))
              recorded = json.loads(load(f"{identity}/result.json", collection.LIMIT))
              worker = json.loads(load(f"{identity}/worker.json", collection.LIMIT))
              if (not isinstance(request, dict) or not isinstance(recorded, dict) or
                      not isinstance(worker, dict) or request.get("schema") != collection.SCHEMA or
                      result.get("schema") != collection.SCHEMA or request.get("identity") != identity or
                      request.get("mode") != "upload" or request.get("control") != str(healthy / identity) or
                      result.get("control") != request["control"] or request.get("destination") != str(destination) or
                      type(request.get("deadline")) not in (int, float) or not 0 < request["deadline"] < float("inf") or
                      not isinstance(request.get("module_sha256"), str) or len(request["module_sha256"]) != 64 or
                      any(char not in "0123456789abcdef" for char in request["module_sha256"]) or
                      type(result.get("entries")) is not int or type(result.get("bytes")) is not int or
                      type(result.get("pid")) is not int or result["pid"] <= 0 or recorded != result or
                      result.get("worker") != worker or result.get("complete") is not True or
                      "error" in result or "cleanup_error" in result or
                      not collection.receipt_complete(request, worker, result["pid"], result["status"],
                          result["rc"], result["cleanup_complete"]) or
                      result.get("index") != worker["index"] or result.get("entries") != worker["entries"] or
                      result.get("bytes") != worker["bytes"]):
                  raise ValueError("Incomplete or foreign upload collector receipt")
              raw = load(f"{identity}/upload-inventory.json", 2 * 1024 * 1024)
              manifest = json.loads(raw)
              ready = json.loads(load(f"{identity}/upload-ready.json", collection.LIMIT))
              receipt = dict(path=str(destination / "evidence-index.json"), **fingerprint(raw))
              if (not isinstance(manifest, dict) or not isinstance(ready, dict) or
                      manifest.get("schema") != "hss-upload-inventory-v1" or manifest.get("identity") != identity or
                      manifest.get("deadline") != request["deadline"] or manifest.get("complete") is not True or
                      manifest.get("errors") != [] or not isinstance(manifest.get("entries"), list) or
                      manifest.get("source_roots") != dict(evidence=request["root"], control=str(healthy)) or
                      type(manifest.get("bytes")) is not int or not 0 <= manifest["bytes"] <= CAP or
                      type(manifest.get("actual_read_bytes")) is not int or not 0 <= manifest["actual_read_bytes"] <= CAP or
                      len(manifest["entries"]) != result["entries"] or manifest["bytes"] != result["bytes"] or
                      result["index"] != receipt or ready != dict(identity=identity,
                          inventory=fingerprint(raw), path=receipt["path"])):
                  raise ValueError("Incomplete or contradictory upload manifest/ready receipt")
              seen, included, copied, path_bytes = set(), set(), 0, 0
              for row in manifest["entries"]:
                  if not isinstance(row, dict):
                      raise ValueError("Malformed upload inventory entry")
                  name = relative(row["path"])
                  path_bytes += len(name.encode())
                  if name in seen or path_bytes > 256 * 1024 or type(row.get("included")) is not bool:
                      raise ValueError("Duplicate or oversized upload inventory")
                  seen.add(name)
                  if row["included"]:
                      if (row.get("type") != "regular" or row.get("reason") != "included-verified-regular" or
                              type(row.get("bytes")) is not int or row["bytes"] < 0 or
                              not isinstance(row.get("sha256"), str) or len(row["sha256"]) != 64 or
                              any(char not in "0123456789abcdef" for char in row["sha256"])):
                          raise ValueError("Invalid included upload evidence")
                      included.add(name)
                      copied += row["bytes"]
                  elif (row.get("type"), row.get("reason")) not in {
                          ("directory", "excluded-directory-metadata-only"),
                          ("directory", "excluded-inflight-upload-control-subtree"),
                          *((kind, "excluded-special-object") for kind in
                              ("socket", "symlink", "fifo", "character", "block", "unsupported"))}:
                      raise ValueError("Incomplete or invalid excluded upload entry")
