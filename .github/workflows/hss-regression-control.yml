                      require(not owner_path.is_symlink() and owner_path.stat().st_size <= 1024 * 1024,
                              "Invalid ownership file")
                      owner_raw = owner_path.read_bytes()
                      owner = evidence_schema.ownership(owner_raw)
                      require(owner["result"] == str(path.relative_to(OUT)), "Ownership result path mismatch")
                  except (ValueError, UnicodeDecodeError, OSError, AssertionError) as error:
                      save(str(owner_path.parent.relative_to(OUT) / "invalid-ownership.json"),
                           evidence_schema.invalid(owner_path.relative_to(OUT), owner_raw, error))
                      continue
                  reference = dict(identity=parent["identity"], result=str(parent_path.relative_to(OUT)))
                  if reference not in owner["parents"]:
                      continue
                  try:
                      temporary = []
                      for item in owner_path.parent.glob(".result.json.*.tmp"):
                          require(len(temporary) < 10 and not item.is_symlink() and item.stat().st_size <= 1024 * 1024,
                                  f"Invalid temporary result evidence: {item.relative_to(OUT)}")
                          temporary.append(dict(path=str(item.relative_to(OUT)), sha256=digest(item)))
                      save(str(sidecar.relative_to(OUT)), dict(status="interrupted_before_result", rc=None,
                           cleanup_complete=None, spawn=None, observed_at=time.time(), parent=reference["result"],
                           parent_identity=reference["identity"], ownership=str(owner_path.relative_to(OUT)),
                           ownership_sha256=hashlib.sha256(owner_raw).hexdigest(), raw_result=None, raw_sha256=None,
                           temporary=temporary, reason="No published result; child spawn, exit and local cleanup unknown"))
                  except (ValueError, UnicodeDecodeError, OSError, AssertionError) as error:
                      save(str(owner_path.parent.relative_to(OUT) / "invalid-ownership.json"),
                           evidence_schema.invalid(owner_path.relative_to(OUT), owner_raw, error))
              for path in OUT.glob("*/result.json"):
                  if path.with_name("interruption.json").exists():
                      continue
                  count += 1
                  require(count <= 1000, "Too many command records")
                  require(not path.is_symlink() and path.stat().st_size <= 1024 * 1024,
                          "Invalid command record")
                  raw = path.read_bytes()
                  try:
                      child = evidence_schema.record(raw, command=True)
                  except (ValueError, UnicodeDecodeError) as error:
                      save(str(path.parent.relative_to(OUT) / "invalid-result.json"),
                           evidence_schema.invalid(path.relative_to(OUT), raw, error))
                      continue
                  if parent["identity"] not in child["ancestors"] or child["status"] != "running":
                      continue
                  save(str(path.parent.relative_to(OUT) / "interruption.json"), dict(
                      status="interrupted_by_parent", rc=None, cleanup_complete=None,
                      observed_at=time.time(), parent=str(parent_path.relative_to(OUT)),
                      parent_identity=parent["identity"], raw_sha256=hashlib.sha256(raw).hexdigest(),
                      reason="Child exit status and local cleanup unknown; see parent cleanup result"))

          def dependency_checkpoint(label, normalize=False, clean=False):
              from contextlib import ExitStack
              paths = ("test/requirements.txt", "test/requirements-3.txt")
              report = dict(status="running", candidate_sha=CANDIDATE, variant=VARIANT,
                            workflow_sha=os.environ["WORKFLOW_SHA"], before={}, after={})
              def snapshot(descriptor):
                  info = os.fstat(descriptor)
                  require(stat.S_ISREG(info.st_mode) and info.st_size <= 256 * 1024,
                          "Dependency is nonregular or exceeds 256 KiB")
                  os.lseek(descriptor, 0, os.SEEK_SET)
                  raw = os.read(descriptor, 256 * 1024 + 1)
                  require(len(raw) == info.st_size, "Dependency size changed while reading")
                  return dict(sha256=hashlib.sha256(raw).hexdigest(), bytes=len(raw),
                              mtime_ns=info.st_mtime_ns, atime_ns=info.st_atime_ns,
                              device=info.st_dev, inode=info.st_ino)
              try:
                  manifest = json.loads((OUT / "manifest.json").read_text())
                  expected = manifest["python_dependencies"]
                  require(set(expected) == set(paths), "Dependency provenance paths changed")
                  report["expected"] = expected
                  with ExitStack() as stack:
                      descriptors = {}
                      for path in paths:
                          descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                          stack.callback(os.close, descriptor)
                          descriptors[path] = descriptor
                          report["before"][path] = snapshot(descriptor)
                      for path in paths:
                          require(expected[path]["blob"] == git("rev-parse", f"{CANDIDATE}:{path}") and
                                  expected[path]["sha256"] == hashlib.sha256(content(CANDIDATE, path)).hexdigest(),
                                  f"Dependency provenance changed: {path}")
                          require(report["before"][path]["sha256"] == expected[path]["sha256"],
                                  f"Pinned dependency changed: {path}")
                      if clean:
                          require(not git("status", "--porcelain", "-uno"), "Tracked source changed at dependency checkpoint")
                      for path in paths:
                          info = os.stat(path, follow_symlinks=False)
                          before = report["before"][path]
                          require(stat.S_ISREG(info.st_mode) and
                                  (info.st_dev, info.st_ino) == (before["device"], before["inode"]),
                                  f"Dependency path changed: {path}")
                      if normalize:
                          source, lock = (report["before"][path] for path in paths)
                          target = max(source["mtime_ns"], lock["mtime_ns"])
                          report["target_mtime_ns"] = target
                          os.utime(descriptors[paths[1]], ns=(lock["atime_ns"], target))
                      for path in paths:
                          report["after"][path] = snapshot(descriptors[path])
                          require(report["after"][path]["sha256"] == expected[path]["sha256"],
                                  f"Pinned dependency changed during checkpoint: {path}")
                      if normalize:
                          require(report["after"][paths[1]]["mtime_ns"] == target and
                                  report["after"][paths[0]]["mtime_ns"] == source["mtime_ns"],
                                  "Dependency timestamp normalization lost precision or input changed")
                      if clean:
                          require(not git("status", "--porcelain", "-uno"), "Tracked source changed during dependency checkpoint")
                  report["status"] = "PASS"
              except (OSError, ValueError, KeyError, TypeError, AssertionError, subprocess.SubprocessError) as error:
                  report.update(status="FAIL", error=f"{type(error).__name__}: {error}"[:512])
                  raise
              finally:
                  save(f"dependency-{label}.json", report)

          def source_identity():
              require(git("rev-list", "--parents", "-n", "1", CANDIDATE).split() ==
                      [CANDIDATE, "b230ba5d6bd0ef362fd8c9d80e8a1a95a367c111"],
                      "Candidate must have exactly the frozen worker ACCEPTED parent")
              require(git("rev-parse", f"{CANDIDATE}^{{tree}}") == os.environ["CANDIDATE_TREE"],
                      "Candidate tree differs from frozen worker ACCEPTED source")
              require(git("rev-list", "--parents", "-n", "1", CONTROL).split() == [CONTROL, CANDIDATE] and
                      git("rev-parse", f"{CONTROL}^{{tree}}") == os.environ["CONTROL_TREE"] and
                      git("diff", "--name-only", CANDIDATE, CONTROL).splitlines() ==
                      ["src/plugins/http_static/static_server.c"], "Omitted-release control identity differs")
              for path, blob in TEST_BLOBS.items():
                  require(git("rev-parse", f"{CANDIDATE}:{path}") == blob and
                          git("rev-parse", f"{CONTROL}:{path}") == blob, "Frozen identical test blob differs: " + path)
              for path, blob in CORE_BLOBS.items():
                  require(git("rev-parse", f"{CANDIDATE}:{path}") == blob and
                          git("rev-parse", f"{CONTROL}:{path}") == blob, "Frozen ACCEPTED core blob differs: " + path)
              def inventory(ref):
                  return [(cls.name, node.name) for cls in ast.parse(content(ref, FIXTURE)).body
                          if isinstance(cls, ast.ClassDef) for node in cls.body
                          if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")]
              baseline = inventory("b230ba5d6bd0ef362fd8c9d80e8a1a95a367c111")
              require(len(baseline) == 33 and inventory(CANDIDATE) == baseline +
                      [("TestAcceptedWitness", name) for name in ACCEPTED_FIXTURES],
                      "Frozen thirty-nine fixture names differ from original thirty-three plus ACCEPTED six")
              require(content(CANDIDATE, HTTP_TEST) == content(CHECK_BASE, HTTP_TEST),
                      "HTTP name regression differs from integrated master")
              sources = {name: ast.parse(content(CANDIDATE, path)) for name, path in
                         (("test_http_static", TEST), ("vpp_papi_provider", "test/vpp_papi_provider.py"))}
              setup_lines = {}
              for cls in sources["test_http_static"].body:
                  if isinstance(cls, ast.ClassDef) and cls.name in ("TestHttpStaticVapi", "TestHttpStaticCli"):
                      method = next(node for node in cls.body if isinstance(node, ast.FunctionDef) and node.name == "setUpClass")
                      calls = [node.lineno for node in ast.walk(method) if isinstance(node, ast.Call) and
                               isinstance(node.func, ast.Attribute) and node.func.attr == "cli" and node.args and
                               isinstance(node.args[0], ast.JoinedStr) and any(isinstance(part, ast.Constant) and
                               part.value == "create host-interface name " for part in node.args[0].values)]
                      require(len(calls) == 1, "Ambiguous diagnostic setup call")
                      setup_lines[cls.name] = calls[0]
              require(setup_lines == {"TestHttpStaticVapi": 58, "TestHttpStaticCli": 199},
                      "Diagnostic observer setup source identity differs")
              provider = next(node for node in sources["vpp_papi_provider"].body if
                              isinstance(node, ast.ClassDef) and node.name == "VppPapiProvider")
              method = next(node for node in provider.body if isinstance(node, ast.FunctionDef) and node.name == "cli")
              calls = [node.lineno for node in ast.walk(method) if isinstance(node, ast.Call) and
                       isinstance(node.func, ast.Attribute) and node.func.attr == "cli_return_response"]
              require(calls == [480], "Diagnostic observer provider call identity differs")

          def prepare():
              workflow = os.environ["WORKFLOW_SHA"]
              initial = json.loads((OUT / "manifest.json").read_text())
              initial["status"] = "preparing"
              save("manifest.json", initial)
              source_identity()
              planned = (OUT / "planned-phases.txt").read_text().splitlines()
              commits = git("rev-list", "--reverse", "--no-merges", f"{CHECK_BASE}..{CANDIDATE}").splitlines()
              require([name for name in planned if name.startswith(("style-", "api-", "message-"))] ==
                      [f"{kind}-{commit}" for commit in commits for kind in ("style", "api", "message")],
                      "Planned commit checks differ from immutable history")
              manifest = dict(workflow_sha=workflow, candidate_sha=CANDIDATE, check_base_sha=CHECK_BASE, frozen_sha=FROZEN,
                              workflow_blob=git("rev-parse", f"{workflow}:.github/workflows/hss-regression-control.yml"),
                              candidate_tree=git("rev-parse", f"{CANDIDATE}^{{tree}}"), variant=VARIANT,
                              control_sha=CONTROL, control_tree=os.environ["CONTROL_TREE"],
                              async_scope="worker1 real HTTP ASYNC release/cancel; multi-event ACCEPTED/destroy and ACK/reset/heap remain open",
                              run_id=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                              artifact=f"hss-{VARIANT}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
                              run_url=f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                              limits="8 MiB console/command; 4 MiB observer/process; diagnostics 32 MiB/300 files",
                              uncovered_negative_controls=["premature listener/cache release/reuse", "omitted cleanup/ack",
                                                           "deferred-only reset before pointer free", "ctx/cert heap release",
                                                           "genuine pending HTTP scheduling", "worker pending queue/destroy",
                                                           "synthetic callback rejection/parent branch safety"],
                              synthetic_scope="two debug test successes; main-queue synthetic identity only, including worker1 class",
                              ipv6_http3_scope="control-plane identity and QUIC listener/ALPN; no IPv6 request or HTTP3 transfer")
              manifest["tests"] = {path: dict(blob=git("rev-parse", f"{CANDIDATE}:{path}"),
                                             sha256=hashlib.sha256(content(CANDIDATE, path)).hexdigest())
                                   for path in TEST_BLOBS}
              manifest["accepted_sources"] = {path: dict(blob=blob,
                      sha256=hashlib.sha256(content(CANDIDATE, path)).hexdigest()) for path, blob in CORE_BLOBS.items()}
              manifest["accepted_scope"] = "one real worker1 HTTP ACCEPTED at consumer head; token201 old/new URI reuse"
              manifest["accepted_fields"] = ACCEPTED_FIELDS
              manifest["python_dependencies"] = {path: dict(blob=git("rev-parse", f"{CANDIDATE}:{path}"),
                      sha256=hashlib.sha256(content(CANDIDATE, path)).hexdigest()) for path in
                      ("test/requirements.txt", "test/requirements-3.txt")}
              manifest["source"] = dict(path=SOURCE, candidate_blob=git("rev-parse", f"{CANDIDATE}:{SOURCE}"),
                                        frozen_blob=git("rev-parse", f"{FROZEN}:{SOURCE}"))
              manifest["http_name_sources"] = {path: dict(blob=git("rev-parse", f"{CANDIDATE}:{path}"),
                      sha256=hashlib.sha256(content(CANDIDATE, path)).hexdigest()) for path in
                      ("src/plugins/http/http.c", "src/plugins/http/http_private.h", "src/plugins/http/test/http_test.c")}
              manifest["diagnostic_sources"] = {path: dict(blob=git("rev-parse", f"{CANDIDATE}:{path}"),
                      sha256=hashlib.sha256(content(CANDIDATE, path)).hexdigest()) for path in
                      ("test/asf/asfframework.py", "test/vpp_papi_provider.py", TEST)}
              require(content(CANDIDATE, "test/asfframework.py") == b"asf/asfframework.py",
                      "Unexpected framework alias")
              manifest["live_diagnostic_limits"] = "3 identities; 15 files including pending; 18 MiB + 48 KiB; 2 s/query"
              manifest["tools"] = {path.name: digest(path) for path in TOOLS.glob("*.py")}
              manifest["work_deadline"] = float(os.environ["WORK_DEADLINE"])
              manifest["upload_limit"] = "External runner termination can prevent upload; own work stops before reserved collection/upload budget."
              save("manifest.json", manifest)
              require(git("rev-parse", "HEAD") == workflow, "Workflow SHA mismatch")
              subprocess.run(["git", "checkout", "--detach", CANDIDATE], check=True, timeout=60)
              require(not git("status", "--porcelain"), "Candidate tree is dirty")
              for path in ("build-root/build-vpp_debug-native", "build-root/install-vpp_debug-native", "build-root/test/venv"):
                  require(not Path(path).exists(), f"Not an independent clean build: {path}")
              manifest["tests"] = {path: dict(blob=git("rev-parse", f"{CANDIDATE}:{path}"), sha256=digest(path))
                                   for path in TEST_BLOBS}
              save("manifest.json", manifest)

          def mutate():
              require(git("rev-parse", "HEAD") == CANDIDATE, "Candidate HEAD moved")
              require(not git("diff", "--name-only"), "Tracked source changed before mutation")
              original = Path(SOURCE).read_bytes()
              if VARIANT == "async-omit-release":
                  require(git("rev-parse", f"{CANDIDATE}:{SOURCE}") == "886d83b7fbb2e7f34dee0e3771eaeaed07dea264" and
                          git("rev-parse", f"{CONTROL}:{SOURCE}") == "735a35989c74fd8ae241d8133ca6c6b8389aea32",
                          "Omitted-release source blobs differ")
                  Path(SOURCE).write_bytes(content(CONTROL, SOURCE))
              elif VARIANT != "fixed":
                  old, new = RECIPES.get(VARIANT, (None, None))
                  # Whitespace comes from immutable source; preserve surrounding bytes exactly.
                  if VARIANT == "api-protocol":
                      expression = re.compile(rb'snprintf \(\(char \*\) rmp->uri, sizeof \(rmp->uri\), "http%s://%s:%d",\n[ \t]+l->flags & HSS_LISTENER_F_NEED_CRYPTO \? "s" : "", addr,')
                      matches = list(expression.finditer(original))
                      require(len(matches) == 1, "Ambiguous URI restoration hunk")
                      old = matches[0].group().decode()
                      indent = old.split("\n")[1].split("l->flags")[0]
                      new = ('snprintf ((char *) rmp->uri, sizeof (rmp->uri), "%s://%s:%d",\n' +
                             indent + 'tp_vfts[l->sep.transport_proto].transport_options.name, addr,')
                  frozen = content(FROZEN, SOURCE).decode()
                  witness = ("tp_vfts[hsm->default_listener.sep.transport_proto].transport_options.name"
                             if VARIANT == "api-protocol" else
                             "rmp->cache_size_limit = htonl (hsm->default_listener.cache.cache_limit);"
                             if VARIANT == "cache-limit" else new)
                  if VARIANT == "read-error-unlock":
                      old = ('      clib_warning ("Error reading \'%s\'", path);\n'
                             '      clib_error_report (error);\n      hss_cache_unlock (hc);\n      return ~0;')
                      new = old.replace("      hss_cache_unlock (hc);\n", "")
                      require(new in frozen and old not in frozen,
                              "Read-error unlock removal lacks frozen-source provenance")
                  else:
                      require(witness in frozen, "Restoration has no frozen-source provenance")
                  require(original.count(old.encode()) == 1, "Ambiguous restoration hunk")
                  Path(SOURCE).write_bytes(original.replace(old.encode(), new.encode(), 1))
              require(git("diff", "--name-only").splitlines() == ([] if VARIANT == "fixed" else [SOURCE]),
                      "Unexpected source mutation")
              manifest = json.loads((OUT / "manifest.json").read_text())
              for path, provenance in manifest["tests"].items():
                  require(digest(path) == provenance["sha256"], f"Candidate test changed: {path}")
              for path, provenance in manifest["accepted_sources"].items():
                  require(git("hash-object", path) == provenance["blob"] and digest(path) == provenance["sha256"],
                          "ACCEPTED core source changed: " + path)
              manifest["source"] = dict(path=SOURCE, candidate_blob=git("rev-parse", f"{CANDIDATE}:{SOURCE}"),
                                        frozen_blob=git("rev-parse", f"{FROZEN}:{SOURCE}"), built_blob=git("hash-object", SOURCE))
              index_env = dict(os.environ, GIT_INDEX_FILE=str(TOOLS / "build-index"))
              subprocess.run(["git", "read-tree", CANDIDATE], env=index_env, check=True, timeout=60)
              subprocess.run(["git", "add", SOURCE], env=index_env, check=True, timeout=60)
              manifest["built_tree"] = subprocess.check_output(["git", "write-tree"], env=index_env, text=True, timeout=60).strip()
              require((manifest["source"]["built_blob"], manifest["built_tree"]) == BUILD_IDENTITIES[VARIANT],
                      "Restored source blob or built tree differs from frozen recipe")
              if VARIANT == "async-omit-release":
                  require(manifest["built_tree"] == os.environ["CONTROL_TREE"], "Control built tree differs from frozen control")
                  manifest["source"]["control_blob"] = git("rev-parse", f"{CONTROL}:{SOURCE}")
              manifest["tools"] = {path.name: digest(path) for path in TOOLS.glob("*.py")}
              save("manifest.json", manifest)
              (OUT / "restoration.diff").write_text(git("diff", "--", SOURCE) + "\n")

          def work_remaining():
              seconds = float(os.environ["WORK_DEADLINE"]) - time.time()
              if seconds <= 0:
                  raise TimeoutError("Absolute work deadline exceeded")
              return seconds

          def bounded_paths(root, recursive=True, limit=4000):
              pending, visited = [Path(root)], 0
              while pending:
                  work_remaining()
                  with os.scandir(pending.pop()) as entries:
                      for entry in entries:
                          work_remaining()
                          visited += 1
                          require(visited <= limit, "Evidence traversal limit exceeded")
                          if entry.is_symlink():
                              continue
                          if recursive and entry.is_dir(follow_symlinks=False):
                              pending.append(Path(entry.path))
                          elif entry.is_file(follow_symlinks=False):
                              yield Path(entry.path)
                          elif not recursive and entry.is_dir(follow_symlinks=False):
                              yield Path(entry.path)

          def runtime_roots():
              return [path for path in bounded_paths("/tmp", recursive=False)
                      if path.name.startswith("vpp-unittest-") and path.is_dir()]

          def read_evidence(paths, limit=32 * 1024 * 1024):
              data, remaining = [], limit
              for path in paths:
                  work_remaining()
                  require(not path.is_symlink(), "Symlink evidence rejected")
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(fd, "rb") as stream:
                      require(stat.S_ISREG(os.fstat(stream.fileno()).st_mode), "Nonregular evidence")
                      raw = stream.read(remaining + 1)
                  require(len(raw) <= remaining, "Evidence input limit exceeded; refusing partial validation")
                  remaining -= len(raw)
                  data.append(raw.decode(errors="replace"))
              work_remaining()
              return "\n".join(data)

          def collect(destination):
              destination.mkdir(parents=True, exist_ok=True)
              report, remaining, count, complete = [], 32 * 1024 * 1024, 0, False
              try:
                  roots = runtime_roots() + [Path("build-root/test-logs")]
                  for root in roots:
                      if root.is_symlink() or not root.is_dir():
                          continue
                      for source in bounded_paths(root):
                          work_remaining()
                          require(count < 300 and remaining > 0, "Diagnostic file/byte cap reached")
                          if source.suffix not in (".txt", ".log", ".pcap", ".pcapng"):
                              continue
                          fd = os.open(source, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                          with os.fdopen(fd, "rb") as reader:
                              info = os.fstat(reader.fileno())
                              if not stat.S_ISREG(info.st_mode):
                                  continue
                              length = min(info.st_size, 2 * 1024 * 1024)
                              require(length <= remaining, "Diagnostic byte cap reached")
                              require(source.suffix not in (".pcap", ".pcapng") or length == info.st_size,
                                      "Packet capture exceeds whole-file limit")
                              reader.seek(info.st_size - length)
                              raw = reader.read(length)
                              require(len(raw) == length, "Diagnostic file changed while reading")
                              (destination / f"{count:04d}{source.suffix}").write_bytes(raw)
                          report.append(f"{source}: {length}/{info.st_size}")
                          remaining -= length
                          count += 1
                  complete = True
              finally:
                  (destination / "collection.json").write_text(json.dumps(dict(
                      complete=complete, files=count, bytes=32 * 1024 * 1024 - remaining,
                      limits="4000 entries/root; 300 files; 32 MiB; 2 MiB/file; text tails",
                      report=report), indent=2) + "\n")

          def expected_ids():
              tree = ast.parse(Path(TEST).read_text())
              methods = {cls.name: [node.name for node in cls.body if isinstance(node, ast.FunctionDef)
                                    and node.name.startswith("test_")]
                         for cls in tree.body if isinstance(cls, ast.ClassDef)}
              regressions = ("test_http_static_listener_delete_reuse", "test_http_static_cached_listener_retirement",
                             "test_http_static_destroy_ownership", "test_http_static_default_get_states",
                             "test_http_static_listener_uri_identity", "test_http_static_listener_ipv6_identity",
                             "test_http_static_listener_http3_identity")
              require(collections.Counter(methods["TestHttpStaticCli"]) == collections.Counter(
                      (*regressions, "test_http_static_cli", "test_http_static_pending_accept_identity",
                       "test_http_static_cache_owners", "test_http_static_cache_read_error",
                       "test_http_static_cache_pressure", "test_http_static_cache_relocation")),
                      "Reviewed thirteen methods or separate synthetic test changed")
              require(methods["TestHttpStaticCliWorker"] == ["test_http_static_worker_accepted_identity",
                      "test_http_static_async_release_cancel"] and
                      methods["TestHttpStaticVapi"] == ["test_http_static_vapi"], "Frozen suite classes changed")
              return [f"test_http_static.{cls}.{method}" for cls in (*CLASSES, "TestHttpStaticVapi")
                      for method in methods["TestHttpStaticCli" if cls in CLASSES else cls]] + [ASYNC_TEST, ACCEPTED_TEST]

          def infrastructure_text(text, events, variant):
              require(not re.search(r"ERROR: (?:AddressSanitizer|ASAN):|AddressSanitizer:DEADLYSIGNAL|"
                                    r"\b[Aa]ssertion [`'][^\n]+['`] (?:failed|fails)\b", text),
                      "Fatal sanitizer/C assertion diagnostic")
              header = "   Count                  Node                              Reason               Severity \n"
              benign = re.compile(r" +[1-9][0-9]* +af-packet-input +timed out block +error +\n")
              row = re.compile(r" +[0-9]+ +[a-zA-Z0-9_-]+ {2,}[a-zA-Z0-9][a-zA-Z0-9 _/-]*? {2,}"
                               r"(?:error|warning|warn|info) +\n")
              replies = {}
              for event in events:
                  if event["kind"] == "cli_reply" and event.get("command") == "show error" and event.get("retval") == 0:
                      replies[(event["pid"], event["seq"])] = event.get("reply")
              for event in events:
                  if event["kind"] != "cli" or event.get("command") != "show error":
                      continue
                  reply = event.get("reply")
                  if not isinstance(reply, str) or replies.get((event["pid"], event["seq"] - 1)) != reply:
                      continue
                  lines = reply.splitlines(keepends=True)
                  if (not lines or lines[0] != header or not any(benign.fullmatch(line) for line in lines) or
                          not all(row.fullmatch(line) for line in lines[1:])):
                      continue
                  rendering = re.compile(r"(?m)^[0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} show error\n" + re.escape(reply) + r"\n")
                  text = rendering.sub(lambda match: "".join(
                      "\n" if benign.fullmatch(line) else line for line in match.group().splitlines(keepends=True)), text)
              return text

          def execution_evidence(events, console, expected, variant, logs):
              require(evidence_schema.FATAL.search("\n".join((console, logs, json.dumps(events)))) is None,
                      "Fatal process diagnostic evidence")
              forbidden = ("addError", "addSkip", "addExpectedFailure", "addUnexpectedSuccess")
              require(not any(event["kind"] in forbidden for event in events), "Error/skip/expected failure callback")
              require(not re.search(r"SIGSEGV|segmentation fault|core was generated|timed out|TimeoutError|"
                                    r"VppTransportSocketIOError|VPP(?:\s+is)?\s+dead|"
                                    r"not enough cpus|Skipping tests due to setup failure",
                                    infrastructure_text(console, events, variant) + infrastructure_text(logs, events, variant), re.I),
                      "Infrastructure/crash/timeout evidence")
              starts = [event for event in events if event["kind"] == "startTest"]
              stops = [event for event in events if event["kind"] == "stopTest"]
              wanted = collections.Counter(expected)
              require(collections.Counter(event["test"] for event in starts) == wanted, "Wrong/missing/duplicate test starts")
              require(collections.Counter(event["test"] for event in stops) == wanted, "Missing normal stopTest")
              complete = [event for event in events if event["kind"] == "completed" and event["tests"]]
              require(sum(event["tests"] for event in complete) == len(expected), "Missing normal runner completion")
              require(all(not any(event[key] for key in ("errors", "skips", "expected", "unexpected")) for event in complete),
                      "Invalid runner summary")
              loaded = {event["pid"] for event in events if event["kind"] == "loaded"}
              require(loaded and all(event["pid"] in loaded for event in starts + stops + complete),
                      "Missing observer load provenance")
              for event in starts:
                  require(event["workers"] == (1 if ".TestHttpStaticCliWorker." in event["test"] else 0),
                          "Wrong worker configuration")
                  require(event.get("netns_disabled") is False and
                          not set(event.get("excluded", [])) & {"http_static", "tlsopenssl", "quic"},
                          "Namespace or required plugin excluded")
                  cmdline = " ".join(event.get("vpp_cmdline", []))
                  require(cmdline and not re.search(r"(?:tlsopenssl|quic|http_static)_plugin.so\s*\{\s*disable", cmdline),
                          "Missing startup command or required plugin disabled")
              return starts, stops, complete, wanted

          def test_interval(events, test):
              start = next(event for event in events if event["kind"] == "startTest" and event["test"] == test)
              stop = next(event for event in events if event["kind"] == "stopTest" and event["test"] == test)
              require(start["pid"] == stop["pid"] and start["seq"] < stop["seq"], "Test lifecycle crosses processes")
              return [event for event in events if event["pid"] == start["pid"] and
                      start["seq"] < event["seq"] < stop["seq"]]

          def read_error_evidence(events, expected, negative=False):
              for test in expected:
                  active = test_interval(events, test)
                  replies = [event for event in active if event["kind"] == "cli_reply" and
                             event["command"].startswith("test http static cache read-error ")]
                  subs = [event for event in active if event["kind"] == "addSubTest" and event["test"] == test]
                  require(len(replies) == len(subs) == 2, "Both read-error path witnesses required")
                  valid_paths = []
                  for index, (reply, sub) in enumerate(zip(replies, subs)):
                      paths = reply["command"].removeprefix("test http static cache read-error ").split()
                      require(len(paths) == 2 and os.path.isabs(paths[1]) and
                              Path(paths[1]).name == "valid.txt", "Invalid read-error command paths")
                      invalid, valid = paths
                      require(invalid == (str(Path(valid).with_name("missing.txt")) if index == 0 else valid + "/child") and
                              sub["params"] == {"invalid": invalid} and reply["seq"] < sub["seq"],
                              "Read-error path/subtest ordering mismatch")
                      valid_paths.append(valid)
                      if negative:
                          require(reply["retval"] == -1 and "cache read error retained lock" in reply["reply"] and
                                  sub.get("error") == "AssertionError" and
                                  "self.assertEqual(reply.retval, 0, reply.reply)" in sub.get("traceback", "") and
                                  "AssertionError: -1 != 0" in sub["traceback"] and
                                  "cache read error retained lock" in sub["traceback"], "Wrong retained-lock assertion witness")
                      else:
                          require(reply["retval"] == 0 and not sub.get("error") and
                                  "cache read error: lock released, valid owner reused and cleared" in reply["reply"],
                                  "Missing real read-error recovery witness")
                  require(valid_paths[0] == valid_paths[1], "Read-error paths belong to different fixtures")

          def quic_evidence(events):
              listing = "show session listeners quic verbose 2"
              add = "http static listener add uri quic://10.10.1.2:8087 url-handlers http3"
              delete = "http static listener del uri quic://10.10.1.2:8087 http3"
              for cls in CLASSES:
                  test = f"test_http_static.{cls}.test_http_static_listener_http3_identity"
                  active = test_interval(events, test)
                  operations = [event for event in active if
                                (event["kind"] == "cli" and event["command"].startswith(
                                    ("show session listeners quic", "show session thread ",
                                     "http static listener add uri quic://"))) or
                                (event["kind"] == "cli_reply" and event["command"].startswith(
                                    "http static listener del uri quic://"))]
                  relevant = [event for event in active if event["kind"] in ("cli", "cli_reply") and
                              event["command"].startswith(("show session listeners quic", "show session thread ",
                                  "http static listener add uri quic://", "http static listener del uri quic://"))]
                  require(len(operations) == 11 and len(relevant) == 20 and
                          all(left["seq"] < right["seq"] for left, right in zip(relevant, relevant[1:])),
                          "Incomplete or duplicate QUIC identity queries")
                  for event in operations:
                      if event["kind"] == "cli_reply":
                          require(event["command"] == delete and event["retval"] == 0,
                                  "QUIC listener deletion failed")
                          continue
                      paired = [reply for reply in active if reply["kind"] == "cli_reply" and
                                reply["pid"] == event["pid"] and reply["seq"] + 1 == event["seq"] and
                                reply["command"] == event["command"]]
                      require(len(paired) == 1 and paired[0]["retval"] == 0 and
                              paired[0]["reply"] == event["reply"], "QUIC query reply provenance differs")
                  require(operations[0]["command"] == listing, "Missing QUIC listener baseline")
                  def identities(reply):
                      found = re.findall(r"\[(\d+):(\d+)\].*\[Q\]", reply)
                      require(len(found) == len(set(found)) == reply.count("[Q]"),
                              "Ambiguous QUIC listener identities")
                      return set(found)
                  baseline = identities(operations[0]["reply"])
                  for offset in (1, 6):
                      created, listed, details, deleted, remaining = operations[offset:offset + 5]
                      require(created["command"] == add and listed["command"] == remaining["command"] == listing and
                              deleted["command"] == delete, "QUIC listener operation order differs")
                      current = identities(listed["reply"])
                      added = current - baseline
                      require(baseline <= current and len(added) == 1, "Missing unique added QUIC listener")
                      thread, index = next(iter(added))
                      require(details["command"] == f"show session thread {thread} index {index}" and
                              re.search(r"\bh3\b", details["reply"]) is not None,
                              "Missing added QUIC listener ALPN evidence")
                      require(identities(remaining["reply"]) == baseline, "QUIC listener removal differs from baseline")
                  successes = [event for event in active if event["kind"] == "addSuccess" and event["test"] == test]
                  require(len(successes) == 1 and operations[-1]["seq"] < successes[0]["seq"],
                          "QUIC identity queries did not precede test success")

          def async_snapshots(active):
              header = "enabled overflow live baseline destroys detaches owners".split()
              fields = ("token epoch generation app thread hs handle listener enter async send cancel cleanup "
                        "sends cancels cleanups duplicate late pending owned tx refs retiring final freed "
                        "releases cachefree vecfree poolput recovery omitted").split()
              snapshots = []
              for event in active:
                  if event["kind"] != "cli_reply" or event.get("command") != "test http static async status":
                      continue
                  require(event["retval"] == 0, "ASYNC status command failed")
                  lines = event["reply"].strip().splitlines()
                  parts = lines[0].split() if lines else []
                  require(parts[:1] == ["async-ledger"] and parts[1::2] == header and
                          len(parts) == 15, "Invalid ASYNC status header")
                  summary = dict(zip(header, map(int, parts[2::2])))
                  require(summary["enabled"] == 1 and summary["overflow"] == 0, "ASYNC ledger disabled or overflowed")
                  records = {}
                  for line in lines[1:]:
                      parts = line.split()
                      require(parts[::2] == fields and len(parts) == 62, "Invalid ASYNC scalar record")
                      record = dict(zip(fields, map(int, parts[1::2])))
                      require(record["token"] not in records and all(value >= 0 for value in record.values()),
                              "Duplicate or negative ASYNC record")
                      records[record["token"]] = record
                  snapshots.append((event["seq"], summary, records))
              require(snapshots, "Missing actual ASYNC status replies")
              return snapshots

          def async_freed(record, canceled=False):
              for key in ("refs", "owned", "pending", "recovery", "omitted"):
                  require(record[key] == 0, "ASYNC completion retained " + key)
              for key in ("cleanups", "poolput", "cachefree", "vecfree"):
                  require(record[key] == 1, "ASYNC completion count differs: " + key)
              require(record["releases"] == 2 and record["sends"] == int(not canceled) and
                      record["cancels"] == int(canceled), "ASYNC send/cancel/release count differs")
              order = ("enter", "async", "cancel" if canceled else "send", "cleanup", "freed")
              require(all(record[key] > 0 for key in (*order, "final")) and
                      all(record[left] < record[right] for left, right in zip(order, order[1:])) and
                      record["final"] < record["freed"], "ASYNC lifecycle sequence differs")

          def async_evidence(events, negative=False):
              active = test_interval(events, ASYNC_TEST)
              require(all(left["seq"] < right["seq"] for left, right in zip(active, active[1:])),
                      "ASYNC observer events out of order")
              replies = [event for event in active if event["kind"] == "cli_reply" and
                         event.get("command", "").startswith("test http static async ")]
              require(replies and all(event["retval"] == 0 for event in replies), "ASYNC CLI failed")
              commands = [event["command"].removeprefix("test http static async ") for event in replies]
              require(commands[0] == "start" and commands[-1] == "clear" and commands.count("start") ==
                      commands.count("abort") == commands.count("clear") == 1 and
                      commands.count("release 101") == 2, "ASYNC command lifecycle differs")
              snapshots = async_snapshots(active)
              history = {token: [(seq, summary, records[token]) for seq, summary, records in snapshots if token in records]
                         for token in (101, 102, 103)}
              sent = history[101]
              require(sent and all(record["thread"] == 1 for _, _, record in sent if record["enter"]),
                      "ASYNC request did not run on worker1")
              require(any(record["enter"] > 0 and record["async"] > record["enter"] and
                          record["sends"] == record["tx"] == 0 and record["owned"] == 1
                          for _, _, record in sent), "Missing genuine unsent ASYNC state")
              require(any(record["retiring"] == record["refs"] == 1 and record["sends"] == 0
                          for _, _, record in sent), "Old listener not retained before release")
              require(any(record["duplicate"] == 1 and record["sends"] == 1 for _, _, record in sent),
                      "Duplicate ASYNC release was not observed")
              responses = [event for event in active if event["kind"] == "helper" and
                           event.get("helper") == "_response" and event.get("response", {}).get("status") == 200]
              bodies = [event["response"].get("body") for event in responses]
              require(bodies == (["old-body", "new-config"] if negative else ["old-body", "new-config", "next-body"]),
                      "Missing actual ASYNC HTTP200 bodies")
              old, fresh = [event["response"] for event in responses[:2]]
              generation = next(record["generation"] for _, _, record in sent if record["send"])
              require(old.get("cache") == "max-age=123" and fresh.get("cache") == "max-age=456" and
                      old.get("server") == fresh.get("server") == f"http_static_server_{generation}",
                      "ASYNC old/new listener configuration differs")
              last_seq, last_summary, last_records = snapshots[-1]
              require(last_summary["live"] == last_summary["baseline"] and
                      all(last_summary[key] == 0 for key in ("destroys", "detaches", "owners")) and
                      all(record["pending"] == record["owned"] == 0 for record in last_records.values()),
                      "ASYNC final owners or destroys incomplete")
              clear = next(event for event in reversed(replies) if event["command"] == "test http static async clear")
              require(last_seq < clear["seq"], "ASYNC clear lacks prior idle snapshot")
              if negative:
                  failures = [event for event in active if event["kind"] == "addFailure"]
                  require(len(failures) == 1, "Missing unique ASYNC omission failure")
                  failure = failures[0]
                  require(any(seq < failure["seq"] and record["omitted"] == record["refs"] == record["cleanups"] == 1 and
                              record["poolput"] == record["final"] == record["freed"] == record["recovery"] == 0
                              for seq, _, record in sent), "Missing pre-recovery refs1 witness")
                  recoveries = [event for event in replies if event["command"] == "test http static async recover 101"]
                  require(len(recoveries) == 1 and failure["seq"] < recoveries[0]["seq"] < last_seq < clear["seq"],
                          "Guarded recovery did not follow original failure")
                  require(set(last_records) == {101} and last_records[101]["recovery"] ==
                          last_records[101]["poolput"] == last_records[101]["cachefree"] ==
                          last_records[101]["vecfree"] == 1 and last_records[101]["refs"] == 0 and
                          last_records[101]["freed"] > last_records[101]["cleanup"] > 0,
                          "Omitted release was not independently recovered")
                  before_recovery = [snapshot for snapshot in snapshots if snapshot[0] < recoveries[0]["seq"]]
                  require(before_recovery, "Missing latest pre-recovery snapshot")
                  seq, summary, records = before_recovery[-1]
                  record = records.get(101, {})
                  require(failure["seq"] < seq and
                          all(summary[key] == 0 for key in ("destroys", "detaches", "owners")) and
                          all(item["pending"] == 0 for item in records.values()) and
                          all(record.get(key) == 1 for key in ("omitted", "refs", "cleanups")) and
                          all(record.get(key) == 0 for key in ("poolput", "final", "freed", "recovery")),
                          "Latest ASYNC snapshot does not permit guarded recovery")
                  return
              require(set(last_records) == {101, 102, 103} and not any(command.startswith("recover ") for command in commands),
                      "Fixed ASYNC unexpectedly recovered omission")
              for token in (101, 102, 103):
                  async_freed(last_records[token], canceled=token == 102)
              require(commands.count("release 102") == commands.count("release 103") == 1 and
                      last_records[102]["late"] == 1 and last_records[101]["duplicate"] == 1,
                      "Missing canceled late release or duplicate rejection")
              canceled, replacement = last_records[102], last_records[103]
              require(canceled["epoch"] != replacement["epoch"] and canceled["generation"] != replacement["generation"] and
                      (canceled["app"], canceled["epoch"], canceled["handle"]) !=
                      (replacement["app"], replacement["epoch"], replacement["handle"]), "ASYNC replacement identity reused")
              require(any(records.get(102, {}).get("late") == 1 and records.get(103, {}).get("sends") == 0 and
                          records[103]["owned"] == 1 for _, _, records in snapshots), "Late release touched new request")
              response = responses[-1]["response"]
              require(response.get("cache") == "max-age=987" and
                      response.get("server") == f"http_static_server_{replacement['generation']}",
                      "Replacement ASYNC HTTP configuration differs")

          def accepted_evidence(events):
              active = test_interval(events, ACCEPTED_TEST)
              require(all(left["seq"] < right["seq"] for left, right in zip(active, active[1:])),
                      "ACCEPTED observer events out of order")
              replies = [event for event in active if event["kind"] == "cli_reply"]
              require(replies and all(event["retval"] == 0 for event in replies), "ACCEPTED CLI failed")
              prefix = "test http static accepted "
              commands = [event for event in replies if event.get("command", "").startswith(prefix)]
              starts = [event for event in commands if re.fullmatch(prefix + r"start 201 listener [0-9]+", event["command"])]
              releases = [event for event in commands if event["command"] == prefix + "release"]
              clears = [event for event in commands if event["command"] == prefix + "clear"]
              require(len(starts) == len(clears) == 1 and len(releases) == 2 and
                      commands[0] == starts[0] and commands[-1] == clears[0], "ACCEPTED command lifecycle differs")
              identities, snapshots = [], []
              for event in commands:
                  command, parts = event["command"], event["reply"].split()
                  if command == prefix + "status":
                      require(len(parts) == 2 * len(ACCEPTED_FIELDS) and parts[::2] == ACCEPTED_FIELDS and
                              all(re.fullmatch(r"[0-9]+", value) for value in parts[1::2]),
                              "ACCEPTED forty-one-field schema differs")
                      record = dict(zip(ACCEPTED_FIELDS, map(int, parts[1::2])))
                      require(record["token"] == 201 and record["enabled"] == 1 and record["overflow"] == 0,
                              "ACCEPTED record disabled, overflowed or wrong token")
                      snapshots.append((event["seq"], record))
                  elif re.fullmatch(prefix + r"identity listener [0-9]+", command):
                      fields = ("listener", "epoch", "generation", "app")
                      require(len(parts) == 8 and parts[::2] == list(fields) and
                              all(re.fullmatch(r"[0-9]+", value) for value in parts[1::2]),
                              "ACCEPTED listener identity schema differs")
                      identity = dict(zip(fields, map(int, parts[1::2])))
                      require(identity["listener"] == int(command.split()[-1]), "ACCEPTED identity reply differs")
                      identities.append((event["seq"], identity))
                  else:
                      require(event in starts + releases + clears, "Unexpected ACCEPTED command")
              require(len(identities) == 2 and snapshots, "Missing ACCEPTED old/new identities or snapshots")
              (old_seq, old), (new_seq, new) = identities
              require(old["listener"] == int(starts[0]["command"].split()[-1]) and
                      old["listener"] != new["listener"] and old["epoch"] != new["epoch"] and
                      old["app"] == new["app"] and old["generation"] == new["generation"] and
                      starts[0]["seq"] < old_seq < new_seq < releases[0]["seq"],
                      "ACCEPTED old/new allocation identity differs")
              held = [(seq, record) for seq, record in snapshots if record["held"]]
              require(held and old_seq < held[0][0] < new_seq, "Missing real held ACCEPTED before replacement")
              original = held[0][1]
              binding = ("token", "epoch", "generation", "app", "worker", "listener", "thread", "handle", "head", "held")
              order = ("held", "captured", "released", "transferred", "callback", "ready", "advanced", "ack")
              for seq, record in held:
                  require(all(record[key] == original[key] for key in binding) and
                          all(record[key] == value for key, value in old.items()) and
                          record["thread"] == record["handle"] >> 32 == 1 and
                          record["protocol"] == 7 and record["builtin"] == record["enqueued"] == 1 and
                          record["event"] == 11, "ACCEPTED queue/session/app identity changed")
                  require(all(record[key] <= 1 for key in
                          ("callbacks", "advances", "rx_ready", "captures", "transfers", "cleanups", "poolput")),
                          "Duplicate ACCEPTED ownership or callback")
                  if seq < releases[0]["seq"]:
                      require(all(record[key] == 0 for key in
                              ("released", "transferred", "callback", "ready", "advanced", "ack", "cleaned",
                               "callbacks", "advances", "rx_ready", "transfers", "cleanups", "head_after", "freed", "poolput")) and
                              record["current_head"] == record["head"] and record["queued"] > 0,
                              "ACCEPTED advanced, invoked callback or freed while held")
                  if record["ack"]:
                      require(all(record[left] < record[right] for left, right in zip(order, order[1:])) and
                              all(record[key] == 1 for key in
                                  ("callbacks", "advances", "rx_ready", "captures", "transfers", "refs_before", "refs_after")) and
                              record["head_after"] != record["head"] and
                              all(record[key] == 0 for key in ("pending", "queued", "retained")),
                              "ACCEPTED release/transfer/callback/RX_READY/head/ACK order differs")
                  if record["freed"]:
                      require(record["ack"] < record["cleaned"] < record["freed"] and
                              record["cleanups"] == record["poolput"] == 1 and record["refs"] == 0,
                              "ACCEPTED cleanup/free evidence differs")
              uri = "tcp://10.10.1.2:8093"
              deletes = [event for event in replies if event["command"] == "http static listener del uri " + uri]
              additions = [event for event in replies if re.fullmatch(
                  r"http static listener add uri " + re.escape(uri) + r" www-root \S+ max-age (?:123|456)", event["command"])]
              require(len(deletes) == len(additions) == 2 and
                      additions[0]["command"].endswith("max-age 123") and
                      additions[1]["command"].endswith("max-age 456") and
                      additions[0]["seq"] < starts[0]["seq"] < held[0][0] < deletes[0]["seq"] <
                      additions[1]["seq"] < new_seq, "ACCEPTED same-URI delete/recreate order differs")
              captures = [(seq, record) for seq, record in held if deletes[0]["seq"] < seq < additions[1]["seq"]]
              require(captures and all(record["captures"] == record["retained"] == record["refs"] ==
                      record["retiring"] == 1 and record["captured"] > record["held"] for _, record in captures) and
                      any(new_seq < seq < releases[0]["seq"] for seq, _ in held),
                      "ACCEPTED listener was not captured and retained across replacement")
              helpers = [event for event in active if event["kind"] == "helper" and event.get("helper") == "_response"]
              require(len(helpers) == 3 and all(event.get("test") == ACCEPTED_TEST for event in helpers) and
                      helpers[0].get("response") == {"requested": True} and
                      old_seq < helpers[0]["seq"] < held[0][0] and
                      helpers[0]["client"] == helpers[1]["client"] != helpers[2]["client"],
                      "Missing ACCEPTED held request and distinct old/new HTTP clients")
              responses = helpers[1:]
              for event, body, cache in zip(responses, ("old accepted config", "new accepted config"),
                                            ("max-age=123", "max-age=456")):
                  response = event["response"]
                  require(response.get("status") == 200 and response.get("body") == body and
                          response.get("cache") == cache and
                          response.get("server") == f"http_static_server_{old['generation']}",
                          "ACCEPTED HTTP response lost old/new listener configuration")
              acknowledged = [(seq, record) for seq, record in held if record["ack"]]
              closed = [(seq, record) for seq, record in held if record["freed"]]
              require(acknowledged and closed and releases[0]["seq"] < acknowledged[0][0] < responses[0]["seq"] <
                      responses[1]["seq"] < closed[0][0] < deletes[1]["seq"] < releases[1]["seq"] < clears[0]["seq"] and
                      snapshots[-1][1]["freed"] > 0 and
                      all(snapshots[-1][1][key] == 0 for key in ("pending", "queued", "retained", "refs")),
                      "ACCEPTED response/close/release/drain/clear order differs")
              disables = [event for event in replies if event["command"] == "http static server disable"]
              ledger = [event for event in replies if event["command"].startswith("test http static async ")]
              require(len(disables) == 1 and releases[1]["seq"] < snapshots[-1][0] < disables[0]["seq"] < clears[0]["seq"] and
                      ledger[0]["command"] == "test http static async start" and
                      ledger[-1]["command"] == "test http static async clear" and
                      clears[0]["seq"] < ledger[-1]["seq"], "ACCEPTED teardown failed to disable and clear ownership ledger")
              idle_seq, summary, records = async_snapshots(active)[-1]
              successes = [event for event in active if event["kind"] == "addSuccess" and event.get("test") == ACCEPTED_TEST]
              require(not records and summary["live"] == summary["baseline"] and
                      all(summary[key] == 0 for key in ("destroys", "detaches", "owners")) and
                      disables[0]["seq"] < idle_seq < clears[0]["seq"] and len(successes) == 1 and
                      ledger[-1]["seq"] < successes[0]["seq"], "ACCEPTED success preceded final owner drain")

          def validate(events, console, rc, expected, variant, logs):
              starts, stops, complete, wanted = execution_evidence(events, console, expected, variant, logs)
              subs = [event for event in events if event["kind"] == "addSubTest"]
              outcomes = [event for event in events if event["kind"] in ("addSuccess", "addFailure")]
              callbacks = re.findall(r"--- (add\w+)\(\) (\w+)\.(\w+)\(", logs)
              if variant == "async-omit-release":
                  require(rc == 2 and expected == [ASYNC_TEST] and len(outcomes) == 1 and
                          outcomes[0]["kind"] == "addFailure" and outcomes[0]["test"] == ASYNC_TEST and
                          outcomes[0].get("error") == "AssertionError" and
                          callbacks == [("addFailure", "TestHttpStaticCliWorker", "test_http_static_async_release_cancel")] and
                          sum(event["failures"] for event in complete) == 1 and
                          not any(event.get("error") for event in subs), "Omission did not complete with one ordinary failure")
                  frames = ((1371, "test_http_static_async_release_cancel", "self._async_sent_scenario(root, uri)"),
