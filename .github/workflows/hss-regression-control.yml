              save("http-name-acceptance.json", dict(status="PASS", expected=["test_http.TestHttpNameOwnership.test_app_name_ownership"],
                   claims="actual production copy/free helper regression; callback fault injection remains uncovered"))

          def binaries():
              names = ("vpp", "http_static_plugin.so", "tlsopenssl_plugin.so", "quic_plugin.so",
                       "http_plugin.so", "http_unittest_plugin.so")
