                       patch.object(time, "time", return_value=1), patch.object(time, "sleep", side_effect=sleep), \
                       patch.object(owner, "reconcile"), patch.object(owner, "identity", side_effect=identity), \
                       patch.object(owner, "exited", return_value=boundary == "quiescence"), \
                       patch.object(signal, "pidfd_send_signal", side_effect=lambda fd, sig: sent.append((fd, sig))), \
                       patch.object(os, "open", return_value=60), patch.object(os, "pidfd_open", return_value=61), \
                       patch.object(os, "close", side_effect=lambda fd: closed.append((fd, tuple(sent)))), \
                       patch.object(os, "waitid", return_value=None), \
                       patch.object(os, "kill", side_effect=AssertionError("Numeric signal forbidden")), \
                       patch.object(os, "killpg", side_effect=AssertionError("Group signal forbidden")):
                      require(not owner.cleanup(900), "Cleanup timeout became success")
                  require((91, signal.SIGTERM) in sent and (91, signal.SIGKILL) in sent and
                          all(fd == 91 for fd, _ in sent), "Deadline skipped KILL or signalled tentative child")
                  require(all((91, signal.SIGKILL) in signals for fd, signals in closed if fd in (90, 91)),
                          "Proven handle closed before KILL")
                  require([fd for fd, _ in closed].count(90) == [fd for fd, _ in closed].count(91) == 1 and
                          [fd for fd, _ in closed].count(60) == [fd for fd, _ in closed].count(61) ==
                          (0 if boundary in ("work", "step") else 2), "Cleanup descriptors lost or double closed")
                  require(len(owner.cleanup_errors) == 2 and
                          [value["signal"] for value in owner.cleanup_errors] == [15, 9] and
                          all(value["error"] == "Acquisition deadline exhausted" for value in owner.cleanup_errors) and
                          owner.cleanup_errors[0]["deadline"] == 2 and
                          owner.cleanup_errors[1]["deadline"] == owner.cleanup_errors[0]["observed"] + 2 and
