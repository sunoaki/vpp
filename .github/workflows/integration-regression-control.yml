                          "Fresh self reads were cached")
              save("parent-identity-fixtures.json", dict(status="PASS", boundaries=4,
                   sticky_paths=["observe", "resolve", "bind", "discover", "absence", "cleanup"], fresh_self_reads=3))
              discovery_snapshot_fixtures()

          def discovery_snapshot_fixtures():
              from unittest.mock import patch
              for boundary in ("discover", "cleanup", "distinct_birth"):
                  owner = OwnedProcesses()
                  key = (500, "old-parent")
                  original = (os.getpid(), key[1], "S")
                  replacement = (os.getpid() if boundary == "distinct_birth" else 1, "replacement", "S")
                  owner.candidate(500, original, {})
                  owner.handles[key] = (50, 51)
                  owner.resolve(key, "bound")
                  clock, sent, closed = [0.0], [], []
                  with patch.dict(globals(), processes=lambda: {500: replacement}), \
                       patch.object(owner, "exited", return_value=True), \
                       patch.object(owner, "identity", return_value=replacement), \
                       patch.object(os, "open", return_value=60), patch.object(os, "pidfd_open", return_value=61), \
                       patch.object(os, "close", side_effect=closed.append), patch.object(os, "waitid", return_value=None), \
                       patch.object(signal, "pidfd_send_signal", side_effect=lambda fd, sig: sent.append((fd, sig))), \
                       patch.object(os, "kill", side_effect=AssertionError("Numeric signal forbidden")), \
                       patch.object(os, "killpg", side_effect=AssertionError("Group signal forbidden")), \
                       patch.object(time, "monotonic", side_effect=lambda: clock[0]), \
                       patch.object(time, "sleep", side_effect=lambda seconds: clock.__setitem__(0, clock[0] + seconds)):
                      if boundary == "cleanup":
                          require(not owner.cleanup(500), "Standalone snapshot mismatch produced false cleanup")
                      else:
                          owner.discover()
                          require(not sent and not closed, "Discovery signalled or closed published handles")
                      record = owner.acquisitions[key]
                      witness = dict(record.get("birth_mismatch", {}))
                      require(record["reused"] and key in owner.unresolved and record["status"] == "pending" and
                              witness == dict(stage="discover_snapshot", expected=key[1], actual=replacement),
                              "Standalone discovery lost bound identity mismatch")
                      if boundary == "distinct_birth":
                          new_key = (500, replacement[1])
                          require(owner.handles.get(new_key) == (60, 61) and new_key not in owner.unresolved and
                                  owner.acquisitions[new_key]["status"] == "bound",
                                  "Sticky old birth blocked separately proven new birth")
                      else:
                          require(set(owner.acquisitions) == {key} and set(owner.handles) == {key},
                                  "Unattributable replacement acquired authority")
                      owner.observe(key, (1, "later", "R"), "later_snapshot")
                      owner.observe(key, original, "later_original")
                      with patch.object(os, "open", side_effect=FileNotFoundError(2, "later absent")):
                          owner.reconcile({})
                          owner.reconcile({})
                      require(not owner.resolve(key, "bound") and not owner.resolve(key, "vanished") and
                              not owner.bind(500, original), "Snapshot mismatch bypassed sticky guards")
                      owner.discover()
                      if boundary != "cleanup":
                          require(not owner.cleanup(500), "Sticky discovery mismatch produced false cleanup")
                      require(record["birth_mismatch"] == witness and record["reused"] and key in owner.unresolved,
                              "Later discovery or cleanup replaced first snapshot witness")
                  descriptors = [50, 51, 60, 61] if boundary == "distinct_birth" else [50, 51]
                  require(sorted(closed) == descriptors and (51, signal.SIGKILL) in sent and
                          all(fd in ({51, 61} if boundary == "distinct_birth" else {51}) for fd, _ in sent),
                          "Snapshot cleanup changed proven pidfd signalling or descriptor ownership")
              save("discovery-snapshot-fixtures.json", dict(status="PASS", boundaries=3,
                   first_witness="discover_snapshot", distinct_birth_bound=True, cleanup_complete=False))

          def ownership_fixtures():
              from unittest.mock import patch
              baseline = (500, "child", "S")
              adopted = (os.getpid(), "child", "Z")
              def scenario(values, accepted, parent_exit=False, changes=None):
                  owner = OwnedProcesses()
                  for pid, handle in ((500, (50, 51)), (501, (52, 53))):
                      owner.candidate(pid, (os.getpid(), "parent", "S"), {})
                      owner.handles[(pid, "parent")] = handle
                      owner.resolve((pid, "parent"), "bound")
                  owner.candidate(600, baseline, {500: (1, "parent", "S")})
                  children = iter(values)
                  changes = changes or {}
                  parents = iter(changes.get("identities", [(1, "parent", "R")] * 6))
                  reads, closed = [], []
                  def identity(fd):
                      reads.append(fd)
                      if fd == 60:
                          return next(children)
                      if changes.get("replace"):
                          owner.handles[(500, "parent")] = (52, 53)
                      return next(parents)
                  if changes.get("self_birth"):
                      owner.self_birth = "different"
                  with patch.object(os, "open", return_value=60) as opened, \
                       patch.object(os, "pidfd_open", return_value=61) as pidfd, \
                       patch.object(os, "close", side_effect=closed.append), \
                       patch.object(owner, "identity", side_effect=identity), \
                       patch.object(owner, "exited", side_effect=parent_exit if isinstance(parent_exit, list) else None,
                                    return_value=parent_exit), \
                       patch.object(signal, "pidfd_send_signal") as sent:
                      result = owner.bind(600, baseline)
                      require(result is accepted and not sent.called, "Tentative authority or wrong acquisition verdict")
                      require(opened.call_count == 1 and pidfd.call_count <= 1 and set(reads) <= {50, 52, 60}, "Acquisition replaced handle generation")
                      expected_closed = [] if accepted else [60, 61] if pidfd.called else [60]
                      require(closed == expected_closed, "Tentative descriptors closed incorrectly")
                  return owner
              for boundary in range(4):
                  values = [baseline] * boundary + [adopted] * (6 - boundary)
                  owner = scenario(values, True)
                  attempt = owner.acquisitions[(600, "child")]["last_attempt"]
                  require(attempt["expected"] == baseline and "before" in attempt and "after" in attempt and
                          attempt["proof"]["final"] == adopted and owner.handles[(600, "child")] == (60, 61), "Adoption proof lost observations/handle")
                  changed = (500, "replacement", "S")
                  owner = scenario([baseline] * boundary + [changed] * (6 - boundary), False)
                  record = owner.acquisitions[(600, "child")]
                  require(record["reused"] and record["birth_mismatch"]["actual"][1] == "replacement", "Birth mismatch lacks immutable witness")
                  with patch.object(os, "open", side_effect=AssertionError("Sticky key reopened")):
                      require(not owner.bind(600, baseline) and not owner.resolve((600, "child"), "bound") and
                              not owner.resolve((600, "child"), "vanished"), "Sticky key bypassed resolution")
                  owner.handles[(600, "child")] = (60, 61)
                  with patch.dict(globals(), processes=lambda: {600: baseline}):
                      owner.discover()
                      owner.reconcile({})
                  require((600, "child") in owner.unresolved, "Already-bound shortcut cleared sticky key")
              scenario([baseline] * 4, False, parent_exit=True)
              scenario([baseline] * 4, False, parent_exit=[False, True])
              scenario([baseline] * 4, False, changes={"replace": True})
              scenario([baseline] * 4, False, changes={"identities": [(1, "parent", "S"), (1, "different", "S")]})
              scenario([adopted] * 4, False, changes={"self_birth": True})
              owner = scenario([baseline] * 4, True)
              require(owner.acquisitions[(600, "child")]["last_attempt"]["proof"]["parent_after"]["same_handle"], "Parent pidfd not bracketed")
              transferred = (501, "child", "R")
              owner = scenario([baseline] * 3 + [transferred] * 3, True)
              proof = owner.acquisitions[(600, "child")]["last_attempt"]["proof"]
              require(proof["final"] == transferred and proof["parent_after"]["parent_handle"] == [52, 53],
                      "New owned parent lacked fresh exact-handle proof")
              scenario([baseline] * 2 + [(777, "child", "S")] * 2, False)
              unstable = [baseline, baseline, baseline, adopted, adopted, baseline, baseline, adopted]
              owner = scenario(unstable, False)
              require(len(owner.acquisitions[(600, "child")]["last_attempt"]["rounds"]) == 3, "Ownership rounds unbounded")
              for boundary in range(4):
                  for failure in (PermissionError(13, "unreadable"), ValueError("malformed"), TimeoutError("deadline")):
                      owner = OwnedProcesses()
                      owner.candidate(600, adopted, {})
                      closed = []
                      with patch.object(os, "open", return_value=60), patch.object(os, "pidfd_open", return_value=61), \
                           patch.object(os, "close", side_effect=closed.append), \
                           patch.object(owner, "identity", side_effect=[adopted] * boundary + [failure]):
                          try:
                              result = owner.bind(600, adopted)
                          except TimeoutError:
                              require(isinstance(failure, TimeoutError), "Wrong deadline exception")
                          else:
                              require(result is False, "Uncertain acquisition accepted")
                      require(closed == ([60] if boundary == 0 else [60, 61]) and
                              not owner.handles and (600, "child") in owner.unresolved,
                              "Exception lost descriptor/unresolved truth")
              for point in ("resolve", "publication", "sticky"):
                  owner = OwnedProcesses()
                  owner.candidate(600, adopted, {})
                  closed = []
                  resolve = owner.resolve
                  class Publication(dict):
                      def __setitem__(self, key, value):
                          super().__setitem__(key, value)
                          raise TimeoutError("publication boundary")
                  if point == "publication":
                      owner.handles = Publication()
                  def interrupt(key, status):
                      result = resolve(key, status)
                      if point == "sticky":
                          owner.observe(key, (os.getpid(), "replacement", "S"), "publication_fixture")
                          return result
                      if point == "resolve":
                          raise TimeoutError("resolution boundary")
                      return result
                  with patch.object(os, "open", return_value=60), patch.object(os, "pidfd_open", return_value=61), \
                       patch.object(os, "close", side_effect=closed.append), \
                       patch.object(owner, "identity", return_value=adopted), \
                       patch.object(owner, "resolve", side_effect=interrupt):
                      try:
                          require(owner.bind(600, adopted) is False and point == "sticky", "Sticky publication accepted")
                      except TimeoutError:
                          require(point != "sticky", "Sticky publication raised wrong exception")
                  require(closed == ([] if point == "publication" else [60, 61]), "Publication double-closed or leaked handles")
                  require((600, "child") in owner.handles if point == "publication" else
                          (600, "child") in owner.unresolved, "Publication lost descriptor ownership")
              for opening in ("open", "pidfd_open"):
                  owner = OwnedProcesses()
                  owner.candidate(600, adopted, {})
                  closed = []
                  with patch.object(os, "open", return_value=60), patch.object(os, "pidfd_open", return_value=61), \
                       patch.object(owner, "identity", return_value=adopted), \
                       patch.object(os, "close", side_effect=closed.append), \
                       patch.object(os, opening, side_effect=PermissionError(13, "opening")):
                      require(not owner.bind(600, adopted), "Descriptor opening failure accepted")
                  require(closed == ([] if opening == "open" else [60]), "Opening failure closed wrong handles")
              owner = OwnedProcesses()
              owner.candidate(600, adopted, {})
              with patch.object(owner, "acquisition_deadline", side_effect=TimeoutError("deadline")), \
                   patch.object(os, "open") as opened:
                  try:
                      owner.bind(600, adopted)
                  except TimeoutError:
                      pass
                  else:
                      raise AssertionError("Acquisition ignored deadline")
                  require(not opened.called, "Expired acquisition opened descriptor")
              owner.acquisitions = dict.fromkeys(range(20000))
              try:
                  owner.candidate(601, adopted, {})
              except AssertionError as error:
                  require(str(error) == "Acquisition evidence capacity exceeded", "Wrong acquisition capacity failure")
              else:
                  raise AssertionError("Acquisition capacity ignored")
              owner = OwnedProcesses()
              owner.candidate(600, adopted, {})
              owner.observe((600, "child"), (os.getpid(), "replacement", "S"), "old_key_fixture")
              replacement = (os.getpid(), "replacement", "R")
              owner.candidate(600, replacement, {})
              with patch.object(os, "open", return_value=60), patch.object(os, "pidfd_open", return_value=61), \
                   patch.object(os, "close"), patch.object(owner, "identity", return_value=replacement):
                  require(owner.bind(600, replacement) and (600, "child") in owner.unresolved,
                          "New incarnation resolved sticky old key")
              from unittest.mock import Mock
              root = OwnedProcesses()
              process = Mock(pid=600, returncode=0)
              def sticky_root(pid, identity):
                  root.observe((pid, identity[1]), (os.getpid(), "replacement", "S"), "root_fixture")
                  return True
              with patch.dict(globals(), processes=lambda: {600: adopted}), \
                   patch.dict(globals(), OwnedProcesses=lambda: root), \
                   patch.object(subprocess, "Popen", return_value=process), \
                   patch.object(root, "bind", side_effect=sticky_root), \
                   patch.object(root, "cleanup", return_value=False):
                  try:
                      command("fixture-root-sticky", ["fixture"], limit=5)
                  except SystemExit as error:
                      require(error.code == 125, "Root sticky changed supervisor status")
                  else:
                      raise AssertionError("Root sticky bypassed command guard")
              result = json.loads((OUT / "fixture-root-sticky/result.json").read_text())
              require(result["error"] == "Root birth mismatch" and result["unresolved_processes"] == [[600, "child"]],
                      "Root sticky guard lost failure evidence")
              save("ownership-fixtures.json", dict(status="PASS", rounds=3, boundary_parent_and_birth=8,
                   child_read_errors=12, parent_rejections=6, publication_boundaries=3,
                   sticky_paths=["bind", "bound", "discover", "vanished", "root", "new_birth"], tentative_signals=0))

          def finalize():
              diagnostics(OUT / "final-diagnostics")
              for path in TOOLS.glob("*.py"):
                  (OUT / path.name).write_bytes(path.read_bytes())

          def evidence_index():
              save("evidence-index.json", {str(p.relative_to(OUT)): dict(bytes=p.stat().st_size, sha256=sha(p.read_bytes()))
                                          for p in OUT.rglob("*") if p.is_file() and not p.is_symlink() and
                                          p.name != "evidence-index.json" and not p.name.endswith(".pending")})

          def phase_observations():
              observations = []
              for path in sorted(OUT.glob("phase-*.json")):
                  if path.name in ("phase-finalize.json", "phase-observations.json"):
                      continue
                  try:
                      value = json.loads(path.read_text())
                      require(isinstance(value, dict), "Phase record is not an object")
                      require(isinstance(value.get("status"), str) and value["status"] in
                              ("NOT_RUN", "running", "PASS", "FAIL"), "Missing or unknown phase status")
                  except (OSError, ValueError, AssertionError) as error:
                      observations.append(dict(path=path.name, status="UNKNOWN", rc=None, error=str(error)))
                      continue
                  if value["status"] != "PASS":
                      observations.append(dict(path=path.name, status=value["status"], rc=None,
                                               reason="Earlier phase failed or job interrupted; raw record retained"))
              save("phase-observations.json", observations)
              require(not any(value["status"] == "UNKNOWN" for value in observations), "Phase observations contain malformed or unreadable records")

          def phase(action, arguments):
              status = dict(action=action, start=time.time(), status="running", rc=None)
              save(f"phase-{action}.json", status)
              def expired(signum, frame):
                  raise TimeoutError("Phase work deadline exhausted, including postprocessing")
              previous = signal.signal(signal.SIGALRM, expired)
              caps = dict(prepare=240, mutate=240, binaries=60, environment=240, tests=3060, build=2460)
              budget = 75 if action == "finalize" else min(caps.get(action, 1500), work_deadline() - time.time())
              try:
                  require(budget > 0, "Shared phase deadline exhausted")
                  signal.setitimer(signal.ITIMER_REAL, budget)
                  if action == "prepare": prepare()
                  elif action == "mutate": mutate()
                  elif action == "tests": tests()
                  elif action == "binaries": binaries()
                  elif action == "finalize":
                      finalize()
                      phase_observations()
                  elif action == "fixtures": fixtures()
                  else:
                      rc, _ = command(action, arguments, limit=2400 if action == "build" else 1500)
                      status["rc"] = rc
                      require(rc == 0, f"{action} command failed: {rc}")
                  status["status"] = "PASS"
              except BaseException as error:
                  status.update(status="FAIL", error=str(error))
                  raise
              finally:
                  try:
                      status["end"] = time.time()
                      save(f"phase-{action}.json", status)
                      if action == "finalize":
                          evidence_index()
                  except BaseException as error:
                      if action == "finalize":
                          (OUT / "evidence-index.json").unlink(missing_ok=True)
                          status.update(status="FAIL", error=str(error), end=time.time())
                          save("phase-finalize.json", status)
                      raise
                  finally:
                      signal.setitimer(signal.ITIMER_REAL, 0)
                      signal.signal(signal.SIGALRM, previous)

          if __name__ == "__main__":
              phase(sys.argv[1], sys.argv[2:])
          PY
          python3 "$TOOLS/control.py" prepare

      - name: Install dependencies on the exact clean integrated checkout
        timeout-minutes: 27
        run: |
          export STEP_DEADLINE="$(( $(date +%s) + 1560 ))"
          python3 "$TOOLS/control.py" dependencies make UNATTENDED=yes install-dep

      - name: Execute clean integrated C API feature and pinned formatter checks
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export STEP_DEADLINE="$(( $(date +%s) + 1740 ))"
          test -z "$(git status --porcelain -uno)"
          python3 "$TOOLS/control.py" feature-list make checkfeaturelist
          python3 "$TOOLS/control.py" c-style make checkstyle
          python3 "$TOOLS/control.py" api-style make checkstyle-api
          python3 "$TOOLS/control.py" c-formatter clang-format-19 --version
          touch test/requirements-3.txt
          python3 "$TOOLS/control.py" python-style make UV= checkstyle-python
          python3 "$TOOLS/control.py" python-pin build-root/test/venv/bin/python -c \
            'import black; assert black.__version__ == "26.5.1", black.__version__; print(black.__version__)'
          test -z "$(git status --porcelain -uno)"

      - name: Select only the immutable owner restoration
        timeout-minutes: 5
        run: |
          export STEP_DEADLINE="$(( $(date +%s) + 240 ))"
          python3 "$TOOLS/control.py" mutate

      - name: Record version and build an independent debug image
        timeout-minutes: 42
        run: |
          set -euo pipefail
          export STEP_DEADLINE="$(( $(date +%s) + 2460 ))"
          if ! git describe --long --match 'v[0-9]*' 2>/dev/null; then
            printf '0.0.0-release+%s.%s-g%s\n' "$(git log -1 --format=%ct)" \
              "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)" > src/scripts/.version
          fi
          if [ -f src/scripts/.version ]; then cp src/scripts/.version "$EVIDENCE/version.txt"; fi
          python3 "$TOOLS/control.py" build make UNATTENDED=yes VPP_EXCLUDED_PLUGINS= build
          python3 "$TOOLS/control.py" binaries

      - name: Prepare real test runtime
        timeout-minutes: 3
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ runner.temp }}/integration-evidence/runtime-setup

      - name: Require CPUs namespaces and TAP devices
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export STEP_DEADLINE="$(( $(date +%s) + 240 ))"
          python3 "$TOOLS/control.py" environment bash -euo pipefail -c '
            python3 -c "import os,pathlib; cpus=sorted(os.sched_getaffinity(0)); roots=[pathlib.Path(f\"/sys/devices/system/cpu/cpu{cpu}/topology\") for cpu in cpus]; cores={(p.joinpath(\"physical_package_id\").read_text().strip(),p.joinpath(\"core_id\").read_text().strip()) for p in roots}; required=3 if os.environ[\"CASE\"] == \"fixed-ipsec_esp\" else 2; print(dict(cpus=cpus,physical_cores=sorted(cores),required=required)); assert len(cores) >= required"
            mountpoint /dev/shm
            test "$(df -B1 --output=size /dev/shm | tail -n 1)" -ge 2147483648
            ns="integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap '\''ip netns del "$ns"'\'' EXIT
            ip netns add "$ns"
            ip netns exec "$ns" ip link set lo up
            ip netns exec "$ns" ip tuntap add dev probe mode tap
            ip netns exec "$ns" ip link del probe
            test -c /dev/net/tun
            test -c /dev/vhost-net
            (: <> /dev/net/tun)
            (: <> /dev/vhost-net)
            uname -a
            dpkg-query -W clang-format-19 python3
          '

      - name: Execute complete fixed suite or precise intended failure
        timeout-minutes: 52
        run: python3 "$TOOLS/control.py" tests

      - name: Retain bounded diagnostics and complete provenance
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integration-evidence"
          if [ -f "$RUNNER_TEMP/integration-tools/control.py" ]; then
            python3 "$RUNNER_TEMP/integration-tools/control.py" finalize
          fi

      - name: Upload every outcome with complete callbacks and events
        id: evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Record artifact and pending final acceptance
        if: always()
        timeout-minutes: 1
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          printf 'Artifact ID: %s\nArtifact URL: %s\nArtifact digest: %s\n' \
            "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Intermediate required24 only. Final26 and M44 INTERPOSE remain pending. Coverage gaps are in manifest.json.' >> "$GITHUB_STEP_SUMMARY"

  acceptance:
    needs: control
    if: always() && github.ref == 'refs/heads/feat/integration-runtime-controls-ff50-octobe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all independent variant evidence
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          pattern: integration-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-results

      - name: Require ready24 and each precise paired source control
        timeout-minutes: 2
        env:
          RESULT_ROOT: ${{ runner.temp }}/integration-results
          MATRIX_RESULT: ${{ needs.control.result }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          root = Path(os.environ['RESULT_ROOT'])
          expected_tree = '86cfc49495ff83e2869aca5d80177a6b112228ec'
          fixed = ['linux_cp', 'linux_cp_lifecycle', 'linux_cp_netlink', 'ipsec_esp', 'gre', 'gre_teib', 'ip_mcast']
          negatives = ['router-add', 'router-delete', 'router-sweep', 'router-permanent', 'lifecycle-fd',
                       'lifecycle-failure', 'lifecycle-refresh', 'lifecycle-flags', 'lifecycle-vlan-add',
                       'lifecycle-vlan-delete', 'lifecycle-namespace', 'netlink-pair', 'netlink-dump',
                       'tunnel-df', 'gre-config', 'gre-ingress']
          expected = {'fixed-' + suite for suite in fixed} | set(negatives)
          records, errors, hashes = {}, [], {}
          for directory in sorted(root.glob('integration-*')):
              try:
                  manifest = json.loads((directory / 'manifest.json').read_text())
                  result = json.loads((directory / 'acceptance.json').read_text())
                  name = result['case']
                  assert name in expected and name not in records, 'Unknown or duplicate variant'
                  assert result['status'] == 'PASS', 'Variant did not pass strict classifier'
                  assert result['integration_tree'] == manifest['integration_tree'] == expected_tree
                  assert result['workflow_sha'] == manifest['workflow_sha'] == os.environ['WORKFLOW_SHA']
                  assert result['run'] == manifest['run_id'] == os.environ['GITHUB_RUN_ID']
                  assert result['attempt'] == manifest['attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
                  assert manifest['case'] == name
                  for phase in ['prepare', 'dependencies', 'feature-list', 'c-style', 'api-style', 'c-formatter',
                                'python-style', 'python-pin', 'mutate', 'build', 'binaries', 'environment', 'tests', 'finalize']:
                      assert json.loads((directory / f'phase-{phase}.json').read_text())['status'] == 'PASS', phase
                  callback = json.loads((directory / 'runtime/callbacks.json').read_text())
                  assert callback['complete'] and callback['sources'] and callback['event_sources']
                  index = json.loads((directory / 'evidence-index.json').read_text())
                  for path in ['manifest.json', 'acceptance.json', 'runtime/callbacks.json', 'runtime/result.json',
                               'phase-finalize.json', 'phase-observations.json']:
                      data = (directory / path).read_bytes()
                      assert index[path] == dict(bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
                  for source in callback['event_sources']:
                      data = (directory / 'runtime' / source['path']).read_bytes()
                      assert len(data) == source['bytes'] and hashlib.sha256(data).hexdigest() == source['sha256']
                  runtime = json.loads((directory / 'runtime/result.json').read_text())
                  assert runtime['status'] == 'completed' and runtime['cleanup_complete'] and not runtime['infrastructure']
                  assert not runtime.get('unresolved_processes') and not runtime.get('supervisor_rc')
                  expected_failfast = 'FAILFAST=1' if name in ('tunnel-df', 'lifecycle-refresh') else 'FAILFAST=0'
                  assert [arg for arg in runtime['command'] if arg.startswith('FAILFAST=')] == [expected_failfast]
                  if name.startswith('fixed-'):
                      assert result['built_tree'] == expected_tree and 'restoration' not in manifest
                      assert not (collections.Counter(result['required']) - collections.Counter(result['successes']))
                  else:
                      assert manifest['restoration']['name'] == name and result['built_tree'] != expected_tree
                  records[name] = (result, manifest)
                  hashes[name] = {path: hashlib.sha256((directory / path).read_bytes()).hexdigest()
                                  for path in ['manifest.json', 'acceptance.json', 'runtime/callbacks.json']}
              except (OSError, ValueError, KeyError, AssertionError) as error:
                  errors.append(f'{directory.name}: {error}')
          if set(records) != expected:
              errors.append(f'Missing variants: {sorted(expected - set(records))}')
          if os.environ['MATRIX_RESULT'] != 'success':
              errors.append('One or more independent jobs failed')
          required = []
          for suite in fixed:
              if 'fixed-' + suite in records:
                  required.extend(records['fixed-' + suite][0]['required'])
          if len(required) != 24 or len(set(required)) != 24:
              errors.append('Required24 inventory incomplete or duplicated')
          for name in negatives:
              if name not in records:
                  continue
              result, manifest = records[name]
              paired = records.get('fixed-' + result['paired_fixed'])
              if paired is None or collections.Counter(paired[0]['successes'])[result['intended_failure']] != 1:
                  errors.append(f'{name}: no corresponding actual fixed success')
          assessment = dict(status='FAIL' if errors else 'PASS', errors=errors, expected_variants=sorted(expected),
                            required24=required, evidence_sha256=hashes, integration_tree=expected_tree,
                            workflow_sha=os.environ['WORKFLOW_SHA'], run=os.environ['GITHUB_RUN_ID'],
                            attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                            final26='PENDING: M44 final two ip4 methods plus C INTERPOSE regression',
                            m43_negative='UNVERIFIED / ON HOLD; fixed full ip_mcast and three actual successes required',
                            claim='Intermediate required24 and enabled functional controls only; not final audit acceptance')
          (root / 'aggregate.json').write_text(json.dumps(assessment, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(assessment['claim'] + '\n\nStatus: ' + assessment['status'] + '\n')
              stream.write('\n'.join(errors) + '\n')
          if errors:
              sys.exit(1)
          PY

      - name: Upload task-mapped intermediate acceptance
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: integration-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-results/aggregate.json
          retention-days: 7
          if-no-files-found: error
