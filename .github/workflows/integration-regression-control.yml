                      "RETRIES=0", f"FAILFAST={int(failfast)}", "SKIP_TESTS=", "VPP_EXCLUDED_PLUGINS=", "V=2", "TIMEOUT=300",
                      "COREDUMP_SIZE=0", "COMPRESS_FAILED_TEST_LOGS=no", "DECODE_PCAPS=none", "RND_SEED=50", f"TEST={selector}", "test-debug"]
              rc, console = command("runtime", args, environment, limit=3000)
