                  acceptance = dict(status="PASS", case=CASE, suite=suite, successes=successes, required=ready(suite))
              else:
                  identity = negative(CASE, RunEvidence(events, console, rc, logs, records["callbacks"]))
                  acceptance = dict(status="PASS", case=CASE, intended_failure=identity, paired_fixed=identity.split(".")[0].removeprefix("test_"))
              acceptance.update(integration_tree=TREE, built_tree=manifest["built_tree"], workflow_sha=os.environ["WORKFLOW_SHA"],
                                run=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"], pending=GAPS)
              save("acceptance.json", acceptance)

          def binaries():
              verify()
              root = Path("build-root/install-vpp_debug-native")
              files = {}
              for name in ("vpp", "linux_cp_plugin.so", "linux_cp_unittest_plugin.so", "gre_plugin.so", "unittest_plugin.so"):
