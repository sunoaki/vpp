                      require(not owner.cleanup(500), "Forgotten parent mismatch produced false cleanup")
                  require(key in owner.unresolved and record["birth_mismatch"] == witness and record["reused"],
                          "Discovery or absence replaced first parent mismatch")
              with patch.object(OwnedProcesses, "fresh_self_birth", side_effect=["initial", "before", "after"]) as fresh:
                  owner = OwnedProcesses()
                  require(owner.parent_proof(os.getpid(), {}) is None and
