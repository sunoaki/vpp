                  elif name == "lifecycle-refresh":
                      path, after, selector = interface, "4d269fa926616f9953c2e89853ae9d34d41b94e9", "linux_cp_lifecycle.TestLinuxCPLifecycle.test_pair_replace_resend"
                      steps = []
