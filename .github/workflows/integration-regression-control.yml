                          traces = [trace for _, trace in result.errors]
                          require("line 144" in traces[0] and all("line 131" in trace for trace in traces[1:]), "Retained-pair model lost original failure causality")
                      if failfast:
                          require(len(visits) == (5 if module == "test_ipsec_esp" else 7), "Unexpected first-failure execution boundary")

          def observation_fixtures():
              import tempfile
              from unittest.mock import patch
              with tempfile.TemporaryDirectory(dir=TOOLS) as temporary:
                  root = Path(temporary)
                  raw = {"phase-a.json": "{}", "phase-b.json": "null", "phase-c.json": "[]",
                         "phase-d.json": "{", "phase-e.json": '{"status":[]}',
                         "phase-z.json": '{"status":"running"}'}
                  for name, data in raw.items():
                      (root / name).write_text(data)
                  with patch.dict(globals(), OUT=root, finalize=lambda: None):
                      try:
                          phase("finalize", [])
                      except AssertionError:
                          pass
                      else:
                          raise AssertionError("Malformed observations published successful finalization")
                  values = json.loads((root / "phase-observations.json").read_text())
                  require(sum(value["status"] == "UNKNOWN" for value in values) == 5 and
                          any(value["path"] == "phase-z.json" and value["status"] == "running" for value in values), "Malformed shape aborted later phase observations")
                  require(json.loads((root / "phase-finalize.json").read_text())["status"] == "FAIL" and
                          all((root / name).read_text() == data for name, data in raw.items()), "Finalization invented PASS or altered malformed raw records")

          def scheduling_fixtures():
              from unittest.mock import patch
              owner = OwnedProcesses()
              owner.handles = {(9, "90"): (90, 91), (8, "80"): (80, 81), (7, "11"): (10, 11)}
              table = {8: (os.getpid(), "80", "S"), 7: (8, "22", "S")}
              exited, signals = {91, 11}, []
              def identity(directory):
                  if directory == 80:
                      return os.getpid(), "80", "R"
                  return table[7][:2] + ("R",)
              def send(descriptor, sig):
                  signals.append((descriptor, sig))
                  exited.add(descriptor)
                  if descriptor == 81:
                      table.pop(8, None)
                      table[7] = (os.getpid(), "22", "S")
                  if descriptor == 71:
                      table.pop(7, None)
              with patch.dict(globals(), processes=lambda: dict(table)), patch.object(os, "open", return_value=70), \
                   patch.object(os, "pidfd_open", return_value=71), patch.object(os, "close"), patch.object(os, "waitid"), \
                   patch.object(owner, "identity", side_effect=identity), patch.object(owner, "exited", side_effect=lambda handle: handle[1] in exited), \
                   patch.object(signal, "pidfd_send_signal", side_effect=send), \
                   patch.object(os, "kill", side_effect=AssertionError("Numeric signal forbidden")), \
                   patch.object(os, "killpg", side_effect=AssertionError("Group signal forbidden")):
                  require(owner.cleanup(9) and not table and (7, "22") in owner.handles and
                          any(fd == 71 for fd, _ in signals), "S/R transition lost owned reused child")
              owner = OwnedProcesses()
              owner.handles[(9, "90")] = (90, 91)
              with patch.dict(globals(), processes=lambda: {7: (os.getpid(), "22", "S")}), \
                   patch.object(owner, "bind", return_value=False), patch.object(owner, "exited", return_value=True), \
                   patch.object(owner, "signal"), patch.object(os, "close"), patch.object(os, "waitid"):
                  require(not owner.cleanup(9) and (7, "22") in owner.unresolved, "Unbound owned child falsely cleaned")

          def finalize():
              diagnostics(OUT / "final-diagnostics")
              for path in TOOLS.glob("*.py"):
                  (OUT / path.name).write_bytes(path.read_bytes())
              save("evidence-index.json", {str(p.relative_to(OUT)): dict(bytes=p.stat().st_size, sha256=sha(p.read_bytes()))
                                          for p in OUT.rglob("*") if p.is_file() and not p.is_symlink()})

          def phase_observations():
              observations = []
              for path in sorted(OUT.glob("phase-*.json")):
                  if path.name in ("phase-finalize.json", "phase-observations.json"):
                      continue
                  try:
                      value = json.loads(path.read_text())
                      require(isinstance(value, dict), "Phase record is not an object")
                      require(isinstance(value.get("status"), str) and value["status"] in
                              ("NOT_RUN", "running", "PASS", "FAIL"), "Missing or unknown phase status")
                  except (OSError, ValueError, AssertionError) as error:
                      observations.append(dict(path=path.name, status="UNKNOWN", rc=None, error=str(error)))
                      continue
                  if value["status"] != "PASS":
                      observations.append(dict(path=path.name, status=value["status"], rc=None,
                                               reason="Earlier phase failed or job interrupted; raw record retained"))
              save("phase-observations.json", observations)
              require(not any(value["status"] == "UNKNOWN" for value in observations), "Phase observations contain malformed or unreadable records")

          def phase(action, arguments):
              status = dict(action=action, start=time.time(), status="running", rc=None)
              save(f"phase-{action}.json", status)
              def expired(signum, frame):
                  raise TimeoutError("Phase work deadline exhausted, including postprocessing")
              previous = signal.signal(signal.SIGALRM, expired)
              budget = 75 if action == "finalize" else float(os.environ["WORK_DEADLINE"]) - time.time()
              try:
                  require(budget > 0, "Shared phase deadline exhausted")
                  signal.setitimer(signal.ITIMER_REAL, budget)
                  if action == "prepare": prepare()
                  elif action == "mutate": mutate()
                  elif action == "tests": tests()
                  elif action == "binaries": binaries()
                  elif action == "finalize":
                      finalize()
                      phase_observations()
                  elif action == "fixtures": fixtures()
                  else:
                      rc, _ = command(action, arguments, limit=2400 if action == "build" else 1500)
                      status["rc"] = rc
                      require(rc == 0, f"{action} command failed: {rc}")
                  status["status"] = "PASS"
              except BaseException as error:
                  status.update(status="FAIL", error=str(error))
                  raise
              finally:
                  signal.setitimer(signal.ITIMER_REAL, 0)
                  signal.signal(signal.SIGALRM, previous)
                  status["end"] = time.time()
                  save(f"phase-{action}.json", status)

          if __name__ == "__main__":
              phase(sys.argv[1], sys.argv[2:])
          PY
          python3 "$TOOLS/control.py" prepare

      - name: Install dependencies on the exact clean integrated checkout
        timeout-minutes: 27
        run: python3 "$TOOLS/control.py" dependencies make UNATTENDED=yes install-dep

      - name: Execute clean integrated C API feature and pinned formatter checks
        timeout-minutes: 30
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -uno)"
          python3 "$TOOLS/control.py" feature-list make checkfeaturelist
          python3 "$TOOLS/control.py" c-style make checkstyle
          python3 "$TOOLS/control.py" api-style make checkstyle-api
          python3 "$TOOLS/control.py" c-formatter clang-format-19 --version
          touch test/requirements-3.txt
          python3 "$TOOLS/control.py" python-style make UV= checkstyle-python
          python3 "$TOOLS/control.py" python-pin build-root/test/venv/bin/python -c \
            'import black; assert black.__version__ == "26.5.1", black.__version__; print(black.__version__)'
          test -z "$(git status --porcelain -uno)"

      - name: Select only the immutable owner restoration
        timeout-minutes: 5
        run: python3 "$TOOLS/control.py" mutate

      - name: Record version and build an independent debug image
        timeout-minutes: 42
        run: |
          set -euo pipefail
          if ! git describe --long --match 'v[0-9]*' 2>/dev/null; then
            printf '0.0.0-release+%s.%s-g%s\n' "$(git log -1 --format=%ct)" \
              "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)" > src/scripts/.version
          fi
          if [ -f src/scripts/.version ]; then cp src/scripts/.version "$EVIDENCE/version.txt"; fi
          python3 "$TOOLS/control.py" build make UNATTENDED=yes VPP_EXCLUDED_PLUGINS= build
          python3 "$TOOLS/control.py" binaries

      - name: Prepare real test runtime
        timeout-minutes: 3
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ runner.temp }}/integration-evidence/runtime-setup

      - name: Require CPUs namespaces and TAP devices
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 "$TOOLS/control.py" environment bash -euo pipefail -c '
            python3 -c "import os,pathlib; cpus=sorted(os.sched_getaffinity(0)); roots=[pathlib.Path(f\"/sys/devices/system/cpu/cpu{cpu}/topology\") for cpu in cpus]; cores={(p.joinpath(\"physical_package_id\").read_text().strip(),p.joinpath(\"core_id\").read_text().strip()) for p in roots}; required=3 if os.environ[\"CASE\"] == \"fixed-ipsec_esp\" else 2; print(dict(cpus=cpus,physical_cores=sorted(cores),required=required)); assert len(cores) >= required"
            mountpoint /dev/shm
            test "$(df -B1 --output=size /dev/shm | tail -n 1)" -ge 2147483648
            ns="integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap '\''ip netns del "$ns"'\'' EXIT
            ip netns add "$ns"
            ip netns exec "$ns" ip link set lo up
            ip netns exec "$ns" ip tuntap add dev probe mode tap
            ip netns exec "$ns" ip link del probe
            test -c /dev/net/tun
            test -c /dev/vhost-net
            (: <> /dev/net/tun)
            (: <> /dev/vhost-net)
            uname -a
            dpkg-query -W clang-format-19 python3
          '

      - name: Execute complete fixed suite or precise intended failure
        timeout-minutes: 52
        run: python3 "$TOOLS/control.py" tests

      - name: Retain bounded diagnostics and complete provenance
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integration-evidence"
          if [ -f "$RUNNER_TEMP/integration-tools/control.py" ]; then
            python3 "$RUNNER_TEMP/integration-tools/control.py" finalize
          fi

      - name: Upload every outcome with complete callbacks and events
        id: evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Record artifact and pending final acceptance
        if: always()
        timeout-minutes: 1
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          printf 'Artifact ID: %s\nArtifact URL: %s\nArtifact digest: %s\n' \
            "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Intermediate required24 only. Final26 and M44 INTERPOSE remain pending. Coverage gaps are in manifest.json.' >> "$GITHUB_STEP_SUMMARY"

  acceptance:
    needs: control
    if: always() && github.ref == 'refs/heads/feat/integration-runtime-controls-ff50-octobe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all independent variant evidence
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          pattern: integration-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-results

      - name: Require ready24 and each precise paired source control
        timeout-minutes: 2
        env:
          RESULT_ROOT: ${{ runner.temp }}/integration-results
          MATRIX_RESULT: ${{ needs.control.result }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          root = Path(os.environ['RESULT_ROOT'])
          expected_tree = '293b103fb64948865d788a7abc0d585b2c235f3a'
          fixed = ['linux_cp', 'linux_cp_lifecycle', 'linux_cp_netlink', 'ipsec_esp', 'gre', 'gre_teib', 'ip_mcast']
          negatives = ['router-add', 'router-delete', 'router-sweep', 'router-permanent', 'lifecycle-fd',
                       'lifecycle-failure', 'lifecycle-refresh', 'lifecycle-flags', 'lifecycle-vlan-add',
                       'lifecycle-vlan-delete', 'lifecycle-namespace', 'netlink-pair', 'netlink-dump',
                       'tunnel-df', 'gre-config', 'gre-ingress']
          expected = {'fixed-' + suite for suite in fixed} | set(negatives)
          records, errors, hashes = {}, [], {}
          for directory in sorted(root.glob('integration-*')):
              try:
                  manifest = json.loads((directory / 'manifest.json').read_text())
                  result = json.loads((directory / 'acceptance.json').read_text())
                  name = result['case']
                  assert name in expected and name not in records, 'Unknown or duplicate variant'
                  assert result['status'] == 'PASS', 'Variant did not pass strict classifier'
                  assert result['integration_tree'] == manifest['integration_tree'] == expected_tree
                  assert result['workflow_sha'] == manifest['workflow_sha'] == os.environ['WORKFLOW_SHA']
                  assert result['run'] == manifest['run_id'] == os.environ['GITHUB_RUN_ID']
                  assert result['attempt'] == manifest['attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
                  assert manifest['case'] == name
                  for phase in ['prepare', 'dependencies', 'feature-list', 'c-style', 'api-style', 'c-formatter',
                                'python-style', 'python-pin', 'mutate', 'build', 'binaries', 'environment', 'tests', 'finalize']:
                      assert json.loads((directory / f'phase-{phase}.json').read_text())['status'] == 'PASS', phase
                  callback = json.loads((directory / 'runtime/callbacks.json').read_text())
                  assert callback['complete'] and callback['sources'] and callback['event_sources']
                  index = json.loads((directory / 'evidence-index.json').read_text())
                  for path in ['manifest.json', 'acceptance.json', 'runtime/callbacks.json', 'runtime/result.json']:
                      data = (directory / path).read_bytes()
                      assert index[path] == dict(bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
                  for source in callback['event_sources']:
                      data = (directory / 'runtime' / source['path']).read_bytes()
                      assert len(data) == source['bytes'] and hashlib.sha256(data).hexdigest() == source['sha256']
                  runtime = json.loads((directory / 'runtime/result.json').read_text())
                  assert runtime['status'] == 'completed' and runtime['cleanup_complete'] and not runtime['infrastructure']
                  assert not runtime.get('unresolved_processes') and not runtime.get('supervisor_rc')
                  expected_failfast = 'FAILFAST=1' if name in ('tunnel-df', 'lifecycle-refresh') else 'FAILFAST=0'
                  assert [arg for arg in runtime['command'] if arg.startswith('FAILFAST=')] == [expected_failfast]
                  if name.startswith('fixed-'):
                      assert result['built_tree'] == expected_tree and 'restoration' not in manifest
                      assert not (collections.Counter(result['required']) - collections.Counter(result['successes']))
                  else:
                      assert manifest['restoration']['name'] == name and result['built_tree'] != expected_tree
                  records[name] = (result, manifest)
                  hashes[name] = {path: hashlib.sha256((directory / path).read_bytes()).hexdigest()
                                  for path in ['manifest.json', 'acceptance.json', 'runtime/callbacks.json']}
              except (OSError, ValueError, KeyError, AssertionError) as error:
                  errors.append(f'{directory.name}: {error}')
          if set(records) != expected:
              errors.append(f'Missing variants: {sorted(expected - set(records))}')
          if os.environ['MATRIX_RESULT'] != 'success':
              errors.append('One or more independent jobs failed')
          required = []
          for suite in fixed:
              if 'fixed-' + suite in records:
                  required.extend(records['fixed-' + suite][0]['required'])
          if len(required) != 24 or len(set(required)) != 24:
              errors.append('Required24 inventory incomplete or duplicated')
          for name in negatives:
              if name not in records:
                  continue
              result, manifest = records[name]
              paired = records.get('fixed-' + result['paired_fixed'])
              if paired is None or collections.Counter(paired[0]['successes'])[result['intended_failure']] != 1:
                  errors.append(f'{name}: no corresponding actual fixed success')
          assessment = dict(status='FAIL' if errors else 'PASS', errors=errors, expected_variants=sorted(expected),
                            required24=required, evidence_sha256=hashes, integration_tree=expected_tree,
                            workflow_sha=os.environ['WORKFLOW_SHA'], run=os.environ['GITHUB_RUN_ID'],
                            attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                            final26='PENDING: M44 final two ip4 methods plus C INTERPOSE regression',
                            m43_negative='UNVERIFIED / ON HOLD; fixed full ip_mcast and three actual successes required',
                            claim='Intermediate required24 and enabled functional controls only; not final audit acceptance')
          (root / 'aggregate.json').write_text(json.dumps(assessment, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(assessment['claim'] + '\n\nStatus: ' + assessment['status'] + '\n')
              stream.write('\n'.join(errors) + '\n')
          if errors:
              sys.exit(1)
          PY

      - name: Upload task-mapped intermediate acceptance
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: integration-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/integration-results/aggregate.json
          retention-days: 7
          if-no-files-found: error
