                  before = content(TREE, path)
              result = before
              for old, new in steps:
                  require(old != new and result.count(old) == 1, f"Ambiguous owner recipe {name}")
                  result = result.replace(old, new, 1)
              require(oid(result) == after, f"Owner output blob differs: {name}: {oid(result)}")
              reverse = result
              for old, new in reversed(steps):
                  require(reverse.count(new) == 1, f"Ambiguous inverse {name}")
                  reverse = reverse.replace(new, old, 1)
              require(reverse == before, "Recipe is not byte reversible")
              return dict(name=name, path=path, kind=kind, before_blob=oid(before), after_blob=after,
