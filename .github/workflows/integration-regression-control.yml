                      path, after, selector = interface, "fc05accd60c0e161af615e6874a053030238109e", "linux_cp_lifecycle.TestLinuxCPNamespaceOwnership.test_equal_ifindex_namespace_delete"
                      steps = [(b"  if (lcp_itf_pair_find_by_vif (lip->lip_vif_index) == lipi)\n    hash_unset (lip_db_by_vif, lip->lip_vif_index);", b"  hash_unset (lip_db_by_vif, lip->lip_vif_index);")]
                  elif name == "netlink-pair":
                      path, after, selector = nl, "49ba5277830f1a50f6f05e1769df98e42b775aae", "linux_cp_netlink.TestLinuxCPNetlinkSocketOwnership.test_pair_add_during_netlink_recovery"
                      steps = [(b"lcp_nl_pair_add_cb (lcp_itf_pair_t *pair)\n{\n  nl_main_t *nm = &nl_main;\n\n  if (nm->nl_status == NL_STATUS_SYNC)\n    return;\n\n  if (!nm->sk_route)", b"lcp_nl_pair_add_cb (lcp_itf_pair_t *pair)\n{\n  nl_main_t *nm = &nl_main;\n\n  if (!nm->sk_route)")]
                  elif name == "netlink-dump":
                      path, after, selector = nl, "686f9309ff4a3d4eeca7e6920efd1feda6ccf643", "linux_cp_netlink.TestLinuxCPNetlinkDumpCompletion.test_dump_completion_errors"
                      steps = [(b"  while (nlmsg_ok (hdr, n_bytes))\n    {\n      if (hdr->nlmsg_flags & NLM_F_DUMP_INTR)\n\t{\n\t  err = -NLE_DUMP_INTR;\n\t  goto out;\n\t}\n\n      nlmsg_free (msg);", b"  while (nlmsg_ok (hdr, n_bytes))\n    {\n      nlmsg_free (msg);")]
                      original = content(TREE, path)
                      start = original.index(b"      if (hdr->nlmsg_type == NLMSG_DONE)\n")
                      end = original.index(b"\n\t}", start) + 3
                      steps.append((original[start:end], b"      if (hdr->nlmsg_type == NLMSG_DONE)\n\t{\n\t  done = 1;\n\t  goto out;\n\t}"))
                  elif name == "tunnel-df":
                      path, after, selector = "src/vnet/tunnel/tunnel_dp.h", "fd0d60c0a1a3021b22dad1d52fc3e54049bade46", "ipsec_esp.TestIpsecEspTun.test_tun_df44"
                      steps = [(b"      u16 old_flags = outer->flags_and_fragment_offset;\n\n      ip4_header_set_df (outer);\n\n      sum = ip_csum_update (outer->checksum, old_flags, outer->flags_and_fragment_offset,\n\t\t\t    ip4_header_t, flags_and_fragment_offset);\n", b"      u16 tos = outer->flags_and_fragment_offset;\n\n      ip4_header_set_df (outer);\n\n      sum =\n\tip_csum_update (outer->checksum, tos, outer->tos, ip4_header_t,\n\t\t\tflags_and_fragment_offset);\n")]
