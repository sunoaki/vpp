                  else:
                      raise AssertionError("Cleanup deadline published command success")
              result = json.loads((OUT / "fixture-cleanup-deadline/result.json").read_text())
              require(result["rc"] == 0 and result["supervisor_rc"] == 125 and not result["cleanup_complete"] and
                      len(result["cleanup_errors"]) == 2 and
                      [value["signal"] for value in result["cleanup_errors"]] == [15, 9],
                      "Command discarded raw exit or cleanup deadline evidence")
              save("cleanup-boundary-fixtures.json", dict(status="PASS", boundaries=4,
                   signals="proven pidfd only", cleanup_complete=False, raw_rc=0, supervisor_rc=125))

          def parent_identity_fixtures():
              from unittest.mock import patch
              for boundary in ("before", "after", "attributable", "snapshot"):
                  owner = OwnedProcesses()
                  key = (500, "parent")
                  parent = (os.getpid(), "parent", "S")
                  child = (500, "child", "S")
                  owner.candidate(500, parent, {})
                  owner.handles[key] = (50, 51)
                  owner.resolve(key, "bound")
                  owner.candidate(600, child, {500: parent})
                  replacement = (os.getpid(), "replacement", "R")
                  parents = iter([parent, replacement] if boundary == "after" else [replacement])
                  def identity(fd):
                      return child if fd == 60 else next(parents)
                  with patch.object(os, "open", return_value=60), patch.object(os, "pidfd_open", return_value=61), \
                       patch.object(os, "close"), patch.object(owner, "identity", side_effect=identity), \
                       patch.object(owner, "exited", return_value=False), patch.object(signal, "pidfd_send_signal") as sent:
                      result = (owner.attributable(child, {500: replacement if boundary == "snapshot" else parent})
                                if boundary in ("attributable", "snapshot") else owner.bind(600, child))
                      require(not result and not sent.called, "Changed parent established child authority")
                  record = owner.acquisitions[key]
                  witness = dict(record["birth_mismatch"])
                  require(record["reused"] and key in owner.unresolved and record["status"] == "pending" and
                          witness["stage"] == {"before": "parent_before", "after": "parent_after",
                              "attributable": "attributable_direct", "snapshot": "attributable_snapshot"}[boundary],
                          "Parent mismatch lacks sticky first witness")
                  owner.observe(key, (os.getpid(), "another", "Z"), "later_parent")
