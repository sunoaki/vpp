# SPDX-License-Identifier: Apache-2.0
# Temporary branch-only evidence. Never merge this workflow into master.
name: Temporary immutable integration controls

on:
  push:
    branches: [feat/integration-runtime-controls-ff50-octobe]

permissions:
  contents: read

concurrency:
  group: integration-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control:
    if: github.ref == 'refs/heads/feat/integration-runtime-controls-ff50-octobe'
    name: integration / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - fixed-linux_cp
          - fixed-linux_cp_lifecycle
          - fixed-linux_cp_netlink
          - fixed-ipsec_esp
          - fixed-gre
          - fixed-gre_teib
          - fixed-ip_mcast
          - router-add
          - router-delete
          - router-sweep
          - router-permanent
          - lifecycle-fd
          - lifecycle-failure
          - lifecycle-refresh
          - lifecycle-flags
          - lifecycle-vlan-add
          - lifecycle-vlan-delete
          - lifecycle-namespace
          - netlink-pair
          - netlink-dump
          - tunnel-df
          - gre-config
          - gre-ingress
    container:
      image: debian:trixie
      options: >-
        --shm-size=2g
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --security-opt=apparmor=unconfined
        --device-cgroup-rule="c 10:200 rwm"
        --device-cgroup-rule="c 10:238 rwm"
    defaults:
      run:
        shell: bash
    env:
      CASE: ${{ matrix.case }}
      WORKFLOW_SHA: ${{ github.sha }}
      CLANG_FORMAT_VER: "19"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Bootstrap bounded tools and upload reserve
        timeout-minutes: 6
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/integration-tools"
          evidence="$RUNNER_TEMP/integration-evidence"
          mkdir -p "$tools" "$evidence"
          printf 'TOOLS=%s\nEVIDENCE=%s\nWORK_DEADLINE=%s\n' \
            "$tools" "$evidence" "$(( $(date +%s) + 6600 ))" >> "$GITHUB_ENV"
          printf '{"workflow":"%s","case":"%s","run":"%s","attempt":"%s","job":"%s","status":"bootstrap","expected_tree":"293b103fb64948865d788a7abc0d585b2c235f3a","scoped_files":22,"required_methods":24}\n' \
            "$WORKFLOW_SHA" "$CASE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" > "$evidence/bootstrap.json"
          for phase in prepare dependencies feature-list c-style api-style c-formatter python-style python-pin mutate build binaries environment tests finalize; do
            printf '{"action":"%s","status":"NOT_RUN","rc":null}\n' "$phase" > "$evidence/phase-$phase.json"
          done
          rm -f /etc/apt/apt.conf.d/docker-clean
          rc=0
          timeout --signal=TERM --kill-after=5s 300s bash -euo pipefail -c \
            'apt-get update -qq; apt-get install -y -qq sudo make git bash iproute2 python3' \
            > "$evidence/bootstrap.log" 2>&1 || rc=$?
          tail -c 8388608 "$evidence/bootstrap.log" > "$evidence/bootstrap-tail.log"
          mv "$evidence/bootstrap-tail.log" "$evidence/bootstrap.log"
          printf '{"rc":%s}\n' "$rc" > "$evidence/bootstrap-result.json"
          exit "$rc"

      - name: Check out the exact workflow before reading style inputs
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Materialize external immutable tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cp .github/workflows/integration-regression-control.yml "$EVIDENCE/workflow.yml"
          cat > "$TOOLS/sitecustomize.py" <<'PY'
          import json
          import os
          import sys
          import threading
          import traceback
          import unittest
          from pathlib import Path

          destination = os.environ.get("INTEGRATION_EVENTS")
          if destination:
              sequence = 0
              state = threading.local()

              def emit(kind, **values):
                  global sequence
                  sequence += 1
                  record = dict(kind=kind, pid=os.getpid(), sequence=sequence, **values)
                  data = (json.dumps(record, sort_keys=True) + "\n").encode()
                  path = Path(destination + f".{os.getpid()}.jsonl")
                  if len(data) > 256 * 1024 or (path.exists() and path.stat().st_size + len(data) > 32 * 1024 * 1024):
                      raise RuntimeError("Integration observer capacity exceeded; refusing partial evidence")
                  with path.open("ab") as stream:
                      stream.write(data)

              def wrap(name):
                  original = getattr(unittest.TestResult, name)
                  def observed(self, test, *args):
                      if name == "startTest":
                          state.test = test.id()
                      record = dict(test=test.id())
                      if name == "startTest":
                          config = getattr(sys.modules.get("config"), "config", None)
                          record.update(netns=getattr(config, "skip_netns_tests", None),
                                        excluded=list(getattr(config, "excluded_plugins", [])),
                                        workers=getattr(test.__class__, "vpp_worker_count", 0),
                                        cmdline=list(getattr(test.__class__, "vpp_cmdline", [])))
                      if name in ("addError", "addFailure", "addExpectedFailure", "addSubTest"):
                          error = args[-1]
                          if error:
                              record.update(exception=error[0].__name__, traceback="".join(traceback.format_exception(*error)))
                      if name == "addSubTest":
                          subtest = args[0]
                          record.update(parent_test=test.id(), subtest_id=subtest.id(),
                                        subtest_description=str(subtest), params=dict(subtest.params))
                      if name == "addSkip":
                          record["reason"] = str(args[0])
                      emit(name, **record)
                      result = original(self, test, *args)
                      if name == "stopTest":
                          state.test = None
                      return result
                  setattr(unittest.TestResult, name, observed)

              for name in ("startTest", "stopTest", "addSuccess", "addFailure", "addError", "addSkip",
                           "addExpectedFailure", "addUnexpectedSuccess", "addSubTest"):
                  wrap(name)
              original_stop = unittest.TestResult.stopTestRun
              def stop(self):
                  emit("completed", tests=self.testsRun, errors=len(self.errors), failures=len(self.failures),
                       skips=len(self.skipped), expected=len(self.expectedFailures), unexpected=len(self.unexpectedSuccesses))
                  return original_stop(self)
              unittest.TestResult.stopTestRun = stop

              def profile(frame, event, value):
                  if event != "return":
                      return
                  path, name = frame.f_code.co_filename, frame.f_code.co_name
                  if path.endswith("/run_tests.py") and name == "__call__":
                      owner = frame.f_locals.get("self")
                      case = frame.f_locals.get("test_method")
                      if owner.__class__.__name__ == "SplitToSuitesCallback" and case is not None:
                          suite = owner.suites.get(owner.suite_name)
                          if suite is not None and any(item is case for item in suite):
                              emit("selected", test=case.id())
                      return
                  if not getattr(state, "test", None):
                      return
                  record = dict(test=state.test, file=path, function=name, line=frame.f_code.co_firstlineno)
                  if path.endswith("/vpp_papi_provider.py") and name in ("cli", "cli_return_response"):
                      record.update(command=frame.f_locals.get("cli"), value=str(value))
                  elif path.endswith("/vpp_papi_provider.py") and name == "api":
                      record.update(api=getattr(frame.f_locals.get("api_fn"), "__name__", None),
                                    arguments=repr(frame.f_locals.get("api_args")), retval=frame.f_locals.get("retval"),
                                    value=repr(value))
                  elif path.endswith(("/test_linux_cp.py", "/test_linux_cp_netlink.py", "/test_linux_cp_lifecycle.py")) and name in (
                          "_stats", "_netlink_stats", "_router", "poll_for", "_namespace_fd_count", "_fd_count", "_pairs"):
                      record.update(value=str(value), description=frame.f_locals.get("description"),
                                    actual=repr(frame.f_locals.get("actual")), expected=repr(frame.f_locals.get("expected")),
                                    namespace=frame.f_locals.get("namespace"))
                  elif path.endswith("/test_gre_teib.py") and name == "assert_ingress":
                      owner = frame.f_locals["owner"]
                      record.update(owner=owner.sw_if_index, before=frame.f_locals.get("before"),
                                    packets=len(frame.f_locals.get("packets", [])), received=len(frame.f_locals.get("received", [])))
                  else:
                      return
                  if len(str(record).encode()) > 128 * 1024:
                      raise RuntimeError("Integration helper record exceeds capacity")
                  emit("helper", **record)
              if sys.getprofile() is not None:
                  raise RuntimeError("Integration observer profile slot already occupied")
              sys.setprofile(profile)
              threading.setprofile(profile)
              emit("loaded")
          PY
          cat > "$TOOLS/control.py" <<'PY'
          import ast
          import collections
          import ctypes
          import difflib
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import selectors
          import signal
          import stat
          import subprocess
          import sys
          import time

          BASE = "630f876bc326eee05c23d517600b72e8d6a6ec83"
          INTEGRATION = "646bccb9f3f601c25e828f0155c97e910e7ac0be"
          TREE = "293b103fb64948865d788a7abc0d585b2c235f3a"
          WORKFLOW = ".github/workflows/integration-regression-control.yml"
          INPUTS = [
              ("M33", "712f93e232f759c0585491ccd5fa2b7fa12478e6", {
                  "src/plugins/linux-cp/lcp.rst": "0eafbd92ebf35abe6ab78f5cda9612c586e01aa9",
                  "src/plugins/linux-cp/lcp_router.c": "cf352d6c35c5561695c57b235f9b54b16b78c4c8",
                  "src/plugins/linux-cp/lcp_router.h": "5f1ec5dfe8b67f5d555dea4e277bc858a1f3616b",
                  "src/plugins/linux-cp/test/lcp_unittest.c": "75aa2f0c3f307c4d159a334c0d39c5ef55b0c8e1",
                  "test/test_linux_cp.py": "5fe4b23371398a5edacfe22c106cba677186e765"}),
              ("M36", "48df11100f429a2174bb866c3abb33d2af66501f", {
                  "src/plugins/linux-cp/lcp.api": "82135513fac65e72c10d53e9e0f8cb4daf3b0eb3",
                  "src/plugins/linux-cp/lcp.c": "90daafd78ca6229891a750faca0f660342991e1e",
                  "src/plugins/linux-cp/lcp_interface.c": "1b9a5a789db8b7b1e103170cc438a1fd195019e5",
                  "src/plugins/linux-cp/lcp_interface.h": "5324731ebf68a3f78813b0a3143448041fb7672c",
                  "test/test_linux_cp_lifecycle.py": "cfcb2b404c8b64d7c06a869909c6f602feff8c9d"}),
              ("M37", "0386481f791cc2a11a8afbb7d69881ae17826371", {
                  "src/plugins/linux-cp/lcp_nl.c": "c51aeb54fc7cc2eb465059277e6f884a504fa37b",
                  "src/plugins/linux-cp/lcp_nl.h": "1e963053474c6f11d451c49a7d3c572c6b86e991",
                  "test/test_linux_cp_netlink.py": "1c03f2dd5e27de79e91c5f6fcc104979124b103d"}),
              ("M40", "815eaa339772c4c715ac0890fe2c2b136f694fe9", {
                  "src/vnet/tunnel/tunnel_dp.h": "468c628236393f184ab64736441fe1b7bbd40e36",
                  "test/test_ipsec_esp.py": "093794c2074bbdf66f9350308439e833a03dccc6"}),
              ("M42", "8ae66e1d9f9deee0fbeec3ed1e910ab132b84785", {
                  "src/plugins/gre/gre.h": "7ed347d0ff765c2eee2785838e855a3ad7703834",
                  "src/plugins/gre/interface.c": "f9f52823ea322d776937d939f5d4d4e37666229b",
                  "test/test_gre_teib.py": "fe80bb2566a62be3ba443a2995ba544bf4be1063"}),
              ("M43", "3be7fb661fe0bdc82df628194433887b0326258a", {
                  "src/plugins/unittest/mfib_test.c": "cb4c919427e6059b1cf8de6e14a990595e514e36",
                  "src/vnet/mfib/mfib_entry.c": "66f8faf3543beae2666aad39f4961de4a1496f91",
                  "test/test_ip_mcast.py": "61e55c0622b90c560956507f278d9538175a8195"}),
              ("M39", "2e8b1e68964c8473ec13149d111be12ffa20dfba", {
                  ".github/workflows/pr-verify.yml": "1c42770dbfa97b62dcf66d10af7b94c3e0e782eb"})]
          READY = {
              "linux_cp": {"TestLinuxCPNetlinkRecovery": ["netlink_poll_error_recovery", "netlink_poll_error_invalid_fd",
                  "router_source_ownership", "router_partial_delete_ownership", "router_mpls_ownership",
                  "router_linux_replace_replay", "router_bound_table_sweep", "router_broadcast_recovery"]},
              "linux_cp_lifecycle": {"TestLinuxCPLifecycle": ["default_namespace_resources", "default_namespace_failure",
                  "pair_replace_resend", "pair_flags_pool_reuse", "vlan_resources"],
                  "TestLinuxCPNamespaceOwnership": ["equal_ifindex_namespace_delete"]},
              "linux_cp_netlink": {"TestLinuxCPNetlinkSocketOwnership": ["pair_add_during_netlink_recovery"],
                  "TestLinuxCPNetlinkDumpCompletion": ["dump_completion_errors", "dump_completion_success"]},
              "ipsec_esp": {"TestIpsecEspTun": ["tun_df44"]},
              "gre_teib": {"TestGreTeib": ["gre_teib_ipv4", "gre_teib_ipv6", "gre_teib_cross_mp"]},
              "ip_mcast": {"TestIPMcast": ["mfib_zero_flags_ip4", "mfib_zero_flags_ip6"], "TestMFIB": ["mfib"]}}
          GAPS = [
              "M44 final two ip4 methods and fib INTERPOSE regression pending M35 scope release; intermediate24 is not final26 acceptance",
              "M33 MPLS invalid-index unlock guard lacks ordinary failure witness; permanent-source negative stops before recovery/packet send",
              "M36 heap vectors, socket/link owners, direct-add refresh, startup failure, allocation/connect failures, getter alias/fd0 and invalid length lack independent existing runtime oracles",
              "M36 fd counts do not prove heap cleanup; VLAN negative checks <0, not exact -73",
              "M37 restored parser first-case witness does not establish each DONE scenario or exact libnl error mapping",
              "M43 private global extension pool is not measured directly",
              "M43 negative mechanism unverified/on hold after provider refusal; no crash reproduction is implemented"]
          CASE = os.environ.get("CASE", "fixed-linux_cp")
          OUT = Path(os.environ.get("EVIDENCE", "."))
          TOOLS = Path(os.environ.get("TOOLS", "."))
          CALLBACK = re.compile(r"--- (add\w+)\(\) (\w+)\.(\w+)\(")
          INFRA = re.compile(r"VppTransportSocketIOError|VppDiedError|Vpp dead|VPP subprocess died unexpectedly|"
                             r"VPP died shortly after startup|Exception connecting to (?:vapi|VPP)|PUMP THREAD TIMEOUT|"
                             r"SIGSEGV|segmentation fault|Core was generated|Core file present,|AddressSanitizer|"
                             r"timed out|TimeoutError|not enough cpus|Skipping tests due to setup failure|"
                             r"(?:^|\n)SKIP:|OK \(skipped=", re.I)

          def require(value, message):
              if not value:
                  raise AssertionError(message)

          def git(*args, env=None, data=None):
              return subprocess.check_output(["git", *args], env=env, input=data)

          def textgit(*args, **kwargs):
              return git(*args, **kwargs).decode().strip()

          def content(ref, path):
              return git("show", f"{ref}:{path}")

          def oid(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def publish(target, value):
              temporary = target.with_name(target.name + f".{os.getpid()}.pending")
              temporary.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n")
              os.replace(temporary, target)

          def save(name, value):
              publish(OUT / name, value)

          def function(data, name):
              token = b"\n" + name.encode() + b" ("
              require(data.count(token) == 1, f"Ambiguous function {name}")
              point = data.index(token) + 1
              start = data.rfind(b"\n", 0, point - 1) + 1
              return data[start:data.index(b"\n}\n", point) + 3]

          def ready(suite=None):
              return [f"test_{module}.{cls}.test_{method}" for module, classes in READY.items()
                      if suite is None or suite == module for cls, methods in classes.items() for method in methods]

          def initial_manifest():
              OUT.mkdir(parents=True, exist_ok=True)
              value = dict(workflow_sha=os.environ["WORKFLOW_SHA"], workflow_blob=textgit("hash-object", WORKFLOW),
                           patchbase=BASE, integration_base=INTEGRATION, expected_tree=TREE, inputs=INPUTS,
                           case=CASE, required24=ready(), pending=GAPS, status="preparation_pending",
                           run_id=os.environ["GITHUB_RUN_ID"], attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                           job=os.environ["GITHUB_JOB"], repository=os.environ["GITHUB_REPOSITORY"],
                           run_url=f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                           tools={p.name: sha(p.read_bytes()) for p in TOOLS.glob("*.py")})
              save("manifest.json", value)
              # Resolve every pin before checkout or fixtures so failed fetchability has provenance.
              value["resolved"] = {}
              for ref in [BASE, INTEGRATION, *(tip for _, tip, _ in INPUTS)]:
                  value["resolved"][ref] = dict(commit=textgit("rev-parse", f"{ref}^{{commit}}"),
                                                 tree=textgit("rev-parse", f"{ref}^{{tree}}"))
                  save("manifest.json", value)
              return value

          def prepare():
              manifest = initial_manifest()
              require(textgit("rev-parse", "HEAD") == os.environ["WORKFLOW_SHA"], "Wrong workflow commit")
              require(not textgit("status", "--porcelain"), "Dirty workflow checkout")
              for path in ("build-root/build-vpp_debug-native", "build-root/install-vpp_debug-native", "build-root/.ccache", "build-root/test/venv"):
                  require(not Path(path).exists(), f"Build not independent: {path}")
              subprocess.run(["git", "checkout", "--detach", INTEGRATION], check=True)
              seen, patches = set(), []
              for mission, tip, files in INPUTS:
                  actual = textgit("diff", "--name-only", BASE, tip).splitlines()
                  require(set(actual) == set(files) and not seen.intersection(files), f"Unexpected {mission} scope")
                  seen.update(files)
                  for path, blob in files.items():
                      require(textgit("rev-parse", f"{tip}:{path}") == blob, f"Changed reviewed blob {path}")
                  patch = git("diff", "--binary", "--full-index", BASE, tip, "--", *files)
                  subprocess.run(["git", "apply", "--index", "--check", "-"], input=patch, check=True)
                  subprocess.run(["git", "apply", "--index", "-"], input=patch, check=True)
                  (OUT / f"{mission}.patch").write_bytes(patch)
                  patches.append(dict(mission=mission, tip=tip, sha256=sha(patch)))
              require(textgit("write-tree") == TREE, "Composition tree mismatch; owner resolution required")
              for _, _, files in INPUTS:
                  for path, blob in files.items():
                      require(textgit("hash-object", path) == blob, f"Integrated blob mismatch: {path}")
              require(set(textgit("diff", "--cached", "--name-only", INTEGRATION).splitlines()) == seen, "Unexpected integrated paths")
              identity = dict(os.environ, GIT_AUTHOR_NAME="Integration CI", GIT_AUTHOR_EMAIL="ci@example.invalid",
                              GIT_COMMITTER_NAME="Integration CI", GIT_COMMITTER_EMAIL="ci@example.invalid",
                              GIT_AUTHOR_DATE="2026-10-19T00:00:00Z", GIT_COMMITTER_DATE="2026-10-19T00:00:00Z")
              commit = textgit("commit-tree", TREE, "-p", INTEGRATION, env=identity,
                               data=b"ci: construct immutable integration\n\nType: ci\n")
              subprocess.run(["git", "checkout", "--detach", commit], check=True)
              require(not textgit("status", "--porcelain"), "Integrated checkout not clean")
              manifest.update(integration_head=commit, integration_tree=TREE, patches=patches, status="prepared")
              manifest["tracked"] = tracked()
              save("manifest.json", manifest)
              fixtures()

          def tracked():
              result = {}
              for entry in git("ls-files", "-s", "-z").split(b"\0"):
                  if not entry:
                      continue
                  metadata, path = entry.split(b"\t", 1)
                  mode = metadata.decode().split()[0]
                  name = path.decode()
                  target = Path(name)
                  data = os.readlink(target).encode() if target.is_symlink() else target.read_bytes()
                  actual_mode = "120000" if target.is_symlink() else "100755" if target.stat().st_mode & 0o111 else "100644"
                  require(actual_mode == mode, f"Tracked file mode changed: {name}")
                  result[name] = dict(mode=actual_mode, blob=oid(data), symlink=target.is_symlink())
              return result

          def verify(variant=True):
              manifest = json.loads((OUT / "manifest.json").read_text())
              require(textgit("rev-parse", "HEAD") == manifest["integration_head"], "Integration HEAD moved")
              expected = dict(manifest["tracked"])
              if variant and manifest.get("restoration"):
                  recipe = manifest["restoration"]
                  expected[recipe["path"]] = dict(expected[recipe["path"]], blob=recipe["after_blob"])
              require(tracked() == expected, "Tracked bytes/modes/symlinks changed outside selected recipe")
              return manifest

          def recipe(name):
              router = "src/plugins/linux-cp/lcp_router.c"
              interface = "src/plugins/linux-cp/lcp_interface.c"
              setter = "src/plugins/linux-cp/lcp.c"
              nl = "src/plugins/linux-cp/lcp_nl.c"
              gre = "src/plugins/gre/interface.c"
              records = {
                  "router-add": (router, "lcp_router_route_add", "921ea99820e1599a0b1d4559750895637b851fd1", "linux_cp.TestLinuxCPNetlinkRecovery.test_router_linux_replace_replay"),
                  "router-delete": (router, "lcp_router_route_del", "d1aea3dcd92e0cf84a6f3694e588ff437b736260", "linux_cp.TestLinuxCPNetlinkRecovery.test_router_partial_delete_ownership"),
                  "router-sweep": (router, "lcp_router_route_sync_end", "d1e793a5131a6a4d1dbd2b998081e1999bf597ec", "linux_cp.TestLinuxCPNetlinkRecovery.test_router_bound_table_sweep"),
                  "router-permanent": (router, "lcp_router_table_add_del_special_routes", "c08f0413bc4ca4c24b8eef241c04576297625e3f", "linux_cp.TestLinuxCPNetlinkRecovery.test_router_broadcast_recovery"),
                  "lifecycle-failure": (setter, "lcp_set_default_ns", "016dadeb32d35e1ee8cf52d5ae30d69a8f088379", "linux_cp_lifecycle.TestLinuxCPLifecycle.test_default_namespace_failure"),
                  "lifecycle-vlan-add": (interface, "lcp_netlink_add_link_vlan", "79b7c054551307b7c9f1f2e52eb799bedadf2d9e", "linux_cp_lifecycle.TestLinuxCPLifecycle.test_vlan_resources"),
                  "lifecycle-vlan-delete": (interface, "lcp_netlink_del_link", "96bfa60b0267f1d7a636f61b204729aa86086923", "linux_cp_lifecycle.TestLinuxCPLifecycle.test_vlan_resources"),
                  "gre-config": (gre, "gre_tunnel_db_find", "f84b6627d14708df6bd2735c14b6d3963bb361e3", "gre_teib.TestGreTeib.test_gre_teib_ipv4"),
                  "gre-ingress": (gre, "gre_tunnel_db_add", "ed3989fb34afcb752a44e1c7a4fb71186eb8e259", "gre_teib.TestGreTeib.test_gre_teib_ipv4")}
              if name in records:
                  path, fn, after, selector = records[name]
                  before = content(TREE, path)
                  steps = [(function(before, fn), function(content(BASE, path), fn))]
                  kind = "literal-base-function"
              else:
                  kind = "literal-base-block"
                  if name == "lifecycle-fd":
                      path, after, selector = setter, "ee82bbcb7e2098546faa5cebb08bffe0ee27a2eb", "linux_cp_lifecycle.TestLinuxCPLifecycle.test_default_namespace_resources"
                      steps = [(b"  if (lcpm->default_ns_fd >= 0)\n    close (lcpm->default_ns_fd);\n  vec_free (lcpm->default_namespace);", b"  vec_free (lcpm->default_namespace);")]
                      kind = "isolated-owner-regression"
                  elif name == "lifecycle-flags":
