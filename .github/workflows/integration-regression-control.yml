                      owner.reconcile({})
                      owner.reconcile({})
                  require(not owner.resolve(key, "bound") and not owner.resolve(key, "vanished") and
                          not owner.bind(500, parent), "Parent mismatch bypassed sticky guards")
                  clock = [0.0]
                  with patch.dict(globals(), processes=lambda: {500: parent}), \
                       patch.object(owner, "exited", return_value=True), patch.object(os, "close"), \
                       patch.object(os, "waitid"), patch.object(signal, "pidfd_send_signal"), \
