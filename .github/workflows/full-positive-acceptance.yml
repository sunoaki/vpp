# SPDX-License-Identifier: Apache-2.0
name: Full positive acceptance

on:
  push:
    branches: [validation/full-positive-20261022]

permissions:
  contents: read
  actions: read

concurrency:
  group: full-positive-cce149c4d1ccd2d4ab88d07acc92478a82a2b100
  cancel-in-progress: false

jobs:
  full-positive:
    name: Full positive execution
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    timeout-minutes: 360
    container:
      image: debian:trixie
      options: >-
        --shm-size=2g
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --security-opt=apparmor=unconfined
        --device-cgroup-rule="c 10:200 rwm"
        --device-cgroup-rule="c 10:238 rwm"
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE_SHA: cce149c4d1ccd2d4ab88d07acc92478a82a2b100
      CANDIDATE_TREE: dc04885a19d9b3acfe1ab1184f83239031ef6e6b
      CANDIDATE_PARENT: 626c341265faa473681e373013645701fc12aedd
      CANDIDATE_BASE: 415599eade17cc745989b5c92e7f3c12e5d0ce60
      CLANG_FORMAT_VER: "19"
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
      VPP_EXTRA_CMAKE_ARGS: >-
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    steps:
      - name: Install base tools
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update -qq
          apt-get install -y -qq sudo make git bash python3 iproute2 binutils procps curl ca-certificates

      - name: Check out the control carrier
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          ref: cce149c4d1ccd2d4ab88d07acc92478a82a2b100
          path: candidate
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check out an independent style workspace
        uses: actions/checkout@v4
        with:
          ref: cce149c4d1ccd2d4ab88d07acc92478a82a2b100
          path: style-source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prepare evidence control and verify identities
        id: identity
        run: |
          set -Eeuo pipefail
          export ACCEPTANCE_ROOT="${RUNNER_TEMP}/full-positive-evidence"
          echo "ACCEPTANCE_ROOT=${ACCEPTANCE_ROOT}" >> "$GITHUB_ENV"
          mkdir "$ACCEPTANCE_ROOT"
          cat > "${RUNNER_TEMP}/full-positive.py" <<'PY'
          import ast
          import hashlib
          import json
          import os
          import re
          import shutil
          import stat
          import subprocess
          import sys
          import threading
          import time
          from pathlib import Path

          root = Path(os.environ["ACCEPTANCE_ROOT"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          candidate = workspace / "candidate"
          source_sha = os.environ["CANDIDATE_SHA"]
          source_tree = os.environ["CANDIDATE_TREE"]
          parent = os.environ["CANDIDATE_PARENT"]
          base = os.environ["CANDIDATE_BASE"]
          suites = ["linux_cp", "linux_cp_lifecycle", "linux_cp_netlink", "gre",
                    "gre_teib", "ip_mcast", "ip4", "ipsec_esp", "fib"]
          limit_bytes = 256 * 1024 * 1024
          limit_file = 32 * 1024 * 1024
          limit_count = 2000
          callbacks = re.compile(r" --- (add\w+)\(\) (\w+)\.(\w+)\(")

          def save(path, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, indent=2) + "\n")

          def load(path):
              return json.loads(path.read_text())

          def git(*args, cwd=candidate):
              return subprocess.check_output(["git", *args], cwd=cwd)

          def text(*args, cwd=candidate):
              return git(*args, cwd=cwd).decode().strip()

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          def attribution():
              provenance_path = root / "provenance.json"
              return {"carrier_sha": os.environ["GITHUB_SHA"], "candidate_sha": source_sha,
                      "candidate_tree": source_tree,
                      "built_source_tree": load(provenance_path)["built_source_tree"]
                      if provenance_path.exists() else "UNAVAILABLE: build provenance not yet recorded"}

          def pool_usage(optional):
              files = [p for p in root.rglob("*") if p.is_file() and not p.is_symlink()
                       and ("optional" in p.relative_to(root).parts) == optional]
              return len(files), sum(p.stat().st_size for p in files)

          def reserve(size, optional=False):
              count, total = pool_usage(optional)
              byte_budget, file_budget = (16 * 1024 * 1024, 256) if optional else (168 * 1024 * 1024, 1488)
              if size > limit_file or count >= file_budget or total + size > byte_budget:
                  raise RuntimeError("Evidence pool exceeded; mandatory evidence INCOMPLETE")

          def copy_file(source, destination, required=False):
              if source.is_symlink() or not source.is_file():
                  if required:
                      raise RuntimeError(f"Missing or unsafe required file: {source}")
                  return {"path": str(source), "status": "unsafe-or-missing"}
              size = source.stat().st_size
              sha = hashlib.sha256()
              with source.open("rb") as stream:
                  for part in iter(lambda: stream.read(1024 * 1024), b""):
                      sha.update(part)
              record = {"path": str(source), "size": size, "sha256": sha.hexdigest()}
              try:
                  reserve(size, optional=not required)
              except RuntimeError:
                  record["status"] = "required-limit-INCOMPLETE" if required else "omitted-optional-limit"
                  return record
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination, follow_symlinks=False)
              record.update(stored=str(destination.relative_to(root)), status="copied")
              return record

          def command(label, args, cwd=candidate, seconds=1200):
              directory = root / "commands" / label
              directory.mkdir(parents=True, exist_ok=False)
              save(directory / "command.json", {"argv": args, "cwd": str(cwd),
                                               "start": time.time(), "timeout": seconds,
                                               "identity": attribution()})
              try:
                  reserve(limit_file)
              except RuntimeError as error:
                  save(directory / "result.json", {"status": "NOT_RUN/INCOMPLETE", "end": time.time(),
                       "error": str(error), "identity": attribution()})
                  raise
              script = '''set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s "$1" "${@:4}" 2>&1 |
            (ulimit -f 32768; tee "$2")
          codes=("${PIPESTATUS[@]}")
          printf '%s\\n' "${codes[0]}" > "$3/raw-returncode.txt"
          printf '%s\\n' "${codes[1]}" > "$3/capture-returncode.txt"
          test "${codes[0]}" = 0 && test "${codes[1]}" = 0
          '''
              result = subprocess.run(["bash", "-c", script, "acceptance", str(seconds),
                                       str(directory / "command.log"), str(directory), *args], cwd=cwd)
              save(directory / "result.json", {"returncode": result.returncode, "end": time.time()})
              if result.returncode:
                  raise RuntimeError(f"Command failed: {label}")

          def clean(cwd=candidate):
              if git("status", "--porcelain", "--untracked-files=no", cwd=cwd):
                  raise RuntimeError(f"Tracked source drift: {cwd}")

          def manifest():
              return git("ls-tree", "-r", "-z", source_tree)

          def verify_source():
              if text("rev-parse", "HEAD") != source_sha:
                  raise RuntimeError("Candidate HEAD changed")
              if text("rev-parse", "HEAD^{tree}") != source_tree:
                  raise RuntimeError("Candidate tree changed")
              clean()
              version = candidate / "src/scripts/.version"
              provenance_path = root / "provenance.json"
              if provenance_path.exists():
                  provenance = load(provenance_path)
                  if version.is_symlink():
                      raise RuntimeError("Version became a symlink")
                  if provenance["version"]["source"] == "src/scripts/.version":
                      if not version.is_file() or digest(version.read_bytes()) != provenance["version"]["sha256"]:
                          raise RuntimeError("Build version drift")
                  elif version.exists():
                      raise RuntimeError("Unexpected build version file")
                  else:
                      current = git("describe", "--long", "--match", "v*")
                      if digest(current) != provenance["version"]["sha256"]:
                          raise RuntimeError("Tag-derived build version drift")
                  if digest((root / "built-source-manifest.nul").read_bytes()) != provenance["built_manifest_sha256"]:
                      raise RuntimeError("Built manifest evidence drift")
                  binaries_path = root / "binaries.json"
                  if binaries_path.exists():
                      for binary in load(binaries_path).values():
                          if file_identity(Path(binary["path"])) != {key: value for key, value in binary.items() if key != "build_id"}:
                              raise RuntimeError("Installed binary drift: " + binary["path"])

          def identity():
              for path in [candidate, workspace / "style-source", workspace / "control"]:
                  subprocess.run(["git", "config", "--global", "--add", "safe.directory", str(path)], check=True)
              verify_source()
              if text("show", "-s", "--format=%P", source_sha) != parent:
                  raise RuntimeError("Candidate sole parent mismatch")
              if text("show", "-s", "--format=%P", parent) != base:
                  raise RuntimeError("Candidate base mismatch")
              expected = "a0498570cd61e9135fe26dff6def7eb72dc6d26c"
              if text("rev-parse", f"HEAD:.github/workflows/pr-verify.yml") != expected:
                  raise RuntimeError("Candidate original workflow changed")
              carrier = workspace / "control"
              if text("rev-parse", "HEAD", cwd=carrier) != os.environ["GITHUB_SHA"]:
                  raise RuntimeError("Carrier SHA mismatch")
              data = manifest()
              (root / "candidate-manifest.nul").write_bytes(data)
              save(root / "identity.json", {
                  "candidate_sha": source_sha, "candidate_tree": source_tree,
                  "sole_parent": parent, "base": base, "manifest_sha256": digest(data),
                  "carrier_sha": text("rev-parse", "HEAD", cwd=carrier),
                  "carrier_tree": text("rev-parse", "HEAD^{tree}", cwd=carrier),
                  "workflow_blob": text("rev-parse", "HEAD:.github/workflows/full-positive-acceptance.yml", cwd=carrier),
                  "candidate_workflow_blob": expected,
                  "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
                  "run_id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "job": os.environ["GITHUB_JOB"], "event": os.environ["GITHUB_EVENT_NAME"],
                  "ref": os.environ["GITHUB_REF"], "run_url": os.environ["GITHUB_SERVER_URL"] + "/" +
                  os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
                  "ci01": "OPEN: no natural recovered-retry artifact observed here",
                  "negative": "UNFULFILLED/HOLD", "merge": "HOLD"})
              save(root / "suite-status.json", {suite: "NOT_RUN" for suite in suites})
              command("resources", ["bash", "-c", "id; uname -a; nproc; free -b; df -B1; cat /proc/self/status; cat /etc/os-release; dpkg-query -W"], seconds=60)

          def style():
              directory = workspace / "style-source"
              commits = text("rev-list", "--reverse", f"{base}..{source_sha}", cwd=directory).splitlines()
              if commits != [parent, source_sha]:
                  raise RuntimeError("Unexpected style commit range")
              for commit in commits:
                  subprocess.run(["git", "checkout", "--detach", commit], cwd=directory, check=True)
                  clean(directory)
                  command("feature-" + commit[:8], ["make", "checkfeaturelist"], cwd=directory, seconds=300)
                  command("c-style-" + commit[:8], ["env", "CHECKSTYLE_COMMIT=" + commit, "make", "checkstyle"], cwd=directory, seconds=600)
                  command("api-" + commit[:8], ["make", "checkstyle-api"], cwd=directory, seconds=300)
                  clean(directory)
                  command("message-" + commit[:8], ["bash", "extras/scripts/check_commit_msg.sh"], cwd=directory, seconds=60)
              command("python-style", ["make", "checkstyle-python"], cwd=directory, seconds=1200)
              verify_source()

          def provenance():
              verify_source()
              version = candidate / "src/scripts/.version"
              if version.is_symlink():
                  raise RuntimeError("Unsafe version input")
              described = subprocess.run(["git", "describe", "--tags", "--long", "--match", "v[0-9]*"], cwd=candidate,
                                         stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if described.returncode and not version.exists():
                  stamp = text("log", "-1", "--format=%ct")
                  count = text("rev-list", "--count", "HEAD")
                  short = text("rev-parse", "--short=7", "HEAD")
                  version.write_text(f"0.0.0-release+{stamp}.{count}-g{short}\n")
              if version.exists():
                  if not version.is_file() or not 0 < version.stat().st_size <= 4096:
                      raise RuntimeError("Invalid version input")
                  raw = version.read_bytes()
                  origin = "src/scripts/.version"
              else:
                  raw = git("describe", "--long", "--match", "v*")
                  if not raw.strip() or len(raw) > 4096:
                      raise RuntimeError("Invalid tag version")
                  origin = "git describe --long --match v*"
              (root / "build-version.raw").write_bytes(raw)
              index = root / "source.index"
              env = dict(os.environ, GIT_INDEX_FILE=str(index))
              try:
                  subprocess.run(["git", "read-tree", source_sha], cwd=candidate, env=env, check=True)
                  if origin == "src/scripts/.version":
                      subprocess.run(["git", "add", "-f", "--", origin], cwd=candidate, env=env, check=True)
                  built_tree = subprocess.check_output(["git", "write-tree"], cwd=candidate, env=env).decode().strip()
              finally:
                  index.unlink(missing_ok=True)
              built_manifest = git("ls-tree", "-r", "-z", built_tree)
              (root / "built-source-manifest.nul").write_bytes(built_manifest)
              save(root / "provenance.json", {"candidate_sha": source_sha, "candidate_tree": source_tree,
                   "built_source_tree": built_tree, "built_manifest_sha256": digest(built_manifest),
                   "replacement_count": 0, "version": {"source": origin, "blob": blob(raw), "sha256": digest(raw)},
                   "header": text("rev-parse", "HEAD:src/vnet/tunnel/tunnel_dp.h"),
                   "esp_test": text("rev-parse", "HEAD:test/test_ipsec_esp.py"),
                   "cmake_args": os.environ["VPP_EXTRA_CMAKE_ARGS"]})
              if text("rev-parse", "HEAD:src/vnet/tunnel/tunnel_dp.h") != "468c628236393f184ab64736441fe1b7bbd40e36":
                  raise RuntimeError("ESP header mismatch")
              if text("rev-parse", "HEAD:test/test_ipsec_esp.py") != "093794c2074bbdf66f9350308439e833a03dccc6":
                  raise RuntimeError("ESP test mismatch")
              verify_source()

          def file_identity(path):
              info = path.stat()
              return {"path": str(path), "sha256": digest(path.read_bytes()), "size": info.st_size,
                      "inode": info.st_ino, "major": os.major(info.st_dev), "minor": os.minor(info.st_dev)}

          def install_layout(cache, manifest, config, install, report):
              keys = ["CMAKE_INSTALL_PREFIX", "VPP_LIBRARY_DIR", "CMAKE_INSTALL_LIBDIR"]
              values = {key: [] for key in keys}
              for line in cache.splitlines():
                  match = re.fullmatch(r"([^:#=]+):[^=]+=(.*)", line)
                  if match and match.group(1) in values:
                      values[match.group(1)].append(match.group(2))
              report["cache_values"] = values
              if any(len(values[key]) != 1 for key in keys[:2]) or len(values[keys[2]]) > 1:
                  raise RuntimeError("Missing or duplicate install cache key")
              prefix, library = [values[key][0] for key in keys[:2]]
              generated = re.findall(r'^#define CLIB_LIB_DIR "([^"\n]+)"$', config, re.M)
              report["generated_library_dirs"] = generated
              report["cmake_install_libdir"] = "cached" if values[keys[2]] else "normal variable not cached; generated CLIB_LIB_DIR cross-check required"
              if prefix != str(install):
                  raise RuntimeError("Install prefix differs from fixed candidate root")
              relative = Path(library)
              if (not library or relative.is_absolute() or ".." in relative.parts
                      or str(relative) != library or library == "."
                      or generated != [library] or values[keys[2]] not in ([], [library])):
                  raise RuntimeError("Noncanonical or conflicting install library directory")
              selected = {}
              for name in ["linux_nl_plugin.so", "linux_cp_unittest_plugin.so"]:
                  expected = install / relative / "vpp_plugins" / name
                  matches = [line for line in manifest.splitlines() if Path(line).name == name]
                  report["plugins"][name] = {"query": str(expected), "manifest_paths": matches,
                      "manifest_count": len(matches)}
                  if matches != [str(expected)]:
                      raise RuntimeError("Missing, duplicate or conflicting install manifest entry: " + name)
                  selected[name] = expected
              return selected

          def installed_plugins():
              install = candidate / "build-root/install-vpp_debug-native/vpp"
              build = candidate / "build-root/build-vpp_debug-native/vpp"
              report = {"status": "INCOMPLETE", "identity": attribution(), "install_root": str(install),
                        "plugins": {}, "inputs": [], "skipped_directory_links": []}
              evidence = root / "install-layout"
              evidence.mkdir()
              reserve(65536)
              try:
                  for name in ["CMakeCache.txt", "install_manifest.txt", "CMakeFiles/vppinfra/config.h"]:
                      source = build / name
                      record = {"path": str(source), "status": "PENDING"}
                      report["inputs"].append(record)
                      if not source.resolve().is_relative_to(build.resolve()):
                          raise RuntimeError("Install metadata resolves outside fresh build root: " + name)
                      record.update(copy_file(source, evidence / name, required=True))
                      if record["status"] != "copied":
                          raise RuntimeError("Required install metadata not archived: " + name)
                  selected = install_layout((evidence / "CMakeCache.txt").read_text(),
                      (evidence / "install_manifest.txt").read_text(),
                      (evidence / "CMakeFiles/vppinfra/config.h").read_text(), install, report)
                  if install.is_symlink() or not install.is_dir():
                      raise RuntimeError("Unsafe or missing fixed installation root")
                  resolved_root = install.resolve(strict=True)
                  if resolved_root != install:
                      raise RuntimeError("Fixed installation root resolves through an alias")
                  found = {name: set() for name in selected}
                  def walk_error(error):
                      raise error
                  for directory, directories, filenames in os.walk(install, followlinks=False, onerror=walk_error):
                      for name in directories + filenames:
                          path = Path(directory) / name
                          if name in found:
                              found[name].add(path)
                      for name in directories:
                          path = Path(directory) / name
                          if path.is_symlink():
                              report["skipped_directory_links"].append(str(path))
                  for name, expected in selected.items():
                      if expected.exists() or expected.is_symlink():
                          found[name].add(expected)
                      paths = sorted(found[name])
                      item = report["plugins"][name]
                      item.update(found_count=len(paths), found_paths=[str(path) for path in paths],
                                  resolved_paths=[])
                      for path in paths:
                          resolved = path.resolve(strict=True)
                          item["resolved_paths"].append(str(resolved))
                          if not resolved.is_relative_to(resolved_root) or not resolved.is_file():
                              raise RuntimeError("External or nonregular installed plugin: " + name)
                      if paths != [expected]:
                          raise RuntimeError("Missing, duplicate or conflicting installed plugin: " + name)
                      directory = expected.parent.resolve(strict=True)
                      if not directory.is_relative_to(resolved_root) or not directory.is_dir():
                          raise RuntimeError("External plugin directory: " + name)
                      selected[name] = expected.resolve(strict=True)
                  report["status"] = "PASS"
                  return selected
              except Exception as error:
                  report.update(status="FAIL/INCOMPLETE", error=str(error))
                  raise
              finally:
                  payload = (json.dumps(report, indent=2) + "\n").encode()
                  reserve(len(payload))
                  (evidence / "discovery.json").write_bytes(payload)

          def elf():
              install = candidate / "build-root/install-vpp_debug-native/vpp"
              selected = installed_plugins()
              files = {}
              for name, path in selected.items():
                  files[name] = file_identity(path)
                  notes = subprocess.check_output(["readelf", "-n", str(path)])
                  (root / (name + ".notes.txt")).write_bytes(notes)
                  match = re.search(rb"Build ID: (\w+)", notes)
                  files[name]["build_id"] = match.group(1).decode() if match else None
              provider = files["linux_nl_plugin.so"]
              dynamic = subprocess.check_output(["readelf", "--dyn-syms", "--wide", provider["path"]])
              (root / "linux_nl_plugin.so.dynsym.txt").write_bytes(dynamic)
              for symbol in ["lcp_nl_test_set_sync_pause", "lcp_nl_test_inject_dump"]:
                  rows = [line.split() for line in dynamic.decode().splitlines() if line.split() and line.split()[-1] == symbol]
                  if len(rows) != 1 or rows[0][3:6] != ["FUNC", "GLOBAL", "DEFAULT"] or not rows[0][6].isdigit():
                      raise RuntimeError(f"Invalid dynamic export: {symbol}: {rows}")
              files["vpp"] = file_identity((install / "bin/vpp").resolve())
              save(root / "binaries.json", files)
              command("toolchain", ["bash", "-c", "cc --version; c++ --version; ccache -s; dpkg-query -W"], seconds=60)

          def link_record(path, allowed):
              raw = os.readlink(path)
              target = Path(os.path.abspath(os.path.join(path.parent, raw)))
              record = {"path": str(path), "link": raw, "lexical_target": str(target),
                        "resolution": "UNSAFE", "copied": False, "traversed": False}
              owner = next((directory for directory in allowed if target.is_relative_to(directory)), None)
              if ".." in Path(raw).parts or owner is None:
                  record["reason"] = "Parent traversal or target outside accepted diagnostic roots"
                  return record
              current = Path(owner.anchor)
              try:
                  for component in target.parts[1:]:
                      current /= component
                      mode = current.lstat().st_mode
                      if stat.S_ISLNK(mode):
                          record["reason"] = "Nested symlink rejected without traversal"
                          return record
                  record.update(resolution="SAFE", resolved=str(target),
                                target_kind="directory" if stat.S_ISDIR(mode) else "file")
              except OSError as error:
                  record.update(resolution="UNRESOLVED", reason=str(error))
              return record

          def snapshot(destination):
              records, issues = [], []
              roots = sorted(Path("/tmp").glob("vpp-unittest-*"))
              roots += [Path("/tmp/vpp-failed-unittests"), candidate / "build-root/test-logs"]
              allowed = [directory for directory in roots if not directory.is_symlink()]
              files = []
              for directory in roots:
                  if directory.is_symlink():
                      records.append(link_record(directory, allowed))
                      continue
                  if not directory.is_dir():
                      records.append({"path": str(directory), "status": "missing"})
                      continue
                  for current, directories, names in os.walk(directory, followlinks=False):
                      retained = []
                      for name in sorted(directories):
                          path = Path(current) / name
                          if path.is_symlink():
                              records.append(link_record(path, allowed))
                          else:
                              retained.append(name)
                      directories[:] = retained
                      for name in sorted(names):
                          path = Path(current) / name
                          if path.is_symlink():
                              records.append(link_record(path, allowed))
                          elif stat.S_ISREG(path.lstat().st_mode):
                              files.append((path.name != "log.txt", path, directory))
              for optional, path, directory in sorted(files, key=lambda item: (item[0], str(item[1]))):
                  area = "optional" if optional else "files"
                  target = destination / area / directory.name / path.relative_to(directory)
                  try:
                      record = copy_file(path, target, required=not optional)
                  except OSError as error:
                      record = {"path": str(path), "status": "copy-INCOMPLETE", "error": str(error)}
                  records.append(record)
                  if record["status"] == "copy-INCOMPLETE" or (not optional and record["status"] != "copied"):
                      issues.append(str(path))
              save(destination / "snapshot.json", {"at": time.time(), "identity": attribution(),
                   "files": records, "issues": issues,
                   "capacity_policy": {"mandatory_bytes": 168 * 1024 * 1024, "mandatory_files": 1488,
                       "optional_bytes": 16 * 1024 * 1024, "optional_files": 256,
                       "seal_reserve_bytes": 8 * 1024 * 1024, "seal_reserve_files": 128,
                       "post_job_reserved_bytes": 64 * 1024 * 1024, "post_job_reserved_files": 128,
                       "overflow": "Mandatory FAIL/INCOMPLETE; optional omitted with size/hash; records retained"}})
              if issues:
                  raise RuntimeError("Mandatory snapshot evidence INCOMPLETE: " + repr(issues))

          def groups():
              return {
                  "linux_cp": {"TestLinuxCPNetlinkRecovery": ["test_netlink_poll_error_recovery", "test_netlink_poll_error_invalid_fd", "test_router_source_ownership", "test_router_partial_delete_ownership", "test_router_mpls_ownership", "test_router_linux_replace_replay", "test_router_bound_table_sweep", "test_router_broadcast_recovery"],
                      "TestLinuxCPPairManagement": ["test_pair_delete_static_routes_ipv4", "test_pair_delete_dynamic_routes_ipv4", "test_pair_delete_static_routes_ipv6", "test_pair_delete_dynamic_routes_ipv6", "test_pair_create_delete_tun", "test_gre_lcp_ipv4_survives_pair_churn", "test_pair_create_delete_tap", "test_pair_vlan_subinterface", "test_pair_auto_subinterface"],
                      "TestLinuxCPOSPFMcast": ["test_ospf_mcast_host_to_phy", "test_ospf_mcast_phy_to_host"]},
                  "linux_cp_lifecycle": {"TestLinuxCPLifecycle": ["test_default_namespace_resources", "test_default_namespace_failure", "test_pair_replace_resend", "test_pair_flags_pool_reuse", "test_vlan_resources"], "TestLinuxCPNamespaceOwnership": ["test_equal_ifindex_namespace_delete"]},
                  "linux_cp_netlink": {"TestLinuxCPNetlinkSocketOwnership": ["test_pair_add_during_netlink_recovery"], "TestLinuxCPNetlinkDumpCompletion": ["test_dump_completion_errors", "test_dump_completion_success"]},
                  "gre_teib": {"TestGreTeib": ["test_gre_teib_ipv4", "test_gre_teib_ipv6", "test_gre_teib_cross_mp"]},
                  "ip_mcast": {"TestIPMcast": ["test_mfib_zero_flags_ip4", "test_mfib_zero_flags_ip6"], "TestMFIB": ["test_mfib"]},
                  "ip4": {"TestIPv4IfAddrRoute": ["test_ipv4_local_export_withdraw_glean", "test_ipv4_local_export_withdraw_non_glean"]},
                  "ipsec_esp": {"TestIpsecEspTun": ["test_tun_df44"]},
                  "fib": {"TestFIB": ["test_fib"]}}

          def inventory(suite, directory):
              selected = (root / "commands" / (suite + "-list") / "command.log").read_text(errors="replace")
              match = re.search(r"total: (\d+) test\(s\) selected", selected)
              if not match or int(match.group(1)) == 0:
                  raise RuntimeError("Empty or missing discovered inventory")
              expected_count = int(match.group(1))
              selected_classes = {}
              for name, content in re.findall(r"^    (\w+): (.+)$", selected, flags=re.M):
                  count = re.fullmatch(r"(\d+) test\(s\)", content)
                  selected_classes[name] = int(count.group(1)) if count else len(content.split(", "))
              results, skips, raw_logs, startups = {}, [], [], []
              for log in sorted((directory / "files").glob("vpp-unittest-*/log.txt")):
                  contents = log.read_text(errors="replace")
                  raw_logs.append({"path": str(log.relative_to(root)), "sha256": digest(log.read_bytes())})
                  for raw in re.findall(r"vpp_cmdline args: (.+)", contents):
                      argv = ast.literal_eval(raw)
                      workers = argv[argv.index("corelist-workers") + 1].split(",") if "corelist-workers" in argv else []
                      startups.append({"class": log.parent.name.removeprefix("vpp-unittest-"),
                                       "argv": argv, "configured_worker_cores": workers,
                                       "configured_worker_count": len(workers)})
                  for callback, cls, method in callbacks.findall(contents):
                      results.setdefault(cls + "." + method, []).append(callback)
                  skips.extend(line for line in contents.splitlines() if "addSkip" in line)
              actual_classes = {}
              for name in results:
                  cls = name.split(".")[0]
                  actual_classes[cls] = actual_classes.get(cls, 0) + 1
              issues = []
              if sum(selected_classes.values()) != expected_count or actual_classes != selected_classes:
                  issues.append("Discovered class counts and actual method inventory differ")
              for name, values in results.items():
                  if values != ["addSuccess"]:
                      issues.append(f"{name}: {values}")
              if skips:
                  issues.append("Skipped tests or classes remain OPEN")
              required = []
              for cls, methods in groups().get(suite, {}).items():
                  for method in methods:
                      name = cls + "." + method
                      required.append(name)
                      if results.get(name) != ["addSuccess"]:
                          issues.append("Required non-skip unique success missing: " + name)
              command_log = (root / "commands" / suite / "command.log").read_text(errors="replace")
              if not re.search(r"vpp_worker_count=0(?:[,\)])", command_log) or not re.search(r"retries=0(?:[,\)])", command_log):
                  issues.append("Harness global worker/retry config missing")
              started_classes = {entry["class"] for entry in startups}
              if not set(selected_classes) <= started_classes:
                  issues.append("Per-class actual startup configuration missing")
              required_startups = {}
              for cls in groups().get(suite, {}):
                  records = [entry for entry in startups if entry["class"] == cls]
                  required_startups[cls] = records
                  if not records or any(entry["configured_worker_count"] != 0 for entry in records):
                      issues.append("Required class did not prove an actual zero-worker startup: " + cls)
              save(directory / "required-zero-worker-startups.json", required_startups)
              counts = {callback: sum(values.count(callback) for values in results.values())
                        for callback in ["addSuccess", "addSkip", "addFailure", "addError", "addExpectedFailure", "addUnexpectedSuccess"]}
              save(directory / "inventory.json", {"module": "test_" + suite, "discovered": expected_count,
                   "ran": len(results), "callback_counts": counts,
                   "discovered_classes": selected_classes, "actual_classes": actual_classes,
                   "methods": results, "skip_details": skips, "required": required,
                   "command_config": {"vpp_worker_count": 0, "retries": 0,
                                      "class_worker_overrides": "Existing class declarations remain authoritative; see vpp_cmdline logs"},
                   "actual_startups": startups,
                   "all_classes_zero_workers": bool(startups) and all(entry["configured_worker_count"] == 0 for entry in startups),
                   "raw_logs": raw_logs, "issues": issues})
              if issues:
                  raise RuntimeError("; ".join(issues))

          def watch_processes(stop, output):
              binaries = load(root / "binaries.json")
              expected_exe = binaries["vpp"]
              observed = {}
              errors = []
              while not stop.is_set():
                  for proc in Path("/proc").iterdir():
                      if not proc.name.isdigit():
                          continue
                      try:
                          info = (proc / "exe").stat()
                          if info.st_ino != expected_exe["inode"] or os.major(info.st_dev) != expected_exe["major"] or os.minor(info.st_dev) != expected_exe["minor"]:
                              continue
                          start = (proc / "stat").read_text().rsplit(")", 1)[1].split()[19]
                          key = proc.name + "-" + start
                          if key in observed:
                              continue
                          cmdline = (proc / "cmdline").read_bytes()
                          maps = (proc / "maps").read_bytes()
                          found = {}
                          for row in maps.decode().splitlines():
                              parts = row.split(None, 5)
                              if len(parts) != 6:
                                  continue
                              for name in ["linux_nl_plugin.so", "linux_cp_unittest_plugin.so"]:
                                  expected = binaries[name]
                                  if Path(parts[5]).name != name:
                                      continue
                                  device = [int(v, 16) for v in parts[3].split(":")]
                                  if parts[5] != expected["path"] or int(parts[4]) != expected["inode"] or device != [expected["major"], expected["minor"]]:
                                      raise RuntimeError("Loaded plugin identity differs: " + row)
                                  if digest(Path(parts[5]).read_bytes()) != expected["sha256"]:
                                      raise RuntimeError("Loaded plugin bytes changed")
                                  found[name] = expected
                          if len(found) != 2:
                              continue
                          directory = output / key
                          directory.mkdir(parents=True)
                          (directory / "cmdline.raw").write_bytes(cmdline)
                          (directory / "maps.txt").write_bytes(maps)
                          classes = re.findall(r"vpp-unittest-(\w+)", cmdline.decode(errors="replace"))
                          observed[key] = {"pid": int(proc.name), "start_ticks": start,
                              "classes": sorted(set(classes)), "plugins": found,
                              "exe": expected_exe, "at": time.time()}
                      except (FileNotFoundError, ProcessLookupError):
                          continue
                      except Exception as error:
                          errors.append(str(error))
                  stop.wait(0.05)
              save(output / "identity.json", {"processes": observed, "errors": errors})

          def run_suites():
              verify_source()
              states = load(root / "suite-status.json")
              for suite in suites:
                  directory = root / "suites" / suite
                  directory.mkdir(parents=True)
                  states[suite] = "RUNNING"
                  save(root / "suite-status.json", states)
                  stop = threading.Event()
                  watcher = None
                  try:
                      command(suite + "-list", ["make", "UNATTENDED=yes", "TEST_JOBS=1", "VPP_WORKER_COUNT=0", "RETRIES=0", "TEST=" + suite, "test-list"], seconds=300)
                      if suite == "linux_cp_netlink":
                          watcher = threading.Thread(target=watch_processes, args=(stop, directory / "loaded"))
                          watcher.start()
                      run_error = None
                      try:
                          command(suite, ["make", "UNATTENDED=yes", "TEST_JOBS=1", "VPP_WORKER_COUNT=0", "RETRIES=0", "TEST=" + suite, "test-debug"], seconds=1200)
                      except Exception as error:
                          run_error = error
                      finally:
                          if watcher:
                              stop.set()
                              watcher.join(timeout=10)
                              if watcher.is_alive():
                                  run_error = RuntimeError("Process identity collection did not stop")
                          snapshot(directory)
                      inventory_error = None
                      try:
                          inventory(suite, directory)
                      except Exception as error:
                          inventory_error = error
                      if run_error or inventory_error:
                          raise RuntimeError(f"Command: {run_error}; inventory: {inventory_error}")
                      if suite == "linux_cp_netlink":
                          loaded = load(directory / "loaded/identity.json")
                          classes = {cls for entry in loaded["processes"].values() for cls in entry["classes"]}
                          if loaded["errors"] or not {"TestLinuxCPNetlinkSocketOwnership", "TestLinuxCPNetlinkDumpCompletion"} <= classes:
                              raise RuntimeError("Required real netlink process mappings missing or invalid")
                      verify_source()
                      states[suite] = "PASS"
                  except Exception as error:
                      states[suite] = "FAIL: " + str(error)
                      save(root / "suite-status.json", states)
                      raise
                  save(root / "suite-status.json", states)

          def acceptance_groups():
              buckets = {"original26": [], "fullfib1": [], "pair_ospf11": []}
              for suite, classes in groups().items():
                  inventory_path = root / "suites" / suite / "inventory.json"
                  actual = load(inventory_path).get("methods", {}) if inventory_path.exists() else {}
                  for cls, methods in classes.items():
                      group = "fullfib1" if suite == "fib" else "pair_ospf11" if cls in {
                          "TestLinuxCPPairManagement", "TestLinuxCPOSPFMcast"} else "original26"
                      for method in methods:
                          name = cls + "." + method
                          buckets[group].append({"module": suite, "method": name,
                                                "callbacks": actual.get(name, []),
                                                "status": "PASS" if actual.get(name) == ["addSuccess"] else "INCOMPLETE"})
              save(root / "acceptance-groups.json", {name: {
                  "required": len(entries), "success": sum(item["status"] == "PASS" for item in entries),
                  "status": "PASS" if all(item["status"] == "PASS" for item in entries) else "INCOMPLETE",
                  "methods": entries} for name, entries in buckets.items()})

          def collect():
              errors = []
              try:
                  snapshot(root / "final-diagnostics")
              except Exception as error:
                  errors.append(str(error))
              acceptance_groups()
              save(root / "log-identities.json", {"identity": attribution(), "logs": [
                  {"path": str(path.relative_to(root)), "identity": attribution(),
                   "built_identity_scope": "Actual build input when available; pre-build commands precede this build"}
                  for path in sorted(root.rglob("*")) if path.is_file() and not path.is_symlink()
                  and (path.suffix in {".log", ".txt", ".raw"})]})
              save(root / "worker-contract.json", {"all_classes_zero_workers": "UNFULFILLED",
                   "reason": "Complete ip4 retains TestIPPuntHandoff worker2; complete ipsec_esp retains async/handoff worker2 classes",
                   "required_classes_zero_workers": "Separate actual-startup gate for all 13 required classes; no substitute for all classes"})
              if errors:
                  raise RuntimeError("; ".join(errors))

          def seal():
              records = []
              for path in sorted(root.rglob("*")):
                  if path.is_symlink():
                      raise RuntimeError("Symlink in evidence output")
                  if path.is_file() and path != root / "artifact-manifest.json":
                      records.append({"path": str(path.relative_to(root)), "size": path.stat().st_size,
                                      "sha256": digest(path.read_bytes())})
              payload = json.dumps(records, indent=2) + "\n"
              if (len(records) + 1 > limit_count - 128 or
                  sum(item["size"] for item in records) + len(payload.encode()) > limit_bytes - 64 * 1024 * 1024 or
                  len(payload.encode()) > limit_file or any(item["size"] > limit_file for item in records)):
                  raise RuntimeError("Artifact limits exceeded; evidence INCOMPLETE, records retained without truncation")
              (root / "artifact-manifest.json").write_text(payload)

          stage = sys.argv[1]
          started = time.time()
          stage_error = None
          try:
              if stage == "identity":
                  identity()
              elif stage == "dependencies":
                  command("dependencies", ["make", "UNATTENDED=yes", "install-dep"], seconds=1500)
                  verify_source()
              elif stage == "style":
                  style()
              elif stage == "provenance":
                  provenance()
              elif stage == "build":
                  for path in ["build-root/build-vpp_debug-native", "build-root/install-vpp_debug-native"]:
                      if (candidate / path).exists():
                          raise RuntimeError("Fresh build output already exists")
                  command("build", ["make", "UNATTENDED=yes", "build"], seconds=5400)
                  verify_source()
              elif stage == "elf":
                  elf()
              elif stage == "suites":
                  run_suites()
              elif stage == "drift":
                  verify_source()
              elif stage == "collect":
                  collect()
              else:
                  raise RuntimeError("Unknown stage")
          except Exception as error:
              stage_error = str(error)
          save(root / "stages" / (stage + ".json"), {"status": "FAIL" if stage_error else "PASS",
               "error": stage_error, "start": started, "end": time.time(), "identity": attribution()})
          if stage == "collect":
              try:
                  seal()
              except Exception as error:
                  stage_error = str(error)
                  save(root / "stages/collect.json", {"status": "FAIL", "error": stage_error,
                       "start": started, "end": time.time(), "identity": attribution()})
                  raise
          if stage_error:
              raise SystemExit(stage_error)
          PY
          python3 "${RUNNER_TEMP}/full-positive.py" identity

      - name: Install standard dependencies
        id: dependencies
        timeout-minutes: 25
        working-directory: candidate
        run: python3 "${RUNNER_TEMP}/full-positive.py" dependencies

      - name: Check the complete candidate patch style
        id: style
        timeout-minutes: 30
        run: python3 "${RUNNER_TEMP}/full-positive.py" style

      - name: Record exact build source and version
        id: provenance
        run: python3 "${RUNNER_TEMP}/full-positive.py" provenance

      - name: Build fresh VPP debug
        id: build
        timeout-minutes: 90
        run: python3 "${RUNNER_TEMP}/full-positive.py" build

      - name: Verify actual installed dynamic exports
        id: elf
        run: python3 "${RUNNER_TEMP}/full-positive.py" elf

      - name: Remount test shared memory
        id: runtime
        uses: ./candidate/.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}/candidate
          SHM_SIZE: 2G
          LOG_DIR: ${{ github.workspace }}/candidate/build-root/test-logs

      - name: Verify namespace, devices and shared memory
        id: preflight
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          exec > >(tee "${ACCEPTANCE_ROOT}/preflight.log") 2>&1
          namespace="vpp-full-positive-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            result=$?
            trap - EXIT
            if [ -e "/run/netns/${namespace}" ]; then
              ip netns del "$namespace" || result=1
            fi
            exit "$result"
          }
          trap cleanup EXIT
          id
          cat /proc/self/status
          df -B1 /dev/shm
          test "$(df -B1 --output=size /dev/shm | tail -1)" -ge 2147483648
          ip netns add "$namespace"
          ip netns exec "$namespace" ip link set lo up
          ip netns exec "$namespace" ip link show lo
          ip netns exec "$namespace" cat /proc/net/netlink
          ip netns exec "$namespace" sh -c 'test -r /proc/self/fdinfo/0 && test -d /proc/self/fd'
          mkdir -p /dev/net
          if [ ! -e /dev/net/tun ]; then mknod /dev/net/tun c 10 200; fi
          if [ ! -e /dev/vhost-net ]; then mknod /dev/vhost-net c 10 238; fi
          for device in /dev/net/tun /dev/vhost-net; do
            test -c "$device"
            (: <> "$device")
          done
          ip netns exec "$namespace" ip tuntap add dev vpp-ci-tap mode tap
          ip netns exec "$namespace" ip link del vpp-ci-tap

      - name: Run all nine complete modules and seal each result
        id: suites
        timeout-minutes: 190
        run: python3 "${RUNNER_TEMP}/full-positive.py" suites

      - name: Verify source and version after testing
        id: drift
        run: python3 "${RUNNER_TEMP}/full-positive.py" drift

      - name: Collect bounded evidence even after failure
        id: collect
        if: always()
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          test -f "${RUNNER_TEMP}/full-positive.py"
          python3 "${RUNNER_TEMP}/full-positive.py" collect

      - name: Upload positive evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-positive-cce149c4d1ccd2d4ab88d07acc92478a82a2b100-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-positive-evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Verify the uploaded archive digest
        id: archive
        if: always() && steps.upload.outcome == 'success'
        timeout-minutes: 6
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/full-positive-artifact.zip"
          curl --fail --silent --show-error --location --max-time 300 --max-filesize 314572800 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$archive"
          expected="${ARTIFACT_DIGEST#sha256:}"
          test "${#expected}" = 64
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict

      - name: Download the actual uploaded archive
        id: download
        if: always() && steps.upload.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/full-positive-downloaded
          merge-multiple: true

      - name: Verify downloaded bytes and final positive verdict
        id: verdict
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          steps = json.loads(os.environ["STEP_RESULTS"])
          required = ["identity", "dependencies", "style", "provenance", "build", "elf",
                      "runtime", "preflight", "suites", "drift", "collect", "upload", "archive", "download"]
          failed = [name for name in required if steps.get(name, {}).get("outcome") != "success"]
          downloaded = Path(os.environ["RUNNER_TEMP"]) / "full-positive-downloaded"
          manifest = downloaded / "artifact-manifest.json"
          if not manifest.is_file() or manifest.is_symlink():
              failed.append("downloaded manifest missing")
          else:
              entries = json.loads(manifest.read_text())
              listed = [entry["path"] for entry in entries]
              actual = {str(path.relative_to(downloaded)) for path in downloaded.rglob("*")
                        if path.is_file() and path != manifest}
              if len(listed) != len(set(listed)) or set(listed) != actual:
                  failed.append("Manifest and actual downloaded file sets differ (only root manifest excluded)")
              if any(path.is_symlink() for path in downloaded.rglob("*")):
                  failed.append("Symlink in downloaded evidence")
              for entry in entries:
                  relative = Path(entry["path"])
                  if relative.is_absolute() or ".." in relative.parts or str(relative) != entry["path"]:
                      raise SystemExit("Unsafe artifact manifest path")
                  path = downloaded / relative
                  if path.is_symlink() or not path.is_file() or path.stat().st_size != entry["size"] or hashlib.sha256(path.read_bytes()).hexdigest() != entry["sha256"]:
                      failed.append("downloaded bytes: " + str(relative))
          status = downloaded / "suite-status.json"
          expected = ["linux_cp", "linux_cp_lifecycle", "linux_cp_netlink", "gre", "gre_teib",
                      "ip_mcast", "ip4", "ipsec_esp", "fib"]
          states = json.loads(status.read_text()) if status.is_file() else {}
          if set(states) != set(expected) or any(states.get(suite) != "PASS" for suite in expected):
              failed.append("complete suite success missing")
          grouped_path = downloaded / "acceptance-groups.json"
          grouped = json.loads(grouped_path.read_text()) if grouped_path.is_file() else {}
          for name, count in {"original26": 26, "fullfib1": 1, "pair_ospf11": 11}.items():
              if grouped.get(name, {}).get("required") != count or grouped[name].get("success") != count:
                  failed.append("Incomplete acceptance group: " + name)
          report = {"positive_execution": "FAIL" if failed else "PASS", "issues": failed,
                    "complete_evidence_contract": "PENDING: post-job read-only archive must verify actual image and execution timestamps",
                    "acceptance_groups": grouped,
                    "all_classes_zero_workers": "UNFULFILLED: complete ip4/ipsec_esp retain existing worker2 classes",
                    "artifact_id": os.environ["ARTIFACT_ID"], "artifact_url": os.environ["ARTIFACT_URL"],
                    "artifact_digest": os.environ["ARTIFACT_DIGEST"], "steps": steps,
                    "ci01": "OPEN: requires a real natural recovered retry, later suite reset, and downloaded ordinary-run diagnostic artifact on this exact candidate",
                    "negative": "UNFULFILLED/HOLD", "merge": "HOLD", "final_r5": "SEALED"}
          print(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Positive execution: " + report["positive_execution"] + "; complete evidence pending post-job archive.\n\n")
              summary.write("all_classes_zero_workers=UNFULFILLED: existing full-module worker2 classes retained.\n\n")
              summary.write("Candidate: cce149c4d1ccd2d4ab88d07acc92478a82a2b100 / dc04885a19d9b3acfe1ab1184f83239031ef6e6b\n\n")
              summary.write("Artifact: " + os.environ["ARTIFACT_URL"] + "\n\n")
              summary.write("CI01 OPEN; negative UNFULFILLED/HOLD; merge HOLD; final r5 SEALED.\n")
          if failed:
              raise SystemExit(1)
          PY

  execution-archive:
    name: Archive completed execution identity
    needs: full-positive
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download execution evidence by immutable artifact id
        id: download
        if: needs.full-positive.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.full-positive.outputs.artifact-id }}
          path: ${{ runner.temp }}/completed-execution
          merge-multiple: true

      - name: Record completed job timestamps and actual runner container identity
        id: records
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_RESULT: ${{ needs.full-positive.result }}
          EXECUTION_ARTIFACT_ID: ${{ needs.full-positive.outputs.artifact-id }}
          EXECUTION_ARTIFACT_DIGEST: ${{ needs.full-positive.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "execution-archive"
          output.mkdir()
          evidence = Path(os.environ["RUNNER_TEMP"]) / "completed-execution"
          issues = []
          report = {"status": "INCOMPLETE", "started_at": time.time(),
                    "execution_result": os.environ["EXECUTION_RESULT"],
                    "carrier_sha": os.environ["GITHUB_SHA"],
                    "candidate_sha": "cce149c4d1ccd2d4ab88d07acc92478a82a2b100",
                    "candidate_tree": "dc04885a19d9b3acfe1ab1184f83239031ef6e6b",
                    "run_id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "execution_artifact_id": os.environ["EXECUTION_ARTIFACT_ID"],
                    "execution_artifact_digest": os.environ["EXECUTION_ARTIFACT_DIGEST"],
                    "container_identity": "UNVERIFIED", "job_step_timestamps": "INCOMPLETE",
                    "all_classes_zero_workers": "UNFULFILLED: full ip4/ipsec_esp retain worker2 classes",
                    "ci01": "OPEN/NOT_OBSERVED", "negative": "UNFULFILLED/HOLD",
                    "merge": "HOLD", "final_r5": "SEALED"}

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def save(path, value):
              path.write_text(json.dumps(value, indent=2) + "\n")

          def fetch(suffix, destination, maximum=33554432):
              url = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"] + suffix
              result = subprocess.run(["curl", "--fail", "--silent", "--show-error", "--location",
                  "--max-time", "120", "--max-filesize", str(maximum),
                  "-H", "Authorization: Bearer " + os.environ["GH_TOKEN"],
                  "-H", "Accept: application/vnd.github+json", url, "--output", str(destination)])
              if result.returncode:
                  raise RuntimeError("Read-only GitHub evidence fetch failed: " + suffix)
              return destination.read_bytes()

          try:
              manifest_path = evidence / "artifact-manifest.json"
              entries = json.loads(manifest_path.read_text())
              listed = [entry["path"] for entry in entries]
              actual = {str(path.relative_to(evidence)) for path in evidence.rglob("*")
                        if path.is_file() and path != manifest_path}
              if len(listed) != len(set(listed)) or set(listed) != actual:
                  raise RuntimeError("Downloaded execution file set differs from manifest")
              if any(path.is_symlink() for path in evidence.rglob("*")):
                  raise RuntimeError("Downloaded execution contains symlinks")
              for entry in entries:
                  relative = Path(entry["path"])
                  if relative.is_absolute() or ".." in relative.parts or str(relative) != entry["path"]:
                      raise RuntimeError("Unsafe execution manifest path")
                  data = (evidence / relative).read_bytes()
                  if len(data) != entry["size"] or sha(data) != entry["sha256"]:
                      raise RuntimeError("Downloaded execution byte mismatch: " + str(relative))
              save(output / "execution-artifact-files.json", {"manifest_size": manifest_path.stat().st_size,
                   "manifest_sha256": sha(manifest_path.read_bytes()), "files": entries})
              for name in ["identity.json", "provenance.json", "acceptance-groups.json", "worker-contract.json"]:
                  data = (evidence / name).read_bytes()
                  (output / name).write_bytes(data)
              provenance = json.loads((output / "provenance.json").read_text())
              report["built_source_tree"] = provenance["built_source_tree"]
              report["acceptance_groups"] = json.loads((output / "acceptance-groups.json").read_text())
              identity = json.loads((output / "identity.json").read_text())
              if any(identity[key] != report[key] for key in ["carrier_sha", "candidate_sha", "candidate_tree"]):
                  raise RuntimeError("Execution identity differs from carrier/candidate contract")
              report["log_attribution"] = {"carrier_sha": report["carrier_sha"],
                  "candidate_sha": report["candidate_sha"], "candidate_tree": report["candidate_tree"],
                  "built_source_tree": report["built_source_tree"],
                  "execution_logs": "All GitHub execution job/step logs in job.log",
                  "artifact_logs": "Per-log identities in execution artifact log-identities.json"}
          except Exception as error:
              issues.append("Execution artifact INCOMPLETE: " + str(error))
          try:
              prefix = "/actions/runs/" + os.environ["GITHUB_RUN_ID"] + "/attempts/" + os.environ["GITHUB_RUN_ATTEMPT"]
              jobs = json.loads(fetch(prefix + "/jobs?per_page=100", output / "jobs.json"))
              if jobs["total_count"] > 100:
                  raise RuntimeError("Job listing exceeds bounded single-page contract")
              selected = [job for job in jobs["jobs"] if job["name"] == "Full positive execution"]
              if len(selected) != 1:
                  raise RuntimeError("Completed execution job is not unique")
              job = selected[0]
              save(output / "execution-job.json", job)
              if job["status"] != "completed" or not job.get("started_at") or not job.get("completed_at"):
                  issues.append("Execution job completion timestamps INCOMPLETE")
              for step in job.get("steps", []):
                  if step.get("status") != "completed" or not step.get("started_at") or not step.get("completed_at"):
                      issues.append("Step timestamps INCOMPLETE: " + step["name"])
                  if step.get("conclusion") != "success":
                      issues.append("Execution step did not succeed: " + step["name"])
              if not job.get("steps"):
                  issues.append("Execution steps missing")
              if not any("timestamps" in issue for issue in issues) and job.get("steps"):
                  report["job_step_timestamps"] = "VERIFIED: GitHub API actual completed execution job and every step"
              raw = fetch("/actions/jobs/" + str(job["id"]) + "/logs", output / "job.log")
              logs = raw.decode(errors="replace")
              blocks = re.findall(r"##\[group\]Starting job container\r?\n(.*?)##\[endgroup\]", logs, re.S)
              if len(blocks) != 1 or "##[group]" in blocks[0]:
                  raise RuntimeError("Actual container initialization log unavailable or ambiguous; identity UNVERIFIED")
              initialization = blocks[0]
              (output / "container-initialization.log").write_text(initialization)
              normalized = re.sub(r"(?m)^\d{4}-\d{2}-\d{2}T[0-9:.]+Z ", "", initialization).replace("\r\n", "\n")
              commands = re.findall(r"^##\[command\]([^\n]+)\n(.*?)(?=^##\[command\]|\Z)", normalized, re.M | re.S)
              bindings = [(command, result) for command, result in commands
                          if re.match(r"/usr/bin/docker (?:pull|create|start)(?: |$)", command)]
              if len(bindings) != 3 or bindings[0][0] != "/usr/bin/docker pull debian:trixie":
                  raise RuntimeError("Actual pull/create/start sequence UNVERIFIED")
              pull, create, start = bindings
              image_digest = re.findall(r"^Digest: (sha256:[0-9a-f]{64})$", pull[1], re.M)
              if (len(image_digest) != 1
                      or re.findall(r"^Digest: (sha256:[0-9a-f]{64})$", normalized, re.M) != image_digest
                      or not re.fullmatch(r'/usr/bin/docker create [^\n]+ debian:trixie "-f" "/dev/null"', create[0])
                      or not re.fullmatch(r"[0-9a-f]{64}", create[1].strip())):
                  raise RuntimeError("Actual pull digest/create container binding UNVERIFIED")
              container_id = create[1].strip()
              if start[0] != "/usr/bin/docker start " + container_id or start[1].strip() != container_id:
                  raise RuntimeError("Actual container start identity UNVERIFIED")
              report["container_identity"] = {"status": "VERIFIED", "actual_digest": image_digest[0],
                  "container_id": container_id, "requested_tag": "debian:trixie",
                  "source": "Same execution job Starting job container pull/digest/create/start records",
                  "raw_log_sha256": sha(raw), "initialization_sha256": sha(initialization.encode())}
              if os.environ["EXECUTION_RESULT"] != "success" or job.get("conclusion") != "success":
                  issues.append("Positive execution job did not succeed")
          except Exception as error:
              issues.append(str(error))
          report.update(status="FAIL/INCOMPLETE" if issues else "PASS", issues=issues, ended_at=time.time())
          save(output / "completed-execution-report.json", report)
          files = [{"path": str(path.relative_to(output)), "size": path.stat().st_size,
                    "sha256": sha(path.read_bytes())} for path in sorted(output.iterdir()) if path.is_file()]
          payload = (json.dumps(files, indent=2) + "\n").encode()
          if len(files) + 1 > 128 or any(item["size"] > 33554432 for item in files) or sum(item["size"] for item in files) + len(payload) > 67108864:
              raise SystemExit("Completed-job archive limits exceeded; INCOMPLETE (raw records retained)")
          (output / "artifact-manifest.json").write_bytes(payload)
          print(json.dumps(report, indent=2))
          if issues:
              raise SystemExit(1)
          PY

      - name: Upload completed execution records
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-positive-execution-records-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/execution-archive/
          retention-days: 7
          if-no-files-found: error

      - name: Download completed execution records
        id: redownload
        if: always() && steps.upload.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/execution-archive-downloaded
          merge-multiple: true

      - name: Verify completed execution archive bytes and contract
        if: always()
        env:
          RECORD_OUTCOME: ${{ steps.records.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.redownload.outcome }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/execution-records.zip"
          curl --fail --silent --show-error --location --max-time 120 --max-filesize 157286400 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "$archive"
          expected="${ARTIFACT_DIGEST#sha256:}"
          test "${#expected}" = 64
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "execution-archive-downloaded"
          manifest = root / "artifact-manifest.json"
          entries = json.loads(manifest.read_text())
          paths = [entry["path"] for entry in entries]
          actual = {str(path.relative_to(root)) for path in root.rglob("*") if path.is_file() and path != manifest}
          if len(paths) != len(set(paths)) or set(paths) != actual or any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("Completed-job artifact file set mismatch")
          for entry in entries:
              relative = Path(entry["path"])
              if relative.is_absolute() or ".." in relative.parts or str(relative) != entry["path"]:
                  raise SystemExit("Unsafe completed-job artifact path")
              data = (root / relative).read_bytes()
              if len(data) != entry["size"] or hashlib.sha256(data).hexdigest() != entry["sha256"]:
                  raise SystemExit("Completed-job evidence byte mismatch")
          report = json.loads((root / "completed-execution-report.json").read_text())
          print(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Completed execution evidence: " + report["status"] + "\n\n")
              summary.write("Archive: " + os.environ["ARTIFACT_URL"] + "\n\n")
              summary.write("all_classes_zero_workers=UNFULFILLED; CI01 OPEN; negative UNFULFILLED; merge HOLD; r5 SEALED.\n")
          if report["status"] != "PASS" or os.environ["RECORD_OUTCOME"] != "success" or os.environ["DOWNLOAD_OUTCOME"] != "success":
              raise SystemExit(1)
          PY
