# SPDX-License-Identifier: Apache-2.0
name: Temporary FIB and GRE regression controls

on:
  push:
    branches: [feat/ci-regression-controls-ff47-october19]

permissions:
  contents: read

concurrency:
  group: regression-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control:
    name: ${{ matrix.feature }} / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        feature: [fib, gre]
        variant: [fixed, restored]
        include:
          - feature: fib
            variant: special-update
    container:
      image: debian:trixie
      options: >-
        --shm-size=2g
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --security-opt=apparmor=unconfined
        --device-cgroup-rule="c 10:200 rwm"
        --device-cgroup-rule="c 10:238 rwm"
    defaults:
      run:
        shell: bash
    env:
      FEATURE: ${{ matrix.feature }}
      CONTROL_VARIANT: ${{ matrix.variant }}
      WORKFLOW_SHA: ${{ github.sha }}
      FROZEN_SHA: 630f876bc326eee05c23d517600b72e8d6a6ec83
      FIB_SHA: 564b0e46466adca2acb55acea5f3cc9f25562338
      GRE_SHA: 7213fd05cc7ec99403ac31d029ad272425cb35d5
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Install base tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          printf 'CONTROL_WORK_DEADLINE=%s\n' "$(( $(date +%s) + 4500 ))" >> "$GITHUB_ENV"
          printf 'CONTROL_DIR=%s/regression-control\nEVIDENCE_DIR=%s/regression-evidence\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/regression-control" "$RUNNER_TEMP/regression-evidence"
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update -qq
          apt-get install -y -qq sudo make git bash iproute2 python3

      - name: Check out the workflow commit
        timeout-minutes: 3
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prepare immutable source and evidence tools
        timeout-minutes: 2
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          mkdir -p "$CONTROL_DIR" "$EVIDENCE_DIR"
          cp .github/workflows/regression-control.yml "$EVIDENCE_DIR/workflow.yml"
          cat > "$CONTROL_DIR/sitecustomize.py" <<'PY'
          import json
          import os
          import traceback
          import unittest
          from pathlib import Path

          output = os.environ.get("CONTROL_EVENTS")
          if output:
              def emit(record):
                  record["pid"] = os.getpid()
                  path = Path(output)
                  if path.exists() and path.stat().st_size > 4 * 1024 * 1024:
                      raise RuntimeError("Observer exceeded 4 MiB event limit")
                  with path.open("a") as stream:
                      stream.write(json.dumps(record, sort_keys=True) + "\n")

              original_subtest = unittest.TestResult.addSubTest
              original_start = unittest.TestResult.startTest

              def observe(self, test, subtest, err):
                  emit({"kind": "subtest", "test": test.id(),
                        "params": dict(subtest.params),
                        "error": None if err is None else err[0].__name__,
                        "traceback": "" if err is None else
                        "".join(traceback.format_exception(*err))})
                  return original_subtest(self, test, subtest, err)

              def start(self, test):
                  emit({"kind": "start", "test": test.id()})
                  return original_start(self, test)

              unittest.TestResult.addSubTest = observe
              unittest.TestResult.startTest = start
              emit({"kind": "loaded"})
          PY
          cat > "$CONTROL_DIR/validate.py" <<'PY'
          import collections
          import json
          import re

          METHODS = ["test_gre_header_copy_4o4", "test_gre_header_copy_6o4",
                     "test_gre_header_copy_4o6", "test_gre_header_copy_6o6",
                     "test_mgre_header_copy_with_key"]
          CALLBACK = re.compile(r"--- (add\w+)\(\) ([\w]+)\.([\w]+)\(")

          def require(condition, message):
              if not condition:
                  raise AssertionError(message)

          def validate_fib_cli_error(variant, selector, rc, console, logs, stderr,
                                     callbacks, subtests, expected):
              require(selector == "fib.TestFIB.test_fib" and expected == [("TestFIB", "test_fib")],
                      "Unexpected FIB negative selector")
              require(rc == 2 and callbacks == [("addError", "TestFIB", "test_fib")] and not subtests,
                      "Unexpected FIB negative result")
              require(not re.search(r"SIG(?:SEGV|ABRT|BUS|ILL|FPE)|segmentation fault|"
                                    r"\bAborted\b|\bBus error\b|Core was generated|"
                                    r"VppTransportSocketIOError|VppDiedError|Vpp dead|"
                                    r"VPP subprocess died unexpectedly|VPP died shortly after startup|"
                                    r"poll failed:|socket poll error:|PUMP THREAD TIMEOUT|"
                                    r"Exception connecting to (?:vapi|VPP):|Core file present,|"
                                    r"timed out|TimeoutError|AssertionError|(?:^|\n)SKIP:|"
                                    r"OK \(skipped=", "\n".join((console, logs, stderr)), re.IGNORECASE),
                      "FIB infrastructure error or skipped test")
              require(re.findall(r"(?m)^(?:ERROR|FAIL|SKIP):[^\n]*", console) ==
                      ["ERROR: FIB Unit Tests"], "Unexpected FIB error heading")
              require(re.findall(r"(?m)^Ran [^\n]*", console) and
                      len(re.findall(r"(?m)^Ran [^\n]*", console)) == 1 and
                      re.search(r"(?m)^Ran 1 test in [0-9]+\.[0-9]+s$", console),
                      "Missing or duplicate completed FIB test summary")
              require(re.findall(r"(?m)^(?:FAILED|OK)[^\n]*", console) == ["FAILED (errors=1)"],
                      "Unexpected FIB failure summary")
              exception = "vpp_papi_exceptions.CliFailedCommandError: test fib: FIB Unit Test Failed"
              frames = (r'  File "[^"\n]*/test/asf/test_fib\.py", line 22, in test_fib\n'
                        r'    error = self\.vapi\.cli\("test fib"\)\n'
                        r'  File "[^"\n]*/test/vpp_papi_provider\.py", line 484, in cli\n'
                        r'    raise CliFailedCommandError\(r\.reply\)\n' + re.escape(exception))
              for text in (console, logs):
                  require(len(re.findall(r"(?m)^" + re.escape(exception) + r"$", text)) == 1 and
                          len(re.findall(frames, text)) == 1 and
                          text.count("Traceback (most recent call last):") == 1,
                          "Missing or unexpected FIB CLI traceback")
              clock = r"(?m:^)\d{2}:\d{2}:\d{2},\d{3} "
              call = (clock + r"CLI: test fib\n" + clock +
                      r"Calling cli_inband\('cmd':'test fib\\n','context':(?P<context>\d+),"
                      r"'_vl_msg_id':\d+,'client_index':\d+\)\n" + clock +
                      r"Return value: cli_inband_reply\(_0=\d+, context=(?P=context), "
                      r"retval=-1, reply='test fib: FI\.\.\.\n")
              calls = list(re.finditer(call, logs))
              require(len(calls) == 1 and len(re.findall(clock + r"CLI: test fib(?m:$)", logs)) == 1,
                      "Missing or duplicate failing test fib CLI call")
              require([int(value) for value in re.findall(r"Return value: [^\n]*retval=(-?\d+)", logs)
                       if int(value) != 0] == [-1], "Unexpected failing API return")
              outcome = (clock + r"--- addError\(\) TestFIB\.test_fib\(FIB Unit Tests\) called, "
                         r"error is \(<class 'vpp_papi_exceptions\.CliFailedCommandError'>, "
                         r"CliFailedCommandError\('test fib: FIB Unit Test Failed\\n'\), "
                         r"<traceback object at 0x[0-9a-f]+>\)(?m:$)")
              results = list(re.finditer(outcome, logs))
              require(len(results) == 1 and calls[0].end() == results[0].start(),
                      "FIB CLI error did not produce the exact result callback")
              lifecycle = ["--- START setUp() TestFIB.test_fib(",
                           "--- END setUp() TestFIB.test_fib(",
                           "CLI: test fib\n", "--- addError() TestFIB.test_fib(", exception,
                           "--- START tearDown() TestFIB.test_fib(",
                           "--- END tearDown() TestFIB.test_fib(",
                           "--- START tearDownClass() TestFIB ---",
                           "--- END tearDownClass() TestFIB ---"]
              positions = [logs.find(token) for token in lifecycle]
              require(all(logs.count(token) == 1 for token in lifecycle) and
                      positions == sorted(positions), "Incomplete or duplicate FIB lifecycle")
              cleanup = logs[positions[-2]:positions[-1]]
              shutdown = ["Disconnecting class vapi client on TestFIB",
                          "Sending TERM to vpp", "Waiting for vpp to die",
                          "Deleting class vpp attribute on TestFIB"]
              require(all(cleanup.count(token) == 1 for token in shutdown) and
                      [cleanup.index(token) for token in shutdown] ==
                      sorted(cleanup.index(token) for token in shutdown),
                      "Missing normal live-VPP class shutdown")
              shutdown_times = []
              for token in shutdown[2:]:
                  match = re.search(r"(?m)^(\d{2}):(\d{2}):(\d{2}),(\d{3}) " +
                                    re.escape(token) + r"$", cleanup)
                  require(match, "Missing shutdown timestamp")
                  hour, minute, second, millisecond = map(int, match.groups())
                  shutdown_times.append(((hour * 60 + minute) * 60 + second) * 1000 + millisecond)
              require((shutdown_times[1] - shutdown_times[0]) % 86400000 < 5000,
                      "VPP shutdown reached the caught five-second communicate timeout")
              require(console.index(exception) < console.index("Ran 1 test in ") <
                      console.index("FAILED (errors=1)"), "FIB summary precedes the failure")
              marker = ("FAIL:5809: special update purges import delegate"
                        if variant == "special-update" else
                        "FAIL:5702: incremental add creates import delegate")
              markers = re.findall(r"(?m)^FAIL:[0-9]+: [^\n]*", stderr)
              require(markers and markers[0] == marker and markers.count(marker) == 1,
                      f"Wrong, missing, or duplicate first FIB assertion: {markers[:1]}")

          def validate(feature, variant, selector, rc, console, logs, events, expected, stderr=""):
              callbacks = CALLBACK.findall(logs)
              loaded = [event["pid"] for event in events if event["kind"] == "loaded"]
              starts = [event for event in events if event["kind"] == "start"]
              subtests = [event for event in events if event["kind"] == "subtest"]
              require(loaded and len(set(loaded)) == len(loaded),
                      "Missing or duplicate observer load records")
              require(all(event["pid"] in loaded for event in starts + subtests),
                      "Test process did not load observer")
              require(collections.Counter(event["test"] for event in starts) ==
                      collections.Counter(f"test_{feature}.{cls}.{method}" for cls, method in expected),
                      "Missing, duplicate, or unexpected test starts")
              require(all(any(start["pid"] == event["pid"] and start["test"] == event["test"]
                              for start in starts) for event in subtests),
                      "Subtest without observed test start")
              if feature == "fib" and variant in ("restored", "special-update"):
                  validate_fib_cli_error(variant, selector, rc, console, logs, stderr,
                                         callbacks, subtests, expected)
                  return
              require(callbacks or feature == "gre" and variant == "restored",
                      "Missing framework result callbacks")
              require(not any(callback in ("addError", "addSkip", "addExpectedFailure",
                                           "addUnexpectedSuccess")
                              for callback, _, _ in callbacks), "Invalid result callback")
              require(not re.search(r"(?:^|\n)(?:ERROR|SKIP):|FAILED \([^\n]*errors=|"
                                    r"OK \(skipped=|SIG(?:SEGV|ABRT|BUS|ILL|FPE)|segmentation fault|"
                                    r"\bAborted\b|\bBus error\b|Core was generated|timed out|TimeoutError|"
                                    r"VppTransportSocketIOError|VppDiedError|Vpp dead|"
                                    r"VPP subprocess died unexpectedly|PUMP THREAD TIMEOUT",
                                    "\n".join((console, logs, stderr)),
                                    re.IGNORECASE), "Infrastructure error or skipped test")
              require(re.search(r"Ran [1-9][0-9]* tests? in ", console),
                      "Missing completed unittest summary")
              actual = [(cls, method) for callback, cls, method in callbacks
                        if callback == "addSuccess"]
              if variant == "fixed":
                  require(rc == 0, f"Fixed command failed: {rc}")
                  require(collections.Counter(actual) == collections.Counter(expected),
                          f"Missing/duplicate/unexpected successes: {actual}, expected {expected}")
                  require(all(callback == "addSuccess" for callback, _, _ in callbacks),
                          "Fixed run has a failure")
                  require(not any(event["error"] for event in subtests),
                          "Fixed run has a subtest failure")
                  require(not re.search(r"\bFAIL:[0-9]+:", logs), "C assertion failed")
              else:
                  require(rc == 2, f"Expected make test-failure exit status 2, got {rc}")
                  require(re.search(r"FAILED \(failures=[1-9][0-9]*\)", console),
                          "Expected completed assertion-only failure summary")
                  require(not actual, "Restored exact method unexpectedly succeeded")
              if feature == "fib":
                  return
              selected = METHODS if selector == "gre" else [selector.rsplit(".", 1)[1]]
              for method in selected:
                  records = [event for event in subtests
                             if event["test"] == f"test_gre.TestGRE.{method}"]
                  require(records, f"No subtest evidence for {method}")
                  identities = [(event["pid"], tuple(sorted(event["params"].items())))
                                for event in records]
                  require(len(set(identities)) == len(identities), "Duplicate subtest records")
                  if variant == "fixed":
                      if method == "test_mgre_header_copy_with_key":
                          parameters = [{"count": count} for count in (1, 65)]
                      else:
                          combined = 77 if method.endswith("4o4") else (
                              204 if method.endswith("6o6") else 76)
                          parameters = []
                          for key in (0, 268370692):
                              for flags in (0, 4, 8, 64, combined):
                                  parameters.append({"key": key, "flags": flags})
                                  parameters.extend({"key": key, "flags": flags, "count": count}
                                                    for count in (1, 65))
                      require(collections.Counter(json.dumps(event["params"], sort_keys=True)
                                                  for event in records) ==
                              collections.Counter(json.dumps(params, sort_keys=True)
                                                  for params in parameters),
                              f"Incomplete parameter coverage for {method}")
                  else:
                      failures = [event for event in records if event["error"]]
                      require(failures and all(event["error"] == "AssertionError"
                                              for event in failures),
                              "Restored GRE has non-assertion errors")
                      require(all("verify_gre_header_copy" in event["traceback"]
                                  for event in failures), "Unexpected GRE assertion location")
                      require(not callbacks, f"Unexpected restored GRE callbacks: {callbacks}")
                      first = failures[0]
                      mgre = method == "test_mgre_header_copy_with_key"
                      params = {"count": 1} if mgre else {
                          "key": 268370692, "flags": 4, "count": 1}
                      expression = "self.assertEqual(outer.tc, expected_tc)" if (
                          method.endswith("4o6") or method.endswith("6o6")) else (
                          "self.assertEqual(outer.tos, expected_tc)")
                      values = "AssertionError: 255 != 21" if mgre else "AssertionError: 252 != 20"
                      require(first["params"] == params and expression in first["traceback"]
                              and values in first["traceback"],
                              f"Wrong first packet assertion: {first}")
          PY
          cat > "$CONTROL_DIR/collect.py" <<'PY'
          import os
          import stat
          from pathlib import Path

          def collect(destination):
              destination.mkdir(parents=True, exist_ok=True)
              report = ["Limits per invocation: 24 MiB total, 2 MiB/file, 200 files; "
                        "text tails retained; oversized binary files skipped; no symlinks."]
              candidates = []
              for root in [*sorted(Path("/tmp").glob("vpp-unittest-*")),
                           Path("/tmp/vpp-failed-unittests"), Path("build-root/test-logs")]:
                  if root.is_symlink() or not root.is_dir():
                      continue
                  for directory, subdirs, names in os.walk(root, followlinks=False):
                      subdirs[:] = sorted(name for name in subdirs
                                          if not (Path(directory) / name).is_symlink())
                      for name in sorted(names):
                          source = Path(directory) / name
                          if source.suffix not in (".txt", ".log", ".pcap", ".pcapng"):
                              continue
                          if not stat.S_ISREG(source.lstat().st_mode):
                              continue
                          binary = source.suffix in (".pcap", ".pcapng")
                          priority = 0 if name in ("log.txt", "vpp_stderr.txt") else 1
                          candidates.append((binary, priority, source))
              remaining = 24 * 1024 * 1024
              count = 0
              for binary, _, source in sorted(candidates):
                  if count >= 200:
                      report.append("Stopped at 200-file limit")
                      break
                  fd = os.open(source, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(fd, "rb") as reader:
                      info = os.fstat(reader.fileno())
                      if not stat.S_ISREG(info.st_mode):
                          continue
                      size = info.st_size
                      length = min(size, 2 * 1024 * 1024)
                      if length > remaining or binary and size > length:
                          if len(report) < 1000:
                              report.append(f"SKIP {str(source)[:500]!r}: {size} bytes")
                          continue
                      target = destination / f"{count:04d}{source.suffix}"
                      reader.seek(size - length)
                      target.write_bytes(reader.read(length))
                  report.append(f"{str(source)[:500]!r} -> {target.name}: {length}/{size} bytes")
                  count += 1
                  remaining -= length
              (destination / "collection.txt").write_text("\n".join(report) + "\n")
          PY
          cat > "$CONTROL_DIR/run.py" <<'PY'
          import ast
          import ctypes
          import hashlib
          import json
          import os
          import re
          import selectors
          import signal
          import subprocess
          import sys
          import time
          import traceback
          from pathlib import Path
          from collect import collect
          from validate import CALLBACK, METHODS, validate

          output = Path(os.environ["EVIDENCE_DIR"])
          tools = Path(os.environ["CONTROL_DIR"])
          feature, variant = os.environ["FEATURE"], os.environ["CONTROL_VARIANT"]
          candidate = os.environ["FIB_SHA" if feature == "fib" else "GRE_SHA"]
          frozen = os.environ["FROZEN_SHA"]
          source = "src/vnet/fib/fib_entry.c" if feature == "fib" else "src/plugins/gre/gre.c"
          tests = (["src/plugins/unittest/fib_test.c", "test/asf/test_fib.py"]
                   if feature == "fib" else ["test/test_gre.py"])

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def blob(ref, path):
              return git("rev-parse", f"{ref}:{path}")

          def special_update_parts(data):
              signature = b"void\nfib_entry_special_update ("
              assert data.count(signature) == 1, "Missing or ambiguous special-update function"
              start = data.index(signature)
              end = data.index(b"\n}\n", start) + 3
              return data[:start], data[start:end], data[end:]

          def selective_source(candidate_bytes, frozen_bytes):
              prefix, function, suffix = special_update_parts(candidate_bytes)
              old_function = special_update_parts(frozen_bytes)[1]
              assert function != old_function, "Special-update control has no source difference"
              restored = prefix + old_function + suffix
              assert special_update_parts(restored) == (prefix, old_function, suffix)
              return restored

          def verify_selective_source():
              assert feature == "fib" and variant == "special-update"
              candidate_bytes = subprocess.check_output(["git", "show", f"{candidate}:{source}"])
              frozen_bytes = subprocess.check_output(["git", "show", f"{frozen}:{source}"])
              expected = selective_source(candidate_bytes, frozen_bytes)
              assert Path(source).read_bytes() == expected, "Selective source bytes differ"
              headers = ["src/vnet/fib/fib_entry.h", "src/vnet/fib/fib_entry_delegate.h"]
              for path in tests + headers:
                  original = subprocess.check_output(["git", "show", f"{candidate}:{path}"])
                  assert Path(path).read_bytes() == original, f"Candidate invariant failed: {path}"
              return candidate_bytes, frozen_bytes, expected, headers

          def process_identity(pid):
              try:
                  fields = Path(f"/proc/{pid}/stat").read_text().rsplit(")", 1)[1].split()
                  return int(fields[1]), int(fields[19])
              except (OSError, ValueError, IndexError):
                  return None

          def process_table():
              table = {}
              for path in Path("/proc").glob("[0-9]*/stat"):
                  pid = int(path.parent.name)
                  identity = process_identity(pid)
                  if identity is not None:
                      table[pid] = identity
              return table

          def descendants(tracked, baseline, unresolved):
              table = process_table()
              changed = True
              while changed:
                  changed = False
                  for pid, (parent, birth) in table.items():
                      owned_parent = (parent in tracked and parent not in baseline and
                                      parent in table and tracked[parent] == table[parent][1])
                      if pid in tracked or pid in baseline:
                          previous = tracked.get(pid, baseline.get(pid))
                          if birth != previous and owned_parent:
                              if (pid, birth) not in unresolved and len(unresolved) >= 2048:
                                  raise RuntimeError("Unresolved PID identity evidence limit exceeded")
                              unresolved.setdefault((pid, birth), {
                                  "pid": pid, "birth": birth, "previous_birth": previous,
                                  "parent": parent, "parent_birth": tracked[parent]})
                          continue
                      if parent == os.getpid() or owned_parent:
                          tracked[pid] = birth
                          changed = True
              return {pid for pid, birth in tracked.items()
                      if pid in table and table[pid][1] == birth}

          def inspect_process(pid, birth, sig=None):
              try:
                  descriptor = os.pidfd_open(pid)
              except ProcessLookupError:
                  return False, None
              try:
                  current = process_identity(pid)
                  if current is None or current[1] != birth:
                      return False, None
                  sent = False
                  if sig is not None:
                      try:
                          signal.pidfd_send_signal(descriptor, sig)
                          sent = True
                      except ProcessLookupError:
                          pass
                  try:
                      reaped = os.waitid(os.P_PIDFD, descriptor, os.WEXITED | os.WNOHANG)
                  except ChildProcessError:
                      reaped = None
                  return sent, reaped
              finally:
                  os.close(descriptor)

          def record_root_exit(process, reaped):
              if process is not None and reaped is not None and reaped.si_pid == process.pid:
                  process.returncode = (reaped.si_status if reaped.si_code == os.CLD_EXITED
                                        else -reaped.si_status)

          def poll_root(process, tracked):
              if process.returncode is None:
                  _, reaped = inspect_process(process.pid, tracked.get(process.pid))
                  record_root_exit(process, reaped)
              return process.returncode

          def process_evidence(pid, birth):
              result = {"pid": pid, "birth": birth, "state": None, "comm": None, "cmdline": None}
              current = process_identity(pid)
              if current is None or current[1] != birth:
                  result["identity_matches"] = False
                  return result
              try:
                  with Path(f"/proc/{pid}/stat").open("rb") as stream:
                      result["state"] = stream.read(4096).rsplit(b")", 1)[1].split()[0].decode()
                  for name, limit in (("comm", 256), ("cmdline", 1024)):
                      with Path(f"/proc/{pid}/{name}").open("rb") as stream:
                          data = stream.read(limit + 1)
                      result[name] = data[:limit].replace(b"\0", b" ").decode(errors="replace").rstrip()
                      result[f"{name}_truncated"] = len(data) > limit
              except (OSError, ValueError, IndexError) as error:
                  result["error"] = str(error)[:500]
              current = process_identity(pid)
              if current is None or current[1] != birth:
                  return {"pid": pid, "birth": birth, "identity_matches": False,
                          "state": None, "comm": None, "cmdline": None}
              result["identity_matches"] = True
              return result

          def reap_completed(tracked, baseline, unresolved, result):
              observed = set()
              deadline = time.monotonic() + 5
              while True:
                  progress = False
                  for pid in sorted(descendants(tracked, baseline, unresolved)):
                      if time.monotonic() >= deadline:
                          raise TimeoutError("Completion reap deadline exceeded")
                      birth = tracked[pid]
                      if (pid, birth) not in observed:
                          if len(observed) >= 2048:
                              raise RuntimeError("Completion process evidence limit exceeded")
                          result["processes"].append(process_evidence(pid, birth))
                          observed.add((pid, birth))
                      _, reaped = inspect_process(pid, birth)
                      if reaped is not None:
                          if len(result["reaped"]) >= 2048:
                              raise RuntimeError("Completion reap evidence limit exceeded")
                          result["reaped"].append([reaped.si_pid, birth, reaped.si_status, reaped.si_code])
                          progress = True
                  if not progress:
                      return

          def cleanup(process, tracked, baseline, unresolved):
              result = {"signals": [], "reaped": [], "survivors": [], "processes": []}
              observed = set()
              deadline = time.monotonic() + 5
              for sig, seconds in ((signal.SIGTERM, 1), (signal.SIGKILL, 3)):
                  stage_end = min(deadline, time.monotonic() + seconds)
                  while True:
                      live = descendants(tracked, baseline, unresolved)
                      identities = [(pid, tracked[pid]) for pid in sorted(live)]
                      for pid, birth in identities:
                          if (pid, birth) not in observed:
                              if len(observed) < 2048:
                                  result["processes"].append(process_evidence(pid, birth))
                                  observed.add((pid, birth))
                              else:
                                  result["processes_truncated"] = True
                          sent, reaped = inspect_process(pid, birth, sig)
                          if sent and len(result["signals"]) < 2048:
                              result["signals"].append([pid, birth, int(sig)])
                          if reaped is not None:
                              if len(result["reaped"]) < 2048:
                                  result["reaped"].append([reaped.si_pid, birth, reaped.si_status,
                                                           reaped.si_code])
                              else:
                                  result["reaped_truncated"] = True
                              record_root_exit(process, reaped)
                      if not descendants(tracked, baseline, unresolved) or time.monotonic() >= stage_end:
                          break
                      time.sleep(0.02)
              if process is not None and process.returncode is None:
                  poll_root(process, tracked)
                  if process.returncode is None:
                      result["survivors"].append(process.pid)
              result["survivors"] = sorted(set(result["survivors"]) |
                                           descendants(tracked, baseline, unresolved))
              result["unresolved_identities"] = list(unresolved.values())
              if unresolved:
                  result["error"] = "Proven owned PID reuse remains unresolved"
              return result

          def command(label, args, env=None, seconds=900, evidence=False):
              directory = output / label
              directory.mkdir()
              now = time.time()
              limit = min(now + seconds, float(os.environ["CONTROL_WORK_DEADLINE"]) +
                          (300 if evidence else 0))
              deadline = time.monotonic() + max(0, limit - now)
              result = {"command": args, "start": now, "deadline": limit, "rc": None,
                        "outcome": "running", "exception": None, "cleanup": None,
                        "completion": {"processes": [], "reaped": []}}
              result_path = directory / "result.json"
              result_path.write_text(json.dumps(result, indent=2))
              (directory / "console.log").touch()
              tail, process, tracked, unresolved = bytearray(), None, {}, {}
              baseline = {pid: birth for pid, (_, birth) in process_table().items()}
              poller = selectors.DefaultSelector()
              handlers = {}

              def interrupted(signum, frame):
                  raise KeyboardInterrupt(f"Runner received signal {signum}")

              try:
                  for sig in (signal.SIGTERM, signal.SIGINT):
                      handlers[sig] = signal.signal(sig, interrupted)
                  if ctypes.CDLL(None, use_errno=True).prctl(36, 1, 0, 0, 0) != 0:
                      raise OSError(ctypes.get_errno(), "Cannot become child subreaper")
                  if time.monotonic() >= deadline:
                      raise TimeoutError("Command budget exhausted before spawn")
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                             env=env, start_new_session=True)
                  descendants(tracked, baseline, unresolved)
                  result["pid"] = process.pid
                  result["pid_starttime"] = tracked.get(process.pid)
                  result_path.write_text(json.dumps(result, indent=2))
                  os.set_blocking(process.stdout.fileno(), False)
                  poller.register(process.stdout, selectors.EVENT_READ)
                  with (directory / "console.log").open("w+b") as stream:
                      while poller.get_map() or poll_root(process, tracked) is None:
                          descendants(tracked, baseline, unresolved)
                          remaining = deadline - time.monotonic()
                          if remaining <= 0:
                              raise TimeoutError("Absolute command deadline exceeded")
                          for key, _ in poller.select(min(0.1, remaining)):
                              try:
                                  chunk = os.read(key.fd, 65536)
                              except BlockingIOError:
                                  continue
                              if not chunk:
                                  poller.unregister(key.fileobj)
                                  continue
                              tail.extend(chunk)
                              del tail[:-8 * 1024 * 1024]
                              stream.seek(0)
                              stream.write(tail)
                              stream.truncate()
                              stream.flush()
                      result["rc"] = process.returncode
                  reap_completed(tracked, baseline, unresolved, result["completion"])
                  if descendants(tracked, baseline, unresolved):
                      raise RuntimeError("Command left descendant processes after completion")
                  result["outcome"] = "success" if result["rc"] == 0 else "nonzero"
              except BaseException as error:
                  result["outcome"] = ("timeout" if isinstance(error, (TimeoutError, subprocess.TimeoutExpired))
                                       else "exception")
                  result["exception"] = {"type": type(error).__name__, "message": str(error),
                                         "traceback": traceback.format_exc()}
              finally:
                  for sig in handlers:
                      signal.signal(sig, signal.SIG_IGN)
                  try:
                      result["cleanup"] = cleanup(process, tracked, baseline, unresolved)
                  except BaseException as error:
                      result["cleanup"] = {"error": repr(error), "survivors": sorted(tracked)}
                  result["cleanup"]["unresolved_identities"] = list(unresolved.values())
                  if unresolved:
                      result["cleanup"].setdefault("error", "Proven owned PID reuse remains unresolved")
                  if process is not None:
                      result["rc"] = process.returncode
                  try:
                      if process is not None:
                          process.stdout.close()
                      poller.close()
                  except OSError as error:
                      result["cleanup"]["error"] = repr(error)
                  if result["cleanup"]["survivors"] or "error" in result["cleanup"]:
                      result["outcome"] = "cleanup-failed"
                  result["spawned"] = process is not None
                  result["retained_bytes"] = len(tail)
                  result["runner_rc"] = result["rc"] if result["outcome"] in ("success", "nonzero") else 125
                  result["end"] = time.time()
                  result_path.write_text(json.dumps(result, indent=2))
                  for sig, handler in handlers.items():
                      signal.signal(sig, handler)
              status = result["rc"] if result["outcome"] in ("success", "nonzero") else 125
              return directory, status, tail.decode(errors="replace")

          def prepare():
              workflow_sha = os.environ["WORKFLOW_SHA"]
              assert git("rev-parse", "HEAD") == workflow_sha
              manifest = {"workflow_sha": workflow_sha, "candidate_sha": candidate,
                          "frozen_sha": frozen, "feature": feature, "variant": variant,
                          "candidate_tree": git("rev-parse", f"{candidate}^{{tree}}"),
                          "workflow_blob": blob(workflow_sha, ".github/workflows/regression-control.yml"),
                          "run_id": os.environ["GITHUB_RUN_ID"],
                          "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                          "job": os.environ["GITHUB_JOB"], "tests": {},
                          "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                                     f"/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                          "artifact_name": f"regression-{feature}-{variant}-"
                                           f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
                          "expected_failure": ("FAIL:5702: incremental add creates import delegate"
                                               if feature == "fib" else
                                               "key=268370692 flags=4 count=1: outer.tos/tc 252 != 20; "
                                               "mGRE count=1: outer.tos 255 != 21"),
                          "tool_sha256": {path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                                          for path in sorted(tools.glob("*.py"))}}
              subprocess.run(["git", "checkout", "--detach", candidate], check=True)
              assert not git("status", "--porcelain", "--untracked-files=all")
              assert not Path("build-root/build-vpp_debug-native").exists()
              assert not Path("build-root/install-vpp_debug-native").exists()
              if variant == "restored":
                  with Path(source).open("wb") as stream:
                      subprocess.run(["git", "show", f"{frozen}:{source}"], stdout=stream, check=True)
              expected_source = blob(frozen if variant == "restored" else candidate, source)
              if variant == "special-update":
                  assert feature == "fib"
                  candidate_bytes = subprocess.check_output(["git", "show", f"{candidate}:{source}"])
                  frozen_bytes = subprocess.check_output(["git", "show", f"{frozen}:{source}"])
                  assert Path(source).read_bytes() == candidate_bytes
                  Path(source).write_bytes(selective_source(candidate_bytes, frozen_bytes))
                  candidate_bytes, frozen_bytes, restored, headers = verify_selective_source()
                  expected_source = git("hash-object", source)
                  manifest["expected_failure"] = "FAIL:5809: special update purges import delegate"
                  manifest["selective_restore"] = {
                      "function": "fib_entry_special_update",
                      "candidate_function_sha256": hashlib.sha256(
                          special_update_parts(candidate_bytes)[1]).hexdigest(),
                      "frozen_function_sha256": hashlib.sha256(
                          special_update_parts(frozen_bytes)[1]).hexdigest(),
                      "outside_function_sha256": [hashlib.sha256(part).hexdigest()
                                                  for part in special_update_parts(restored)[::2]],
                      "candidate_headers": {path: blob(candidate, path) for path in headers}}
              assert git("hash-object", source) == expected_source
              changed = git("diff", "--name-only").splitlines()
              assert changed == ([source] if variant in ("restored", "special-update") else [])
              for path in tests:
                  current = git("hash-object", path)
                  assert current == blob(candidate, path)
                  manifest["tests"][path] = current
              manifest["source"] = {"path": source, "candidate_blob": blob(candidate, source),
                                    "frozen_blob": blob(frozen, source), "built_blob": expected_source}
              # A temporary index identifies the exact restored tree without changing HEAD.
              index = tools / "tree-index"
              index_env = dict(os.environ, GIT_INDEX_FILE=str(index))
              subprocess.run(["git", "read-tree", candidate], env=index_env, check=True)
              subprocess.run(["git", "add", source], env=index_env, check=True)
              manifest["built_tree"] = subprocess.check_output(
                  ["git", "write-tree"], env=index_env, text=True).strip()
              (output / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
              (output / "restoration.diff").write_text(git("diff", "--", source) + "\n")
              (output / "expected-source").write_text(expected_source)

          def retain_callbacks(directory, log_paths, events_path):
              assert len(log_paths) <= 200, "Callback source-file limit exceeded"
              sources, records, texts = [], [], []
              for path in log_paths:
                  assert path.is_file() and not path.is_symlink(), "Invalid callback source"
                  data = path.read_bytes()
                  text = data.decode(errors="replace")
                  texts.append(text)
                  sources.append({"path": str(path), "bytes": len(data),
                                  "sha256": hashlib.sha256(data).hexdigest()})
                  for number, line in enumerate(text.splitlines(), 1):
                      if CALLBACK.search(line):
                          assert len(line.encode()) <= 16384, "Callback line limit exceeded"
                          records.append({"source": str(path), "line": number, "text": line})
                          assert len(records) <= 1024, "Callback record limit exceeded"
              logs = "\n".join(texts)
              excerpt = "\n".join(record["text"] for record in records)
              assert CALLBACK.findall(excerpt) == CALLBACK.findall(logs), "Incomplete callbacks"
              provenance = [output / "manifest.json", directory / "result.json",
                            directory / "console.log", events_path]
              evidence = {"complete": True, "pattern": CALLBACK.pattern,
                          "sources": sources, "records": records, "provenance": {}}
              for path in provenance:
                  key = str(path.relative_to(output))
                  try:
                      assert path.is_file() and not path.is_symlink(), "Missing or invalid provenance file"
                      data = path.read_bytes()
                      evidence["provenance"][key] = {
                          "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
                  except (AssertionError, OSError) as error:
                      evidence["complete"] = False
                      evidence["provenance"][key] = {"missing": True, "error": str(error)[:1000]}
              encoded = (json.dumps(evidence, indent=2) + "\n").encode()
              assert len(encoded) <= 1024 * 1024, "Callback evidence limit exceeded"
              (directory / "callbacks.json").write_bytes(encoded)
              assert evidence["complete"], "Incomplete callback provenance; retained available records"
              return logs

          def run_tests():
              assert git("hash-object", source) == (output / "expected-source").read_text()
              assert all(git("hash-object", path) == blob(candidate, path) for path in tests)
              if variant == "special-update":
                  verify_selective_source()
              module = Path(tests[-1])
              tree = ast.parse(module.read_text())
              all_methods = [(cls.name, method.name) for cls in tree.body
                             if isinstance(cls, ast.ClassDef) for method in cls.body
                             if isinstance(method, ast.FunctionDef) and method.name.startswith("test_")]
              exact = (["fib.TestFIB.test_fib"] if feature == "fib" else
                       [f"gre.TestGRE.{method}" for method in METHODS])
              selectors = ([feature] if variant == "fixed" else []) + exact
              errors = []
              for number, selector in enumerate(selectors):
                  label = f"test-{number:02d}-{selector}"
                  events_path = output / f"{label}-events.jsonl"
                  environment = dict(os.environ, CONTROL_EVENTS=str(events_path),
                                     PYTHONPATH=str(tools) + os.pathsep + os.environ.get("PYTHONPATH", ""))
                  args = ["make", "UNATTENDED=yes", "TEST_JOBS=1", "FORCE_FOREGROUND=1",
                          "VPP_WORKER_COUNT=0", "RETRIES=0", "FAILFAST=0", "SKIP_TESTS=",
                          "COREDUMP_SIZE=0", "DECODE_PCAPS=none", "RND_SEED=47", f"TEST={selector}",
                          "test-debug"]
                  directory, rc, console = command(label, args, environment)
                  expected = all_methods if selector == feature else [tuple(selector.split(".")[1:])]
                  request = {"label": label, "selector": selector, "expected": expected,
                             "events": str(events_path), "status": rc}
                  (directory / "snapshot-request.json").write_text(json.dumps(request))
                  _, diagnostic_status, _ = command(
                      f"diagnostics-{label}", [sys.executable, str(tools / "run.py"), "collect", label],
                      seconds=60, evidence=True)
                  _, snapshot_status, _ = command(
                      f"snapshot-{label}", [sys.executable, str(tools / "run.py"), "snapshot", label],
                      seconds=60, evidence=True)
                  if diagnostic_status or snapshot_status:
                      errors.append(f"{selector}: diagnostics={diagnostic_status}, snapshot={snapshot_status}")
                  if json.loads((directory / "result.json").read_text())["outcome"] not in (
                          "success", "nonzero"):
                      errors.append(f"{selector}: invocation infrastructure failure")
                      break
              if errors:
                  raise AssertionError("\n".join(errors))

          def snapshot(label):
              directory = output / label
              request = json.loads((directory / "snapshot-request.json").read_text())
              errors = []
              try:
                  log_paths = sorted(Path("/tmp").glob("vpp-unittest-*/log.txt"))
                  events_path = Path(request["events"])
                  logs = retain_callbacks(directory, log_paths, events_path)
                  stderr_paths = sorted(Path("/tmp").glob("vpp-unittest-*/vpp_stderr.txt"))
                  stderr = "\n".join(path.read_text(errors="replace") for path in stderr_paths
                                     if path.is_file() and not path.is_symlink())
                  events = [json.loads(line) for line in events_path.read_text().splitlines()]
                  result = json.loads((directory / "result.json").read_text())
                  assert result["outcome"] in ("success", "nonzero"), "Invocation infrastructure failure"
                  assert result["rc"] == request["status"] and result["end"] >= result["start"]
                  validate(feature, variant, request["selector"], result["rc"],
                           (directory / "console.log").read_text(errors="replace"), logs, events,
                           [tuple(item) for item in request["expected"]], stderr)
              except (AssertionError, OSError, ValueError) as error:
                  errors.append(f"Callbacks/validation: {error}")
              (directory / "validation.txt").write_text(
                  "FAIL: " + "; ".join(errors) + "\n" if errors else "PASS\n")
              if errors:
                  raise AssertionError("; ".join(errors))

          if __name__ == "__main__":
              if sys.argv[1] == "prepare":
                  prepare()
              elif sys.argv[1] == "tests":
                  run_tests()
              elif sys.argv[1] == "snapshot":
                  snapshot(sys.argv[2])
              elif sys.argv[1] == "collect":
                  destination = output / sys.argv[2] / "diagnostics" if len(sys.argv) > 2 else output / "final-diagnostics"
                  collect(destination)
              else:
                  label = sys.argv[1]
                  seconds = {"dependencies": 900, "build": 2400, "final-collection": 60}.get(label, 900)
                  _, status, _ = command(label, sys.argv[2:], seconds=seconds,
                                         evidence=label == "final-collection")
                  raise SystemExit(status)
          PY
          python3 "$CONTROL_DIR/run.py" prepare

      - name: Install build dependencies
        run: |
          set -euo pipefail
          python3 "$CONTROL_DIR/run.py" dependencies make UNATTENDED=yes install-dep

      - name: Supply version if no release tag is reachable
        run: |
          set -euo pipefail
          if ! git describe --long --match 'v[0-9]*' 2>/dev/null; then
            echo "0.0.0-release+$(git log -1 --format=%ct).$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)" \
              > src/scripts/.version
          fi
          if [ -f src/scripts/.version ]; then
            cp src/scripts/.version "$EVIDENCE_DIR/version.txt"
          fi

      - name: Build this variant independently
        run: |
          set -euo pipefail
          python3 "$CONTROL_DIR/run.py" build make UNATTENDED=yes build

      - name: Set up test runtime
        timeout-minutes: 2
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ runner.temp }}/regression-evidence/runtime

      - name: Run full fixed suites and exact assertion controls
        run: |
          set -euo pipefail
          mountpoint /dev/shm
          test "$(df -B1 --output=size /dev/shm | tail -n 1)" -ge 2147483648
          python3 "$CONTROL_DIR/run.py" tests

      - name: Retain final diagnostics and tool provenance
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if [ -d "$CONTROL_DIR" ]; then
            cp "$CONTROL_DIR/"*.py "$EVIDENCE_DIR/"
          fi
          if [ -f "$CONTROL_DIR/run.py" ]; then
            python3 "$CONTROL_DIR/run.py" final-collection python3 "$CONTROL_DIR/run.py" collect
          fi

      - name: Upload bounded control evidence
        id: evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.feature }}-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/regression-evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Record artifact identity
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf 'Artifact ID: %s\nArtifact URL: %s\n' "$ARTIFACT_ID" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
