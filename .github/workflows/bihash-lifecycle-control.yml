# SPDX-License-Identifier: Apache-2.0
# Temporary validation only: never merge this workflow into master.
name: Bihash lifecycle control

on:
  push:
    branches: ['ci/bihash-lifecycle-control-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bihash-lifecycle-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 1e3ae1a0f54a8a2a7160663bbd50775bcb6b2206
  PARENT_SHA: f9d4c2e78f4bed10f732a75f04484856416fe5a1
  CORE_PARENT_BLOB: 972963da5e09581516561ad115d6e773772d44e6
  CORE_FIXED_BLOB: c3a97cd823d9fab8550b091cd01e46880790c6bf
  C_TEST_BLOB: 072c1183912740e11d2eaf9314b5f190e4eb131f
  ASF_TEST_BLOB: 34b3cef50a9d6bce301fe07b048349abe8906447

jobs:
  lifecycle:
    name: bihash lifecycle (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, parent-core]
    container:
      image: debian:trixie
      options: >-
        --shm-size=2g
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --security-opt=apparmor=unconfined
        --device-cgroup-rule="c 10:200 rwm"
        --device-cgroup-rule="c 10:238 rwm"
    defaults:
      run:
        shell: bash
    env:
      CONTROL_VARIANT: ${{ matrix.variant }}
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Install base tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update -qq
          apt-get install -y -qq sudo make git bash iproute2 python3

      - name: Check out frozen M78 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify immutable source and select core variant
        timeout-minutes: 2
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          mkdir -p evidence
          for pin in "$SOURCE_SHA" "$PARENT_SHA" "$CORE_PARENT_BLOB" \
                     "$CORE_FIXED_BLOB" "$C_TEST_BLOB" "$ASF_TEST_BLOB"; do
            [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          core=src/vppinfra/bihash_template.c
          c_test=src/plugins/unittest/bihash_test.c
          asf_test=test/asf/test_bihash.py
          test "$(git rev-parse "$PARENT_SHA:$core")" = "$CORE_PARENT_BLOB"
          test "$(git hash-object "$core")" = "$CORE_FIXED_BLOB"
          test "$(git hash-object "$c_test")" = "$C_TEST_BLOB"
          test "$(git hash-object "$asf_test")" = "$ASF_TEST_BLOB"
          if [ "$CONTROL_VARIANT" = parent-core ]; then
            git cat-file blob "$CORE_PARENT_BLOB" > "$core"
            test "$(git hash-object "$core")" = "$CORE_PARENT_BLOB"
            test "$(git diff --name-only)" = "$core"
          else
            test -z "$(git status --porcelain --untracked-files=no)"
          fi
          test "$(git hash-object "$c_test")" = "$C_TEST_BLOB"
          test "$(git hash-object "$asf_test")" = "$ASF_TEST_BLOB"
          {
            printf 'source=%s\nparent=%s\nvariant=%s\n' "$SOURCE_SHA" "$PARENT_SHA" "$CONTROL_VARIANT"
            printf 'workflow_commit=%s\nworkflow_ref=%s\n' "$GITHUB_SHA" "$GITHUB_REF"
            printf 'run=%s\nattempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git ls-tree HEAD "$core" "$c_test" "$asf_test"
            git hash-object "$core" "$c_test" "$asf_test"
            git diff -- "$core"
          } | tee evidence/source-identity.txt

      - name: Install VPP build dependencies
        timeout-minutes: 12
        run: |
          set -euo pipefail
          make UNATTENDED=yes install-dep 2>&1 | tee evidence/dependencies.log

      - name: Provide repository version fallback
        run: |
          set -euo pipefail
          if ! git describe --tags --long --match 'v[0-9]*' 2>/dev/null; then
            echo "0.0.0-release+$(git log -1 --format=%ct).$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)" \
              > src/scripts/.version
          fi

      - name: Build VPP debug
        timeout-minutes: 50
        run: |
          set -euo pipefail
          export VPP_EXTRA_CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          ccache -z
          set +e
          timeout --signal=TERM --kill-after=30s 45m \
            make UNATTENDED=yes build 2>&1 | tee evidence/build.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > evidence/build.exit
          test "${statuses[0]}" = 0
          test "${statuses[1]}" = 0
          ccache -s | tee evidence/ccache.txt

      - name: Remount shared memory using repository setup
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ github.workspace }}/evidence/runtime

      - name: Run focused lifecycle and broader bihash suite
        timeout-minutes: 38
        run: |
          set -euo pipefail
          for phase in focused suite; do
            filter=bihash
            limit=20m
            if [ "$phase" = focused ]; then
              filter=bihash.TestBihash.test_bihash_lifecycle
              limit=15m
            fi
            root="/tmp/bh-${phase}"
            mkdir -p "$root" "evidence/$phase"
            printf '%s\n' "make UNATTENDED=yes TEST_JOBS=auto RETRIES=0 TEST=$filter test-debug" \
              > "evidence/$phase/command.txt"
            set +e
            timeout --signal=TERM --kill-after=30s "$limit" \
              make UNATTENDED=yes TEST_JOBS=auto RETRIES=0 TEST="$filter" \
                FAILED_DIR="$root/failed" EXTRA_ARGS="--tmp-dir=$root" \
                test-debug 2>&1 | tee "evidence/$phase/console.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${statuses[0]}" > "evidence/$phase/make.exit"
            printf '%s\n' "${statuses[1]}" > "evidence/$phase/tee.exit"
            PHASE="$phase" TEST_ROOT="$root" python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['TEST_ROOT'])
          out = Path('evidence') / os.environ['PHASE']
          report = []
          for name in ('log.txt', 'vpp_stdout.txt', 'vpp_stderr.txt'):
              source = root / 'vpp-unittest-TestBihash' / name
              if not source.is_file() or source.is_symlink():
                  report.append(f'MISSING {source}')
                  continue
              if source.stat().st_size > 32 * 1024 * 1024:
                  report.append(f'OVERSIZED {source}')
                  continue
              shutil.copyfile(source, out / name)
              report.append(f'COPIED {source}')
          cores = [str(p) for p in root.rglob('core*') if p.is_file()]
          if cores:
              (out / 'core-detected.txt').write_text('\n'.join(cores) + '\n')
          (out / 'collection.txt').write_text('\n'.join(report) + '\n')
          PY
          done

      - name: Require actual named results and CLI evidence
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def classify(variant, phase, rc, console, log, crashed=False):
              def require(condition, message):
                  if not condition:
                      raise ValueError(message)

              console = re.sub(r'\x1b\[[0-9;]*m', '', console)
              require(rc not in (124, 137, 143), 'timeout or killed process')
              require(not crashed, 'core file detected')
              require(not re.search(r'SIGSEGV|SIGABRT|AddressSanitizer|core dumped|Assertion .*failed',
                                    console + log), 'crash diagnostic')
              require('TEST RESULTS:' in console, 'missing completed harness summary')
              counts = dict(re.findall(r'^\s*([A-Za-z ]+):\s*(\d+)\s*$', console, re.M))
              expected_count = 1 if phase == 'focused' else 5
              require(counts.get('Scheduled tests') == str(expected_count), 'unexpected selection')
              require(counts.get('Executed tests') == str(expected_count), 'incomplete execution')
              for label in ('Errors', 'Expected failures', 'Unexpected passes', 'Not Executed tests',
                            'Tests skipped due to lack of CPUS'):
                  require(int(counts.get(label, 0)) == 0, f'invalid {label}')
              events = re.findall(r' --- (add\w+)\(\) TestBihash\.(\w+)\(', log)
              expected = {'test_bihash_lifecycle': 'addSuccess' if variant == 'fixed' else 'addFailure'}
              if phase == 'suite':
                  expected.update(test_bihash_unittest='addSuccess', test_bihash_thread='addSuccess',
                                  test_bihash_vec64='addSuccess', test_bihash_coverage='addSkip')
                  require(re.search(r' --- addSkip\(\) TestBihash\.test_bihash_coverage\([^\n]*'
                                    r' called, reason is part of code coverage tests$', log, re.M),
                          'unexpected coverage skip reason')
              require(sorted(events) == sorted((callback, method) for method, callback in expected.items()),
                      f'unexpected named callbacks: {events}')
              require(int(counts.get('Skipped tests', 0)) == (phase == 'suite'), 'unexpected skips')
              retval = re.findall(r'bihash lifecycle CLI retval: (-?\d+)', log)
              if variant == 'fixed':
                  require(rc == 0, f'make failed: {rc}')
                  require(retval == ['0'], f'CLI retval evidence: {retval}')
                  require('bihash lifecycle: passed' in log, 'missing CLI success')
                  require(int(counts.get('Failures', 0)) == 0, 'unexpected failure')
                  require(int(counts.get('Passed tests', 0)) == (1 if phase == 'focused' else 4),
                          'unexpected success count')
              else:
                  require(rc != 0, 'negative control unexpectedly passed')
                  require(len(retval) == 1 and int(retval[0]) != 0, 'missing failed CLI retval')
                  require('bihash lifecycle: passed' not in log, 'negative CLI unexpectedly passed')
                  require(int(counts.get('Failures', 0)) == 1, 'expected exactly one failure')
                  require(int(counts.get('Passed tests', 0)) == (0 if phase == 'focused' else 3),
                          'unrelated test failure')
                  memory = re.findall(
                      r'bihash lifecycle: free did not restore heap bytes_used '
                      r'\(unregistered 0 cycle 0 case lazy-empty bytes_used (\d+) baseline (\d+)\)', log)
                  require(memory and all(int(actual) > int(baseline) for actual, baseline in memory),
                          'missing named lifecycle memory-accounting failure')
              return {'variant': variant, 'phase': phase, 'make_exit': rc, 'callbacks': events,
                      'result': 'verified'}

          reports = []
          errors = []
          for phase in ('focused', 'suite'):
              root = Path('evidence') / phase
              try:
                  if (root / 'tee.exit').read_text().strip() != '0':
                      raise ValueError('console capture failed')
                  collection = (root / 'collection.txt').read_text()
                  if 'OVERSIZED' in collection or 'MISSING' in collection:
                      raise ValueError('incomplete raw logs')
                  reports.append(classify(os.environ['CONTROL_VARIANT'], phase,
                      int((root / 'make.exit').read_text()), (root / 'console.log').read_text(),
                      (root / 'log.txt').read_text(), (root / 'core-detected.txt').exists()))
              except (OSError, ValueError) as error:
                  errors.append(f'{phase}: {error}')
          Path('evidence/classification.json').write_text(json.dumps(
              {'verified': reports, 'errors': errors}, indent=2) + '\n')
          if errors:
              raise SystemExit('; '.join(errors))
          print(json.dumps(reports, indent=2))
          PY

      - name: Record final tested source blobs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            git rev-parse HEAD
            git hash-object src/vppinfra/bihash_template.c src/plugins/unittest/bihash_test.c test/asf/test_bihash.py
            git status --short
          } > evidence/final-source.txt
          test "$(git hash-object src/plugins/unittest/bihash_test.c)" = "$C_TEST_BLOB"
          test "$(git hash-object test/asf/test_bihash.py)" = "$ASF_TEST_BLOB"
          expected="$CORE_FIXED_BLOB"
          if [ "$CONTROL_VARIANT" = parent-core ]; then expected="$CORE_PARENT_BLOB"; fi
          test "$(git hash-object src/vppinfra/bihash_template.c)" = "$expected"

      - name: Upload source identity and raw test evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: bihash-lifecycle-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
