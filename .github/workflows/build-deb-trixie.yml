name: Build VPP DEB for Debian 13 (Trixie)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as GitHub Release"
        type: boolean
        default: false
      tag:
        description: "Release tag (if publishing)"
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    container:
      image: debian:trixie
    env:
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Disable APT cache cleanup
        run: rm -f /etc/apt/apt.conf.d/docker-clean

      - name: Install base tools
        run: |
          apt-get update -qq
          apt-get install -y -qq sudo make git

      - name: Clone repository
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY.git" .
          # The branch can move between the event and this clone, so check out
          # the commit the run is for instead of whatever the branch points at
          # now; otherwise the debs and their version string would name a
          # different commit than the run and the release body do.
          git config --global --add safe.directory "$PWD"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            git fetch --no-tags --depth 1 origin "$GITHUB_SHA"
            git checkout --detach FETCH_HEAD
          fi

      # The key is derived from the files that decide which packages get
      # downloaded, so it must be hashed after the clone: before it the
      # expression has nothing to hash and resolves to an empty string.
      - name: Restore apt archive cache
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debian13-${{ runner.arch }}-${{ hashFiles('build/external/packages/*.mk') }}
          restore-keys: |
            apt-debian13-${{ runner.arch }}-

      - name: Compute short SHA
        id: vars
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Install VPP build dependencies
        run: |
          sed -i '/^\s*git config commit\.template/s/^\(\s*\)/\1-/' Makefile
          make UNATTENDED=yes install-dep

      - name: Save apt archive cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debian13-${{ runner.arch }}-${{ hashFiles('build/external/packages/*.mk') }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: build-root/.ccache
          key: ccache-debian13-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-debian13-${{ runner.arch }}-${{ github.ref_name }}-
            ccache-debian13-${{ runner.arch }}-

      - name: Build VPP DEB packages
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch --tags --force 2>/dev/null || true
          # Only a VPP release tag (vYY.MM...) should win over the synthesised
          # version.  A bare 'v*' also matches this workflow's own release
          # tags (vpp-trixie-<n>), which would leave .version unwritten and
          # send src/scripts/version down its own git describe path.
          if ! git describe --tags --long --match 'v[0-9]*' 2>/dev/null; then
            # No matching tag in this repo, so synthesise one.  The build
            # identifier must vary per commit, otherwise every build of this
            # branch produces the same version string and apt skips packages
            # it considers already installed.
            #
            # The "0.0.0-release" prefix is deliberate: it is the version of
            # packages already installed from this branch, and Debian
            # compares "<upstream>-<revision>" by its last hyphen, so a plain
            # "0.0.0-<ts>~g<sha>" would sort BELOW "0.0.0-release" (letters
            # outrank digits) and apt would refuse it.  Extending the existing
            # "-release" revision keeps every new build strictly newer.
            #
            # Use the commit timestamp rather than git rev-list --count:
            # this job clones with --depth 1, where the count is always 1.
            # The hash is appended without a separator: Debian compares the
            # part after "+" as digits followed by letters, so two commits
            # made in the same second would otherwise be ordered by their
            # hash instead of by commit order.
            echo "0.0.0-release+$(git log -1 --format=%ct%h)" \
              > src/scripts/.version
          fi
          ccache -z
          export VPP_EXTRA_CMAKE_ARGS="\
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          make pkg-deb
          ccache -s

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: build-root/.ccache
          key: ccache-debian13-${{ runner.arch }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpp-debian13-trixie
          path: build-root/*.deb

      - name: Publish Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          files: build-root/*.deb
          tag_name: ${{ inputs.tag || format('vpp-trixie-{0}', github.run_number) }}
          name: "VPP ${{ steps.vars.outputs.short_sha }} for Debian 13"
          body: |
            VPP build from commit ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Build date: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: true
